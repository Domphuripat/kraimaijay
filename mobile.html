    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }
    };

      // Categories State
      const [categories, setCategories] = useState([

        triggerHaptic();

            showToast("คุณปฏิเสธการอนุญาตแจ้งเตือน", "error");

      const handleTestPushNotification = () => {
        triggerHaptic();
        if (Notification.permission === 'granted') {
          new Notification("🔔 แจ้งเตือนยอดค้างชำระ", {
            body: "มีเพื่อนยังค้างชำระบิลกลุ่ม อย่าลืมตรวจสอบยอดคงค้าง",

      const [cloudConfig] = useState(DEFAULT_FIREBASE_CONFIG);

      const [currentUser, setCurrentUser] = useState(null);
      const [isAdminByGoogle, setIsAdminByGoogle] = useState(false);

      // ฟอร์มบิล

      const [billType, setBillType] = useState('delivery');
      const [newBillDate, setNewBillDate] = useState(new Date().toISOString().split('T')[0]);

      const [tollFee, setTollFee] = useState('');
      const [rideRoute, setRideRoute] = useState('');

      // ปรับยอด & สเตตเมนต์
      const [selectedFriendForAdjust, setSelectedFriendForAdjust] = useState(null);
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustNote, setAdjustNote] = useState('');
      const [adjustType, setAdjustType] = useState('minus');

      const friendSlipRef = useRef(null);

      };

            setCurrentUser(user);
            setIsAdminByGoogle(user?.email && ADMIN_EMAILS.some(e => e.toLowerCase() === user.email.toLowerCase()));
          });

          const base = firestore.collection('artifacts').doc(appId).collection('public').doc('data');

            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setFriends(list);
          });
          const unsubBills = base.collection('bills').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setBills(list);
          });
          const unsubAdjs = base.collection('adjustments').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));

      }, []);

      const handleGoogleLogin = async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          const result = await firebase.auth().signInWithPopup(provider);
          if (result && result.user) {
            const userEmail = (result.user.email || '').toLowerCase();

        } catch (err) {

          setInputPin('');
          showToast("👑 ปลดล็อกโหมดแอดมินเรียบร้อย!");
        } else {
          showToast("PIN ไม่ถูกต้อง", "error");
          setInputPin('');

      const handleLogoutAdmin = async () => {
        triggerHaptic();
        setIsAdminBySecret(false);
        setIsAdminByGoogle(false);
        localStorage.removeItem('kraimaijay_secret_admin');
        try { await firebase.auth().signOut(); } catch (e) {}
        showToast("เปลี่ยนเป็นโหมดผู้ชมแล้ว");
      };

      // ยอดหนี้
      const friendBalances = useMemo(() => {
        const balances = {};
        friends.forEach(f => { balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0, lastBillDate: null, lastBillName: '' }; });

        bills.forEach(bill => {
          const isDomPayer = /me|dom/i.test(bill.paidBy || 'Me (Dom)');
          if (isDomPayer) {
            Object.keys(bill.splits || {}).forEach(name => {
              const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
              const realName = fObj ? fObj.name : name;
              const isSelf = fObj?.isSelf || /me|dom/i.test(realName);
              if (balances[realName] && !isSelf && !bill.paidStatus?.[name]) {
                balances[realName].billsOwed += bill.splits[name];
                if (!balances[realName].lastBillDate) {
                  balances[realName].lastBillDate = bill.date;
                  balances[realName].lastBillName = bill.name;
                }
              }
            });
          } else {
            const payerObj = friends.find(f => f.name.toLowerCase() === (bill.paidBy || '').toLowerCase());
            const realPayerName = payerObj ? payerObj.name : bill.paidBy;
            const myShare = bill.splits?.['Me (Dom)'] || bill.splits?.['ตัวฉันเอง'] || 0;
            const isMySharePaid = bill.paidStatus?.['Me (Dom)'] || bill.paidStatus?.['ตัวฉันเอง'] || false;
            if (balances[realPayerName] && myShare > 0 && !isMySharePaid) {
              balances[realPayerName].billsOwed -= myShare;
            }
          }
        });

        adjustments.forEach(adj => {
          const fObj = friends.find(f => f.name.toLowerCase() === adj.friendName.toLowerCase());
          const realName = fObj ? fObj.name : adj.friendName;
          if (balances[realName] && adj.amount !== undefined && !adj.isSettled) {
            balances[realName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = Math.round((balances[name].billsOwed + balances[name].adjustedOwed) * 100) / 100;
        });
        return balances;
      }, [friends, bills, adjustments]);

      const totalReceivable = useMemo(() => {
        return Object.keys(friendBalances).reduce((acc, name) => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return (fObj?.isSelf || /me|dom/i.test(name)) ? acc : acc + Math.max(0, friendBalances[name].totalOwed);
        }, 0);
      }, [friendBalances, friends]);

      const totalPayable = useMemo(() => {
        return Object.keys(friendBalances).reduce((acc, name) => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return (fObj?.isSelf || /me|dom/i.test(name)) ? acc : acc + Math.abs(Math.min(0, friendBalances[name].totalOwed));
        }, 0);
      }, [friendBalances, friends]);

      const todayMyShare = useMemo(() => {
        const today = new Date().toISOString().split('T')[0];
        return bills.filter(b => b.date === today).reduce((sum, b) => sum + (b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0), 0);
      }, [bills]);

      // สถิติรายเดือน
      const monthlyStats = useMemo(() => {
        const monthly = bills.filter(b => (b.date || '').startsWith(selectedMonth));
        let totalGroupSpend = 0, foodTotal = 0, rideTotal = 0, myTotalExpense = 0;
        const dailyMyExpenses = {};

        monthly.forEach(b => {
          const tot = b.total || 0;
          totalGroupSpend += tot;
          if (b.billType === 'ride') rideTotal += tot;
          else if (b.billType !== 'loan') foodTotal += tot;

          const self = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          myTotalExpense += self;

          if (b.date && self > 0) {
            if (!dailyMyExpenses[b.date]) dailyMyExpenses[b.date] = { total: 0, items: [] };
            dailyMyExpenses[b.date].total += self;
            dailyMyExpenses[b.date].items.push({ name: b.name, amount: self, type: b.billType });
          }
        });

        let heaviestDayStr = '-';
        let maxDayAmount = 0;
        Object.entries(dailyMyExpenses).forEach(([dateStr, data]) => {
          if (data.total > maxDayAmount) {
            maxDayAmount = data.total;
            heaviestDayStr = `${parseInt(dateStr.split('-')[2])} ${new Date(dateStr).toLocaleString('th-TH', { month: 'short' })}`;
          }
        });

        const foodPct = totalGroupSpend > 0 ? Math.round((foodTotal / totalGroupSpend) * 100) : 0;
        const ridePct = totalGroupSpend > 0 ? Math.round((rideTotal / totalGroupSpend) * 100) : 0;

        return {
          totalGroupSpend,
          foodTotal,
          rideTotal,
          foodPct,
          ridePct,
          myTotalExpense,
          count: monthly.length,
          avgPerBill: monthly.length > 0 ? (totalGroupSpend / monthly.length) : 0,
          heaviestDayStr,
          maxDayAmount,
          dailyMyExpenses
        };
      }, [bills, selectedMonth]);

      // ปฏิทิน Matrix
      const calendarMatrix = useMemo(() => {
        if (!selectedMonth) return [];
        const [year, month] = selectedMonth.split('-').map(Number);
        if (!year || !month) return [];

        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const matrix = [];
        let dayCounter = 1;

        for (let row = 0; row < 6; row++) {
          const week = [];
          for (let col = 0; col < 7; col++) {
            if (row === 0 && col < firstDayIndex) {
              week.push(null);
            } else if (dayCounter > daysInMonth) {
              week.push(null);
            } else {
              const dStr = `${selectedMonth}-${String(dayCounter).padStart(2, '0')}`;
              const dayData = monthlyStats.dailyMyExpenses?.[dStr] || null;
              week.push({
                day: dayCounter,
                dateStr: dStr,
                total: dayData ? dayData.total : 0,
                items: dayData ? dayData.items : []
              });
              dayCounter++;
            }
          }
          matrix.push(week);
          if (dayCounter > daysInMonth) break;
        }
        return matrix;
      }, [selectedMonth, monthlyStats.dailyMyExpenses]);

      const handleShiftMonth = (direction) => {
        triggerHaptic();
        const [y, m] = selectedMonth.split('-').map(Number);
        const date = new Date(y, m - 1 + direction, 1);
        const newMonthStr = date.toISOString().substring(0, 7);
        setSelectedMonth(newMonthStr);
        setSelectedCalendarDay(null);
      };

      const getFriendHistory = (friendName) => {
        const fBills = bills.filter(b => {
          const keys = Object.keys(b.splits || {});
          return keys.some(k => k.toLowerCase() === friendName.toLowerCase()) || (b.paidBy || '').toLowerCase() === friendName.toLowerCase();
        });
        const fAdjs = adjustments.filter(a => a.friendName.toLowerCase() === friendName.toLowerCase());
        return { bills: fBills, adjustments: fAdjs };
      };

      const copyRemindText = (name, amount, billName) => {
        triggerHaptic();
        const text = `แจ้งเตือนยอดหารบิล "${billName || 'ค่าใช้จ่ายกลุ่ม'}" ของ ${name} ยอดคงค้าง MYR ${amount.toFixed(2)} รบกวนโอนคืนเมื่อสะดวกด้วยนะครับ 🙏`;
        navigator.clipboard.writeText(text).then(() => showToast(`คัดลอกข้อความทวงของ ${name} แล้ว!`));
      };

      const handleSaveAdjustment = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        const amount = parseFloat(adjustAmount);
        if (isNaN(amount) || amount <= 0) return;

        const finalAmount = adjustType === 'plus' ? amount : -amount;
        const newAdj = {
          friendName: selectedFriendForAdjust,
          amount: finalAmount,
          displayAmount: amount,
          isPaymentRecord: adjustType === 'minus',
          isSettled: adjustType === 'minus',
          note: adjustNote.trim() || (adjustType === 'plus' ? 'เพิ่มยอดหนี้ (+)' : `ชำระแล้ว (- ${amount.toFixed(2)} RM)`),
          date: new Date().toISOString().split('T')[0],
          createdAt: Date.now()
        };

        setIsProcessing(true);
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').add(newAdj);
            showToast(`ปรับยอด ${amount.toFixed(2)} RM เรียบร้อย!`);
            setSelectedFriendForAdjust(null);
            setAdjustAmount('');
            setAdjustNote('');
          } catch (err) {
            showToast("เกิดข้อผิดพลาด", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      // บันทึกบิล + คำนวณเศษสตางค์ (Penny Rounding) + FIFO Auto Net-off
      const handleSaveBill = async (e) => {
        e.preventDefault();
        if (!isAdmin || isProcessing) return;
        if (!newBillName.trim()) { showToast("กรุณาระบุชื่อบิล", "error"); return; }

        let splits = {};
        const activeFriends = billFriends;
        let calculatedTotal = 0;

        if (billType === 'loan') {
          const p = parseFloat(loanAmount) || 0;
          if (loanBorrower) splits[loanBorrower] = p;
          calculatedTotal = p;
        } else if (billType === 'ride') {
          const rf = parseFloat(rideFare) || 0;
          const tf = parseFloat(tollFee) || 0;
          const ds = parseFloat(discountAmount) || 0;
          calculatedTotal = Math.max(0, rf + tf - ds);
          const totalCents = Math.round(calculatedTotal * 100);
          const baseCents = activeFriends.length > 0 ? Math.floor(totalCents / activeFriends.length) : 0;
          let remCents = activeFriends.length > 0 ? totalCents % activeFriends.length : 0;

          activeFriends.forEach(f => {
            let shareCents = baseCents + (remCents > 0 ? 1 : 0);
            if (remCents > 0) remCents--;
            splits[f] = shareCents / 100;
          });
        } else {
          let sub = 0;
          const baseShares = {};
          activeFriends.forEach(f => { baseShares[f] = 0; });
          billItems.forEach(it => {
            const pr = (parseFloat(it.price) || 0) * (parseInt(it.qty) || 1);
            sub += pr;
            const shared = (it.sharedWith || []).filter(sn => activeFriends.includes(sn));
            if (shared.length > 0) {
              const per = pr / shared.length;
              shared.forEach(sn => { baseShares[sn] = (baseShares[sn] || 0) + per; });
            }
          });
          const perDel = activeFriends.length > 0 ? (parseFloat(deliveryFee) || 0) / activeFriends.length : 0;
          const perPack = activeFriends.length > 0 ? (parseFloat(packagingCharge) || 0) / activeFriends.length : 0;
          const disc = parseFloat(discountAmount) || 0;

          let distributedCents = 0;
          activeFriends.forEach(f => {
            const base = baseShares[f] || 0;
            const uDisc = sub > 0 ? (base / sub) * disc : (disc / (activeFriends.length || 1));
            const finalVal = Math.max(0, base + perDel + perPack - uDisc);
            const personCents = Math.round(finalVal * 100);
            splits[f] = personCents / 100;
            distributedCents += personCents;
          });

          calculatedTotal = Math.max(0, sub + (parseFloat(deliveryFee) || 0) + (parseFloat(packagingCharge) || 0) - disc);
          const targetCents = Math.round(calculatedTotal * 100);
          if (activeFriends.length > 0 && distributedCents !== targetCents) {
            const diffCents = targetCents - distributedCents;
            const lastPerson = activeFriends[activeFriends.length - 1];
            splits[lastPerson] = Math.max(0, Math.round((splits[lastPerson] + (diffCents / 100)) * 100) / 100);
          }
        }

        let initialPaidStatus = {};
        const participants = billType === 'loan' ? (loanBorrower ? [loanBorrower] : []) : billFriends;
        participants.forEach(f => {
          initialPaidStatus[f] = f.toLowerCase() === paidBy.toLowerCase();
        });

        const billPayload = {
          name: newBillName,
          billType,
          paidBy,
          date: newBillDate,
          rideFare: parseFloat(rideFare) || 0,
          tollFee: parseFloat(tollFee) || 0,
          rideRoute,
          loanAmount: parseFloat(loanAmount) || 0,
          loanBorrower,
          total: calculatedTotal,
          items: billItems,
          splits,
          paidStatus: initialPaidStatus,
          createdAt: Date.now()
        };

        setIsProcessing(true);
        if (db) {
          try {
            const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();
            const billDocRef = base.collection('bills').doc();
            batch.set(billDocRef, billPayload);

            // ⚡ FIFO AUTO NET-OFF: เมื่อเพื่อนจ่ายแล้วเรามีส่วนออกในบิล
            const isDomPayer = /me|dom/i.test(paidBy);
            const myShare = splits['Me (Dom)'] || splits['ตัวฉันเอง'] || 0;

            if (!isDomPayer && myShare > 0) {
              const friendPayerName = paidBy;
              const unpaidOldBills = bills
                .filter(b => {
                  const bDom = /me|dom/i.test(b.paidBy || 'Me (Dom)');
                  const sKeys = Object.keys(b.splits || {});
                  const matchedKey = sKeys.find(k => k.toLowerCase() === friendPayerName.toLowerCase());
                  return bDom && matchedKey && !b.paidStatus?.[matchedKey] && (b.splits[matchedKey] || 0) > 0;
                })
                .sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

              if (unpaidOldBills.length > 0) {
                let remainingCredit = myShare;
                let autoSettledBillIds = [billDocRef.id];
                let settledCount = 0;

                for (const oldBill of unpaidOldBills) {
                  if (remainingCredit <= 0.009) break;
                  const matchedKey = Object.keys(oldBill.splits || {}).find(k => k.toLowerCase() === friendPayerName.toLowerCase()) || friendPayerName;
                  const debt = oldBill.splits[matchedKey] || 0;
                  const oldBDoc = base.collection('bills').doc(oldBill.id);

                  if (remainingCredit >= debt) {
                    batch.update(oldBDoc, { paidStatus: { ...(oldBill.paidStatus || {}), [matchedKey]: true } });
                    remainingCredit = Math.round((remainingCredit - debt) * 100) / 100;
                    autoSettledBillIds.push(oldBill.id);
                    settledCount++;
                  } else {
                    const remDebt = Math.round((debt - remainingCredit) * 100) / 100;
                    batch.update(oldBDoc, { paidStatus: { ...(oldBill.paidStatus || {}), [matchedKey]: true } });
                    const partRef = base.collection('adjustments').doc();
                    batch.set(partRef, {
                      friendName: friendPayerName,
                      amount: remDebt,
                      displayAmount: remDebt,
                      isPaymentRecord: false,
                      isSettled: false,
                      note: `⚙️ ยอดคงเหลือบิล: ${oldBill.name} (หักล้างอัตโนมัติด้วยบิล ${newBillName} ไป ${remainingCredit.toFixed(2)} RM)`,
                      date: newBillDate,
                      createdAt: Date.now()
                    });
                    autoSettledBillIds.push(oldBill.id);
                    remainingCredit = 0;
                    settledCount++;
                    break;
                  }
                }

                initialPaidStatus['Me (Dom)'] = true;
                initialPaidStatus['ตัวฉันเอง'] = true;
                batch.update(billDocRef, { paidStatus: initialPaidStatus });

                const autoLogRef = base.collection('adjustments').doc();
                batch.set(autoLogRef, {
                  friendName: friendPayerName,
                  amount: 0,
                  displayAmount: myShare,
                  sourceBillId: billDocRef.id,
                  isPaymentRecord: true,
                  isSettled: true,
                  relatedBillIds: autoSettledBillIds,
                  note: `⚡ Auto Net-off: ${friendPayerName} ออกค่า ${newBillName} ให้ (${myShare.toFixed(2)} RM) -> ล้างบิลเก่าอัตโนมัติ ${settledCount} บิล`,
                  date: newBillDate,
                  createdAt: Date.now() + 1
                });
              }
            }

            await batch.commit();
            showToast("บันทึกบิลสำเร็จ! 🎉");
            setNewBillName('');
            setActiveTab('bills');
          } catch (err) {
            showToast("บันทึกไม่สำเร็จ", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      const unpaidDebtors = useMemo(() => {
        return friends.filter(f => !f.isSelf && (friendBalances[f.name]?.totalOwed || 0) > 0);
      }, [friends, friendBalances]);

      return (
        <div className="max-w-md mx-auto min-h-screen px-4 pt-5 pb-8 flex flex-col justify-between">

                  <h1 className="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white mt-0.5">{t('overview')}</h1>

                <button

                  }} 
                  className="bg-capsuleDark text-white text-xs font-semibold px-4 py-2 rounded-xl flex items-center gap-1 active:scale-95 transition shadow-sm"
                >
                  <span className="text-base leading-none">+</span> {t('addBill')}
                </button>
              </div>

              {/* Sunset Net Debt Card */}
              <div className="w-full h-44 rounded-3xl p-5 text-white flex flex-col justify-between shadow-lg shadow-rose-500/15 relative overflow-hidden"
                   style={{ background: 'linear-gradient(135deg, #E65C5C 0%, #EA7E6B 60%, #BA7B9B 100%)' }}>
                <div className="flex justify-between items-start z-10">
                  <div>
                    <p className="text-xs font-bold leading-tight">{t('totalOutstanding')}</p>
                    <p className="text-[10px] text-white/80">KraiMaiJay Tracker</p>
                  </div>
                  <span className="bg-white/20 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-full border border-white/30">
                    รอ {unpaidDebtors.length} คน
                  </span>
                </div>

                <div className="z-10">
                  <div className="flex justify-between items-end mt-1">
                    <div>
                      <p className="text-[9px] text-white/80">{t('pendingFromFriends')}</p>
                      <p className="text-3xl font-black tracking-tight leading-none mt-0.5">
                        MYR {totalReceivable.toFixed(2)}
                      </p>
                    </div>
                    {totalPayable > 0 && (
                      <span className="text-[10px] text-white/95 font-medium bg-black/30 backdrop-blur-sm px-2 py-0.5 rounded-lg border border-white/10">
                        เราค้างคนอื่น: MYR {totalPayable.toFixed(2)}
                      </span>
                    )}
                  </div>
                </div>
              </div>

              {/* 4 Bento Metrics */}
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-cardDue text-white rounded-3xl p-4 flex flex-col justify-between h-32 shadow-md shadow-indigo-500/10">
                  <span className="text-xs font-medium text-white/80">{t('myExpenseToday')}</span>

                    <h3 className="text-xl font-black tracking-tight font-mono">MYR {todayMyShare.toFixed(2)}</h3>

                  </div>

                <div className="bg-cardAvg text-slate-900 rounded-3xl p-4 flex flex-col justify-between h-32 shadow-md shadow-amber-500/10">
                  <span className="text-xs font-medium text-slate-700">{t('monthlyAvg')}</span>

                    <p className="text-[9px] text-slate-700/80 mt-1 leading-snug">จาก {monthlyStats.count} รายการเดือนนี้</p>

              {/* Debt Queue Cards */}
              <div className="space-y-2 pt-1">

                <div className="space-y-2">

                            <button

              {/* By Category Bar */}

                  <button onClick={() => {
                    triggerHaptic();
                    html2canvas(friendSlipRef.current, { scale: 2 }).then(cv => {
                      const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `Statement_${selectedFriendForHistory}.png`; a.click();
                    });
                  }} className="bg-capsuleDark text-white font-bold py-2.5 rounded-xl text-xs">บันทึกรูป PNG</button>
                  <button onClick={() => setSelectedFriendForHistory(null)} className="bg-slate-100 dark:bg-subtleDark font-bold py-2.5 rounded-xl text-xs text-slate-600 dark:text-slate-300">ปิด</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= ADJUST BOTTOM SHEET ================= */}
          {selectedFriendForAdjust && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end" onClick={() => setSelectedFriendForAdjust(null)}>
              <form onSubmit={handleSaveAdjustment} className="bg-white dark:bg-surfaceDark border-t border-slate-200 dark:border-lineDark rounded-t-3xl max-h-[85vh] flex flex-col p-5 space-y-4 animate-in slide-in-from-bottom" onClick={e => e.stopPropagation()}>
                <div className="w-10 h-1 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto -mt-2 mb-1"></div>
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-lineDark">
                  <h3 className="font-extrabold text-slate-900 dark:text-white text-base">ปรับยอดหนี้: {selectedFriendForAdjust}</h3>
                  <button type="button" onClick={() => setSelectedFriendForAdjust(null)} className="text-slate-400 text-xs">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-subtleDark p-1 rounded-xl">
                  <button type="button" onClick={() => { triggerHaptic(); setAdjustType('minus'); }} className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'minus' ? 'bg-mint text-white' : 'text-slate-500'}`}>ชำระแล้ว (-)</button>
                  <button type="button" onClick={() => { triggerHaptic(); setAdjustType('plus'); }} className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'plus' ? 'bg-coral text-white' : 'text-slate-500'}`}>เพิ่มหนี้ (+)</button>
                </div>

                <input type="text" placeholder="จำนวนเงิน (RM)" value={adjustAmount} onChange={e => setAdjustAmount(e.target.value)} onBlur={e => setAdjustAmount(evaluateMathExpression(e.target.value))} className="w-full bg-slate-50 dark:bg-subtleDark border border-slate-200 dark:border-lineDark rounded-xl px-3 py-2 text-sm font-mono font-bold outline-none dark:text-white" required />
                <input type="text" placeholder="หมายเหตุ (เช่น โอนคืนแล้ว)" value={adjustNote} onChange={e => setAdjustNote(e.target.value)} className="w-full bg-slate-50 dark:bg-subtleDark border border-slate-200 dark:border-lineDark rounded-xl px-3 py-2 text-xs outline-none dark:text-white" />

                <button type="submit" disabled={isProcessing} className="w-full bg-brandPurple text-white font-bold py-3 rounded-2xl text-xs shadow-lg shadow-brandPurple/30 active:scale-95 transition">
                  {isProcessing ? 'กำลังบันทึก...' : 'ยืนยันปรับยอด'}
                </button>
              </form>
            </div>
          )}

          {/* ================= FLOATING DYNAMIC CAPSULE NAVBAR ================= */}
          <div className="fixed bottom-6 left-0 right-0 z-50 flex justify-center pointer-events-none px-4 pb-safe">
            <nav className="pointer-events-auto bg-capsuleDark shadow-[0_16px_40px_rgba(0,0,0,0.5)] rounded-full p-1.5 flex items-center justify-between w-full max-w-[370px]">
              
              {/* 1. Overview */}
              <button 
                onClick={() => { triggerHaptic(); setActiveTab('overview'); }}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-full transition-all duration-300 ease-out active:scale-95 ${
                  activeTab === 'overview'
                    ? 'bg-brandPurple text-white shadow-md font-medium'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span className="text-[10px] tracking-tight leading-none">{t('overview')}</span>
              </button>

              {/* 2. Bills */}
              <button 
                onClick={() => { triggerHaptic(); setActiveTab('bills'); }}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-full transition-all duration-300 ease-out active:scale-95 ${
                  activeTab === 'bills'
                    ? 'bg-brandPurple text-white shadow-md font-medium'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="8" y1="6" x2="21" y2="6" />
                  <line x1="8" y1="12" x2="21" y2="12" />
                  <line x1="8" y1="18" x2="21" y2="18" />
                  <line x1="3" y1="6" x2="3.01" y2="6" />
                  <line x1="3" y1="12" x2="3.01" y2="12" />
                  <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
                <span className="text-[10px] tracking-tight leading-none">{t('bills')}</span>
              </button>

              {/* 3. Calendar */}
              <button 
                onClick={() => { triggerHaptic(); setActiveTab('calendar'); }}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-full transition-all duration-300 ease-out active:scale-95 ${
                  activeTab === 'calendar'
                    ? 'bg-brandPurple text-white shadow-md font-medium'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
                <span className="text-[10px] tracking-tight leading-none">{t('calendar')}</span>
              </button>

              {/* 4. Settings */}
              <button 
                onClick={() => { triggerHaptic(); setActiveTab('settings'); setSettingsSubPage(null); }}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-full transition-all duration-300 ease-out active:scale-95 ${
                  activeTab === 'settings'
                    ? 'bg-brandPurple text-white shadow-md font-medium'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span className="text-[10px] tracking-tight leading-none">{t('settings')}</span>
              </button>

            </nav>
          </div>

          {/* ================= AUTH POPUP MODAL ================= */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in" onClick={() => setShowAuthModal(false)}>
              <div className="bg-white dark:bg-surfaceDark border border-slate-200 dark:border-lineDark rounded-3xl p-6 w-full max-w-xs space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-lineDark">
                  <h3 className="font-bold text-sm text-slate-900 dark:text-white">🔑 เข้าสู่ระบบแอดมิน</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 text-xs">✕</button>
                </div>
                <button type="button" onClick={handleGoogleLogin} className="w-full bg-slate-50 dark:bg-subtleDark hover:bg-slate-100 border border-slate-200 dark:border-lineDark py-2.5 rounded-xl text-xs font-bold text-slate-800 dark:text-white flex items-center justify-center gap-2 active:scale-95 transition">
                  <span>Google Sign-in</span>
                </button>
                <form onSubmit={handleVerifyPin} className="space-y-3 pt-2 border-t border-slate-100 dark:border-lineDark">
                  <input type="password" pattern="[0-9]*" inputMode="numeric" maxLength="6" placeholder="กรอก PIN 4 หลัก " value={inputPin} onChange={e => setInputPin(e.target.value)} className="w-full bg-slate-50 dark:bg-subtleDark border border-slate-200 dark:border-lineDark rounded-xl py-2.5 text-center font-mono text-base tracking-widest outline-none focus:border-brandPurple dark:text-white" autoFocus />
                  <button type="submit" className="w-full bg-brandPurple text-white font-bold py-2.5 rounded-xl text-xs active:scale-95 transition shadow-lg shadow-brandPurple/20">ปลดล็อค</button>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-4 left-4 right-4 max-w-xs mx-auto z-50 text-center py-2 px-4 rounded-xl text-xs shadow-xl font-bold ${toast.type === 'error' ? 'bg-coral text-white' : 'bg-slate-900 text-white'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
