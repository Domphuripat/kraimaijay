    const useIsMobile = () => {
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);
      return isMobile;
    };

    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }
    };

    function App() {
      const isMobile = useIsMobile();
      const [cloudConfig] = useState(DEFAULT_FIREBASE_CONFIG);
      const [appId] = useState(DEFAULT_APP_ID);

      const [currentUser, setCurrentUser] = useState(null);
      const [isAdminByGoogle, setIsAdminByGoogle] = useState(false);
      const [isAdminBySecret, setIsAdminBySecret] = useState(() => {

        return p.get('admin') === 'true' || localStorage.getItem('kraimaijay_secret_admin') === 'true';

      const [isProcessing, setIsProcessing] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [inputPin, setInputPin] = useState('');

      const [db, setDb] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'bills' | 'logs' | 'calendar' | 'settings' | 'new-bill'

      // ภาษา
      const [lang, setLang] = useState(() => localStorage.getItem('kraimaijay_lang') || 'th');
      const t = (key) => DICTIONARY[lang]?.[key] || DICTIONARY['th']?.[key] || key;

      const handleSetLang = (newLang) => {
        triggerHaptic();
        setLang(newLang);
        localStorage.setItem('kraimaijay_lang', newLang);
      };

      const restoreInputRef = useRef(null);

      const [friends, setFriends] = useState([]);
      const [bills, setBills] = useState([]);
      const [adjustments, setAdjustments] = useState([]);

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().substring(0, 7));
      const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);

      // ฟอร์มสร้าง/แก้ไขบิล
      const [editingBillId, setEditingBillId] = useState(null);
      const [newBillName, setNewBillName] = useState('');
      const [billType, setBillType] = useState('delivery');
      const [newBillDate, setNewBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [paidBy, setPaidBy] = useState('Me (Dom)');
      const [billFriends, setBillFriends] = useState([]);
      
      const [deliveryFee, setDeliveryFee] = useState('');
      const [packagingCharge, setPackagingCharge] = useState('');
      const [discountAmount, setDiscountAmount] = useState('');
      const [serviceCharge, setServiceCharge] = useState('');
      const [roundingAmount, setRoundingAmount] = useState('');
      const [billItems, setBillItems] = useState([{ id: '1', name: '', price: '', qty: 1, sharedWith: [] }]);

      // OCR & Smart Text Parser
      const [showPasteModal, setShowPasteModal] = useState(false);
      const [pastedBillText, setPastedBillText] = useState('');
      const ocrInputRef = useRef(null);

      // Modals State
      const [selectedFriendForAdjust, setSelectedFriendForAdjust] = useState(null);
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustNote, setAdjustNote] = useState('');
      const [adjustType, setAdjustType] = useState('minus');
      const [selectedFriendForHistory, setSelectedFriendForHistory] = useState(null);
      const [selectedBillForDetail, setSelectedBillForDetail] = useState(null);
      const friendSlipRef = useRef(null);

      const triggerHaptic = () => {
        if (navigator.vibrate) navigator.vibrate(10);
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        try {
          let app = !firebase.apps.length ? firebase.initializeApp(cloudConfig) : firebase.app();
          const auth = firebase.auth(app);
          const firestore = firebase.firestore(app);
          setDb(firestore);

          if (isAdminBySecret && !auth.currentUser) auth.signInAnonymously().catch(() => {});

          const unsubAuth = auth.onAuthStateChanged(user => {
            setCurrentUser(user);
            setIsAdminByGoogle(user?.email && ADMIN_EMAILS.some(e => e.toLowerCase() === user.email.toLowerCase()));
          });

          const base = firestore.collection('artifacts').doc(appId).collection('public').doc('data');
          const unsubFriends = base.collection('friends').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setFriends(list);
          });
          const unsubBills = base.collection('bills').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setBills(list);
          });
          const unsubAdjs = base.collection('adjustments').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setAdjustments(list);
          });

          return () => { unsubAuth(); unsubFriends(); unsubBills(); unsubAdjs(); };
        } catch (e) { console.warn(e); }
      }, []);

      // คำนวณหนี้คงค้างจริง
      const friendBalances = useMemo(() => {
        const balances = {};
        friends.forEach(f => {
          balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0, oldestPendingDate: null, lastBillName: '', pendingBills: [] };
        });

        const sortedBills = [...bills].sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

        sortedBills.forEach(bill => {
          const isDomPayer = /me|dom/i.test(bill.paidBy || 'Me (Dom)');
          if (isDomPayer) {
            Object.keys(bill.splits || {}).forEach(name => {
              const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
              const realName = fObj ? fObj.name : name;
              const isSelf = fObj?.isSelf || /me|dom/i.test(realName);
              if (balances[realName] && !isSelf && !bill.paidStatus?.[name]) {
                const owed = bill.splits[name] || 0;
                balances[realName].billsOwed += owed;
                balances[realName].lastBillName = bill.name;
                balances[realName].pendingBills.push({ billId: bill.id, name: bill.name, amount: owed, date: bill.date });
                if (!balances[realName].oldestPendingDate) balances[realName].oldestPendingDate = bill.date;
              }
            });
          } else {
            const payerObj = friends.find(f => f.name.toLowerCase() === (bill.paidBy || '').toLowerCase());
            const realPayerName = payerObj ? payerObj.name : bill.paidBy;
            const myShare = bill.splits?.['Me (Dom)'] || bill.splits?.['ตัวฉันเอง'] || 0;
            const isMySharePaid = bill.paidStatus?.['Me (Dom)'] || bill.paidStatus?.['ตัวฉันเอง'] || false;
            if (balances[realPayerName] && myShare > 0 && !isMySharePaid) {
              balances[realPayerName].billsOwed -= myShare;
            }
          }
        });

        adjustments.forEach(adj => {
          const fObj = friends.find(f => f.name.toLowerCase() === (adj.friendName || '').toLowerCase());
          const realName = fObj ? fObj.name : adj.friendName;
          if (balances[realName] && adj.amount !== undefined && !adj.isSettled) {
            balances[realName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = Math.round((balances[name].billsOwed + balances[name].adjustedOwed) * 100) / 100;
        });
        return balances;
      }, [friends, bills, adjustments]);

      const totalReceivable = useMemo(() => {
        return Object.keys(friendBalances).reduce((acc, name) => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return (fObj?.isSelf || /me|dom/i.test(name)) ? acc : acc + Math.max(0, friendBalances[name].totalOwed);
        }, 0);
      }, [friendBalances, friends]);

      const totalPayable = useMemo(() => {
        return Object.keys(friendBalances).reduce((acc, name) => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return (fObj?.isSelf || /me|dom/i.test(name)) ? acc : acc + Math.abs(Math.min(0, friendBalances[name].totalOwed));
        }, 0);
      }, [friendBalances, friends]);

      const todayMyShare = useMemo(() => {
        const today = new Date().toISOString().split('T')[0];
        return bills.filter(b => b.date === today).reduce((sum, b) => sum + (b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0), 0);
      }, [bills]);

      // สถิติปฏิทิน + ข้อมูล Grid วันที่
      const calendarStats = useMemo(() => {
        const monthly = bills.filter(b => (b.date || '').startsWith(selectedMonth));
        let totalSpend = 0, foodSpend = 0, rideSpend = 0;
        const friendShareMap = {};
        const dailyExpenses = {};

        monthly.forEach(b => {
          const tot = b.total || 0;
          totalSpend += tot;
          if (b.billType === 'ride') rideSpend += tot;
          else foodSpend += tot;

          Object.entries(b.splits || {}).forEach(([fName, amt]) => {
            friendShareMap[fName] = (friendShareMap[fName] || 0) + amt;
          });

          if (b.date) {
            if (!dailyExpenses[b.date]) dailyExpenses[b.date] = { total: 0, items: [] };
            dailyExpenses[b.date].total += tot;
            dailyExpenses[b.date].items.push({ name: b.name, total: tot, paidBy: b.paidBy });
          }
        });

        const topFriends = Object.entries(friendShareMap)
          .map(([name, amount]) => ({ name, amount, pct: totalSpend > 0 ? Math.round((amount / totalSpend) * 100) : 0 }))
          .sort((a, b) => b.amount - a.amount);

        // คำนวณ Matrix วันที่ 1-31 สำหรับปฏิทิน
        const [year, month] = selectedMonth.split('-').map(Number);
        const matrix = [];
        if (year && month) {
          const firstDayIndex = new Date(year, month - 1, 1).getDay();
          const daysInMonth = new Date(year, month, 0).getDate();
          let dayCounter = 1;

          for (let row = 0; row < 6; row++) {
            const week = [];
            for (let col = 0; col < 7; col++) {
              if (row === 0 && col < firstDayIndex) {
                week.push(null);
              } else if (dayCounter > daysInMonth) {
                week.push(null);
              } else {
                const dStr = `${selectedMonth}-${String(dayCounter).padStart(2, '0')}`;
                const dayData = dailyExpenses[dStr] || null;
                week.push({
                  day: dayCounter,
                  dateStr: dStr,
                  total: dayData ? dayData.total : 0,
                  items: dayData ? dayData.items : []
                });
                dayCounter++;
              }
            }
            matrix.push(week);
            if (dayCounter > daysInMonth) break;
          }
        }

        return {
          totalSpend,
          foodSpend,
          rideSpend,
          avgCost: monthly.length > 0 ? totalSpend / monthly.length : 0,
          topFriends,
          dailyExpenses,
          matrix,
          count: monthly.length
        };
      }, [bills, selectedMonth]);

      const debtQueue = useMemo(() => {
        const now = new Date();
        return friends
          .filter(f => !f.isSelf && (friendBalances[f.name]?.totalOwed || 0) > 0)
          .map(f => {
            const b = friendBalances[f.name];
            const pDate = b.oldestPendingDate ? new Date(b.oldestPendingDate) : now;
            const daysPending = Math.max(0, Math.floor((now - pDate) / (1000 * 60 * 60 * 24)));
            return { id: f.id, name: f.name, owed: b.totalOwed, lastBillName: b.lastBillName || 'บิลหารค่าใช้จ่าย', daysPending };
          })
          .sort((a, b) => b.daysPending - a.daysPending || b.owed - a.owed);
      }, [friends, friendBalances]);

      // Settle Full Balance Logic
      const handleSettleFullBalance = async (friendName) => {
        triggerHaptic();
        if (!isAdmin) { setShowAuthModal(true); return; }
        const currentOwed = friendBalances[friendName]?.totalOwed || 0;
        if (currentOwed <= 0) { showToast("เพื่อนคนนี้ไม่มียอดค้างชำระ"); return; }

        if (confirm(`ยืนยันการเคลียร์ยอดทั้งหมด (Settle Full Balance) ของ ${friendName} จำนวน MYR ${currentOwed.toFixed(2)} หรือไม่?`)) {
          setIsProcessing(true);
          try {
            const batch = db.batch();
            const base = db.collection('artifacts').doc(appId).collection('public').doc('data');

            bills.forEach(b => {
              if (b.splits?.[friendName] && !b.paidStatus?.[friendName]) {
                const nextPaidStatus = { ...(b.paidStatus || {}), [friendName]: true };
                batch.update(base.collection('bills').doc(b.id), { paidStatus: nextPaidStatus });
              }
            });

            const adjRef = base.collection('adjustments').doc();
            batch.set(adjRef, {
              friendName,
              amount: -currentOwed,
              displayAmount: currentOwed,
              isPaymentRecord: true,
              isSettled: true,
              note: `ชำระครบถ้วน (Settle Full Balance - FIFO Cleared)`,
              date: new Date().toISOString().split('T')[0],
              createdAt: Date.now()
            });

            await batch.commit();
            showToast(`เคลียร์ยอด ${friendName} ครบถ้วนแล้ว! 🎉`);
            setSelectedFriendForAdjust(null);
          } catch (e) {
            showToast("เกิดข้อผิดพลาดในการเคลียร์ยอด", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      // Smart FIFO Auto Net-off Adjustment
      const handleSmartFifoAdjustment = async (e) => {
        e.preventDefault();
        triggerHaptic();
        if (!isAdmin) return;
        const amount = parseFloat(adjustAmount);
        if (isNaN(amount) || amount <= 0) return;

        setIsProcessing(true);
        try {
          const batch = db.batch();
          const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
          const friendName = selectedFriendForAdjust;

          if (adjustType === 'minus') {
            let remainingPayment = amount;
            const pendingBills = (friendBalances[friendName]?.pendingBills || []);

            for (let pb of pendingBills) {
              if (remainingPayment <= 0) break;
              if (remainingPayment >= pb.amount) {
                const billDoc = bills.find(b => b.id === pb.billId);
                if (billDoc) {
                  const nextPaid = { ...(billDoc.paidStatus || {}), [friendName]: true };
                  batch.update(base.collection('bills').doc(pb.billId), { paidStatus: nextPaid });
                  remainingPayment -= pb.amount;
                }
              }
            }

            const adjRef = base.collection('adjustments').doc();
            batch.set(adjRef, {
              friendName,
              amount: -amount,
              displayAmount: amount,
              isPaymentRecord: true,
              isSettled: false,
              note: adjustNote.trim() || `ชำระยอดคืน (FIFO Auto Net-off) - ${amount.toFixed(2)} RM`,
              date: new Date().toISOString().split('T')[0],
              createdAt: Date.now()
            });
          } else {
            const adjRef = base.collection('adjustments').doc();
            batch.set(adjRef, {
              friendName,
              amount: amount,
              displayAmount: amount,
              isPaymentRecord: false,
              isSettled: false,
              note: adjustNote.trim() || `เพิ่มยอดหนี้ (+) ${amount.toFixed(2)} RM`,
              date: new Date().toISOString().split('T')[0],
              createdAt: Date.now()
            });
          }

          await batch.commit();
          showToast(`ปรับยอด ${amount.toFixed(2)} RM เรียบร้อย!`);
          setSelectedFriendForAdjust(null);
          setAdjustAmount('');
          setAdjustNote('');
        } catch (err) {
          showToast("เกิดข้อผิดพลาดในการบันทึก", "error");
        } finally {
          setIsProcessing(false);
        }
      };

      // Smart Parser สำหรับข้อความบิลที่ Copy มาวาง
      const handleParseBillText = () => {
        triggerHaptic();
        if (!pastedBillText.trim()) return;
        const lines = pastedBillText.split('\n');
        const parsedItems = [];
        let pDel = deliveryFee, pPack = packagingCharge, pDisc = discountAmount, pServ = serviceCharge, pRound = roundingAmount;

        lines.forEach(line => {
          const l = line.trim();
          if (!l) return;

          if (/delivery|ค่าส่ง/i.test(l)) {
            const m = l.match(/[\d,.]+/);
            if (m) pDel = parseFloat(m[0].replace(',', '')) || pDel;
          } else if (/pack|packaging|กล่อง/i.test(l)) {
            const m = l.match(/[\d,.]+/);
            if (m) pPack = parseFloat(m[0].replace(',', '')) || pPack;
          } else if (/discount|ส่วนลด/i.test(l)) {
            const m = l.match(/[\d,.]+/);
            if (m) pDisc = parseFloat(m[0].replace(',', '')) || pDisc;
          } else if (/service|service charge|ค่าบริการ/i.test(l)) {
            const m = l.match(/[\d,.]+/);
            if (m) pServ = parseFloat(m[0].replace(',', '')) || pServ;
          } else if (/rounding|ปัดเศษ/i.test(l)) {
            const m = l.match(/[-+]?[\d,.]+/);
            if (m) pRound = parseFloat(m[0].replace(',', '')) || pRound;
          } else {
            const match = l.match(/(.+?)\s+([\d,.]+)\s*$/);
            if (match) {
              const name = match[1].replace(/^\d+[\.\)]\s*/, '').trim();
              const price = parseFloat(match[2].replace(',', '')) || 0;
              if (price > 0) {
                parsedItems.push({ id: Date.now() + Math.random().toString(), name, price: price.toString(), qty: 1, sharedWith: [...billFriends] });
              }
            }
          }
        });

        if (parsedItems.length > 0) setBillItems(parsedItems);
        setDeliveryFee(pDel || '');
        setPackagingCharge(pPack || '');
        setDiscountAmount(pDisc || '');
        setServiceCharge(pServ || '');
        setRoundingAmount(pRound || '');
        setShowPasteModal(false);
        setPastedBillText('');
        showToast("แยกรายการจากข้อความบิลสำเร็จ! 🎉");
      };

      // OCR Image Handler
      const handleOcrImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsProcessing(true);
        showToast("กำลังอ่านข้อความจากภาพใบเสร็จ... 🔍");
        try {
          const res = await Tesseract.recognize(file, 'eng+tha');
          const text = res.data.text;
          setPastedBillText(text);
          setShowPasteModal(true);
          showToast("OCR สำเร็จ! ตรวจสอบข้อความก่อนแยกรายการ");
        } catch (err) {
          showToast("ไม่สามารถอ่านข้อความจากภาพได้", "error");
        } finally {
          setIsProcessing(false);
        }
      };

        e.preventDefault();
        triggerHaptic();
        if (!isAdmin || isProcessing) return;
        if (!newBillName.trim()) { showToast("กรุณาระบุชื่อบิล", "error"); return; }

        let splits = {};
        const activeFriends = billFriends;
        const dFee = parseFloat(deliveryFee) || 0;
        const pFee = parseFloat(packagingCharge) || 0;
        const dDisc = parseFloat(discountAmount) || 0;
        const sServ = parseFloat(serviceCharge) || 0;
        const rRound = parseFloat(roundingAmount) || 0;

        let subtotal = 0;
        const baseShares = {};
        activeFriends.forEach(f => { baseShares[f] = 0; });

        billItems.forEach(it => {
          const pr = (parseFloat(it.price) || 0) * (parseInt(it.qty) || 1);
          subtotal += pr;
          const shared = (it.sharedWith || []).filter(sn => activeFriends.includes(sn));
          if (shared.length > 0) {
            const per = pr / shared.length;
            shared.forEach(sn => { baseShares[sn] = (baseShares[sn] || 0) + per; });
          }
        });

        const perPersonFixed = activeFriends.length > 0 ? (dFee + pFee + sServ + rRound) / activeFriends.length : 0;

        activeFriends.forEach(f => {
          const base = baseShares[f] || 0;
          const uDisc = subtotal > 0 ? (base / subtotal) * dDisc : (dDisc / (activeFriends.length || 1));
          splits[f] = Math.round(Math.max(0, base + perPersonFixed - uDisc) * 100) / 100;
        });

        const totalAmt = Object.values(splits).reduce((a, b) => a + b, 0);

        let initialPaidStatus = {};
        activeFriends.forEach(f => {
          initialPaidStatus[f] = f.toLowerCase() === paidBy.toLowerCase();

          billType,
          paidBy,
          date: newBillDate,
          deliveryFee: dFee,
          packagingCharge: pFee,
          discountAmount: dDisc,
          serviceCharge: sServ,
          roundingAmount: rRound,
          total: totalAmt,
          items: billItems,
          splits,
          paidStatus: initialPaidStatus,
          updatedAt: Date.now()
        };

        setIsProcessing(true);
        if (db) {
          try {
            const base = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills');

              await base.doc(editingBillId).update(billPayload);

              await base.add({ ...billPayload, createdAt: Date.now() });
              showToast("บันทึกบิลหารใหม่สำเร็จ! 🎉");
            }
            setEditingBillId(null);
            setNewBillName('');
            setActiveTab('bills');

            showToast("เกิดข้อผิดพลาดในการบันทึกบิล", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowAuthModal(false)}>
              <div className="bg-[#0D1322] border border-[#19243C] rounded-3xl p-6 w-full max-w-xs space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center pb-2 border-b border-[#19243C]">
                  <h3 className="font-bold text-sm text-white">🔑 เข้าสู่ระบบแอดมิน</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-500 text-xs">{t('close')}</button>
                </div>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if (inputPin === ADMIN_PIN) {
                    setIsAdminBySecret(true);
                    localStorage.setItem('kraimaijay_secret_admin', 'true');
                    try { await firebase.auth().signInAnonymously(); } catch (err) {}
                    setShowAuthModal(false);
                    setInputPin('');
                    showToast("👑 ปลดล็อกโหมดแอดมินเรียบร้อย!");
                  } else {
                    showToast("PIN ไม่ถูกต้อง", "error");
                  }
                }} className="space-y-3 pt-2">
                  <input type="password" placeholder="กรอกรหัส PIN แอดมิน" value={inputPin} onChange={e => setInputPin(e.target.value)} className="w-full bg-[#121A2D] border border-[#19243C] rounded-xl py-2.5 text-center font-mono text-sm tracking-widest text-white outline-none focus:border-brandPurple" autoFocus />
                  <button type="submit" className="w-full bg-brandPurple text-white font-bold py-2.5 rounded-xl text-xs shadow-md">ปลดล็อค</button>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 py-2.5 px-4 rounded-xl text-xs shadow-2xl font-bold ${toast.type === 'error' ? 'bg-coral text-white' : 'bg-brandPurple text-white'}`}>
              {toast.message}
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
