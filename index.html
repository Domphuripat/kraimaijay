    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }
    };

    // ===================== RECEIPT PARSER =====================
    // คำสั่งให้ Gemini/ChatGPT อ่านรูปใบเสร็จแล้วตอบเป็น JSON — แม่นกว่า OCR ในเครื่องมาก
    const RECEIPT_AI_PROMPT = `Read this receipt image. Reply with ONLY one JSON object (no explanation, no markdown) in exactly this shape:
{"merchant":"","items":[{"name":"","qty":1,"unitPrice":0}],"subtotal":0,"serviceChargePercent":0,"serviceChargeAmount":0,"taxPercent":0,"taxAmount":0,"deliveryFee":0,"packagingFee":0,"otherFees":0,"discount":0,"rounding":0,"total":0}
Rules:
- unitPrice = price of ONE unit before service charge and tax. If the receipt only shows the line total, divide it by qty.
- Copy item names exactly as printed (any language).
- serviceChargePercent / taxPercent: the % printed on the receipt (e.g. 10, 6, 8), else 0. serviceChargeAmount / taxAmount: the money amounts.
- If prices already include tax and there is no separate tax line, set taxPercent and taxAmount to 0.
- Delivery apps (Grab, Foodpanda, ShopeeFood): put platform fee / service fee / small order fee in otherFees.
- discount is a positive number (total of all promos/vouchers). rounding may be negative.
- Numbers only, no currency symbols. Use 0 for anything not on the receipt.`;

    const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;

    // "1,234.50" / "12,50" / "RM 9.90" -> number
    const MONEY_RE = /([-−]\s*)?(?:RM|MYR|THB|฿)?\s*([0-9]{1,3}(?:,[0-9]{3})+|[0-9]+)[.,]([0-9]{2})(?![0-9])/gi;
    const moneyValues = (line) => {
      const out = [];
      let m;
      MONEY_RE.lastIndex = 0;
      while ((m = MONEY_RE.exec(line)) !== null) {
        const v = parseFloat(`${m[2].replace(/,/g, '')}.${m[3]}`);
        out.push(m[1] ? -v : v);
      }
      // ตัวเลขในวงเล็บ เช่น (5.00) = ติดลบ
      if (out.length && /\(\s*(?:RM\s*)?[0-9.,]+\s*\)\s*$/.test(line)) out[out.length - 1] = -Math.abs(out[out.length - 1]);
      return out;
    };
    const lastMoney = (line) => { const v = moneyValues(line); return v.length ? v[v.length - 1] : null; };
    const percentOf = (line) => { const m = line.match(/([0-9]+(?:\.[0-9]+)?)\s*%/); return m ? parseFloat(m[1]) : 0; };

    const emptyReceipt = () => ({
      merchant: '', items: [], subtotal: 0, scPercent: 0, scAmount: 0, taxPercent: 0, taxAmount: 0,
      deliveryFee: 0, packaging: 0, otherFees: 0, discount: 0, rounding: 0, total: 0, toll: 0, source: 'text'
    });

    // 1) ข้อความที่เป็น JSON (จากคำสั่ง RECEIPT_AI_PROMPT)
    const parseReceiptJson = (text) => {
      const cleaned = text.replace(/```(?:json)?/gi, '');
      const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
      if (a < 0 || b <= a) return null;
      let data;
      try { data = JSON.parse(cleaned.slice(a, b + 1)); } catch (e) { return null; }
      if (!data || !Array.isArray(data.items)) return null;
      const num = (v) => {
        if (typeof v === 'number') return v;
        const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, ''));
        return isNaN(n) ? 0 : n;
      };
      const r = emptyReceipt();
      r.source = 'json';
      r.merchant = String(data.merchant || '').trim();
      r.items = data.items
        .map(it => {
          const qty = Math.max(1, Math.round(num(it.qty) || 1));
          let unit = num(it.unitPrice ?? it.price);
          if (!unit && it.lineTotal) unit = num(it.lineTotal) / qty;
          return { name: String(it.name || '').trim(), qty, unitPrice: round2(unit) };
        })
        .filter(it => it.name && it.unitPrice > 0);
      r.subtotal = num(data.subtotal);
      r.scPercent = num(data.serviceChargePercent);
      r.scAmount = num(data.serviceChargeAmount);
      r.taxPercent = num(data.taxPercent);
      r.taxAmount = num(data.taxAmount);
      r.deliveryFee = num(data.deliveryFee);
      r.packaging = num(data.packagingFee);
      r.otherFees = num(data.otherFees);
      r.discount = Math.abs(num(data.discount));
      r.rounding = num(data.rounding);
      r.total = num(data.total);
      return r;
    };

    // 2) ข้อความธรรมดา (copy จากแอป/อีเมล หรือจาก OCR)
    const parseReceiptLines = (fullText) => {
      const r = emptyReceipt();
      const lines = fullText
        .replace(/[—–]/g, '-')
        .replace(/[oO](?=[0-9]{1,3}[.,][0-9]{2})/g, '0')
        .split('\n')
        .map(l => l.replace(/\s+/g, ' ').trim())
        .filter(Boolean);

      let totalPriority = -1;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const low = line.toLowerCase();
        const amt = lastMoney(line);

        // ภาษี — เช็กก่อน service charge เพราะ "Service Tax" (SST มาเลเซีย) คือภาษี
        if (/service\s*tax|\bsst\b|\bgst\b|\bvat\b|\btax\b|ภาษี|cukai/.test(low)) {
          if (/incl|inclusive|included|รวมแล้ว|termasuk/.test(low)) continue; // แค่บอกว่ารวมภาษีแล้ว
          const pct = percentOf(line);
          if (pct) r.taxPercent = pct;
          if (amt !== null && !(pct && Math.abs(amt - pct) < 0.001)) r.taxAmount = round2(r.taxAmount + Math.abs(amt));
          continue;
        }

        if (/platform\s*fee|small\s*order|service\s*fee|convenience\s*fee|ค่าธรรมเนียม/.test(low)) {
          if (amt !== null) r.otherFees = round2(r.otherFees + Math.abs(amt));
          continue;
        }

        if (/service\s*(charge|chg)|svc\.?\s*(charge|chg)|\bs\/c\b|caj\s*perkhidmatan|ค่าบริการ/.test(low)) {
          const pct = percentOf(line);
          if (pct) r.scPercent = pct;
          if (amt !== null && !(pct && Math.abs(amt - pct) < 0.001)) r.scAmount = round2(r.scAmount + Math.abs(amt));
          continue;
        }

        if (/round|ปัดเศษ|pembundaran/.test(low)) {
          if (amt !== null) r.rounding = round2(amt);
          continue;
        }

        if (/sub\s*-?\s*total|ยอดรวมก่อน|jumlah\s*kecil/.test(low)) {
          if (amt !== null) r.subtotal = Math.abs(amt);
          continue;
        }

        if (/delivery\s*fee|delivery\s*charge|rider\s*fee|driver\s*fee|shipping|ค่าส่ง|ค่าจัดส่ง/.test(low)) {
          if (amt !== null) r.deliveryFee = round2(r.deliveryFee + Math.abs(amt));
          continue;
        }

        if (/packaging|packing|takeaway\s*(box|fee|charge)|container|ค่าแพ็ก|ค่ากล่อง|bag\s*(fee|charge)/.test(low)) {
          if (amt !== null) r.packaging = round2(r.packaging + Math.abs(amt));
          continue;
        }

        if (/discount|promo|voucher|coupon|\boff\b|cashback|rebate|ส่วนลด|โปรโมชั่น|diskaun/.test(low)) {
          if (amt !== null) r.discount = round2(r.discount + Math.abs(amt));
          continue;
        }

        if (/toll|expressway|highway|ทางด่วน/.test(low)) {
          if (amt !== null) r.toll = Math.abs(amt);
          continue;
        }

        // ยอดรวมสุทธิ (เก็บไว้เทียบความถูกต้อง)
        if (/grand\s*total|net\s*total|amount\s*(due|payable)|total\s*(amount|payable|due)|^total\b|^jumlah|ยอดสุทธิ|รวมทั้งสิ้น|ยอดชำระ|ยอดรวม/.test(low)) {
          if (amt !== null) {
            const pr = /grand|net|due|payable|สุทธิ|ทั้งสิ้น|ชำระ/.test(low) ? 2 : 1;
            if (pr > totalPriority) { r.total = Math.abs(amt); totalPriority = pr; }
          }
          continue;
        }

        if (/visa|master\s*card|amex|debit|credit|cash|change\b|tender|paid\s*by|payment|grabcoins|points|order\s*summary|note\s*to|reorder|contact|profile|cutlery|invoice|receipt\s*no|cashier|terminal|table\b|tel\b|phone|www\.|http|เงินทอน|เงินสด|บัตร/.test(low)) continue;

        // ---- รายการอาหาร ----
        const values = moneyValues(line);
        if (!values.length) continue;
        let qty = 1, name = '', unit = 0;
        const firstMoneyAt = line.search(/(?:[-−]\s*)?(?:RM|MYR|THB|฿)?\s*(?:[0-9]{1,3}(?:,[0-9]{3})+|[0-9]+)[.,][0-9]{2}(?![0-9])/i);
        let label = line.slice(0, firstMoneyAt).trim();

        let m;
        if ((m = label.match(/^([0-9]{1,3})\s*[xX×*]\s*(.+)$/))) { qty = parseInt(m[1]); label = m[2]; }        // 2x Burger
        else if ((m = label.match(/^(.+?)\s*[xX×*]\s*([0-9]{1,3})$/))) { label = m[1]; qty = parseInt(m[2]); } // Burger x2
        else if ((m = label.match(/^(.+?)\s+([0-9]{1,3})$/)) && values.length >= 2) { label = m[1]; qty = parseInt(m[2]); } // Burger 2 12.50 25.00
        else if ((m = label.match(/^([0-9]{1,2})\s+(\D.+)$/))) { qty = parseInt(m[1]); label = m[2]; }        // 2 Burger 25.00
        if ((m = label.match(/^[0-9]{6,14}\s+(.+)$/))) label = m[1]; // ตัดบาร์โค้ด/SKU
        name = label.replace(/[:\-–|]+$/, '').trim();
        qty = Math.max(1, qty || 1);

        // บรรทัดถัดไปเป็นแค่ "2x" (รูปแบบของบางแอป)
        if (i + 1 < lines.length && /^[0-9]{1,3}\s*[xX×]$/.test(lines[i + 1])) { qty = parseInt(lines[i + 1]) || qty; i++; }

        if (values.length >= 2) unit = Math.abs(values[0]);               // มีทั้งราคาต่อชิ้นและราคารวม
        else unit = Math.abs(values[0]) / qty;                              // ราคาที่เห็นคือราคารวมของบรรทัด

        if (values[values.length - 1] < 0) { r.discount = round2(r.discount + Math.abs(values[values.length - 1])); continue; }
        if (unit > 0 && name.length >= 2 && !/total|amount|balance|jumlah/i.test(name)) {
          r.items.push({ name, qty, unitPrice: round2(unit) });
        }
      }
      return r;
    };

    const parseReceipt = (text) => parseReceiptJson(text) || parseReceiptLines(text);

    // แปลงผลอ่านใบเสร็จ -> ค่าที่ใส่ในฟอร์ม (อัตรา service charge/ภาษี และยอดปัดเศษให้ยอดรวมตรงใบเสร็จ)
    const TAX_OPTIONS = [0, 6, 7, 8, 10];
    const receiptToForm = (r) => {
      const itemsSum = round2(r.items.reduce((s, it) => s + it.unitPrice * it.qty, 0));
      const base = itemsSum || r.subtotal;

      let scRate = r.scPercent || (r.scAmount && base ? round2((r.scAmount / base) * 100) : 0);
      const scAmt = base * scRate / 100;

      let taxRate = 0;
      if (r.taxPercent || r.taxAmount) {
        if (r.taxPercent) taxRate = r.taxPercent;
        else {
          // แอปคิดภาษีจาก (ค่าอาหาร + service charge) เหมือนใบเสร็จร้านส่วนใหญ่ แล้วปัดเข้าอัตรามาตรฐานถ้าใกล้
          const raw = (base + scAmt) ? (r.taxAmount / (base + scAmt)) * 100 : 0;
          const snap = TAX_OPTIONS.find(o => o && Math.abs(o - raw) < 0.3);
          taxRate = snap || round2(raw);
        }
      }

      const fees = round2(r.otherFees + r.packaging);
      const expected = itemsSum + scAmt + (itemsSum + scAmt) * taxRate / 100 + r.deliveryFee + fees - r.discount;
      let rounding = round2(r.rounding);
      let mismatch = 0;
      if (r.total > 0 && itemsSum > 0) {
        const diff = round2(r.total - expected);
        if (Math.abs(diff) <= Math.max(1, r.total * 0.03)) rounding = diff; // เศษเล็กน้อย -> ใส่ช่อง Rounding ให้ยอดตรงใบเสร็จ
        else mismatch = diff;
      }
      return { itemsSum, scRate, taxRate, fees, rounding, mismatch };
    };
    // =================== END RECEIPT PARSER ===================

    const PLUS_ICON = (
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14" /></svg>
    );

    // สีพื้นหลังของธีมปัจจุบัน (ใช้ตอนส่งออกรูป/PDF ให้ตรงกับที่เห็นบนจอ)
    const themeColor = (name) => {
      const raw = getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
      return raw ? `rgb(${raw.split(/\s+/).join(',')})` : '#0E0F11';
    };

    // นับคนที่ยังไม่เคลียร์ในบิล: ไม่นับคนจ่าย; ถ้าเพื่อนเป็นคนจ่าย ส่วนของเราที่ยังไม่จ่ายก็นับด้วย
    const countUnpaid = (bill, friendsList) => {
      const payer = bill.paidBy || 'Me (Dom)';
      return Object.keys(bill.splits || {}).filter(n => {

        const isSelf = fObj?.isSelf || isSelfName(n);
        if (isSelf && isSelfName(payer)) return false;
        return !bill.paidStatus?.[n] && (bill.splits[n] || 0) > 0;
      }).length;
    };

    // ไอคอนประเภทบิล (เส้น outline เข้าชุดกับเมนูล่าง)
    const BILL_TYPE_ICONS = {
      delivery: (<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 8h14l-1 12H6L5 8z" /><path d="M9 8V6a3 3 0 016 0v2" /></svg>),
      ride: (<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 16l1.5-5.5A2 2 0 018.4 9h7.2a2 2 0 011.9 1.5L19 16" /><path d="M4 16h16v3H4z" /><path d="M7 19v1M17 19v1" /></svg>),
      dinein: (<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 3v18M5 3v5a2 2 0 004 0V3" /><path d="M17 21V3c-2 1.5-3 4-3 8h3" /></svg>),
      loan: (<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="6" width="18" height="12" rx="2" /><circle cx="12" cy="12" r="2.5" /></svg>),

    const NAV_ICONS = {

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('kraimaijay_lang') || 'th');

      const t = (key, params = {}) => {
        let str = TRANSLATIONS[lang]?.[key] || TRANSLATIONS['en']?.[key] || key;
        Object.keys(params).forEach(p => {
          str = str.replace(`{${p}}`, params[p]);
        });
        return str;
      };

      const handleLangToggle = () => {
        const nextLang = lang === 'en' ? 'th' : 'en';
        setLang(nextLang);
        localStorage.setItem('kraimaijay_lang', nextLang);
      };

      // ธีม: ค่าเริ่มต้นตามที่สคริปต์ใน <head> ตั้งไว้ (ที่บันทึกไว้ หรือตามเครื่อง)
      const [theme, setTheme] = useState(() => document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      useEffect(() => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themeColor('bg'));
      }, [theme]);
      const handleThemeToggle = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        try { localStorage.setItem('kraimaijay_theme', next); } catch (e) {}
      };

      const [cloudConfig] = useState(DEFAULT_FIREBASE_CONFIG);
      const [appId] = useState(DEFAULT_APP_ID);

      // --- BALANCE CALCULATION (ป้องกันการหักลบซ้ำ 2 ต่อ) ---
      const getFriendBalances = () => {
        const balances = {};
        friends.forEach(f => {
          balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };

        bills.forEach(bill => {
          const billPayer = bill.paidBy || 'Me (Dom)';

          if (isDomPayer) {
            Object.keys(bill.splits || {}).forEach(name => {

                balances[realName].billsOwed += bill.splits[name];

            const myShare = bill.splits?.['Me (Dom)'] || bill.splits?.['ตัวฉันเอง'] || 0;
            const isMySharePaid = bill.paidStatus?.['Me (Dom)'] || bill.paidStatus?.['ตัวฉันเอง'] || false;

            balances[realName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = Math.round((balances[name].billsOwed + balances[name].adjustedOwed) * 100) / 100;

        return balances;

      const friendBalances = getFriendBalances();

      const todayBillsCount = bills.filter(b => b.date === todayDateStr).length;

      // --- FULL SETTLE (ไม่สร้างยอดติดลบทับซ้อน) ---
      const handleSettleFullWithBatch = async (friendName) => {
        if (!isAdmin || isProcessing) return;

        const unpaidBills = bills.filter(b => {
          const splitsKeys = Object.keys(b.splits || {});
          const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase());
          const hasSplit = matchedKey && b.splits[matchedKey] !== undefined;
          const isPaid = matchedKey ? (b.paidStatus?.[matchedKey] === true) : false;
          return hasSplit && !isPaid;
        });

        const curBalance = friendBalances[friendName]?.totalOwed || 0;

        if (!confirm(t('settleConfirmModal', { n: unpaidBills.length, name: friendName }))) {
          return;
        }

        setIsProcessing(true);
        try {
          if (db) {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();
            let operationsCount = 0;
            const settledBillIds = [];

            unpaidBills.forEach(bill => {
              const bDoc = basePath.collection('bills').doc(bill.id);
              const splitsKeys = Object.keys(bill.splits || {});
              const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase()) || friendName;
              const nextStatus = { ...(bill.paidStatus || {}), [matchedKey]: true };
              batch.update(bDoc, { paidStatus: nextStatus });
              settledBillIds.push(bill.id);
              operationsCount++;
            });

            adjustments.filter(a => a.friendName.toLowerCase() === friendName.toLowerCase() && !a.isSettled).forEach(adj => {
              const aDoc = basePath.collection('adjustments').doc(adj.id);
              batch.update(aDoc, { isSettled: true });
              operationsCount++;
            });

            // บันทึก Log การจ่ายเงิน (amount: 0 เพื่อไม่ให้ไปลดซ้ำกับบิลที่กลายเป็น Paid)
            const settleLogRef = basePath.collection('adjustments').doc();
            batch.set(settleLogRef, {
              friendName,
              amount: 0,
              displayAmount: curBalance,
              isPaymentRecord: true,
              isSettled: true,

              date: localDateStr(),
              createdAt: Date.now() + 1
            });
            operationsCount++;

            if (operationsCount > 0) {
              await batch.commit();
              showToast(`🎉 Cleared all bills and logged payment for ${friendName}!`);
            }

            setSelectedFriendForAdjust(null);
          }
        } catch (err) {
          console.error("Batch settle error:", err);
          showToast("Failed to settle: " + (err.message || "Permission Denied"), "error");
        } finally {
          setIsProcessing(false);
        }

      // --- SMART FIFO AUTO-NETOFF FUNCTION ---
      const handleSmartFifoNetOff = async (friendName, creditAmount, sourceBillId = '', sourceBillName = '') => {
        if (!isAdmin || isProcessing) return;

        const parsedCredit = parseFloat(creditAmount);
        if (isNaN(parsedCredit) || parsedCredit <= 0) {
          showToast("กรุณาระบุจำนวนเงินที่ถูกต้อง", "error");
          return;
        }

        const unpaidBills = bills
          .filter(b => {
            const isDomPayer = isSelfName(b.paidBy || 'Me (Dom)');
            const splitsKeys = Object.keys(b.splits || {});
            const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase());
            const isUnpaid = matchedKey && !b.paidStatus?.[matchedKey] && (b.splits[matchedKey] || 0) > 0;
            return isDomPayer && isUnpaid;
          })
          .sort((a, b) => {
            const dateA = new Date(a.date || 0).getTime();
            const dateB = new Date(b.date || 0).getTime();
            return dateA !== dateB ? dateA - dateB : (a.createdAt || 0) - (b.createdAt || 0);
          });

        if (unpaidBills.length === 0) {
          showToast(`${friendName} ไม่มีบิลเก่าที่ค้างชำระอยู่`, "info");
          return;
        }

        setIsProcessing(true);
        try {
          if (db) {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();
            
            let remainingCredit = parsedCredit;
            let settledBillsCount = 0;
            const autoSettledBillIds = [];

            for (const bill of unpaidBills) {
              if (remainingCredit <= 0.009) break;

              const splitsKeys = Object.keys(bill.splits || {});
              const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase()) || friendName;
              const billDebt = bill.splits[matchedKey] || 0;
              const bDoc = basePath.collection('bills').doc(bill.id);

              if (remainingCredit >= billDebt) {
                const nextStatus = { ...(bill.paidStatus || {}), [matchedKey]: true };
                batch.update(bDoc, { paidStatus: nextStatus });
                remainingCredit = Math.round((remainingCredit - billDebt) * 100) / 100;
                autoSettledBillIds.push(bill.id);
                settledBillsCount++;
              } else {
                const remainingDebtOnThisBill = Math.round((billDebt - remainingCredit) * 100) / 100;
                const nextStatus = { ...(bill.paidStatus || {}), [matchedKey]: true };
                batch.update(bDoc, { paidStatus: nextStatus });

                const partialAdjRef = basePath.collection('adjustments').doc();
                batch.set(partialAdjRef, {
                  friendName,
                  amount: remainingDebtOnThisBill,
                  displayAmount: remainingDebtOnThisBill,
                  sourceBillId: sourceBillId || null,
                  isPaymentRecord: false,
                  isSettled: false,
                  note: `⚙️ ยอดค้างส่วนต่างบิล: ${bill.name} (ตัดด้วยบิล ${sourceBillName || 'ล่าสุด'} ไป ${remainingCredit.toFixed(2)} RM)`,
                  date: localDateStr(),
                  createdAt: Date.now()
                });

                autoSettledBillIds.push(bill.id);
                remainingCredit = 0;
                settledBillsCount++;
                break;
              }
            }

            // เซตสถานะส่วนของ Dom ในบิลต้นทางให้เป็น Paid ป้องกันการหักซ้ำ 2 เด้ง
            if (sourceBillId) {
              const srcBill = bills.find(b => b.id === sourceBillId);
              if (srcBill) {
                const nextStatus = { ...(srcBill.paidStatus || {}) };
                Object.keys(srcBill.splits || {}).forEach(k => {
                  if (isSelfName(k)) nextStatus[k] = true;
                });
                batch.update(basePath.collection('bills').doc(sourceBillId), { paidStatus: nextStatus });
                autoSettledBillIds.push(sourceBillId);
              }
            }

            const logRef = basePath.collection('adjustments').doc();
            batch.set(logRef, {
              friendName,
              amount: 0,
              displayAmount: parsedCredit,
              sourceBillId: sourceBillId || null,
              isPaymentRecord: true,
              isSettled: true,
              relatedBillIds: autoSettledBillIds,
              note: `⚡ Smart Net-off: ตัดล้างหนี้บิลเก่าด้วยบิล ${sourceBillName || 'ล่าสุด'} (${parsedCredit.toFixed(2)} RM)`,
              date: localDateStr(),
              createdAt: Date.now() + 1
            });

            if (remainingCredit > 0.009) {
              const excessRef = basePath.collection('adjustments').doc();
              batch.set(excessRef, {
                friendName,
                amount: -remainingCredit,
                displayAmount: remainingCredit,
                sourceBillId: sourceBillId || null,
                isPaymentRecord: true,
                isSettled: false,
                note: `🤝 เครดิตคงเหลือหลังล้างหนี้ครบทุกบิล: ${remainingCredit.toFixed(2)} RM`,
                date: localDateStr(),
                createdAt: Date.now() + 2
              });
            }

            await batch.commit();
            showToast(`🎉 หักกลบลบหนี้สำเร็จ! ล้างบิลเก่าไป ${settledBillsCount} รายการ`);
            setSelectedFriendForAdjust(null);
          }
        } catch (err) {
          console.error("FIFO Error:", err);
          showToast("เกิดข้อผิดพลาดในการตัดหนี้: " + err.message, "error");
        } finally {
          setIsProcessing(false);
        }
      };

      // --- TWO-WAY UNSETTLE SYNC ON DELETE ADJUSTMENT ---
      const handleDeleteAdjustment = async (adj) => {
        if (!isAdmin || isProcessing) return;
        if (!confirm(`ต้องการลบประวัติ "${adj.note}" ใช่หรือไม่? (สถานะบิลจะถูกคืนค่ากลับเป็น Pending)`)) return;

        setIsProcessing(true);
        try {
          if (db) {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();

            const adjRef = basePath.collection('adjustments').doc(adj.id);
            batch.delete(adjRef);

            if (adj.billId) {
              const billObj = bills.find(b => b.id === adj.billId);
              if (billObj) {
                const splitsKeys = Object.keys(billObj.splits || {});
                const matchedKey = splitsKeys.find(k => k.toLowerCase() === adj.friendName.toLowerCase()) || adj.friendName;
                const newPaidStatus = { ...(billObj.paidStatus || {}), [matchedKey]: false };
                const billRef = basePath.collection('bills').doc(adj.billId);
                batch.update(billRef, { paidStatus: newPaidStatus });
              }
            }

            if (adj.relatedBillIds && Array.isArray(adj.relatedBillIds)) {
              adj.relatedBillIds.forEach(bId => {
                const billObj = bills.find(b => b.id === bId);
                if (billObj) {
                  const nextStatus = { ...(billObj.paidStatus || {}) };
                  Object.keys(nextStatus).forEach(k => {
                    if (k.toLowerCase() === adj.friendName.toLowerCase() || isSelfName(k)) {
                      nextStatus[k] = false;
                    }
                  });
                  const billRef = basePath.collection('bills').doc(bId);
                  batch.update(billRef, { paidStatus: nextStatus });
                }
              });
            }

            await batch.commit();
            showToast("ลบประวัติและดึงสถานะบิลกลับมาค้างชำระเรียบร้อย! 🔄");
          }
        } catch (err) {
          showToast("Delete failed: Permission denied", "error");
        } finally {
          setIsProcessing(false);
        }
      };

      // --- ROLLBACK FIFO ON BILL DELETE ---
      const handleDeleteBill = async (billId) => {
        if (!isAdmin || isProcessing) return;
        if (!confirm("ต้องการลบบิลนี้ใช่หรือไม่? (หากบิลนี้เคยถูกนำไปตัดหนี้ FIFO ระบบจะปลดสถานะบิลเก่ากลับมาค้างชำระให้อัตโนมัติ)")) return;

        setIsProcessing(true);
        try {
          if (db) {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();

            batch.delete(basePath.collection('bills').doc(billId));

            // ตรวจหา Adjustments ที่ผูกกับบิลต้นทางนี้เพื่อ Rollback
            const relatedAdjs = adjustments.filter(a => a.sourceBillId === billId || (a.relatedBillIds && a.relatedBillIds.includes(billId)));
            relatedAdjs.forEach(adj => {
              batch.delete(basePath.collection('adjustments').doc(adj.id));
              if (adj.relatedBillIds && Array.isArray(adj.relatedBillIds)) {
                adj.relatedBillIds.forEach(oldBId => {
                  if (oldBId !== billId) {
                    const oldBill = bills.find(b => b.id === oldBId);
                    if (oldBill) {
                      const nextStatus = { ...(oldBill.paidStatus || {}) };
                      Object.keys(nextStatus).forEach(k => {
                        if (k.toLowerCase() === adj.friendName.toLowerCase()) nextStatus[k] = false;
                      });
                      batch.update(basePath.collection('bills').doc(oldBId), { paidStatus: nextStatus });
                    }
                  }
                });
              }
            });

            await batch.commit();
            setViewingBillId(null);
            showToast("ลบบิลและคืนสถานะหนี้เรียบร้อย! 🔄");
          }
        } catch (err) {
          showToast("Delete failed: " + err.message, "error");
        } finally {
          setIsProcessing(false);
        }
      };

      const handleSaveAdjustment = async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          showToast("Only Admin can adjust balances", "error");
          return;
        }
        const amount = parseFloat(adjustAmount);
        if (isNaN(amount) || amount <= 0) {
          showToast("Please enter a valid amount", "error");
          return;
        }

        const finalAmount = adjustType === 'plus' ? amount : -amount;
        const newAdj = {
          friendName: selectedFriendForAdjust,
          amount: finalAmount,
          displayAmount: amount,
          isPaymentRecord: adjustType === 'minus',
          isSettled: false,
          note: adjustNote.trim() || (adjustType === 'plus' ? 'เพิ่มยอดหนี้ (Add Debt)' : `ชำระบางส่วน (Partial Pay: ${amount.toFixed(2)} RM)`),
          date: localDateStr(),
          createdAt: Date.now()
        };

        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').add(newAdj);
            showToast(`Adjustment of ${amount.toFixed(2)} RM saved`);
          } catch (err) {
            showToast("Save failed: Permission denied", "error");
          }
        }
        setSelectedFriendForAdjust(null);
        setAdjustAmount('');
        setAdjustNote('');
      };

      const handleAddFriend = async (e) => {
      e.preventDefault();
      if (!isAdmin) {
        showToast("Only Admin can add friends", "error");
        return;
      }
    
      const name = newFriendName.trim();
      if (!name) return;
    
      // 1. ดักไม่ให้สร้างชื่อที่เป็นตัวแทนของตัวเอง (Me, Dom, ตัวฉันเอง)
      const isSelfAlias = /^(me|dom|me\s*\(dom\)|ตัวฉันเอง)$/i.test(name);
      if (isSelfAlias) {
        showToast("ไม่สามารถเพิ่มชื่อตัวเองเป็นเพื่อนได้", "error");
        return;
      }
    
      // 2. ดักชื่อซ้ำกับที่มีอยู่แล้ว (รวมทั้งที่ Active และ Archived)
      const isDuplicate = friends.some(
        f => (f.name || '').trim().toLowerCase() === name.toLowerCase()
      );
    
      if (isDuplicate) {
        showToast("มีชื่อนี้อยู่ในระบบแล้ว", "error");
        return;
      }
    
        const newF = { 
          name, 
          isSelf: false, 
          isArchived: false, 
          createdAt: Date.now() 
        };
      
        if (db) {
          try {
            await db.collection('artifacts')
              .doc(appId)
              .collection('public')
              .doc('data')
              .collection('friends')
              .add(newF);
            showToast(`เพิ่มเพื่อน "${name}" สำเร็จ!`);
            setNewFriendName('');
          } catch (err) {
            showToast("Failed to add friend", "error");
          }
        }
      };

      const handleToggleArchiveFriend = async (friend) => {
        if (!isAdmin) {
          showToast("Only Admin can archive friends", "error");
          return;
        }
        const actionText = friend.isArchived ? "Restore" : "Archive";
        if (!confirm(`${actionText} friend "${friend.name}"? (Past records remain safe)`)) return;

        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').doc(friend.id).update({
              isArchived: !friend.isArchived
            });
            showToast(`Friend ${actionText.toLowerCase()}d successfully`);
          } catch (err) {
            showToast("Action failed: Permission denied", "error");
          }
        }
      };

      const handleStartRenameFriend = (friend) => {
        if (!isAdmin) return;
        setRenamingFriendId(friend.id);
        setRenameValue(friend.name);
      };

      const handleCancelRenameFriend = () => {
        setRenamingFriendId(null);
        setRenameValue('');
      };

      const handleConfirmRenameFriend = async (friend) => {
        if (!isAdmin) return;
        const newName = renameValue.trim();
        if (!newName || newName === friend.name) {
          handleCancelRenameFriend();
          return;
        }
        if (friends.some(f => f.id !== friend.id && f.name.toLowerCase() === newName.toLowerCase())) {
          showToast("This name already exists", "error");
          return;
        }

        const oldName = friend.name;
        const renameInBill = (bill) => {
          const newItems = (bill.items || []).map(item => ({
            ...item,
            sharedWith: (item.sharedWith || []).map(n => n === oldName ? newName : n)
          }));
          const newSplits = {};
          Object.entries(bill.splits || {}).forEach(([k, v]) => {
            newSplits[k === oldName ? newName : k] = v;
          });
          const newPaidStatus = {};
          Object.entries(bill.paidStatus || {}).forEach(([k, v]) => {
            newPaidStatus[k === oldName ? newName : k] = v;
          });
          return { ...bill, items: newItems, splits: newSplits, paidStatus: newPaidStatus, paidBy: bill.paidBy === oldName ? newName : bill.paidBy };
        };

        try {
          if (db) {
            const batch = db.batch();
            const friendRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').doc(friend.id);
            batch.update(friendRef, { name: newName });

            bills.forEach(bill => {
              const touches = Object.keys(bill.splits || {}).includes(oldName) || (bill.items || []).some(i => (i.sharedWith || []).includes(oldName)) || bill.paidBy === oldName;
              if (touches) {
                const updated = renameInBill(bill);
                const billRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(bill.id);
                batch.update(billRef, { items: updated.items, splits: updated.splits, paidStatus: updated.paidStatus, paidBy: updated.paidBy });
              }
            });

            adjustments.forEach(adj => {
              if (adj.friendName === oldName) {
                const adjRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').doc(adj.id);
                batch.update(adjRef, { friendName: newName });
              }
            });

            await batch.commit();
            showToast(`Renamed to "${newName}"`);
          }
        } catch (err) {
          showToast("Rename failed: Permission denied", "error");
        }
        handleCancelRenameFriend();
      };

      // ใส่ผลอ่านใบเสร็จลงฟอร์ม: รายการ, service charge, ภาษี, ค่าส่ง, ค่าธรรมเนียม, ส่วนลด และยอดปัดเศษ
      const applyParsedReceipt = (r) => {
        const form = receiptToForm(r);
        const hasAnything = r.items.length > 0 || r.deliveryFee || r.packaging || r.otherFees || r.discount || r.scAmount || r.scPercent || r.taxAmount || r.taxPercent;
        if (!hasAnything) return false;

        if (r.items.length > 0) {
          setBillItems(r.items.map(it => ({
            id: Date.now().toString() + Math.random().toString(36).substring(2, 7),
            name: it.name,
            price: it.unitPrice.toFixed(2),
            qty: it.qty,
            taxRate: form.taxRate,
            sharedWith: [...billFriends]
          })));
        }
        if (r.merchant && !newBillName.trim()) setNewBillName(r.merchant);

        const isDineInStyle = (form.scRate > 0 || form.taxRate > 0) && !r.deliveryFee;
        if (isDineInStyle && billType === 'delivery') setBillType('dinein');
        if (form.taxRate > 0) setTaxMode('addon');

        setServiceChargeRate(form.scRate);
        setDeliveryFee(r.deliveryFee || 0);
        setPackagingCharge(form.fees || 0);
        setDiscountAmount(r.discount || 0);
        setRoundingAdj(form.rounding || 0);

        const parts = [`${r.items.length} รายการ`];
        if (form.scRate) parts.push(`Service ${form.scRate}%`);
        if (form.taxRate) parts.push(`ภาษี ${form.taxRate}%`);
        if (r.deliveryFee) parts.push(`ค่าส่ง ${r.deliveryFee.toFixed(2)}`);
        if (form.fees) parts.push(`ค่าธรรมเนียม/แพ็ก ${form.fees.toFixed(2)}`);
        if (r.discount) parts.push(`ส่วนลด ${r.discount.toFixed(2)}`);
        if (form.mismatch) {
          showToast(`แกะได้ ${parts.join(' · ')} — แต่ยอดรวมต่างจากใบเสร็จ ${form.mismatch.toFixed(2)} RM ลองเช็กรายการอีกครั้ง`, 'error');
        } else {
          showToast(`🎉 ${parts.join(' · ')}${r.total ? ' · ยอดตรงใบเสร็จ ✓' : ''}`);
        }
        return true;
      };

      // อ่านคำตอบจากคลิปบอร์ดแล้วแกะใส่ฟอร์มทันที (ถ้าเบราว์เซอร์ไม่ให้อ่าน ให้เปิดช่องวางเอง)
      const handlePasteFromClipboard = async () => {
        let text = '';
        try { text = await navigator.clipboard.readText(); } catch (e) { text = ''; }
        if (!text || !text.trim()) {
          setShowRawTextInput(true);
          showToast('อ่านคลิปบอร์ดไม่ได้ — กดค้างที่ช่องด้านล่างแล้วเลือก "วาง"', 'error');
          return;
        }
        if (applyParsedReceipt(parseReceipt(text))) {
          setShowRawTextInput(false);
          setRawOrderText('');
        } else {
          setRawOrderText(text);
          setShowRawTextInput(true);
          showToast('ข้อความที่คัดลอกมาไม่ใช่ใบเสร็จ ลองคัดลอกคำตอบของ AI ทั้งหมดอีกครั้ง', 'error');
        }
      };

      const handleParseRawText = () => {
        if (!rawOrderText.trim()) return;
        if (applyParsedReceipt(parseReceipt(rawOrderText))) {
          setShowRawTextInput(false);
          setRawOrderText('');
        } else {
          showToast("ไม่พบรายการที่มีราคาชัดเจน ลองใช้คำสั่งสำหรับ Gemini", "error");
        }
      };

      const calculateBillSplits = (items, scRate, dFee, packCharge, discount, roundAdj, selectedFriends, currentTaxMode, currentBillType, rFare, tFee, lAmt, lBorrower, curRemainderMode = 'distribute', curPaidBy = 'Me (Dom)') => {
        const splits = {};
        const friendItemDetails = {};
        const activeFriendsCount = selectedFriends.length;

        if (currentBillType === 'loan') {
          const parsedLoanAmt = parseFloat(lAmt) || 0;
          if (lBorrower) {
            splits[lBorrower] = parsedLoanAmt;
            friendItemDetails[lBorrower] = { baseShare: parsedLoanAmt };
          }
          return {
            subtotal: parsedLoanAmt,
            total: parsedLoanAmt,
            splits,
            friendItemDetails
          };
        }

        if (currentBillType === 'ride') {
          const parsedRideFare = parseFloat(rFare) || 0;
          const parsedToll = parseFloat(tFee) || 0;
          const parsedDiscount = parseFloat(discount) || 0;
          const parsedRoundAdj = parseFloat(roundAdj) || 0;
          
          const netTotal = Math.max(0, parsedRideFare + parsedToll - parsedDiscount + parsedRoundAdj);
          const totalCents = Math.round(netTotal * 100);
          const baseCents = activeFriendsCount > 0 ? Math.floor(totalCents / activeFriendsCount) : 0;
          let remainderCents = activeFriendsCount > 0 ? (totalCents % activeFriendsCount) : 0;

          selectedFriends.forEach(f => {
            let shareCents = baseCents;
            if (curRemainderMode === 'distribute') {
              if (remainderCents > 0) {
                shareCents += 1;
                remainderCents--;
              }
            } else if (curRemainderMode === 'payer' && f.toLowerCase() === curPaidBy.toLowerCase()) {
              shareCents += remainderCents;
            }

            splits[f] = shareCents / 100;

            friendItemDetails[f] = {
              baseShare: Math.round((parsedRideFare / (activeFriendsCount || 1)) * 100) / 100,
              tollShare: Math.round((parsedToll / (activeFriendsCount || 1)) * 100) / 100,
              discountShare: Math.round((parsedDiscount / (activeFriendsCount || 1)) * 100) / 100,
            };
          });

          return {
            subtotal: parsedRideFare,
            tollFee: parsedToll,
            discountAmount: parsedDiscount,
            total: Math.round(netTotal * 100) / 100,
            splits,
            friendItemDetails
          };
        }

        const friendBaseShares = {};
        const friendTaxShares = {};
        
        selectedFriends.forEach(f => {
          friendBaseShares[f] = 0;
          friendTaxShares[f] = 0;
        });

        let subtotal = 0;
        let taxBreakdown = { 0: 0, 6: 0, 7: 0, 8: 0 };
        let totalTax = 0;

        items.forEach(item => {
          const price = parseFloat(item.price) || 0;
          const qty = parseInt(item.qty) || 1;
          const itemTotal = price * qty;
          const taxRate = parseFloat(item.taxRate) || 0;

          subtotal += itemTotal;

          let itemTaxAmount = 0;
          if (currentTaxMode === 'addon') {
            // ภาษีคิดจาก (ค่าอาหาร + service charge) ตามใบเสร็จร้านอาหารทั่วไป (SST มาเลเซีย / VAT ไทย)
            itemTaxAmount = itemTotal * (1 + (parseFloat(scRate) || 0) / 100) * (taxRate / 100);
          } else {
            itemTaxAmount = itemTotal - (itemTotal / (1 + (taxRate / 100)));
          }

          taxBreakdown[taxRate] = (taxBreakdown[taxRate] || 0) + itemTaxAmount;
          totalTax += itemTaxAmount;

          const sharedList = (item.sharedWith || []).filter(f => selectedFriends.includes(f));
          if (sharedList.length > 0) {
            const itemTotalCents = Math.round(itemTotal * 100);
            const baseShareCents = Math.floor(itemTotalCents / sharedList.length);
            let remShareCents = itemTotalCents % sharedList.length;

            const itemTaxCents = Math.round(itemTaxAmount * 100);
            const baseTaxCents = Math.floor(itemTaxCents / sharedList.length);
            let remTaxCents = itemTaxCents % sharedList.length;

            sharedList.forEach(f => {
              const allocatedCents = baseShareCents + (remShareCents > 0 ? 1 : 0);
              if (remShareCents > 0) remShareCents--;
              friendBaseShares[f] = (friendBaseShares[f] || 0) + (allocatedCents / 100);

              const allocatedTaxCents = baseTaxCents + (remTaxCents > 0 ? 1 : 0);
              if (remTaxCents > 0) remTaxCents--;
              friendTaxShares[f] = (friendTaxShares[f] || 0) + (allocatedTaxCents / 100);
            });
          }
        });

        const totalSc = subtotal * (scRate / 100);
        const parsedDFee = parseFloat(dFee) || 0;
        const parsedPackCharge = parseFloat(packCharge) || 0;
        const parsedDiscount = parseFloat(discount) || 0;
        const parsedRoundAdj = parseFloat(roundAdj) || 0;

        const perPersonDelivery = activeFriendsCount > 0 ? (parsedDFee / activeFriendsCount) : 0;
        const perPersonPackaging = activeFriendsCount > 0 ? (parsedPackCharge / activeFriendsCount) : 0;

        let totalDistributedCents = 0;

        selectedFriends.forEach(f => {
          const base = friendBaseShares[f] || 0;
          const friendSc = base * (scRate / 100);
          const friendTax = currentTaxMode === 'addon' ? (friendTaxShares[f] || 0) : 0;
          const userDiscountShare = subtotal > 0 ? (base / subtotal) * parsedDiscount : (parsedDiscount / (activeFriendsCount || 1));
          
          const finalPersonAmount = Math.max(0, base + friendSc + friendTax + perPersonDelivery + perPersonPackaging - userDiscountShare);
          const personCents = Math.round(finalPersonAmount * 100);
          splits[f] = personCents / 100;
          totalDistributedCents += personCents;

          friendItemDetails[f] = {
            baseShare: Math.round(base * 100) / 100,
            scShare: Math.round(friendSc * 100) / 100,
            taxShare: Math.round((friendTaxShares[f] || 0) * 100) / 100,
            deliveryShare: Math.round(perPersonDelivery * 100) / 100,
            packagingShare: Math.round(perPersonPackaging * 100) / 100,
            discountShare: Math.round(userDiscountShare * 100) / 100,
          };
        });

        const addedTaxToTotal = currentTaxMode === 'addon' ? totalTax : 0;
        const finalTotal = Math.round((subtotal + totalSc + addedTaxToTotal + parsedDFee + parsedPackCharge - parsedDiscount + parsedRoundAdj) * 100) / 100;
        const targetTotalCents = Math.round(finalTotal * 100);

        if (activeFriendsCount > 0 && totalDistributedCents !== targetTotalCents) {
          const diffCents = targetTotalCents - totalDistributedCents;
          const targetPerson = (curRemainderMode === 'payer' && selectedFriends.includes(curPaidBy)) 
            ? curPaidBy 
            : selectedFriends[selectedFriends.length - 1];
          splits[targetPerson] = Math.max(0, Math.round((splits[targetPerson] + (diffCents / 100)) * 100) / 100);
        }

        return {
          subtotal: Math.round(subtotal * 100) / 100,
          serviceChargeAmount: Math.round(totalSc * 100) / 100,
          deliveryFee: parsedDFee,
          packagingCharge: parsedPackCharge,
          discountAmount: parsedDiscount,
          taxMode: currentTaxMode,
          taxBreakdown,
          totalTax: Math.round(totalTax * 100) / 100,
          roundingAdjustment: parsedRoundAdj,
          total: finalTotal,
          splits,
          friendItemDetails
        };
      };

      // --- SAVE BILL + FIFO AUTO NET-OFF ---
      const handleSaveBill = async (e) => {
        e.preventDefault();
        if (!isAdmin || isProcessing) return;
        if (!newBillName.trim()) {
          showToast("Please enter a transaction title", "error");
          return;
        }

        const calculated = calculateBillSplits(
          billItems,
          serviceChargeRate,
          deliveryFee,
          packagingCharge,
          discountAmount,
          roundingAdj,
          billFriends,
          taxMode,
          billType,
          rideFare,
          tollFee,
          loanAmount,
          loanBorrower,
          remainderMode,
          paidBy
        );

        let initialPaidStatus = {};
        // 🔁 ตอนแก้ไขบิล: ย้อนการหักกลบ (net-off) ที่บิลนี้เคยทำไว้ก่อน แล้วค่อยคำนวณใหม่จากยอดล่าสุด
        // ไม่งั้น FIFO จะรันซ้อนทุกครั้งที่กดบันทึก และไปตัดบิลเก่าเพิ่ม/สร้าง log ซ้ำ
        const statusOverrides = {}; // billId -> paidStatus ใหม่ที่จะเขียนลงบิลเก่า (รวบรวมแล้วเขียนครั้งเดียว)
        let adjsToRollback = [];
        if (editingBillId) {
          const oldBill = bills.find(b => b.id === editingBillId);
          initialPaidStatus = { ...(oldBill?.paidStatus || {}) };

          // เปลี่ยนคนจ่าย: คนจ่ายเดิมถูกตั้ง Paid ไว้อัตโนมัติ ต้องล้างออกให้คำนวณใหม่
          const oldPayer = oldBill?.paidBy || 'Me (Dom)';
          if (oldPayer.toLowerCase() !== paidBy.toLowerCase()) {
            Object.keys(initialPaidStatus).forEach(k => {
              if (k.toLowerCase() === oldPayer.toLowerCase()) delete initialPaidStatus[k];
            });
          }

          adjsToRollback = adjustments.filter(a =>
            a.sourceBillId === editingBillId ||
            // ข้อมูลเก่า: adjustment ยอดคงเหลือบางส่วนไม่ได้เก็บ sourceBillId ไว้ ต้องจับคู่จากข้อความ + วันที่
            (oldBill && !a.sourceBillId && a.date === oldBill.date &&
              (a.friendName || '').toLowerCase() === (oldBill.paidBy || '').toLowerCase() &&
              (a.note || '').includes(`หักล้างอัตโนมัติด้วยบิล ${oldBill.name} ไป`))
          );

          adjsToRollback.forEach(adj => {
            (adj.relatedBillIds || []).forEach(bId => {
              if (bId === editingBillId) return;
              const b = bills.find(x => x.id === bId);
              if (!b) return;
              const next = statusOverrides[bId] || { ...(b.paidStatus || {}) };
              Object.keys(next).forEach(k => {
                if (k.toLowerCase() === (adj.friendName || '').toLowerCase()) next[k] = false;
              });
              statusOverrides[bId] = next;
            });
          });

          // ถ้าเคยหักกลบไว้ ส่วนของ Dom ในบิลนี้ถูกตั้งเป็น Paid ให้คืนค่าเพื่อคำนวณใหม่
          if (adjsToRollback.some(a => Array.isArray(a.relatedBillIds))) {
            Object.keys(initialPaidStatus).forEach(k => {
              if (isSelfName(k)) delete initialPaidStatus[k];
            });
          }
        }
        const effectiveStatus = (b) => statusOverrides[b.id] || b.paidStatus || {};

        const participantsToProcess = billType === 'loan' ? (loanBorrower ? [loanBorrower] : []) : billFriends;

        participantsToProcess.forEach(f => {
          if (initialPaidStatus[f] === undefined) {
            const isCurrentPayer = f.toLowerCase() === paidBy.toLowerCase();
            initialPaidStatus[f] = isCurrentPayer ? true : false;
          }
        });

        const billPayload = {
          name: newBillName,
          billType,
          paidBy,
          remainderMode,
          taxMode,
          date: newBillDate,
          rideFare: parseFloat(rideFare) || 0,
          tollFee: parseFloat(tollFee) || 0,
          rideRoute,
          loanAmount: parseFloat(loanAmount) || 0,
          loanBorrower,
          subtotal: calculated.subtotal,
          serviceChargeRate,
          serviceChargeAmount: calculated.serviceChargeAmount || 0,
          deliveryFee: calculated.deliveryFee || 0,
          packagingCharge: calculated.packagingCharge || 0,
          discountAmount: calculated.discountAmount || 0,
          taxBreakdown: calculated.taxBreakdown || {},
          totalTax: calculated.totalTax || 0,
          roundingAdjustment: calculated.roundingAdjustment || 0,
          total: calculated.total,
          items: (billType === 'ride' || billType === 'loan') ? [] : billItems.map(item => ({
            id: item.id,
            name: item.name,
            price: parseFloat(item.price) || 0,
            qty: parseInt(item.qty) || 1,
            taxRate: parseFloat(item.taxRate || 0),
            sharedWith: item.sharedWith || []
          })),
          splits: calculated.splits,
          friendItemDetails: calculated.friendItemDetails,
          paidStatus: initialPaidStatus,
          updatedAt: Date.now()
        };

        setIsProcessing(true);
        if (db) {
          try {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();

            let billDocRef;
            if (editingBillId) {
              billDocRef = basePath.collection('bills').doc(editingBillId);
              batch.update(billDocRef, billPayload);
            } else {
              billPayload.createdAt = Date.now();
              billDocRef = basePath.collection('bills').doc();
              batch.set(billDocRef, billPayload);
            }

            adjsToRollback.forEach(adj => {
              batch.delete(basePath.collection('adjustments').doc(adj.id));
            });

            // ⚡ SMART FIFO AUTO-NETOFF: ถ้าเพื่อนจ่าย และ Dom มีส่วนต้องออก ให้วิ่งไปตัดบิลเก่าที่เพื่อนค้างเราทันที
            const isDomPayer = isSelfName(paidBy);
            const myShareInThisBill = calculated.splits?.['Me (Dom)'] || calculated.splits?.['ตัวฉันเอง'] || 0;

            if (!isDomPayer && myShareInThisBill > 0) {
              const friendPayerName = paidBy;
              const unpaidBills = bills
                .filter(b => {
                  const bDomPayer = isSelfName(b.paidBy || 'Me (Dom)');
                  const splitsKeys = Object.keys(b.splits || {});
                  const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendPayerName.toLowerCase());
                  const isUnpaid = matchedKey && !effectiveStatus(b)[matchedKey] && (b.splits[matchedKey] || 0) > 0;
                  return b.id !== billDocRef.id && bDomPayer && isUnpaid;
                })
                .sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0) || (a.createdAt || 0) - (b.createdAt || 0));

              if (unpaidBills.length > 0) {
                let remainingCredit = myShareInThisBill;
                let autoSettledBillIds = [billDocRef.id];
                let settledCount = 0;

                for (const oldBill of unpaidBills) {
                  if (remainingCredit <= 0.009) break;

                  const splitsKeys = Object.keys(oldBill.splits || {});
                  const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendPayerName.toLowerCase()) || friendPayerName;
                  const billDebt = oldBill.splits[matchedKey] || 0;

                  if (remainingCredit >= billDebt) {
                    statusOverrides[oldBill.id] = { ...effectiveStatus(oldBill), [matchedKey]: true };
                    remainingCredit = Math.round((remainingCredit - billDebt) * 100) / 100;
                    autoSettledBillIds.push(oldBill.id);
                    settledCount++;
                  } else {
                    const remainingDebt = Math.round((billDebt - remainingCredit) * 100) / 100;
                    statusOverrides[oldBill.id] = { ...effectiveStatus(oldBill), [matchedKey]: true };

                    const partAdjRef = basePath.collection('adjustments').doc();
                    batch.set(partAdjRef, {
                      friendName: friendPayerName,
                      amount: remainingDebt,
                      displayAmount: remainingDebt,
                      sourceBillId: billDocRef.id,
                      isPaymentRecord: false,
                      isSettled: false,
                      note: `⚙️ ยอดคงเหลือบิล: ${oldBill.name} (หักล้างอัตโนมัติด้วยบิล ${newBillName} ไป ${remainingCredit.toFixed(2)} RM)`,
                      date: newBillDate,
                      createdAt: Date.now()
                    });

                    autoSettledBillIds.push(oldBill.id);
                    remainingCredit = 0;
                    settledCount++;
                    break;
                  }
                }

                // เซตให้ส่วนของ Dom ในบิลนี้เป็น Paid เพื่อป้องกันการหักยอดซ้ำใน getFriendBalances
                initialPaidStatus['Me (Dom)'] = true;
                initialPaidStatus['ตัวฉันเอง'] = true;
                batch.update(billDocRef, { paidStatus: initialPaidStatus });

                const autoLogRef = basePath.collection('adjustments').doc();
                batch.set(autoLogRef, {
                  friendName: friendPayerName,
                  amount: 0,
                  displayAmount: myShareInThisBill,
                  sourceBillId: billDocRef.id,
                  isPaymentRecord: true,
                  isSettled: true,
                  relatedBillIds: autoSettledBillIds,
                  note: `⚡ Auto Net-off: ${friendPayerName} ออกค่า ${newBillName} ให้ (${myShareInThisBill.toFixed(2)} RM) -> ล้างบิลเก่าอัตโนมัติ ${settledCount} บิล`,
                  date: newBillDate,
                  createdAt: Date.now() + 1
                });

                // ⚠️ ถ้าเครดิตที่เพื่อนออกให้ (myShareInThisBill) มากกว่ายอดบิลเก่าที่เพื่อนติดรวมกัน
                // ส่วนเกินนี้คือยอดที่ Dom ยังติดเพื่อนอยู่จริง ต้องบันทึกเป็นหนี้ไว้ ไม่ใช่ปล่อยหาย
                if (remainingCredit > 0.009) {
                  const excessOweRef = basePath.collection('adjustments').doc();
                  batch.set(excessOweRef, {
                    friendName: friendPayerName,
                    amount: -remainingCredit,
                    displayAmount: remainingCredit,
                    sourceBillId: billDocRef.id,
                    isPaymentRecord: false,
                    isSettled: false,
                    note: `⚙️ ยอดคงเหลือที่ Dom ยังติด ${friendPayerName} หลังหักกลบบิลเก่าหมดแล้ว: ${remainingCredit.toFixed(2)} RM`,
                    date: newBillDate,
                    createdAt: Date.now() + 2
                  });
                }
              }
            }

            // เขียนสถานะบิลเก่าทั้งหมด (ทั้งที่ถูกย้อนคืนและที่ถูกหักใหม่) ครั้งเดียวต่อบิล
            Object.entries(statusOverrides).forEach(([bId, status]) => {
              batch.update(basePath.collection('bills').doc(bId), { paidStatus: status });
            });

            await batch.commit();
            showToast("บันทึกบิลและคำนวณยอดเรียบร้อย! 🎉");
          } catch (err) {
            showToast("Save failed: Permission denied", "error");
          } finally {
            setIsProcessing(false);
          }
        }

        setEditingBillId(null);
        setViewingBillId(null);
        setActiveTab('bills');
      };

      const handleTogglePaid = async (bill, friendName) => {
        if (!isAdmin || isProcessing) return;
        const splitsKeys = Object.keys(bill.splits || {});
        const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase()) || friendName;
        const currentPaid = !!bill.paidStatus?.[matchedKey];
        const newPaidStatus = !currentPaid;
        const updatedStatus = { ...(bill.paidStatus || {}), [matchedKey]: newPaidStatus };
        const userShare = bill.splits?.[matchedKey] || 0;
        
        setIsProcessing(true);
        if (db) {
          try {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();

            const billRef = basePath.collection('bills').doc(bill.id);
            batch.update(billRef, { paidStatus: updatedStatus });

            if (newPaidStatus && userShare > 0) {
              const adjRef = basePath.collection('adjustments').doc();
              batch.set(adjRef, {
                friendName: matchedKey,
                billId: bill.id,
                amount: 0,
                displayAmount: userShare,
                isPaymentRecord: true,
                isSettled: true,
                note: `✓ ชำระแล้ว: ${bill.name}`,
                date: localDateStr(),
                createdAt: Date.now()
              });
            } else if (!newPaidStatus) {
              const matchedAdjs = adjustments.filter(a => a.billId === bill.id && a.friendName.toLowerCase() === matchedKey.toLowerCase());
              matchedAdjs.forEach(adj => {
                const adjRef = basePath.collection('adjustments').doc(adj.id);
                batch.delete(adjRef);
              });
            }

            await batch.commit();
            showToast(`Updated ${matchedKey} to ${newPaidStatus ? 'Paid' : 'Pending'}`);
          } catch (err) {
            showToast("Update failed: Permission denied", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      const handleToggleAdjStatus = async (adj) => {
        if (!isAdmin || isProcessing) return;
        const newStatus = !adj.isSettled;
        setIsProcessing(true);
        if (db) {
          try {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            await basePath.collection('adjustments').doc(adj.id).update({ isSettled: newStatus });
            showToast(`Updated status to ${newStatus ? 'Paid' : 'Pending'}`);
          } catch (e) {
            showToast("Failed to update status", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      const handleRestoreJSON = (e) => {
        if (!isAdmin) {
          showToast("Admin only can restore data", "error");
          return;
        }
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (!data.friends || !data.bills) {
              showToast("Invalid backup JSON format", "error");
              return;
            }

            if (!confirm(`Are you sure you want to restore ${data.bills.length} bills and ${data.friends.length} friends?`)) {
              return;
            }

            if (db) {
              const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
              const batch = db.batch();

              data.friends.forEach(f => {
                const ref = basePath.collection('friends').doc(f.id || undefined);
                batch.set(ref, { name: f.name, isSelf: f.isSelf || false, isArchived: f.isArchived || false, createdAt: f.createdAt || Date.now() });
              });

              data.bills.forEach(b => {
                const ref = basePath.collection('bills').doc(b.id || undefined);
                batch.set(ref, b);
              });

              (data.adjustments || []).forEach(a => {
                const ref = basePath.collection('adjustments').doc(a.id || undefined);
                batch.set(ref, a);
              });

              await batch.commit();
              showToast("Backup restored to cloud successfully! 🎉");
            }
          } catch (err) {
            console.error(err);
            showToast("Failed to parse or restore JSON file", "error");
          } finally {
            if (restoreInputRef.current) restoreInputRef.current.value = '';
          }
        };
        reader.readAsText(file);
      };

      const monthlyBills = useMemo(() => {
        return bills.filter(b => (b.date || '').startsWith(selectedMonth));
      }, [bills, selectedMonth]);

      const monthlyStats = useMemo(() => {
        let totalGroup = 0;
        let foodTotal = 0;
        let rideTotal = 0;
        let loanTotal = 0;
        const friendShares = {};
        const dailyMyExpenses = {};

        friends.forEach(f => { friendShares[f.name] = 0; });

        monthlyBills.forEach(b => {
          const tot = b.total || 0;
          totalGroup += tot;
          if (b.billType === 'ride') {
            rideTotal += tot;
          } else if (b.billType === 'loan') {
            loanTotal += tot;
          } else {
            foodTotal += tot;
          }

          const selfAmount = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          if (b.date && selfAmount > 0) {
            if (!dailyMyExpenses[b.date]) {
              dailyMyExpenses[b.date] = { total: 0, items: [] };
            }
            dailyMyExpenses[b.date].total += selfAmount;
            dailyMyExpenses[b.date].items.push({ name: b.name, amount: selfAmount, type: b.billType });
          }

          Object.entries(b.splits || {}).forEach(([pName, pAmt]) => {
            const fObj = friends.find(f => f.name.toLowerCase() === pName.toLowerCase());
            const key = fObj ? fObj.name : pName;
            friendShares[key] = (friendShares[key] || 0) + (pAmt || 0);
          });
        });

        const sortedSpenders = Object.entries(friendShares)
          .filter(([_, amt]) => amt > 0)
          .sort((a, b) => b[1] - a[1]);

        return {
          totalGroup,
          foodTotal,
          rideTotal,
          loanTotal,
          count: monthlyBills.length,
          avgPerBill: monthlyBills.length > 0 ? (totalGroup / monthlyBills.length) : 0,
          foodPct: totalGroup > 0 ? Math.round((foodTotal / totalGroup) * 100) : 0,
          ridePct: totalGroup > 0 ? Math.round((rideTotal / totalGroup) * 100) : 0,
          sortedSpenders,
          dailyMyExpenses
        };
      }, [monthlyBills, friends]);

      const calendarMatrix = useMemo(() => {
        if (!selectedMonth) return [];
        const [year, month] = selectedMonth.split('-').map(Number);
        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        
        const matrix = [];
        let dayCounter = 1;

        for (let row = 0; row < 6; row++) {
          const week = [];
          for (let col = 0; col < 7; col++) {
            if (row === 0 && col < firstDayIndex) {
              week.push(null);
            } else if (dayCounter > daysInMonth) {
              week.push(null);
            } else {
              const dayStr = `${selectedMonth}-${String(dayCounter).padStart(2, '0')}`;
              const dayData = monthlyStats.dailyMyExpenses[dayStr] || null;
              week.push({
                day: dayCounter,
                dateStr: dayStr,
                total: dayData ? dayData.total : 0,
                items: dayData ? dayData.items : []
              });
              dayCounter++;
            }
          }
          matrix.push(week);
          if (dayCounter > daysInMonth) break;
        }
        return matrix;
      }, [selectedMonth, monthlyStats.dailyMyExpenses]);

      const handleExportPDF = async (ref, filename) => {
        if (!ref.current) return;
        try {
          showToast("Generating PDF document...");
          const canvas = await html2canvas(ref.current, {
            scale: 2,
            backgroundColor: themeColor('surface')
          });
          const imgData = canvas.toDataURL('image/png');
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const imgWidth = 210;
          const pageHeight = 297;
          const imgHeight = (canvas.height * imgWidth) / canvas.width;

          let heightLeft = imgHeight;
          let position = 0;

          pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;

          while (heightLeft > 0) {
            position = heightLeft - imgHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;
          }

          pdf.save(`${filename}.pdf`);
          showToast("PDF Downloaded successfully!");
        } catch (err) {
          console.error(err);
          showToast("Failed to generate PDF", "error");
        }
      };

      const filteredBills = useMemo(() => {
        const term = searchQuery.trim().toLowerCase();
        return bills.filter(bill => {
          const matchTitle = (bill.name || '').toLowerCase().includes(term);
          const matchRoute = (bill.rideRoute || '').toLowerCase().includes(term);
          const matchItem = (bill.items || []).some(item => (item.name || '').toLowerCase().includes(term));
          
          if (term && !matchTitle && !matchRoute && !matchItem) return false;

          const unpaidCount = countUnpaid(bill, friends);

          if (statusFilter === 'pending') return unpaidCount > 0;
          if (statusFilter === 'settled') return unpaidCount === 0;
          if (statusFilter === 'ride') return bill.billType === 'ride';
          if (statusFilter === 'loan') return bill.billType === 'loan';
          if (statusFilter === 'food') return bill.billType !== 'ride' && bill.billType !== 'loan';

          return true;
        });
      }, [bills, searchQuery, statusFilter, friends]);

      const totalOwedAmount = Object.keys(friendBalances).reduce((acc, name) => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || isSelfName(name);
        if (!isMe) return acc + Math.max(0, friendBalances[name].totalOwed);
        return acc;
      }, 0);

      const pendingDebtorsCount = Object.keys(friendBalances).filter(name => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || isSelfName(name);
        return !isMe && friendBalances[name].totalOwed > 0;
      }).length;

      // ตัวแปรคำนวณจำนวนลูกหนี้/เจ้าหนี้สำหรับปุ่มฟิลเตอร์
      const receivableCount = Object.keys(friendBalances).filter(name => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || isSelfName(name);
        return !isMe && friendBalances[name].totalOwed > 0;
      }).length;

      const payableCount = Object.keys(friendBalances).filter(name => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || isSelfName(name);
        return !isMe && friendBalances[name].totalOwed < 0;
      }).length;

      const totalWeOweAmount = Object.keys(friendBalances).reduce((acc, name) => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || isSelfName(name);
        if (!isMe && friendBalances[name].totalOwed < 0) return acc + Math.abs(friendBalances[name].totalOwed);
        return acc;
      }, 0);

      // จัดกลุ่มบิลตามวัน (วันล่าสุดก่อน) สำหรับหน้าประวัติ
      const groupBillsByDate = (list) => {
        const map = new Map();
        list.forEach(b => {
          const d = b.date || '';
          if (!map.has(d)) map.set(d, []);
          map.get(d).push(b);
        });
        return Array.from(map.entries())
          .sort((a, b) => (a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0))
          .map(([date, items]) => ({ date, bills: items }));
      };

      const formatDayLabel = (dateStr) => {
        if (!dateStr) return '—';
        const today = localDateStr();
        const y = new Date(); y.setDate(y.getDate() - 1);
        const day = (() => { const [yy, mm, dd] = dateStr.split('-').map(Number); return new Date(yy, (mm || 1) - 1, dd || 1); })();
        const label = day.toLocaleDateString(lang === 'th' ? 'th-TH' : 'en-GB', { day: 'numeric', month: 'short', year: day.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
        if (dateStr === today) return `${t('today')} · ${label}`;
        if (dateStr === localDateStr(y)) return `${t('yesterday')} · ${label}`;
        return label;
      };

      const billShareText = (bill) => `🧾 รายละเอียด: ${bill.name}\nยอดรวม: ${bill.total?.toFixed(2)} RM\n` +
        (bill.billType === 'loan' ? `- ผู้ยืม: ${bill.loanBorrower}` : (bill.items || []).map(i => `- ${i.name} (x${i.qty}): ${i.price} RM`).join('\n'));

      const startNewBill = () => {
        setEditingBillId(null);
        setNewBillName('');
        setBillType('delivery');
        setPaidBy('Me (Dom)');
        setRemainderMode('distribute');
        setTaxMode('inclusive');
        setDeliveryFee(0);
        setPackagingCharge(0);
        setDiscountAmount(0);
        setServiceChargeRate(0);
        setRoundingAdj(0);
        setRideFare('');
        setTollFee('');
        setRideRoute('');
        setLoanAmount('');
        setLoanBorrower('');
        setBillItems([{ id: '1', name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }]);
        setBillFriends(friends.filter(f => !f.isArchived).map(f => f.name));
        setActiveTab('new-bill');
      };

      const currentSelectedBalance = selectedFriendForAdjust ? (friendBalances[selectedFriendForAdjust] || { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 }) : null;

      // กรองรายชื่อเพื่อนเฉพาะที่มียอดค้างชำระจริง (ไม่แสดงคนยอด 0 และไม่แสดงตัวเอง)
      const unsettledFriendList = useMemo(() => {
        return friends.filter(f => {
          const isMe = f.isSelf || isSelfName(f.name);
          const bal = friendBalances[f.name]?.totalOwed || 0;
          if (isMe || bal === 0) return false;
          if (dashboardDebtFilter === 'receivable') return bal > 0;
          if (dashboardDebtFilter === 'payable') return bal < 0;
          return true;
        });
      }, [friends, friendBalances, dashboardDebtFilter]);

      return (
        <div className="pb-16 min-h-screen">
          {/* Header */}
          <header
            className="bg-bg/85 sticky top-0 z-40 backdrop-blur-md"
            style={{ paddingTop: 'env(safe-area-inset-top, 0px)', paddingLeft: 'env(safe-area-inset-left, 0px)', paddingRight: 'env(safe-area-inset-right, 0px)' }}
          >
            <div className="max-w-4xl mx-auto px-4 sm:px-5 py-3 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                <img 
                  src="cat.jpg" 
                  alt="" 
                  className="w-10 h-10 rounded-full object-cover bg-subtle shrink-0"
                  onError={(e) => { e.target.style.visibility='hidden'; }}
                />
                <div className="flex flex-col min-w-0">
                  <span className="text-xs text-textSecondary truncate">
                    {isAdmin ? t('helloAdmin') : t('viewOnly')}
                  </span>
                  <h1 className="text-base font-bold text-textPrimary leading-tight truncate">{t('appTitle')}</h1>
                </div>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                {isAdmin && (
                  <button
                    onClick={startNewBill}
                    className="hidden sm:flex bg-accent hover:bg-accent-hover font-bold px-4 h-11 rounded-xl transition text-sm items-center gap-1.5"
                  >
                    {PLUS_ICON} {t('newBill')}
                  </button>
                )}
                <button
                  onClick={handleThemeToggle}
                  aria-label={theme === 'dark' ? t('lightMode') : t('darkMode')}
                  title={theme === 'dark' ? t('lightMode') : t('darkMode')}
                  className="w-11 h-11 rounded-xl border border-line bg-surface hover:bg-subtle text-textPrimary flex items-center justify-center transition"
                >
                  {theme === 'dark' ? (
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                  ) : (
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
                  )}
                </button>
                <button
                  onClick={handleLangToggle}
                  className="h-11 min-w-[44px] px-3 rounded-xl border border-line bg-surface hover:bg-subtle text-xs font-bold text-textPrimary transition"
                >
                  {lang === 'en' ? 'TH' : 'EN'}
                </button>
                {isAdmin ? (
                  <button 
                    onClick={handleLogoutAdmin}
                    aria-label={t('lock')}
                    title={t('lock')}
                    className="w-11 h-11 rounded-xl border border-line bg-surface hover:bg-coral-subtle text-textSecondary hover:text-coral flex items-center justify-center transition"
                  >
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
                  </button>
                ) : (
                  <button 
                    onClick={() => setShowAuthModal(true)}
                    className="h-11 px-4 rounded-xl bg-accent hover:bg-accent-hover font-bold text-xs transition"
                  >
                    {t('adminSignIn')}
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className={`max-w-4xl mx-auto px-4 sm:px-5 mt-3 ${activeTab === 'new-bill' ? 'pb-4' : 'pb-28'} sm:pb-8`}>

            {/* Tabs — จอใหญ่แสดงแถบด้านบน มือถือใช้ Bottom Nav แทน */}
            <div className="hidden sm:grid grid-cols-5 bg-subtle p-1 rounded-2xl gap-1 mb-6 border border-line">
              {[
                { id: 'dashboard', label: t('dashboard') },
                { id: 'bills', label: `${t('history')} (${bills.length})` },
                { id: 'friends', label: `${t('friends')} (${friends.filter(f => !f.isArchived).length})` },
                { id: 'adjustments', label: `${t('adjustments')} (${adjustments.length})` },
                { id: 'analytics', label: t('analytics') }
              ].map(tab => (
                <button 
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`py-2 px-3 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 truncate ${activeTab === tab.id ? 'bg-surface text-textPrimary card-shadow' : 'text-textSecondary hover:text-textPrimary'}`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* --- 1. DASHBOARD --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4 max-w-xl mx-auto">
                {/* ยอดรวม + แถบเทียบ ค้างเรา / เราค้าง */}
                <div className="bg-surface rounded-[20px] p-5 card-shadow space-y-3.5">
                  <p className="text-[13px] text-textSecondary">{t('totalToCollect')}</p>
                  <div className="flex items-baseline gap-2 -mt-2">
                    <span className="font-mono text-[44px] leading-tight font-bold tracking-tight text-textPrimary tabular">{totalOwedAmount.toFixed(2)}</span>
                    <span className="text-[15px] text-textSecondary">RM</span>
                  </div>
                  {(totalOwedAmount > 0 || totalWeOweAmount > 0) && (
                    <div className="flex h-2 gap-[3px]" aria-hidden="true">
                      {totalOwedAmount > 0 && <div className="bg-accent rounded-full" style={{ flex: totalOwedAmount }}></div>}
                      {totalWeOweAmount > 0 && <div className="bg-coral rounded-full" style={{ flex: totalWeOweAmount }}></div>}
                    </div>
                  )}
                  <div className="flex justify-between text-xs text-textSecondary gap-3">
                    <span>{t('theyOweMe')} · {t('peopleCount', { n: receivableCount })} <b className="font-mono text-mint">{totalOwedAmount.toFixed(2)}</b></span>
                    <span>{t('iOwe')} <b className="font-mono text-coral">{totalWeOweAmount.toFixed(2)}</b></span>
