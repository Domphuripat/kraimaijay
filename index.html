                {/* ปุ่มสร้างบิล + ยอดวันนี้ */}
                <div className={`grid gap-2.5 ${isAdmin ? 'grid-cols-[minmax(0,1fr)_auto]' : 'grid-cols-1'}`}>
                  {isAdmin && (
                    <button
                      onClick={startNewBill}
                      className="h-[52px] rounded-2xl bg-accent hover:bg-accent-hover active:scale-[0.99] font-bold text-[15px] flex items-center justify-center gap-2 transition"
                    >
                      {PLUS_ICON} {t('newBill')}
                    </button>
                  )}
                  <div className="h-[52px] rounded-2xl bg-surface card-shadow px-3.5 flex flex-col justify-center" title={t('calculatedToday', { n: todayBillsCount })}>
                    <span className="text-[11px] text-textSecondary">{t('myExpenseToday')}</span>
                    <span className="font-mono text-[15px] font-bold tabular">{todayMyExpense.toFixed(2)}</span>
                  </div>
                </div>

                {/* ตัวกรอง */}
                <div className="grid grid-cols-3 gap-1 bg-subtle p-1 rounded-xl border border-line">
                  {[
                    { id: 'all', label: t('segAll', { n: receivableCount + payableCount }) },
                    { id: 'receivable', label: t('segTheyOwe', { n: receivableCount }) },
                    { id: 'payable', label: t('segIOwe', { n: payableCount }) },
                  ].map(f => (
                    <button
                      key={f.id}
                      onClick={() => setDashboardDebtFilter(f.id)}
                      className={`h-9 rounded-[9px] text-[13px] transition ${dashboardDebtFilter === f.id ? 'bg-surface text-textPrimary font-semibold card-shadow' : 'text-textSecondary hover:text-textPrimary'}`}
                    >
                      {f.label}
                    </button>
                  ))}
                </div>

                {/* รายชื่อเพื่อนที่ยังไม่เคลียร์ — แตะเพื่อดูสเตตเมนต์ */}
                <div className="bg-surface rounded-[20px] px-4 py-1 card-shadow">
                  {unsettledFriendList.length === 0 ? (
                    <div className="py-10 text-center text-textMuted text-sm">{t('allSettled')}</div>
                  ) : (
                    unsettledFriendList.map((friend, idx) => {
                      const balance = friendBalances[friend.name] || { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
                      const isDebtor = balance.totalOwed > 0;
                      return (
                        <button
                          key={friend.id}
                          onClick={() => setSelectedFriendForHistory(friend.name)}
                          className={`w-full flex items-center gap-3 h-[60px] text-left ${idx < unsettledFriendList.length - 1 ? 'border-b border-line' : ''}`}
                        >
                          <span className={`w-[38px] h-[38px] rounded-full flex items-center justify-center text-sm font-semibold shrink-0 ${isDebtor ? 'bg-subtle text-textPrimary' : 'bg-coral-subtle text-coral'}`}>
                            {(friend.name || '?').trim().charAt(0).toUpperCase()}
                          </span>
                          <span className="flex-1 min-w-0 flex flex-col">
                            <span className="text-[15px] font-semibold text-textPrimary truncate">
                              {friend.name}
                              {friend.isArchived && <span className="ml-1.5 text-[10px] font-normal bg-subtle text-textMuted px-1.5 py-0.5 rounded">{t('archivedBadge')}</span>}
                            </span>
                            <span className={`text-xs truncate ${isDebtor ? 'text-textSecondary' : 'text-coral'}`}>
                              {isDebtor
                                ? `${t('bills')} ${balance.billsOwed.toFixed(2)}${balance.adjustedOwed !== 0 ? ` · ${t('adj')} ${balance.adjustedOwed > 0 ? '+' : '−'}${Math.abs(balance.adjustedOwed).toFixed(2)}` : ''}`
                                : t('iOweThem')}
                            </span>
                          </span>
                          <span className={`font-mono text-base font-bold tabular ${isDebtor ? 'text-mint' : 'text-coral'}`}>
                            {Math.abs(balance.totalOwed).toFixed(2)}
                          </span>
                        </button>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* --- 2. CREATE / EDIT TRANSACTION --- */}
            {activeTab === 'new-bill' && (
              isAdmin ? (
                <form onSubmit={handleSaveBill} className="max-w-xl mx-auto space-y-4">
                  <div className="flex items-center justify-between h-12">
                    <button type="button" onClick={() => setActiveTab('bills')} aria-label={t('cancel')} className="w-11 h-11 -ml-2 flex items-center justify-center text-textPrimary">
                      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
                    </button>
                    <h2 className="text-[17px] font-bold text-textPrimary">{editingBillId ? t('editTx') : t('newBill')}</h2>
                    <span className="w-11 h-11" aria-hidden="true"></span>
                  </div>

                  <div className="grid grid-cols-4 gap-1 bg-subtle p-1 rounded-xl border border-line" role="group" aria-label="type">
                    <button
                      type="button"
                      onClick={() => { setBillType('delivery'); setTaxMode('inclusive'); setServiceChargeRate(0); }}
                      className={`h-11 rounded-[9px] text-xs flex items-center justify-center gap-1.5 transition ${billType === 'delivery' ? 'bg-surface text-textPrimary font-bold card-shadow' : 'text-textSecondary hover:text-textPrimary'}`}
                    >
                      {BILL_TYPE_ICONS.delivery}<span className="hidden min-[400px]:inline">{t('typeDelivery')}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => { setBillType('ride'); setDiscountAmount(0); }}
                      className={`h-11 rounded-[9px] text-xs flex items-center justify-center gap-1.5 transition ${billType === 'ride' ? 'bg-surface text-textPrimary font-bold card-shadow' : 'text-textSecondary hover:text-textPrimary'}`}
                    >
                      {BILL_TYPE_ICONS.ride}<span className="hidden min-[400px]:inline">{t('typeRide')}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => { setBillType('dinein'); setTaxMode('addon'); setDeliveryFee(0); setPackagingCharge(0); }}
                      className={`h-11 rounded-[9px] text-xs flex items-center justify-center gap-1.5 transition ${billType === 'dinein' ? 'bg-surface text-textPrimary font-bold card-shadow' : 'text-textSecondary hover:text-textPrimary'}`}
                    >
                      {BILL_TYPE_ICONS.dinein}<span className="hidden min-[400px]:inline">{t('typeDineIn')}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => { setBillType('loan'); }}
                      className={`h-11 rounded-[9px] text-xs flex items-center justify-center gap-1.5 transition ${billType === 'loan' ? 'bg-surface text-textPrimary font-bold card-shadow' : 'text-textSecondary hover:text-textPrimary'}`}
                    >
                      {BILL_TYPE_ICONS.loan}<span className="hidden min-[400px]:inline">{t('typeLoan')}</span>
                    </button>
                  </div>

                  {/* PAID BY SELECTOR */}
                  {billType !== 'loan' && (
                    <div className="bg-surface p-4 rounded-2xl card-shadow space-y-2.5">
                      <label className="block text-xs font-bold text-textPrimary">
                        {t('paidByLabel')}
                      </label>
                      <div className="flex flex-wrap gap-2">
                        {friends.filter(f => !f.isArchived).map(friend => {
                          const isPayer = paidBy.toLowerCase() === friend.name.toLowerCase();
                          return (
                            <button
                              key={friend.id}
                              type="button"
                              onClick={() => setPaidBy(friend.name)}
                              className={`h-9 px-3.5 rounded-full text-[13px] transition ${isPayer ? 'bg-accent font-bold' : 'bg-subtle text-textPrimary border border-line'}`}
                            >
                              {isPayer ? '✓ ' : ''} {friend.name}
                            </button>
                          );
                        })}
                      </div>
                      {paidBy !== 'Me (Dom)' && (
                        <p className="text-[11px] text-amber mt-1">
                          💡 เมื่อบันทึกบิลนี้ ระบบจะนำยอดส่วนของฉัน (Dom) ไป<b>ล้างบิลเก่าๆ</b> ที่ {paidBy} เคยค้างเราให้อัตโนมัติ (FIFO Net-off)
                        </p>
                      )}
                    </div>
                  )}

                  {/* SMART SCANNER WITH ROTATION */}
                  {billType !== 'loan' && (
                    <div className="bg-surface card-shadow px-4 py-3 rounded-2xl space-y-2.5">
                      <div className="flex items-center justify-between gap-3">
                        <p className="text-xs text-textSecondary">วางคำตอบจากแชท AI เพื่อกรอกบิลอัตโนมัติ</p>
                        <div className="flex items-center gap-2 shrink-0">
                          <button
                            type="button"
                            onClick={() => setShowRawTextInput(!showRawTextInput)}
                            className="text-xs font-semibold text-textSecondary hover:text-textPrimary underline underline-offset-2 px-1"
                          >
                            {showRawTextInput ? 'ซ่อน' : 'พิมพ์เอง'}
                          </button>
                          <button
                            type="button"
                            onClick={handlePasteFromClipboard}
                            className="h-9 px-4 rounded-lg bg-accent hover:bg-accent-hover font-bold text-xs transition"
                          >
                            📋 วาง
                          </button>
                        </div>
                      </div>

                      {showRawTextInput && (
                        <div className="pt-2 border-t border-line/40 space-y-2">
                          <textarea
                            value={rawOrderText}
                            onChange={(e) => setRawOrderText(e.target.value)}
                            placeholder="วางคำตอบจาก Gemini หรือข้อความใบเสร็จที่นี่..."
                            className="w-full h-40 bg-subtle border border-line rounded-xl p-2.5 text-xs text-textPrimary font-mono outline-none focus:border-accent"
                          />
                          <div className="flex justify-end gap-2">
                            <button
                              type="button"
                              onClick={() => setShowRawTextInput(false)}
                              className="px-3 py-1 text-xs text-textSecondary"
                            >
                              {t('cancel')}

                            <button
                              type="button"
                              onClick={handleParseRawText}
                              className="bg-mint text-bg font-bold px-4 py-1 rounded-lg text-xs"
                            >

                            </button>
                          </div>
                        </div>
                      )}

                    </div>

                  <div className="grid grid-cols-1 sm:grid-cols-[minmax(0,1fr)_160px] gap-3 bg-surface p-4 rounded-2xl card-shadow">
                    <div>
                      <label className="block text-xs font-semibold text-textSecondary mb-2">
                        {billType === 'ride' ? (lang === 'th' ? 'ชื่อทริป / ค่ารถ' : 'Trip title') : billType === 'loan' ? (lang === 'th' ? 'ยืมไปทำอะไร' : 'Loan purpose') : (lang === 'th' ? 'ชื่อร้าน / รายการ' : 'Merchant / order')}
                      </label>
                      <input 
                        type="text" 
                        value={newBillName}
                        onChange={(e) => setNewBillName(e.target.value)}
                        className="w-full bg-surface border border-line rounded-xl px-4 py-2.5 text-textPrimary text-sm focus:border-accent outline-none"
                        placeholder={billType === 'ride' ? 'e.g., Grab Car to Pavilion' : billType === 'loan' ? 'e.g., ยืมเงินสดกินข้าว, ฝากโอน' : 'e.g., KFC GrabFood, Baby Cami'}

                      />

                      {billType !== 'ride' && billType !== 'loan' && (

                          <span className="text-[10px] text-textMuted font-mono mr-1 self-center">{t('quickPresets')}</span>

                            className="w-full bg-subtle border border-line rounded-xl px-3 py-2.5 text-sm text-textPrimary focus:border-coral outline-none"

                    className="text-[10px] bg-subtle text-mint px-2 py-0.5 rounded border border-line hover:bg-mint hover:text-bg font-bold"
                  >
                    {t('copy')}
                  </button>
                  <button onClick={() => setShowCalc(false)} className="text-textSecondary hover:text-textPrimary text-xs font-bold">✕</button>
                </div>
              </div>

              <div className="bg-bg border border-line rounded-xl p-3 text-right text-lg font-mono text-textPrimary overflow-x-auto">
                {calcInput}
              </div>

              <div className="grid grid-cols-4 gap-1.5 text-xs font-mono font-bold">
                {['C', 'DEL', '/', '*'].map(btn => (
                  <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-subtle hover:bg-line text-amber py-2 rounded-lg">{btn}</button>
                ))}
                {['7', '8', '9', '-'].map(btn => (
                  <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-subtle hover:bg-line text-textPrimary py-2 rounded-lg">{btn}</button>
                ))}
                {['4', '5', '6', '+'].map(btn => (
                  <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-subtle hover:bg-line text-textPrimary py-2 rounded-lg">{btn}</button>
                ))}
                {['1', '2', '3', '='].map(btn => (
                  <button key={btn} onClick={() => handleCalcBtn(btn)} className={`py-2 rounded-lg ${btn === '=' ? 'bg-mint text-bg font-black row-span-2 flex items-center justify-center' : 'bg-subtle hover:bg-line text-textPrimary'}`}>{btn}</button>
                ))}
                {['0', '.'].map(btn => (
                  <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-subtle hover:bg-line text-textPrimary py-2 rounded-lg">{btn}</button>
                ))}
              </div>
            </div>
          )}

          {/* --- ADMIN AUTH MODAL --- */}
          {showAuthModal && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
              onClick={() => setShowAuthModal(false)}
            >
              <div 
                className="bg-surface border border-line rounded-3xl p-6 w-full max-w-sm space-y-5 shadow-2xl"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex justify-between items-center pb-2 border-b border-line">
                  <h3 className="font-bold text-md text-textPrimary flex items-center gap-2">
                    {t('adminSignIn')}
                  </h3>
                  <button type="button" onClick={() => setShowAuthModal(false)} className="text-textSecondary text-lg font-bold">✕</button>
                </div>

                <button
                  type="button"
                  onClick={handleGoogleLogin}
                  className="w-full bg-subtle hover:bg-line border border-line hover:border-accent text-textPrimary font-semibold py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-2"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  <span>Sign in with Google</span>
                </button>

                <p className="text-[11px] text-textMuted text-center">
                  เฉพาะบัญชี Google ที่ได้รับสิทธิ์เท่านั้นที่แก้ไขข้อมูลได้
                </p>

                <button type="button" onClick={() => setShowAuthModal(false)} className="w-full bg-subtle border border-line text-textPrimary py-2 rounded-xl text-xs hover:bg-line">{t('cancel')}</button>
              </div>
            </div>
          )}

          {/* --- FRIEND STATEMENT (หน้าเต็ม) --- */}
          {selectedFriendForHistory && (() => {
            const fName = selectedFriendForHistory;
            const bal = friendBalances[fName] || { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
            const owesMe = bal.totalOwed > 0;
            const hist = getFriendHistory(fName);
            const rows = hist.bills.map(b => {
              const matchedKey = Object.keys(b.splits || {}).find(k => k.toLowerCase() === fName.toLowerCase()) || fName;
              const isFriendPayer = (b.paidBy || '').toLowerCase() === fName.toLowerCase();
              const domShare = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
              const isDomPaid = b.paidStatus?.['Me (Dom)'] || b.paidStatus?.['ตัวฉันเอง'] || false;
              const share = isFriendPayer ? domShare : (b.splits?.[matchedKey] || 0);
              const pending = isFriendPayer ? (domShare > 0 && !isDomPaid) : !b.paidStatus?.[matchedKey];
              return { b, matchedKey, isFriendPayer, share, pending };
            });
            const pendingRows = rows.filter(r => r.pending);
            const doneRows = rows.filter(r => !r.pending);
            const typeLabel = (b) => b.billType === 'ride' ? t('filterRide') : b.billType === 'loan' ? t('filterLoan') : t('filterFood');
            const shortDate = (d) => {
              if (!d) return '';
              const [yy, mm, dd] = d.split('-').map(Number);
              return new Date(yy, (mm || 1) - 1, dd || 1).toLocaleDateString(lang === 'th' ? 'th-TH' : 'en-GB', { day: 'numeric', month: 'short' });
            };

            const BillRow = ({ r, last }) => (
              <div className={`py-2.5 ${last ? '' : 'border-b border-line'}`}>
                <div className="flex items-center gap-2.5 min-h-[44px]">
                  <span className="flex-1 min-w-0">
                    <span className="block text-sm font-semibold text-textPrimary truncate">{r.b.name}</span>
                    <span className="block text-xs text-textSecondary truncate">
                      {shortDate(r.b.date)} · {r.isFriendPayer ? t('xPaid', { name: fName }) : typeLabel(r.b)}
                    </span>
                  </span>
                  <span className={`font-mono text-sm font-bold tabular ${r.pending ? (r.isFriendPayer ? 'text-coral' : 'text-textPrimary') : 'text-textSecondary'}`}>
                    {r.share.toFixed(2)}
                  </span>
                  {r.isFriendPayer ? (
                    <span className={`text-xs font-semibold px-2.5 h-8 rounded-full flex items-center ${r.pending ? 'bg-coral-subtle text-coral' : 'bg-mint-subtle text-mint'}`}>
                      {r.pending ? t('iOwe') : t('paid')}
                    </span>
                  ) : isAdmin ? (
                    <button
                      disabled={isProcessing}
                      onClick={() => handleTogglePaid(r.b, fName)}
                      className={`text-xs font-semibold px-3 h-8 rounded-full transition disabled:opacity-50 ${r.pending ? 'bg-coral-subtle text-coral' : 'bg-mint-subtle text-mint'}`}
                    >
                      {r.pending ? t('pending') : t('paid')}
                    </button>
                  ) : (
                    <span className={`text-xs font-semibold px-2.5 h-8 rounded-full flex items-center ${r.pending ? 'bg-coral-subtle text-coral' : 'bg-mint-subtle text-mint'}`}>
                      {r.pending ? t('pending') : t('paid')}
                    </span>
                  )}
                </div>
                {fifoSettlementMap[r.b.id] && (
                  <p className="mt-1 text-[11px] px-2 py-0.5 rounded-md bg-subtle text-textSecondary inline-block">{fifoSettlementMap[r.b.id]}</p>
                )}
                {r.isFriendPayer && r.pending && isAdmin && (
                  <button
                    type="button"
                    disabled={isProcessing}
                    onClick={() => handleSmartFifoNetOff(fName, r.share, r.b.id, r.b.name)}
                    className="mt-2 w-full h-10 rounded-xl bg-subtle border border-line hover:bg-line text-xs font-semibold text-textPrimary transition disabled:opacity-50"
                  >
                    {isProcessing ? '...' : t('fifoThisBill', { amt: r.share.toFixed(2) })}
                  </button>
                )}
              </div>
            );

            return (
              <div className="fixed inset-0 z-50 bg-bg overflow-y-auto" role="dialog" aria-modal="true" aria-label={`${t('statementTitle')} ${fName}`}>
                <div className="max-w-xl mx-auto min-h-full flex flex-col">
                  <div className="sticky top-0 z-10 bg-bg/90 backdrop-blur-md flex items-center justify-between h-14 px-2" style={{ paddingTop: 'env(safe-area-inset-top, 0px)', boxSizing: 'content-box' }}>
                    <button onClick={() => setSelectedFriendForHistory(null)} aria-label={t('back')} className="w-11 h-11 flex items-center justify-center text-textPrimary">
                      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
                    </button>
                    <span className="text-[17px] font-bold text-textPrimary truncate">{fName}</span>
                    <span className="w-11 h-11" aria-hidden="true"></span>
                  </div>

                  <div className="flex-1 px-4 pt-2 pb-6 space-y-3">
                    <div ref={friendSlipRef} className="space-y-3 bg-bg">
                      <div className="bg-surface rounded-[20px] p-[18px] card-shadow space-y-3.5">
                        <div className="flex items-center gap-3">
                          <span className={`w-12 h-12 rounded-full flex items-center justify-center text-lg font-bold shrink-0 ${owesMe || bal.totalOwed === 0 ? 'bg-subtle text-textPrimary' : 'bg-coral-subtle text-coral'}`}>
                            {fName.trim().charAt(0).toUpperCase()}
                          </span>
                          <div className="min-w-0">
                            <p className="text-[13px] text-textSecondary">
                              {bal.totalOwed === 0 ? t('allClear') : owesMe ? t('xOwesMe', { name: fName }) : t('iOweX', { name: fName })}
                            </p>
                            <p className={`font-mono text-[34px] leading-tight font-bold tracking-tight tabular ${bal.totalOwed === 0 ? 'text-textPrimary' : owesMe ? 'text-mint' : 'text-coral'}`}>
                              {Math.abs(bal.totalOwed).toFixed(2)} <span className="font-sans text-[13px] font-medium text-textSecondary">RM</span>
                            </p>
                          </div>
                        </div>
                        <div className="grid grid-cols-3 gap-2 border-t border-line pt-3">
                          <div><p className="text-[11px] text-textSecondary">{t('fromBills')}</p><p className="font-mono text-sm font-bold tabular">{bal.billsOwed.toFixed(2)}</p></div>
                          <div><p className="text-[11px] text-textSecondary">{t('adjusted')}</p><p className="font-mono text-sm font-bold tabular">{bal.adjustedOwed.toFixed(2)}</p></div>
                          <div><p className="text-[11px] text-textSecondary">{t('pendingBillsCount')}</p><p className="font-mono text-sm font-bold tabular">{pendingRows.length}</p></div>
                        </div>
                        <p className="text-[11px] text-textMuted">{t('appTitle')} · {shortDate(localDateStr())}</p>
                      </div>

                      {pendingRows.length > 0 && (
                        <div className="space-y-1.5">
                          <p className="text-xs font-semibold text-textSecondary px-1">{t('pendingSection')}</p>
                          <div className="bg-surface rounded-2xl px-3.5 card-shadow">
                            {pendingRows.map((r, i) => <BillRow key={r.b.id} r={r} last={i === pendingRows.length - 1} />)}
                          </div>
                        </div>
                      )}

                      {hist.adjustments.length > 0 && (
                        <div className="space-y-1.5">
                          <p className="text-xs font-semibold text-textSecondary px-1">{t('adjustments')}</p>
                          <div className="bg-surface rounded-2xl px-3.5 card-shadow">
                            {hist.adjustments.map((adj, i) => (
                              <div key={adj.id} className={`flex items-center gap-2.5 py-2.5 ${i < hist.adjustments.length - 1 ? 'border-b border-line' : ''}`}>
                                <span className="flex-1 min-w-0">
                                  <span className="block text-[13px] text-textPrimary">{adj.note}</span>
                                  <span className="block text-[11px] text-textSecondary">{shortDate(adj.date)}</span>
                                </span>
                                <span className="font-mono text-sm font-bold tabular">
                                  {adj.displayAmount !== undefined ? adj.displayAmount.toFixed(2) : `${adj.amount > 0 ? '+' : ''}${(adj.amount || 0).toFixed(2)}`}
                                </span>
                                {adj.amount > 0 && isAdmin && (
                                  <button
                                    disabled={isProcessing}
                                    onClick={() => handleToggleAdjStatus(adj)}
                                    className={`text-xs font-semibold px-2.5 h-8 rounded-full transition disabled:opacity-50 ${adj.isSettled ? 'bg-mint-subtle text-mint' : 'bg-coral-subtle text-coral'}`}
                                  >
                                    {adj.isSettled ? t('paid') : t('pending')}
                                  </button>
                                )}
                                {isAdmin && (
                                  <button
                                    disabled={isProcessing}
                                    onClick={() => handleDeleteAdjustment(adj)}
                                    aria-label={t('delete')}
                                    title={t('delete')}
                                    className="w-8 h-8 rounded-full flex items-center justify-center text-textMuted hover:text-coral hover:bg-coral-subtle transition disabled:opacity-50"
                                  >
                                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
                                  </button>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {doneRows.length > 0 && (
                        <div className="space-y-1.5">
                          <p className="text-xs font-semibold text-textSecondary px-1">{t('settledSection')}</p>
                          <div className="bg-surface rounded-2xl px-3.5 card-shadow">
                            {doneRows.map((r, i) => <BillRow key={r.b.id} r={r} last={i === doneRows.length - 1} />)}
                          </div>
                        </div>
                      )}

                      {rows.length === 0 && hist.adjustments.length === 0 && (
                        <p className="text-center py-8 text-sm text-textMuted">{t('noTransactions')}</p>
                      )}
                    </div>

                    <div className="grid grid-cols-5 gap-2">
                      {[
                        { label: t('copyShort'), onClick: () => copyStatementTextToClipboard(fName), icon: <path d="M8 8h12v12H8zM16 8V4H4v12h4" /> },
                        { label: 'WhatsApp', onClick: () => shareToSocial(`แจ้งยอดค้างชำระ: ${fName} มียอดคงเหลือ ${bal.totalOwed.toFixed(2)} RM`, 'whatsapp'), icon: <path d="M4 20l1.3-3.9A8 8 0 1112 20a8 8 0 01-4-1.1L4 20z" /> },
                        { label: 'IG', onClick: () => shareToSocial(`แจ้งยอดค้างชำระ: ${fName} มียอดคงเหลือ ${bal.totalOwed.toFixed(2)} RM`, 'ig'), icon: <><rect x="4" y="4" width="16" height="16" rx="5" /><circle cx="12" cy="12" r="3.5" /></> },
                        { label: 'PNG', onClick: () => handleExportElement(friendSlipRef, `Statement_${fName}`), icon: <><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="10" r="1.5" /><path d="M21 16l-5-5-8 8" /></> },
                        { label: 'PDF', onClick: () => handleExportPDF(friendSlipRef, `Statement_${fName}`), icon: <><path d="M6 2h9l3 3v17H6z" /><path d="M9 13h6M9 17h4" /></> },
                      ].map(btn => (
                        <button key={btn.label} onClick={btn.onClick} className="h-16 rounded-2xl bg-surface card-shadow hover:bg-subtle text-[11px] text-textPrimary flex flex-col items-center justify-center gap-1 transition">
                          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{btn.icon}</svg>
                          {btn.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {isAdmin && (
                    <div className={`sticky bottom-0 bg-surface border-t border-line px-4 pt-3 grid gap-2.5 ${bal.totalOwed > 0 ? 'grid-cols-[minmax(0,1fr)_minmax(0,1.4fr)]' : 'grid-cols-1'}`} style={{ paddingBottom: 'calc(0.75rem + env(safe-area-inset-bottom, 0px))' }}>
                      <button
                        onClick={() => { setSelectedFriendForAdjust(fName); setAdjustAmount(''); }}
                        className="h-[52px] rounded-2xl border border-line bg-surface hover:bg-subtle text-sm font-semibold text-textPrimary transition"
                      >
                        {t('partialOrAdjust')}
                      </button>
                      {bal.totalOwed > 0 && (
                        <button
                          disabled={isProcessing}
                          onClick={() => handleSettleFullWithBatch(fName)}
                          className="h-[52px] rounded-2xl bg-accent hover:bg-accent-hover text-sm font-bold transition disabled:opacity-40"
                        >
                          {t('settleAllAmt', { amt: bal.totalOwed.toFixed(2) })}
                        </button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            );
          })()}

          {/* --- RECEIPT MODAL --- */}
          {activeBreakdown && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4"
              onClick={() => setActiveBreakdown(null)}
            >
              <div 
                className="bg-surface border border-line rounded-3xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden"
                onClick={e => e.stopPropagation()}
              >
                <div className="p-4 sm:p-5 border-b border-line flex justify-between items-center bg-surface sticky top-0 z-20">
                  <h3 className="font-bold text-textPrimary text-base">
                    {activeBreakdown.selectedFriend ? `Breakdown: ${activeBreakdown.selectedFriend}` : 'Transaction Summary'}
                  </h3>
                  <button 
                    onClick={() => setActiveBreakdown(null)} 
                    className="w-9 h-9 rounded-full bg-subtle hover:bg-line text-textSecondary hover:text-textPrimary flex items-center justify-center text-lg font-bold transition active:scale-95"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 sm:p-6 overflow-y-auto space-y-4 flex-1">
                  <div ref={receiptCardRef} className="bg-surface border border-line/60 p-5 sm:p-6 rounded-2xl text-textPrimary space-y-4 font-mono text-xs shadow-inner">
                    <div className="text-center pb-3 border-b border-dashed border-line space-y-1">
                      <img src="cat.jpg" alt="Logo" className="w-10 h-10 rounded-full mx-auto mb-1 ring-1 ring-coral/50 object-cover" onError={(e) => { e.target.style.display='none'; }} />
                      <p className="text-xs text-coral font-bold tracking-widest uppercase">👊 {t('appTitle')}</p>
                      <p className="text-base font-bold text-textPrimary font-sans">
                        {activeBreakdown.bill.billType === 'ride' ? '🚗 ' : activeBreakdown.bill.billType === 'loan' ? '💸 ' : '🛵 '} {activeBreakdown.bill.name}
                      </p>
                      {activeBreakdown.bill.rideRoute && <p className="text-[11px] text-textSecondary font-sans">📍 {activeBreakdown.bill.rideRoute}</p>}
                      <p className="text-textMuted">{activeBreakdown.bill.date}</p>
                      <p className="text-xs text-mint font-bold mt-1">
                        💳 Paid By: {activeBreakdown.bill.paidBy || 'Me (Dom)'}
                      </p>
                      {activeBreakdown.selectedFriend && (
                        <p className="text-mint font-bold font-sans text-sm mt-1">
                          Participant: {activeBreakdown.selectedFriend}
                        </p>
                      )}
                    </div>

                    {activeBreakdown.bill.billType === 'loan' ? (
                      <div className="space-y-2">
                        <div className="flex justify-between py-1">
                          <span className="text-textSecondary">Borrower (ผู้ยืม)</span>
                          <span className="font-bold font-mono">{activeBreakdown.bill.loanBorrower}</span>
                        </div>
                        <div className="flex justify-between py-1 text-coral">
                          <span>Loaned Amount</span>
                          <span className="font-bold font-mono">{activeBreakdown.bill.total?.toFixed(2)} RM</span>
                        </div>
                      </div>
                    ) : activeBreakdown.bill.billType === 'ride' ? (
                      <div className="space-y-2">
                        <div className="flex justify-between py-1">
                          <span className="text-textSecondary">Base Fare</span>
                          <span className="font-bold font-mono">{activeBreakdown.bill.subtotal?.toFixed(2)} RM</span>
                        </div>
                        {activeBreakdown.bill.tollFee > 0 && (
                          <div className="flex justify-between py-1 text-amber">
                            <span>Toll / Surcharge</span>
                            <span className="font-bold font-mono">+{activeBreakdown.bill.tollFee?.toFixed(2)} RM</span>
                          </div>
                        )}
                        {activeBreakdown.bill.discountAmount > 0 && (
                          <div className="flex justify-between py-1 text-coral">
                            <span>Promo Discount</span>
                            <span className="font-bold font-mono">-{activeBreakdown.bill.discountAmount?.toFixed(2)} RM</span>
                          </div>
                        )}
                        <div className="flex justify-between py-1 text-textMuted text-[10px]">
                          <span>Total Split Across</span>
                          <span>{Object.keys(activeBreakdown.bill.splits || {}).length} People</span>
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        <div className="flex justify-between font-bold text-textMuted uppercase text-[10px] pb-1 border-b border-line">
                          <span>Item Name</span>
                          <span>Share (RM)</span>
                        </div>

                        {activeBreakdown.bill.items?.filter(item => {
                          if (!activeBreakdown.selectedFriend) return true;
                          return (item.sharedWith || []).some(sn => sn.toLowerCase() === activeBreakdown.selectedFriend.toLowerCase());
                        }).map((item, idx) => {
                          const shareCount = (item.sharedWith || []).length || 1;
                          const userShareCost = (item.price * item.qty) / shareCount;

                          return (
                            <div key={idx} className="flex justify-between items-center py-1">
                              <div className="pr-2">
                                <p className="text-textPrimary font-sans font-medium">{item.name}</p>
                                <p className="text-[10px] text-textMuted">
                                  {item.qty > 1 && `${item.qty}x `}{item.price.toFixed(2)} RM
                                  {activeBreakdown.selectedFriend && shareCount > 1 && ` (Split ${shareCount} pax)`}
                                  {activeBreakdown.bill.taxMode === 'inclusive' ? ` [Incl. Tax ${item.taxRate || 0}%]` : ` [Addon Tax ${item.taxRate || 0}%]`}
                                </p>
                              </div>
                              <span className="font-bold text-textPrimary tabular">{userShareCost.toFixed(2)}</span>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    <div className="pt-3 border-t border-dashed border-line space-y-1.5 text-[11px]">
                      {activeBreakdown.bill.packagingCharge > 0 && (
                        <div className="flex justify-between text-amber">
                          <span>Packaging Charge</span>
                          <span className="tabular font-mono">+{activeBreakdown.bill.packagingCharge.toFixed(2)} RM</span>
                        </div>
                      )}

                      {activeBreakdown.bill.deliveryFee > 0 && (
                        <div className="flex justify-between text-mint">
                          <span>Delivery Fee</span>
                          <span className="tabular font-mono">+{activeBreakdown.bill.deliveryFee.toFixed(2)} RM</span>
                        </div>
                      )}

                      {activeBreakdown.selectedFriend ? (
                        <div className="flex justify-between items-center text-sm font-bold text-textPrimary pt-2 border-t border-line font-sans">
                          <span>Net Payable Amount:</span>
                          <span className="text-base text-mint font-mono tabular">{activeBreakdown.bill.splits[activeBreakdown.selectedFriend]?.toFixed(2)} RM</span>
                        </div>
                      ) : (
                        <div className="flex justify-between items-center text-sm font-bold text-textPrimary pt-2 border-t border-line font-sans">
                          <span>{t('netTotal')}:</span>
                          <span className="text-base text-mint font-mono tabular">{activeBreakdown.bill.total?.toFixed(2)} RM</span>
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-line bg-surface flex gap-3">
                  <button
                    onClick={() => handleExportElement(receiptCardRef, `Bill_${activeBreakdown.bill.name}`)}
                    className="flex-1 bg-accent hover:bg-accent-hover text-white font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-2 transition active:scale-95"
                  >
                    {t('savePng')}
                  </button>
                  <button
                    onClick={() => handleExportPDF(receiptCardRef, `Bill_${activeBreakdown.bill.name}`)}
                    className="flex-1 bg-coral hover:bg-coral/90 text-white font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-2 transition active:scale-95"
                  >
                    {t('downloadPdf')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- ADJUSTMENT & PARTIAL SETTLE MODAL --- */}
          {selectedFriendForAdjust && isAdmin && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
              onClick={() => setSelectedFriendForAdjust(null)}
            >
              <form 
                onSubmit={handleSaveAdjustment} 
                className="bg-surface border border-line rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex justify-between items-center pb-2 border-b border-line">
                  <h3 className="font-bold text-md text-textPrimary flex items-center gap-1.5">
                    {t('adjust')}: <span className="text-accent">{selectedFriendForAdjust}</span>
                  </h3>
                  <button type="button" onClick={() => setSelectedFriendForAdjust(null)} className="text-textSecondary text-lg font-bold">✕</button>
                </div>

                {currentSelectedBalance && (
                  <div className="bg-subtle border border-line/80 rounded-2xl p-3.5 space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-xs text-textSecondary">Current Balance:</span>
                      <span className={`text-lg font-black font-mono tabular ${currentSelectedBalance.totalOwed > 0 ? 'text-coral' : currentSelectedBalance.totalOwed < 0 ? 'text-mint' : 'text-textMuted'}`}>
                        {Math.abs(currentSelectedBalance.totalOwed).toFixed(2)} RM
                        <span className="text-xs ml-1 font-sans">
                          {currentSelectedBalance.totalOwed > 0 ? '(ค้างเรา)' : currentSelectedBalance.totalOwed < 0 ? '(เราค้าง)' : ''}
                        </span>
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-[11px] pt-2 border-t border-line/50 text-textMuted font-mono">
                      <div>{t('bills')}: {currentSelectedBalance.billsOwed.toFixed(2)} RM</div>
                      <div className="text-right">{t('adj')}: {currentSelectedBalance.adjustedOwed > 0 ? '+' : ''}{currentSelectedBalance.adjustedOwed.toFixed(2)} RM</div>
                    </div>

                    <div className="pt-2 border-t border-line/50 flex flex-col gap-2">
                      {currentSelectedBalance.totalOwed > 0 && (
                        <button
                          type="button"
                          disabled={isProcessing}
                          onClick={() => handleSettleFullWithBatch(selectedFriendForAdjust)}
                          className="w-full bg-mint/15 hover:bg-mint text-mint hover:text-bg border border-mint/40 font-black py-2 px-3 rounded-xl text-xs transition text-center flex items-center justify-center gap-1.5 shadow-sm disabled:opacity-50"
                        >
                          <span>{t('settleFullPrompt', { amt: currentSelectedBalance.totalOwed.toFixed(2) })}</span>
                        </button>
                      )}

                      <button
                        type="button"
                        disabled={isProcessing}
                        onClick={() => {
                          const amt = prompt(`ระบุยอดเงินที่ ${selectedFriendForAdjust} ออกให้เรา (RM):`, adjustAmount || "");
                          if (amt) handleSmartFifoNetOff(selectedFriendForAdjust, amt);
                        }}
                        className="w-full bg-accent/20 hover:bg-accent text-accent hover:text-white border border-accent/40 font-bold py-2 px-3 rounded-xl text-xs transition text-center flex items-center justify-center gap-1.5 disabled:opacity-50"
                      >
                        <span>{t('fifoNetOffBtn')}</span>
                      </button>
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2 bg-subtle p-1 rounded-xl">
                  <button
                    type="button"
                    onClick={() => setAdjustType('minus')}
                    className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'minus' ? 'bg-mint text-bg shadow-sm' : 'text-textSecondary'}`}
                  >
                    Deduct / Partial Pay (-)
                  </button>
                  <button
                    type="button"
                    onClick={() => setAdjustType('plus')}
                    className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'plus' ? 'bg-coral text-white shadow-sm' : 'text-textSecondary'}`}
                  >
                    Add Debt (+)
                  </button>
                </div>

                <div>
                  <label className="block text-xs text-textSecondary font-bold mb-1">
                    {adjustType === 'minus' ? 'Amount Received / Paid (RM)' : 'Additional Amount (RM)'}
                  </label>
                  <input 
                    type="text"
                    inputMode="decimal"
                    placeholder="0.00"
                    value={adjustAmount}
                    onChange={(e) => setAdjustAmount(e.target.value)}
                    onBlur={(e) => setAdjustAmount(evaluateMathExpression(e.target.value))}
                    className="w-full bg-subtle border border-line rounded-xl px-4 py-2.5 text-textPrimary text-sm font-mono focus:border-accent outline-none"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs text-textSecondary font-bold mb-1">{t('note')}</label>
                  <input 
                    type="text"
                    placeholder="e.g., Paid for Rice 20 + Drinks 5, Transfer via DuitNow"
                    value={adjustNote}
                    onChange={(e) => setAdjustNote(e.target.value)}
                    className="w-full bg-subtle border border-line rounded-xl px-4 py-2.5 text-textPrimary text-sm focus:border-accent outline-none"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="submit" disabled={isProcessing} className="flex-1 bg-accent hover:bg-accent-hover text-white font-bold py-2.5 rounded-xl text-sm transition disabled:opacity-50">{t('save')}</button>
                  <button type="button" onClick={() => setSelectedFriendForAdjust(null)} className="bg-subtle border border-line text-textPrimary py-2.5 px-4 rounded-xl text-sm hover:bg-line">{t('cancel')}</button>
                </div>
              </form>
            </div>
          )}

          {/* OCR / Sanity Check Warning */}
          {isMismatch && activeTab === 'new-bill' && (
            <div className="fixed bottom-40 left-4 right-4 sm:bottom-20 max-w-md mx-auto bg-amber-subtle border border-amber text-amber p-3 rounded-xl text-xs font-bold shadow-2xl flex items-center justify-between z-50 backdrop-blur-md">
              <span>⚠️ ช่อง Rounding ปรับยอดไป {(parseFloat(roundingAdj) || 0).toFixed(2)} RM ซึ่งเยอะผิดปกติ ลองเช็กรายการหรือค่าธรรมเนียมอีกครั้ง</span>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-24 right-5 sm:bottom-5 z-50 bg-surface border px-4 py-3 rounded-xl text-sm shadow-xl ${toast.type === 'error' ? 'border-coral/40 text-coral bg-coral-subtle/80' : 'border-mint/40 text-mint bg-mint-subtle/80'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    // ลงทะเบียน Service Worker เพื่อให้ติดตั้งเป็น PWA ลงหน้าจอมือถือได้ และเปิดได้เร็วขึ้นครั้งถัดไป
    // (ไม่เกี่ยวกับ Firestore/ข้อมูล แคชแค่ไฟล์หน้าตาแอปเท่านั้น ข้อมูลยังดึงสดจาก Firebase เหมือนเดิมทุกครั้ง)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
