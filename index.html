  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyC4RNzFy2wi7S4ZKN2_DWfHY_hUldwzmRQ",
      authDomain: "eat-app-eb3f8.firebaseapp.com",
      projectId: "eat-app-eb3f8",
      storageBucket: "eat-app-eb3f8.firebasestorage.app",
      messagingSenderId: "923469695976",
      appId: "1:923469695976:web:2888ebe9e10097d7c6b25d",
      measurementId: "G-DJEMGJV6Y6"
    };
    const DEFAULT_APP_ID = "eat-app-eb3f8";

    function App() {
      const [cloudConfig, setCloudConfig] = useState(() => {
        const saved = localStorage.getItem('kraimaijay_cloud_config');
        return saved ? JSON.parse(saved) : DEFAULT_FIREBASE_CONFIG;
      });

      const [appId, setAppId] = useState(() => {

      const [useCloud, setUseCloud] = useState(true);
      const [user, setUser] = useState(null);
      const [db, setDb] = useState(null);
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [friends, setFriends] = useState([]);
      const [bills, setBills] = useState([]);
      const [adjustments, setAdjustments] = useState([]);

      // Filter & Search State
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');

      // Bill Form States
      const [editingBillId, setEditingBillId] = useState(null);
      const [newBillName, setNewBillName] = useState('');
      const [billType, setBillType] = useState('delivery');
      const [newBillDate, setNewBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [billFriends, setBillFriends] = useState([]);
      
      // Ride specific
      const [rideFare, setRideFare] = useState('');
      const [tollFee, setTollFee] = useState('');
      const [rideRoute, setRideRoute] = useState('');
      
      // Food & Delivery specific
      const [taxMode, setTaxMode] = useState('inclusive');
      const [serviceChargeRate, setServiceChargeRate] = useState(0);
      const [deliveryFee, setDeliveryFee] = useState(0);
      const [packagingCharge, setPackagingCharge] = useState(0);
      const [discountAmount, setDiscountAmount] = useState(0);
      const [roundingAdj, setRoundingAdj] = useState(0);
      const [billItems, setBillItems] = useState([
        { id: '1', name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }
      ]);

      // Multi-Image OCR State
      const [selectedImages, setSelectedImages] = useState([]);
      const [ocrProcessing, setOcrProcessing] = useState(false);
      const [ocrProgress, setOcrProgress] = useState(0);
      const fileInputRef = useRef(null);

      // Friends & Adjustment Modals
      const [newFriendName, setNewFriendName] = useState('');
      const [renamingFriendId, setRenamingFriendId] = useState(null);
      const [renameValue, setRenameValue] = useState('');
      const [selectedFriendForAdjust, setSelectedFriendForAdjust] = useState(null);
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustNote, setAdjustNote] = useState('');
      const [adjustType, setAdjustType] = useState('minus');
      const [viewingBillId, setViewingBillId] = useState(null);

      // Modals
      const [activeBreakdown, setActiveBreakdown] = useState(null);
      const receiptCardRef = useRef(null);
      const [selectedFriendForHistory, setSelectedFriendForHistory] = useState(null);
      const friendSlipRef = useRef(null);

      // Settings Inputs
      const [configInput, setConfigInput] = useState(JSON.stringify(cloudConfig, null, 2));
      const [appIdInput, setAppIdInput] = useState(appId);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // FIREBASE CLOUD SETUP
      useEffect(() => {
        if (!useCloud || !cloudConfig) return;

        setLoading(true);
        try {
          let firebaseApp = !firebase.apps.length ? firebase.initializeApp(cloudConfig) : firebase.app();
          const authInstance = firebase.auth(firebaseApp);
          const firestoreInstance = firebase.firestore(firebaseApp);
          setDb(firestoreInstance);

          authInstance.signInAnonymously().then((cred) => {
            setUser(cred.user);
            
            const unsubFriends = firestoreInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends')
              .onSnapshot(snap => {
                const list = [];
                snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                if (list.length === 0) {
                  const defaultFriends = [
                    { name: 'Me (Dom)', createdAt: Date.now() },
                    { name: 'Yaya', createdAt: Date.now() },
                    { name: 'kamil', createdAt: Date.now() },
                    { name: 'wakin', createdAt: Date.now() },
                    { name: 'dom', createdAt: Date.now() },
                    { name: 'panda', createdAt: Date.now() },
                    { name: 'ink', createdAt: Date.now() }
                  ];
                  defaultFriends.forEach(df => firestoreInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').add(df));
                } else {
                  setFriends(list);
                }
              });

            const unsubBills = firestoreInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills')
              .onSnapshot(snap => {
                const list = [];
                snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                setBills(list);
              });

            const unsubAdjs = firestoreInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments')
              .onSnapshot(snap => {
                const list = [];
                snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                setAdjustments(list);
              });

            setLoading(false);
            showToast("Cloud Firebase Synced! 🚀");

            return () => {
              unsubFriends();
              unsubBills();
              unsubAdjs();
            };
          }).catch(err => {
            console.error("Firebase Error:", err);
            setUseCloud(false);
            setLoading(false);
          });
        } catch (err) {
          setUseCloud(false);
          setLoading(false);
        }
      }, [useCloud, cloudConfig, appId]);

      // LOCAL STORAGE FALLBACK
      useEffect(() => {
        if (useCloud) return;
        const savedFriends = localStorage.getItem('kraimaijay_local_friends');
        if (savedFriends) {
          setFriends(JSON.parse(savedFriends));
        } else {
          setFriends([
            { id: '1', name: 'Me (Dom)', createdAt: Date.now() },
            { id: '2', name: 'Yaya', createdAt: Date.now() },
            { id: '3', name: 'kamil', createdAt: Date.now() },
            { id: '4', name: 'wakin', createdAt: Date.now() },
            { id: '5', name: 'dom', createdAt: Date.now() },
            { id: '6', name: 'panda', createdAt: Date.now() },
            { id: '7', name: 'ink', createdAt: Date.now() }
          ]);
        }
        const savedBills = localStorage.getItem('kraimaijay_local_bills');
        if (savedBills) setBills(JSON.parse(savedBills));
        const savedAdjs = localStorage.getItem('kraimaijay_local_adjustments');
        if (savedAdjs) setAdjustments(JSON.parse(savedAdjs));
      }, [useCloud]);

      const handleSaveSettings = (e) => {
        e.preventDefault();
        try {
          const parsed = JSON.parse(configInput);
          const cleanAppId = appIdInput.trim() || 'eat-app-eb3f8';
          setCloudConfig(parsed);
          setAppId(cleanAppId);
          localStorage.setItem('kraimaijay_cloud_config', JSON.stringify(parsed));
          localStorage.setItem('kraimaijay_cloud_appid', cleanAppId);
          setUseCloud(true);
          showToast("Settings saved and reconnected");
          setActiveTab('dashboard');
        } catch (err) {
          showToast("Invalid JSON Configuration", "error");
        }
      };

      // IMAGE PRE-PROCESSING (Grayscale + High Contrast Canvas)
      const preprocessImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              canvas.width = img.width;
              canvas.height = img.height;
              
              ctx.drawImage(img, 0, 0);
              const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const d = imgData.data;
              
              for (let i = 0; i < d.length; i += 4) {
                const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                const contrast = 1.3;
                const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
                const adjusted = factor * (gray - 128) + 128;
                d[i] = adjusted;
                d[i + 1] = adjusted;
                d[i + 2] = adjusted;
              }
              ctx.putImageData(imgData, 0, 0);
              resolve(canvas.toDataURL('image/jpeg', 0.9));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      };

      const handleAddImages = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        setSelectedImages(prev => [...prev, ...files]);
      };

      const handleRemoveImage = (index) => {
        setSelectedImages(prev => prev.filter((_, idx) => idx !== index));
      };

      // SMART PARSER (GRAB / DELIVERY / RECEIPT COMPATIBLE)
      const handleProcessAllImages = async () => {
        if (!selectedImages.length) return;

        setOcrProcessing(true);
        setOcrProgress(0);

        let combinedExtractedItems = [];
        let extractedRideFare = 0;
        let detectedToll = 0;
        let detectedDiscount = 0;
        let detectedDelivery = 0;
        let detectedPackaging = 0;

        try {
          for (let i = 0; i < selectedImages.length; i++) {
            const file = selectedImages[i];
            const processedDataUrl = await preprocessImage(file);

            const { data: { text } } = await Tesseract.recognize(
              processedDataUrl,
              'eng+tha',
              {
                logger: m => {
                  if (m.status === 'recognizing text') {
                    const singleProgress = m.progress || 0;
                    const overall = Math.round(((i + singleProgress) / selectedImages.length) * 100);
                    setOcrProgress(overall);
                  }
                }
              }
            );

            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

            for (let j = 0; j < lines.length; j++) {
              const line = lines[j];

              // 1. Delivery fee
              if (/delivery\s*fee|rider|driver/i.test(line)) {
                const numMatch = line.match(/(?:RM\s*)?([0-9]+\.[0-9]{2})/i);
                if (numMatch) detectedDelivery = parseFloat(numMatch[1]);
                continue;
              }

              // 2. Packaging charge
              if (/packaging|packing|box|takeaway/i.test(line)) {
                const numMatch = line.match(/(?:RM\s*)?([0-9]+\.[0-9]{2})/i);
                if (numMatch) detectedPackaging = parseFloat(numMatch[1]);
                continue;
              }

              // 3. Discount / Promo
              if (/off|discount|promo|voucher/i.test(line)) {
                const numMatch = line.match(/[-−]?\s*(?:RM\s*)?([0-9]+(?:\.[0-9]{2})?)/i);
                if (numMatch) detectedDiscount = parseFloat(numMatch[1]);
                continue;
              }

              // 4. Toll
              if (/toll|expressway|highway/i.test(line)) {
                const numMatch = line.match(/(?:RM\s*)?([0-9]+\.[0-9]{2})/i);
                if (numMatch) detectedToll = parseFloat(numMatch[1]);
                continue;
              }

              // Skip Summary Headers
              const isNoise = /subtotal|total|incl\.\s*tax|tax|service|visa|mastercard|grabcoins|order summary|note to driver|reorder|contact/i.test(line);
              if (isNoise) continue;

              // 5. Menu item & price
              const priceMatch = line.match(/(.+?)\s+(?:RM\s*)?([0-9]+\.[0-9]{2})$/i);
              if (priceMatch) {
                const itemName = priceMatch[1].replace(/^[0-9]+x?\s*/i, '').trim();
                const itemPrice = parseFloat(priceMatch[2]);

                let itemQty = 1;
                if (j + 1 < lines.length && /^[0-9]+x$/i.test(lines[j + 1])) {
                  itemQty = parseInt(lines[j + 1]) || 1;
                }

                if (itemPrice > 0 && itemName.length > 2) {
                  const exists = combinedExtractedItems.some(
                    it => it.name.toLowerCase() === itemName.toLowerCase() && parseFloat(it.price) === itemPrice
                  );
                  if (!exists) {
                    combinedExtractedItems.push({
                      id: Date.now().toString() + Math.random().toString(36).substring(2, 7),
                      name: itemName,
                      price: itemPrice.toFixed(2),
                      qty: itemQty,
                      taxRate: 0,
                      sharedWith: [...billFriends]
                    });
                  }
                }
              }
            }

            if (billType === 'ride') {
              const prices = lines.map(l => {
                const m = l.match(/(?:RM\s*)?([0-9]+\.[0-9]{2})/i);
                return m ? parseFloat(m[1]) : 0;
              }).filter(p => p > 0);
              if (prices.length > 0) {
                extractedRideFare = Math.max(extractedRideFare, ...prices);
              }
            }
          }

          if (billType === 'ride' && extractedRideFare > 0) {
            setRideFare(extractedRideFare);
            if (detectedToll) setTollFee(detectedToll);
            if (detectedDiscount) setDiscountAmount(detectedDiscount);
            showToast("Ride fare scanned successfully");
          } else if (combinedExtractedItems.length > 0) {
            setBillItems(combinedExtractedItems);
            if (detectedPackaging) setPackagingCharge(detectedPackaging);
            if (detectedDelivery) setDeliveryFee(detectedDelivery);
            if (detectedDiscount) setDiscountAmount(detectedDiscount);
            showToast(`Scanned ${combinedExtractedItems.length} items from receipt/order! 🎉`);
          } else {
            showToast("No clear text detected, please enter manually", "error");
          }
        } catch (err) {
          console.error(err);
          showToast("OCR Error processing image", "error");
        } finally {
          setOcrProcessing(false);
          setSelectedImages([]);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      // CALCULATION ENGINE
      const calculateBillSplits = (items, scRate, dFee, packCharge, discount, roundAdj, selectedFriends, currentTaxMode, currentBillType, rFare, tFee) => {
        const splits = {};
        const friendItemDetails = {};
        const activeFriendsCount = selectedFriends.length;

        if (currentBillType === 'ride') {
          const parsedRideFare = parseFloat(rFare) || 0;
          const parsedToll = parseFloat(tFee) || 0;
          const parsedDiscount = parseFloat(discount) || 0;
          const parsedRoundAdj = parseFloat(roundAdj) || 0;
          
          const netTotal = Math.max(0, parsedRideFare + parsedToll - parsedDiscount + parsedRoundAdj);
          const perPerson = activeFriendsCount > 0 ? (netTotal / activeFriendsCount) : 0;

          selectedFriends.forEach(f => {
            splits[f] = Math.round(perPerson * 100) / 100;
            friendItemDetails[f] = {
              baseShare: Math.round((parsedRideFare / (activeFriendsCount || 1)) * 100) / 100,
              tollShare: Math.round((parsedToll / (activeFriendsCount || 1)) * 100) / 100,
              discountShare: Math.round((parsedDiscount / (activeFriendsCount || 1)) * 100) / 100,
            };
          });

          return {
            subtotal: parsedRideFare,
            tollFee: parsedToll,
            discountAmount: parsedDiscount,
            total: Math.round(netTotal * 100) / 100,
            splits,
            friendItemDetails
          };
        }

        const friendBaseShares = {};
        const friendTaxShares = {};
        
        selectedFriends.forEach(f => {
          friendBaseShares[f] = 0;
          friendTaxShares[f] = 0;
        });

        let subtotal = 0;
        let taxBreakdown = { 0: 0, 6: 0, 7: 0, 8: 0 };
        let totalTax = 0;

        items.forEach(item => {
          const price = parseFloat(item.price) || 0;
          const qty = parseInt(item.qty) || 1;
          const itemTotal = price * qty;
          const taxRate = parseFloat(item.taxRate) || 0;

          subtotal += itemTotal;

          let itemTaxAmount = 0;
          if (currentTaxMode === 'addon') {
            itemTaxAmount = itemTotal * (taxRate / 100);
          } else {
            itemTaxAmount = itemTotal - (itemTotal / (1 + (taxRate / 100)));
          }

          taxBreakdown[taxRate] = (taxBreakdown[taxRate] || 0) + itemTaxAmount;
          totalTax += itemTaxAmount;

          const sharedList = (item.sharedWith || []).filter(f => selectedFriends.includes(f));
          if (sharedList.length > 0) {
            const shareAmount = itemTotal / sharedList.length;
            const taxShareAmount = itemTaxAmount / sharedList.length;

            sharedList.forEach(f => {
              friendBaseShares[f] = (friendBaseShares[f] || 0) + shareAmount;
              friendTaxShares[f] = (friendTaxShares[f] || 0) + taxShareAmount;
            });
          }
        });

        const totalSc = subtotal * (scRate / 100);
        const parsedDFee = parseFloat(dFee) || 0;
        const parsedPackCharge = parseFloat(packCharge) || 0;
        const parsedDiscount = parseFloat(discount) || 0;
        const parsedRoundAdj = parseFloat(roundAdj) || 0;

        const perPersonDelivery = activeFriendsCount > 0 ? (parsedDFee / activeFriendsCount) : 0;
        const perPersonPackaging = activeFriendsCount > 0 ? (parsedPackCharge / activeFriendsCount) : 0;

        selectedFriends.forEach(f => {
          const base = friendBaseShares[f] || 0;
          const friendSc = base * (scRate / 100);
          const friendTax = currentTaxMode === 'addon' ? (friendTaxShares[f] || 0) : 0;

          const userDiscountShare = subtotal > 0 ? (base / subtotal) * parsedDiscount : (parsedDiscount / (activeFriendsCount || 1));
          
          const finalPersonAmount = base + friendSc + friendTax + perPersonDelivery + perPersonPackaging - userDiscountShare;
          
          splits[f] = Math.max(0, Math.round(finalPersonAmount * 100) / 100);
          friendItemDetails[f] = {
            baseShare: Math.round(base * 100) / 100,
            scShare: Math.round(friendSc * 100) / 100,
            taxShare: Math.round((friendTaxShares[f] || 0) * 100) / 100,
            deliveryShare: Math.round(perPersonDelivery * 100) / 100,
            packagingShare: Math.round(perPersonPackaging * 100) / 100,
            discountShare: Math.round(userDiscountShare * 100) / 100,
          };
        });

        const addedTaxToTotal = currentTaxMode === 'addon' ? totalTax : 0;
        const finalTotal = Math.round((subtotal + totalSc + addedTaxToTotal + parsedDFee + parsedPackCharge - parsedDiscount + parsedRoundAdj) * 100) / 100;

        return {
          subtotal: Math.round(subtotal * 100) / 100,
          serviceChargeAmount: Math.round(totalSc * 100) / 100,
          deliveryFee: parsedDFee,
          packagingCharge: parsedPackCharge,
          discountAmount: parsedDiscount,
          taxMode: currentTaxMode,
          taxBreakdown,
          totalTax: Math.round(totalTax * 100) / 100,
          roundingAdjustment: parsedRoundAdj,
          total: finalTotal,
          splits,
          friendItemDetails
        };
      };

      const getFriendBalances = () => {
        const balances = {};
        friends.forEach(f => {
          balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
        });

        bills.forEach(bill => {
          Object.keys(bill.splits || {}).forEach(name => {
            const isSelf = name === 'Me (Dom)' || name === 'ตัวฉันเอง';
            if (balances[name] && !isSelf && !bill.paidStatus?.[name]) {
              balances[name].billsOwed += bill.splits[name];
            }
          });
        });

        adjustments.forEach(adj => {
          if (balances[adj.friendName]) {
            balances[adj.friendName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = balances[name].billsOwed + balances[name].adjustedOwed;
        });

        return balances;
      };

      const friendBalances = getFriendBalances();

      const todayDateStr = new Date().toISOString().split('T')[0];
      const todayMyExpense = bills
        .filter(b => b.date === todayDateStr)
        .reduce((sum, b) => {
          const selfAmount = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          return sum + selfAmount;
        }, 0);
      const todayBillsCount = bills.filter(b => b.date === todayDateStr).length;

      const getFriendHistory = (friendName) => {
        const friendBills = bills.filter(b => Object.keys(b.splits || {}).includes(friendName));
        const friendAdjustments = adjustments.filter(a => a.friendName === friendName);
        return { bills: friendBills, adjustments: friendAdjustments };
      };

      const filteredBills = useMemo(() => {
        return bills.filter(bill => {
          const matchesSearch = bill.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (bill.rideRoute && bill.rideRoute.toLowerCase().includes(searchQuery.toLowerCase()));

          if (!matchesSearch) return false;

          const unpaidCount = Object.keys(bill.splits || {}).filter(n => n !== 'Me (Dom)' && n !== 'ตัวฉันเอง' && !bill.paidStatus?.[n]).length;

          if (statusFilter === 'pending') return unpaidCount > 0;
          if (statusFilter === 'settled') return unpaidCount === 0;
          if (statusFilter === 'ride') return bill.billType === 'ride';
          if (statusFilter === 'food') return bill.billType !== 'ride';

          return true;
        });
      }, [bills, searchQuery, statusFilter]);

      const handleExportElement = async (ref, filename) => {
        if (!ref.current) return;
        try {
          showToast("Generating image...");
          const canvas = await html2canvas(ref.current, {
            scale: 2,
            backgroundColor: '#0B0F17'
          });
          const image = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.href = image;
          link.download = `${filename}.png`;
          link.click();
          showToast("Image saved successfully");
        } catch (err) {
          showToast("Failed to generate image", "error");
        }
      };

      const handleStartEditBill = (bill) => {
        setEditingBillId(bill.id);
        setNewBillName(bill.name);
        setBillType(bill.billType || 'delivery');
        setTaxMode(bill.taxMode || 'inclusive');
        setNewBillDate(bill.date);
        setRideFare(bill.rideFare || '');
        setTollFee(bill.tollFee || '');
        setRideRoute(bill.rideRoute || '');
        setServiceChargeRate(bill.serviceChargeRate !== undefined ? bill.serviceChargeRate : 0);
        setDeliveryFee(bill.deliveryFee || 0);
        setPackagingCharge(bill.packagingCharge || 0);
        setDiscountAmount(bill.discountAmount || 0);
        setRoundingAdj(bill.roundingAdjustment || 0);
        
        const existingParticipants = new Set([
          ...Object.keys(bill.splits || {}),
          ...(bill.items || []).flatMap(i => i.sharedWith || [])
        ]);
        const participantsArray = Array.from(existingParticipants);
        setBillFriends(participantsArray.length > 0 ? participantsArray : friends.map(f => f.name));

        const loadedItems = (bill.items || []).map(item => ({
          ...item,
          id: item.id || Date.now().toString() + Math.random().toString(36).substring(2, 5),
          taxRate: item.taxRate !== undefined ? item.taxRate : 0,
          sharedWith: item.sharedWith || []
        }));
        setBillItems(loadedItems);
        setActiveTab('new-bill');
      };

      const handleSaveBill = async (e) => {
        e.preventDefault();
        if (!newBillName.trim()) {
          showToast("Please enter a transaction title", "error");
          return;
        }

        const calculated = calculateBillSplits(
          billItems,
          serviceChargeRate,
          deliveryFee,
          packagingCharge,
          discountAmount,
          roundingAdj,
          billFriends,
          taxMode,
          billType,
          rideFare,
          tollFee
        );

        let initialPaidStatus = {};
        if (editingBillId) {
          const oldBill = bills.find(b => b.id === editingBillId);
          initialPaidStatus = oldBill?.paidStatus || {};
        }
        billFriends.forEach(f => {
          if (initialPaidStatus[f] === undefined) {
            initialPaidStatus[f] = (f === 'Me (Dom)' || f === 'ตัวฉันเอง');
          }
        });

        const billPayload = {
          name: newBillName,
          billType,
          taxMode,
          date: newBillDate,
          rideFare: parseFloat(rideFare) || 0,
          tollFee: parseFloat(tollFee) || 0,
          rideRoute,
          subtotal: calculated.subtotal,
          serviceChargeRate,
          serviceChargeAmount: calculated.serviceChargeAmount || 0,
          deliveryFee: calculated.deliveryFee || 0,
          packagingCharge: calculated.packagingCharge || 0,
          discountAmount: calculated.discountAmount || 0,
          taxBreakdown: calculated.taxBreakdown || {},
          totalTax: calculated.totalTax || 0,
          roundingAdjustment: calculated.roundingAdjustment || 0,
          total: calculated.total,
          items: billType === 'ride' ? [] : billItems.map(item => ({
            id: item.id,
            name: item.name,
            price: parseFloat(item.price) || 0,
            qty: parseInt(item.qty) || 1,
            taxRate: parseFloat(item.taxRate || 0),
            sharedWith: item.sharedWith || []
          })),
          splits: calculated.splits,
          friendItemDetails: calculated.friendItemDetails,
          paidStatus: initialPaidStatus,
          updatedAt: Date.now()
        };

        if (editingBillId) {
          if (useCloud && db) {
            try {
              await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(editingBillId).update(billPayload);
              showToast("Bill updated successfully");
            } catch (err) {
              showToast("Update failed", "error");
            }
          } else {
            setBills(prev => prev.map(b => b.id === editingBillId ? { ...b, ...billPayload } : b));
            showToast("Bill updated locally");
          }
        } else {
          billPayload.createdAt = Date.now();
          if (useCloud && db) {
            try {
              await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').add(billPayload);
              showToast("New transaction saved to cloud");
            } catch (err) {
              showToast("Save failed", "error");
            }
          } else {
            setBills(prev => [{ id: Date.now().toString(), ...billPayload }, ...prev]);
            showToast("New transaction saved locally");
          }
        }

        setEditingBillId(null);
        setViewingBillId(null);
        setActiveTab('bills');
      };

      const handleTogglePaid = async (bill, friendName) => {
        const updatedStatus = { ...bill.paidStatus, [friendName]: !bill.paidStatus?.[friendName] };
        if (useCloud && db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(bill.id).update({ paidStatus: updatedStatus });
          } catch (err) {
            showToast("Update failed", "error");
          }
        } else {
          setBills(bills.map(b => b.id === bill.id ? { ...b, paidStatus: updatedStatus } : b));
        }
      };

      const handleDeleteBill = async (billId) => {
        if (!confirm("Are you sure you want to delete this bill?")) return;
        if (useCloud && db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(billId).delete();
            setViewingBillId(null);
            showToast("Bill deleted");
          } catch (err) {
            showToast("Delete failed", "error");
          }
        } else {
          setBills(bills.filter(b => b.id !== billId));
          setViewingBillId(null);
          showToast("Bill deleted locally");
        }
      };

      const handleAddFriend = async (e) => {
        e.preventDefault();
        const name = newFriendName.trim();
        if (!name) return;
        if (friends.some(f => f.name.toLowerCase() === name.toLowerCase())) {
          showToast("Friend name already exists", "error");
          return;
        }

        const newF = { name, createdAt: Date.now() };
        if (useCloud && db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').add(newF);
            showToast("Friend added to cloud");
          } catch (err) {
            showToast("Failed to add friend", "error");
          }
        } else {
          setFriends([...friends, { id: Date.now().toString(), ...newF }]);
          showToast("Friend added locally");
        }
        setNewFriendName('');
      };

      const handleStartRenameFriend = (friend) => {
        setRenamingFriendId(friend.id);
        setRenameValue(friend.name);
      };

      const handleCancelRenameFriend = () => {
        setRenamingFriendId(null);
        setRenameValue('');
      };

      const handleConfirmRenameFriend = async (friend) => {
        const newName = renameValue.trim();
        if (!newName) {
          showToast("Name cannot be empty", "error");
          return;
        }
        if (newName === friend.name) {
          handleCancelRenameFriend();
          return;
        }
        if (friends.some(f => f.id !== friend.id && f.name.toLowerCase() === newName.toLowerCase())) {
          showToast("This name already exists", "error");
          return;
        }

        const oldName = friend.name;

        const renameInBill = (bill) => {
          const newItems = (bill.items || []).map(item => ({
            ...item,
            sharedWith: (item.sharedWith || []).map(n => n === oldName ? newName : n)
          }));
          const newSplits = {};
          Object.entries(bill.splits || {}).forEach(([k, v]) => {
            newSplits[k === oldName ? newName : k] = v;
          });
          const newPaidStatus = {};
          Object.entries(bill.paidStatus || {}).forEach(([k, v]) => {
            newPaidStatus[k === oldName ? newName : k] = v;
          });
          return { ...bill, items: newItems, splits: newSplits, paidStatus: newPaidStatus };
        };

        try {
          if (useCloud && db) {
            const batch = db.batch();
            const friendRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').doc(friend.id);
            batch.update(friendRef, { name: newName });

            bills.forEach(bill => {
              const touchesFriend = Object.keys(bill.splits || {}).includes(oldName)
                || (bill.items || []).some(i => (i.sharedWith || []).includes(oldName));
              if (touchesFriend) {
                const updated = renameInBill(bill);
                const billRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(bill.id);
                batch.update(billRef, { items: updated.items, splits: updated.splits, paidStatus: updated.paidStatus });
              }
            });

            adjustments.forEach(adj => {
              if (adj.friendName === oldName) {
                const adjRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').doc(adj.id);
                batch.update(adjRef, { friendName: newName });
              }
            });

            await batch.commit();
          } else {
            setFriends(prev => prev.map(f => f.id === friend.id ? { ...f, name: newName } : f));
            setBills(prev => prev.map(b => renameInBill(b)));
            setAdjustments(prev => prev.map(a => a.friendName === oldName ? { ...a, friendName: newName } : a));
          }
          showToast(`Renamed to "${newName}"`);
        } catch (err) {
          showToast("Failed to rename", "error");
        }
        handleCancelRenameFriend();
      };

      const handleDeleteFriend = async (friend) => {
        const balance = friendBalances[friend.name] || { totalOwed: 0 };
        const warningMsg = balance.totalOwed !== 0
          ? `⚠️ "${friend.name}" still has an outstanding balance of ${balance.totalOwed.toFixed(2)} RM.\n\nAre you sure you want to delete this friend?`
          : `Remove "${friend.name}" from your friend list?`;
        if (!confirm(warningMsg)) return;

        if (useCloud && db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').doc(friend.id).delete();
            showToast("Friend removed");
          } catch (err) {
            showToast("Delete failed", "error");
          }
        } else {
          setFriends(prev => prev.filter(f => f.id !== friend.id));
          showToast("Friend removed locally");
        }
      };

      const handleDeleteAdjustment = async (adj) => {
        if (!confirm(`Delete adjustment for "${adj.friendName}" (${adj.amount > 0 ? '+' : ''}${adj.amount.toFixed(2)})?`)) return;

        if (useCloud && db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').doc(adj.id).delete();
            showToast("Adjustment removed");
          } catch (err) {
            showToast("Delete failed", "error");
          }
        } else {
          setAdjustments(prev => prev.filter(a => a.id !== adj.id));
          showToast("Adjustment removed locally");
        }
      };

      const handleSaveAdjustment = async (e) => {
        e.preventDefault();
        const amount = parseFloat(adjustAmount);
        if (isNaN(amount) || amount <= 0) {
          showToast("Please enter a valid amount", "error");
          return;
        }

        const finalAmount = adjustType === 'plus' ? amount : -amount;
        const newAdj = {
          friendName: selectedFriendForAdjust,
          amount: finalAmount,
          note: adjustNote.trim() || (adjustType === 'plus' ? 'Debt Increased' : 'Payment Settled'),
          date: new Date().toISOString().split('T')[0],
          createdAt: Date.now()
        };

        if (useCloud && db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').add(newAdj);
            showToast("Adjustment saved");
          } catch (err) {
            showToast("Failed to save adjustment", "error");
          }
        } else {
          setAdjustments([{ id: Date.now().toString(), ...newAdj }, ...adjustments]);
          showToast("Adjustment saved locally");
        }
        setSelectedFriendForAdjust(null);
        setAdjustAmount('');
        setAdjustNote('');
      };

      const totalOwedAmount = Object.keys(friendBalances).reduce((acc, name) => {
        if (name !== 'Me (Dom)' && name !== 'ตัวฉันเอง') return acc + Math.max(0, friendBalances[name].totalOwed);
        return acc;
      }, 0);

      const pendingDebtorsCount = Object.keys(friendBalances).filter(name => {
        return name !== 'Me (Dom)' && name !== 'ตัวฉันเอง' && friendBalances[name].totalOwed > 0;
      }).length;

      const currentSelectedBalance = selectedFriendForAdjust ? (friendBalances[selectedFriendForAdjust] || { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 }) : null;

      return (
        <div className="pb-16 min-h-screen">
          {/* Header with Custom Pilot Cat Avatar */}
          <header className="bg-surface/80 border-b border-line sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-4xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-3">
              <div>
                <h1 className="text-lg font-black tracking-tight text-textPrimary flex items-center gap-2.5">
                  <img 
                    src="cat.jpg" 
                    alt="Pilot Cat" 
                    className="w-9 h-9 rounded-xl object-cover ring-2 ring-coral/40 shadow-md shadow-coral/20"
                    onError={(e) => { e.target.style.display='none'; }}
                  />
                  <div className="flex flex-col">
                    <span className="leading-none bg-gradient-to-r from-textPrimary via-coral to-amber bg-clip-text text-transparent font-black tracking-wide text-base sm:text-lg">
                      KraiMaiJayMeeReung
                    </span>
                    <span className="text-[10px] text-coral font-bold tracking-widest uppercase mt-0.5">
                      Made by Dom 🔥
                    </span>
                  </div>
                  <span className={`text-[10px] font-medium px-2 py-0.5 rounded-full border ml-1 ${useCloud ? 'bg-mint/10 border-mint/30 text-mint' : 'bg-subtle border-line text-textMuted'}`}>
                    {useCloud ? 'Cloud Sync' : 'Local Only'}
                  </span>
                </h1>
              </div>
              <div className="flex gap-2 w-full sm:w-auto">
                <button 
                  onClick={() => {
                    setEditingBillId(null);
                    setNewBillName('');
                    setBillType('delivery');
                    setTaxMode('inclusive');
                    setDeliveryFee(0);
                    setPackagingCharge(0);
                    setDiscountAmount(0);
                    setServiceChargeRate(0);
                    setRoundingAdj(0);
                    setRideFare('');
                    setTollFee('');
                    setRideRoute('');
                    setSelectedImages([]);
                    setBillItems([{ id: '1', name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }]);
                    setBillFriends(friends.map(f => f.name));
                    setActiveTab('new-bill');
                  }}
                  className="flex-1 sm:flex-initial bg-accent hover:bg-accent-hover active:scale-[0.98] text-white font-bold px-4 py-2 rounded-xl transition text-sm flex justify-center items-center gap-1.5 shadow-lg shadow-accent/20"
                >
                  + Create Transaction
                </button>
                <button 
                  onClick={() => setActiveTab('settings')}
                  className="bg-surface hover:bg-subtle text-textSecondary hover:text-textPrimary px-3 py-2 rounded-xl border border-line transition text-xs font-medium"
                  title="Settings"
                >
                  ⚙️
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 mt-6">
            
            {/* Tabs */}
            <div className="flex bg-surface p-1 rounded-2xl gap-1 mb-6 border border-line">
              <button 
                onClick={() => setActiveTab('dashboard')}
                className={`flex-1 py-2 px-2 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 ${activeTab === 'dashboard' ? 'bg-accent text-white shadow-sm' : 'text-textSecondary hover:text-textPrimary'}`}
              >
                Dashboard
              </button>
              <button 
                onClick={() => setActiveTab('bills')}
                className={`flex-1 py-2 px-2 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 ${activeTab === 'bills' ? 'bg-accent text-white shadow-sm' : 'text-textSecondary hover:text-textPrimary'}`}
              >
                History ({bills.length})
              </button>
              <button 
                onClick={() => setActiveTab('friends')}
                className={`flex-1 py-2 px-2 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 ${activeTab === 'friends' ? 'bg-accent text-white shadow-sm' : 'text-textSecondary hover:text-textPrimary'}`}
              >
                Friends / Debtors ({friends.length})
              </button>
              <button 
                onClick={() => setActiveTab('adjustments')}
                className={`flex-1 py-2 px-2 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 ${activeTab === 'adjustments' ? 'bg-accent text-white shadow-sm' : 'text-textSecondary hover:text-textPrimary'}`}
              >
                Adjustments ({adjustments.length})
              </button>
            </div>

            {/* --- 1. DASHBOARD --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-surface border border-coral/30 bg-gradient-to-br from-coral-subtle/30 to-surface p-5 rounded-2xl relative overflow-hidden">
                    <div className="absolute right-2 top-2 text-5xl opacity-10 pointer-events-none select-none">💸</div>
                    <p className="text-xs text-coral font-bold uppercase tracking-wider font-mono">Total Outstanding (To Collect)</p>
                    <p className="text-3xl font-black text-coral mt-1 font-mono tabular">{totalOwedAmount.toFixed(2)} <span className="text-sm font-sans font-medium text-coral/80">RM</span></p>
                    <p className="text-xs text-textSecondary mt-1">Pending from {pendingDebtorsCount} friend(s)</p>
                  </div>

                  <div className="bg-surface border border-mint/30 bg-gradient-to-br from-mint-subtle/30 to-surface p-5 rounded-2xl relative overflow-hidden">
                    <div className="absolute right-2 top-2 text-5xl opacity-10 pointer-events-none select-none">💳</div>
                    <p className="text-xs text-mint font-bold uppercase tracking-wider font-mono">My Expense Today</p>
                    <p className="text-3xl font-black text-mint mt-1 font-mono tabular">{todayMyExpense.toFixed(2)} <span className="text-sm font-sans font-medium text-mint/80">RM</span></p>
                    <p className="text-xs text-textSecondary mt-1">Calculated from {todayBillsCount} transaction(s) today</p>
                  </div>
                </div>

                <div className="bg-surface rounded-2xl p-6 border border-line">
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-xs font-bold text-textMuted uppercase tracking-wider font-mono">
                      Unsettled Friends (Click name for Statement)
                    </h2>
                    <span className="text-[11px] text-accent">Tap name to view ledger ↗</span>
                  </div>
                  <div className="space-y-3">
                    {friends.filter(f => f.name !== 'Me (Dom)' && f.name !== 'ตัวฉันเอง' && (friendBalances[f.name]?.totalOwed || 0) > 0).length === 0 ? (
                      <div className="py-8 text-center text-textMuted text-sm">All debts are cleared! Everything is settled 🎉</div>
                    ) : (
                      friends.map(friend => {
                        const balance = friendBalances[friend.name] || { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
                        if (friend.name === 'Me (Dom)' || friend.name === 'ตัวฉันเอง' || balance.totalOwed <= 0) return null;

                        return (
                          <div key={friend.id} className="bg-subtle border border-line/80 hover:border-accent/40 p-4 rounded-xl flex justify-between items-center transition duration-150">
                            <div 
                              className="cursor-pointer group flex-1"
                              onClick={() => setSelectedFriendForHistory(friend.name)}
                            >
                              <span className="font-bold text-textPrimary group-hover:text-accent transition flex items-center gap-1.5">
                                {friend.name}
                                <span className="text-[10px] text-accent font-normal underline group-hover:opacity-100 opacity-80">View History ↗</span>
                                <span className="text-[10px] text-coral bg-coral-subtle/50 px-1.5 py-0.5 rounded font-mono">Unpaid</span>
                              </span>
                              <div className="flex gap-4 mt-1 text-xs text-textSecondary font-mono tabular">
                                <span>Bills: {balance.billsOwed.toFixed(2)} RM</span>
                                {balance.adjustedOwed !== 0 && (
                                  <span className={balance.adjustedOwed > 0 ? 'text-amber' : 'text-mint'}>
                                    Adj: {balance.adjustedOwed.toFixed(2)} RM
                                  </span>
                                )}
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <span className="text-lg font-extrabold text-coral font-mono tabular">{balance.totalOwed.toFixed(2)} RM</span>
                              <button
                                onClick={() => { setSelectedFriendForAdjust(friend.name); setAdjustAmount(''); }}
                                className="bg-surface hover:bg-line text-textPrimary text-xs font-semibold px-3 py-1.5 rounded-lg border border-line transition"
                              >
                                Adjust
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* --- 2. CREATE / EDIT TRANSACTION --- */}
            {activeTab === 'new-bill' && (
              <form onSubmit={handleSaveBill} className="bg-surface rounded-2xl p-6 border border-line space-y-6">
                <div className="flex justify-between items-center pb-4 border-b border-line">
                  <h2 className="text-lg font-bold text-textPrimary flex items-center gap-2">
                    {editingBillId ? 'Edit Transaction' : 'Create New Transaction'}
                  </h2>
                  <button type="button" onClick={() => setActiveTab('bills')} className="text-textSecondary hover:text-textPrimary text-sm">✕ Cancel</button>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setBillType('delivery');
                      setTaxMode('inclusive');
                      setServiceChargeRate(0);
                    }}
                    className={`py-2 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5 ${billType === 'delivery' ? 'bg-grab/15 border-grab text-emerald-400 shadow-sm' : 'bg-subtle border-line text-textSecondary'}`}
                  >
                    🛵 Food Delivery
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setBillType('ride');
                      setDiscountAmount(0);
                    }}
                    className={`py-2 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5 ${billType === 'ride' ? 'bg-bolt/15 border-bolt text-bolt shadow-sm' : 'bg-subtle border-line text-textSecondary'}`}
                  >
                    🚗 Ride (Grab/Bolt)
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setBillType('dinein');
                      setTaxMode('addon');

                </div>
              </form>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 bg-surface border px-4 py-3 rounded-xl text-sm shadow-xl ${toast.type === 'error' ? 'border-coral/40 text-coral bg-coral-subtle/80' : 'border-mint/40 text-mint bg-mint-subtle/80'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
