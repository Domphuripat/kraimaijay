<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KraiMaiJay - Mobile App</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0F17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KraiMaiJay">
  <link rel="apple-touch-icon" href="cat.jpg">
  <link rel="icon" type="image/jpeg" href="cat.jpg">

  <script>
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (!isStandalone && !isMobile && window.innerWidth > 768) {
      window.location.replace('./index.html');
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0B0F17',
            surface: '#151C28',
            subtle: '#1E293B',
            line: '#27354A',
            accent: { DEFAULT: '#6366F1', hover: '#4F46E5', subtle: '#1E1B4B' },
            mint: { DEFAULT: '#10B981', subtle: '#064E3B' },
            coral: { DEFAULT: '#F43F5E', subtle: '#4C0519' },
            amber: { DEFAULT: '#F59E0B', subtle: '#451A03' },
            grab: '#00B14F', bolt: '#34D186', whatsapp: '#25D366', instagram: '#E1306C',
            textPrimary: '#F8FAFC', textSecondary: '#94A3B8', textMuted: '#64748B',
          },
          fontFamily: {
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .tabular { font-variant-numeric: tabular-nums; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-bg text-textPrimary min-h-screen relative pb-32">

  <div id="root">
    <div class="min-h-screen flex items-center justify-center text-textMuted text-sm font-mono">
      Loading KraiMaiJay Mobile...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const ADMIN_EMAILS = ["phuripat26dom@gmail.com"];
    const ADMIN_PIN = "2323";
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyC4RNzFy2wi7S4ZKN2_DWfHY_hUldwzmRQ",
      authDomain: "eat-app-eb3f8.firebaseapp.com",
      projectId: "eat-app-eb3f8",
      storageBucket: "eat-app-eb3f8.firebasestorage.app",
      messagingSenderId: "923469695976",
      appId: "1:923469695976:web:2888ebe9e10097d7c6b25d",
      measurementId: "G-DJEMGJV6Y6"
    };
    const DEFAULT_APP_ID = "eat-app-eb3f8";

    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }
    };

    function App() {
      const [lang, setLang] = useState('th');
      const [cloudConfig] = useState(DEFAULT_FIREBASE_CONFIG);
      const [appId] = useState(DEFAULT_APP_ID);

      const [isAdminByGoogle, setIsAdminByGoogle] = useState(false);
      const [isAdminBySecret, setIsAdminBySecret] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        return p.get('admin') === 'true' || p.get('dom') === '2323' || localStorage.getItem('kraimaijay_secret_admin') === 'true';
      });
      const isAdmin = isAdminByGoogle || isAdminBySecret;

      const [isProcessing, setIsProcessing] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [inputPin, setInputPin] = useState('');

      const [showCalc, setShowCalc] = useState(false);
      const [calcInput, setCalcInput] = useState('0');

      const [db, setDb] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [friends, setFriends] = useState([]);
      const [bills, setBills] = useState([]);
      const [adjustments, setAdjustments] = useState([]);
      const [dashboardDebtFilter, setDashboardDebtFilter] = useState('all');

      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().substring(0, 7));
      const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);

      // ฟอร์มบิล
      const [editingBillId, setEditingBillId] = useState(null);
      const [newBillName, setNewBillName] = useState('');
      const [billType, setBillType] = useState('delivery');
      const [newBillDate, setNewBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [billFriends, setBillFriends] = useState([]);
      const [paidBy, setPaidBy] = useState('Me (Dom)');
      const [remainderMode, setRemainderMode] = useState('distribute');
      
      const [rideFare, setRideFare] = useState('');
      const [tollFee, setTollFee] = useState('');
      const [rideRoute, setRideRoute] = useState('');
      const [loanAmount, setLoanAmount] = useState('');
      const [loanBorrower, setLoanBorrower] = useState('');
      
      const [taxMode, setTaxMode] = useState('inclusive');
      const [serviceChargeRate, setServiceChargeRate] = useState(0);
      const [deliveryFee, setDeliveryFee] = useState(0);
      const [packagingCharge, setPackagingCharge] = useState(0);
      const [discountAmount, setDiscountAmount] = useState(0);
      const [roundingAdj, setRoundingAdj] = useState(0);
      const [billItems, setBillItems] = useState([{ id: '1', name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }]);

      // OCR
      const [selectedImages, setSelectedImages] = useState([]);
      const [imageRotation, setImageRotation] = useState(0);
      const [ocrProcessing, setOcrProcessing] = useState(false);
      const [ocrProgress, setOcrProgress] = useState(0);
      const [showRawTextInput, setShowRawTextInput] = useState(false);
      const [rawOrderText, setRawOrderText] = useState('');
      const fileInputRef = useRef(null);

      // จัดการเพื่อนและการปรับยอด
      const [newFriendName, setNewFriendName] = useState('');
      const [selectedFriendForAdjust, setSelectedFriendForAdjust] = useState(null);
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustNote, setAdjustNote] = useState('');
      const [adjustType, setAdjustType] = useState('minus');
      const [viewingBillId, setViewingBillId] = useState(null);
      const [selectedFriendForHistory, setSelectedFriendForHistory] = useState(null);
      const friendSlipRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleCalcBtn = (val) => {
        if (val === 'C') setCalcInput('0');
        else if (val === 'DEL') setCalcInput(prev => prev.length > 1 ? prev.slice(0, -1) : '0');
        else if (val === '=') {
          try {
            const clean = calcInput.replace(/[^0-9+\-*/.]/g, '');
            const res = Function(`'use strict'; return (${clean})`)();
            setCalcInput((Math.round(res * 100) / 100).toString());
          } catch (e) { setCalcInput('Error'); }
        } else setCalcInput(prev => prev === '0' || prev === 'Error' ? val : prev + val);
      };

      useEffect(() => {
        try {
          let app = !firebase.apps.length ? firebase.initializeApp(cloudConfig) : firebase.app();
          const auth = firebase.auth(app);
          const firestore = firebase.firestore(app);
          setDb(firestore);

          if (isAdminBySecret && !auth.currentUser) auth.signInAnonymously().catch(() => {});

          const unsubAuth = auth.onAuthStateChanged(user => {
            setIsAdminByGoogle(user?.email && ADMIN_EMAILS.some(e => e.toLowerCase() === user.email.toLowerCase()));
          });

          const base = firestore.collection('artifacts').doc(appId).collection('public').doc('data');
          const unsubFriends = base.collection('friends').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setFriends(list);
          });
          const unsubBills = base.collection('bills').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setBills(list);
          });
          const unsubAdjs = base.collection('adjustments').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setAdjustments(list);
          });

          return () => { unsubAuth(); unsubFriends(); unsubBills(); unsubAdjs(); };
        } catch (e) { console.warn(e); }
      }, []);

      const friendBalances = useMemo(() => {
        const balances = {};
        friends.forEach(f => { balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 }; });

        bills.forEach(bill => {
          const isDomPayer = /me|dom/i.test(bill.paidBy || 'Me (Dom)');
          if (isDomPayer) {
            Object.keys(bill.splits || {}).forEach(name => {
              const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
              const realName = fObj ? fObj.name : name;
              const isSelf = fObj?.isSelf || /me|dom/i.test(realName);
              if (balances[realName] && !isSelf && !bill.paidStatus?.[name]) {
                balances[realName].billsOwed += bill.splits[name];
              }
            });
          } else {
            const payerObj = friends.find(f => f.name.toLowerCase() === (bill.paidBy || '').toLowerCase());
            const realPayerName = payerObj ? payerObj.name : bill.paidBy;
            const myShare = bill.splits?.['Me (Dom)'] || bill.splits?.['ตัวฉันเอง'] || 0;
            const isMySharePaid = bill.paidStatus?.['Me (Dom)'] || bill.paidStatus?.['ตัวฉันเอง'] || false;
            if (balances[realPayerName] && myShare > 0 && !isMySharePaid) {
              balances[realPayerName].billsOwed -= myShare;
            }
          }
        });

        adjustments.forEach(adj => {
          const fObj = friends.find(f => f.name.toLowerCase() === adj.friendName.toLowerCase());
          const realName = fObj ? fObj.name : adj.friendName;
          if (balances[realName] && adj.amount !== undefined && !adj.isSettled) {
            balances[realName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = Math.round((balances[name].billsOwed + balances[name].adjustedOwed) * 100) / 100;
        });
        return balances;
      }, [friends, bills, adjustments]);

      const totalOwedAmount = useMemo(() => {
        return Object.keys(friendBalances).reduce((acc, name) => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return (fObj?.isSelf || /me|dom/i.test(name)) ? acc : acc + Math.max(0, friendBalances[name].totalOwed);
        }, 0);
      }, [friendBalances, friends]);

      const todayMyExpense = useMemo(() => {
        const today = new Date().toISOString().split('T')[0];
        return bills.filter(b => b.date === today).reduce((sum, b) => sum + (b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0), 0);
      }, [bills]);

      const monthlyStats = useMemo(() => {
        const monthly = bills.filter(b => (b.date || '').startsWith(selectedMonth));
        let totalGroup = 0, foodTotal = 0, rideTotal = 0, loanTotal = 0;
        const friendShares = {};
        const dailyMyExpenses = {};

        friends.forEach(f => { friendShares[f.name] = 0; });

        monthly.forEach(b => {
          const tot = b.total || 0;
          totalGroup += tot;
          if (b.billType === 'ride') rideTotal += tot;
          else if (b.billType === 'loan') loanTotal += tot;
          else foodTotal += tot;

          const self = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          if (b.date && self > 0) {
            if (!dailyMyExpenses[b.date]) dailyMyExpenses[b.date] = { total: 0, items: [] };
            dailyMyExpenses[b.date].total += self;
            dailyMyExpenses[b.date].items.push({ name: b.name, amount: self, type: b.billType });
          }

          Object.entries(b.splits || {}).forEach(([pName, pAmt]) => {
            const fObj = friends.find(f => f.name.toLowerCase() === pName.toLowerCase());
            const key = fObj ? fObj.name : pName;
            friendShares[key] = (friendShares[key] || 0) + (pAmt || 0);
          });
        });

        const sortedSpenders = Object.entries(friendShares).filter(([_, amt]) => amt > 0).sort((a, b) => b[1] - a[1]);

        return {
          totalGroup,
          foodTotal,
          rideTotal,
          loanTotal,
          count: monthly.length,
          avgPerBill: monthly.length > 0 ? (totalGroup / monthly.length) : 0,
          foodPct: totalGroup > 0 ? Math.round((foodTotal / totalGroup) * 100) : 0,
          ridePct: totalGroup > 0 ? Math.round((rideTotal / totalGroup) * 100) : 0,
          sortedSpenders,
          dailyMyExpenses
        };
      }, [bills, selectedMonth, friends]);

      const calendarMatrix = useMemo(() => {
        if (!selectedMonth) return [];
        const [year, month] = selectedMonth.split('-').map(Number);
        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const matrix = [];
        let counter = 1;

        for (let r = 0; r < 6; r++) {
          const week = [];
          for (let c = 0; c < 7; c++) {
            if ((r === 0 && c < firstDayIndex) || counter > daysInMonth) week.push(null);
            else {
              const dStr = `${selectedMonth}-${String(counter).padStart(2, '0')}`;
              week.push({ day: counter, dateStr: dStr, total: monthlyStats.dailyMyExpenses[dStr]?.total || 0, items: monthlyStats.dailyMyExpenses[dStr]?.items || [] });
              counter++;
            }
          }
          matrix.push(week);
          if (counter > daysInMonth) break;
        }
        return matrix;
      }, [selectedMonth, monthlyStats.dailyMyExpenses]);

      // OCR Scanning
      const parseTextContent = (text) => {
        const cleanLines = text.split('\n').map(l => l.trim()).filter(Boolean);
        let extractedItems = [], dFee = 0, pCharge = 0, dAmount = 0;

        cleanLines.forEach(line => {
          if (/delivery\s*fee/i.test(line)) {
            const m = line.match(/([0-9]+[.,][0-9]{2})/);
            if (m) dFee = parseFloat(m[1].replace(',', '.'));
          } else if (/packaging|packing/i.test(line)) {
            const m = line.match(/([0-9]+[.,][0-9]{2})/);
            if (m) pCharge = parseFloat(m[1].replace(',', '.'));
          } else if (/discount|promo/i.test(line)) {
            const m = line.match(/([0-9]+[.,][0-9]{2})/);
            if (m) dAmount = parseFloat(m[1].replace(',', '.'));
          } else {
            const m = line.match(/^([0-9]+[xX])?\s*(.+?)\s+(?:RM\s*)?([0-9]+[.,][0-9]{2})$/i);
            if (m) {
              extractedItems.push({
                id: Date.now().toString() + Math.random().toString(36).substring(2, 5),
                name: m[2].trim(),
                price: parseFloat(m[3].replace(',', '.')).toFixed(2),
                qty: parseInt(m[1]) || 1,
                taxRate: 0,
                sharedWith: [...billFriends]
              });
            }
          }
        });
        return { extractedItems, dFee, pCharge, dAmount };
      };

      const handleScanImages = async () => {
        if (!selectedImages.length) return;
        setOcrProcessing(true);
        setOcrProgress(0);
        try {
          let allItems = [];
          for (let i = 0; i < selectedImages.length; i++) {
            const { data: { text } } = await Tesseract.recognize(selectedImages[i], 'eng+tha', {
              logger: m => m.status === 'recognizing text' && setOcrProgress(Math.round(((i + (m.progress || 0)) / selectedImages.length) * 100))
            });
            const p = parseTextContent(text);
            allItems = [...allItems, ...p.extractedItems];
            if (p.dFee) setDeliveryFee(p.dFee);
            if (p.pCharge) setPackagingCharge(p.pCharge);
            if (p.dAmount) setDiscountAmount(p.dAmount);
          }
          if (allItems.length) { setBillItems(allItems); showToast(`สแกนสำเร็จ ${allItems.length} เมนู!`); }
          else showToast("OCR อ่านไม่ชัด แนะนำให้ใช้ปุ่มวางข้อความ", "error");
        } catch (e) { showToast("เกิดข้อผิดพลาดในการสแกน", "error"); }
        finally { setOcrProcessing(false); setSelectedImages([]); }
      };

      const handleExportJSONBackup = () => {
        const full = { version: "1.0", exportDate: new Date().toISOString(), friends, bills, adjustments };
        const blob = new Blob([JSON.stringify(full, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `KraiMaiJay_Backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("สำรองข้อมูล JSON สำเร็จ! 📦");
      };

      const handleExportCSVReport = () => {
        let csv = "data:text/csv;charset=utf-8,\uFEFFDate,Type,Title,PaidBy,Total(RM)\n";
        bills.forEach(b => {
          csv += `${b.date},${b.billType},"${(b.name || '').replace(/"/g, '""')}","${b.paidBy || 'Me (Dom)'}",${(b.total || 0).toFixed(2)}\n`;
        });
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csv));
        link.setAttribute("download", `KraiMaiJay_Bills_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("ดาวน์โหลด CSV เรียบร้อย! 📊");
      };

      const unsettledFriendList = useMemo(() => {
        return friends.filter(f => {
          const isMe = f.isSelf || /me|dom/i.test(f.name);
          const bal = friendBalances[f.name]?.totalOwed || 0;
          if (isMe || bal === 0) return false;
          if (dashboardDebtFilter === 'receivable') return bal > 0;
          if (dashboardDebtFilter === 'payable') return bal < 0;
          return true;
        });
      }, [friends, friendBalances, dashboardDebtFilter]);

      return (
        <div className="min-h-screen">
          {/* Header Mobile */}
          <header className="bg-surface/90 border-b border-line sticky top-0 z-30 backdrop-blur-lg px-4 py-3">
            <div className="max-w-md mx-auto flex justify-between items-center">
              <div className="flex items-center gap-2">
                <img src="cat.jpg" className="w-8 h-8 rounded-xl object-cover ring-2 ring-coral/40" onError={e => e.target.style.display='none'} />
                <span className="font-black text-base bg-gradient-to-r from-textPrimary via-coral to-amber bg-clip-text text-transparent">
                  KraiMaiJay
                </span>
                <span className="text-[10px] text-coral font-bold ml-1">App</span>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setShowCalc(!showCalc)} className="bg-subtle p-1.5 rounded-lg text-sm active:scale-95 transition">🧮</button>
                {isAdmin ? (
                  <button onClick={() => { setIsAdminBySecret(false); localStorage.removeItem('kraimaijay_secret_admin'); firebase.auth().signOut(); }} className="bg-subtle text-textSecondary border border-line p-1.5 rounded-lg text-xs">🔒</button>
                ) : (
                  <button onClick={() => setShowAuthModal(true)} className="bg-accent text-white px-2.5 py-1 rounded-lg text-xs font-bold">Sign-In</button>
                )}
              </div>
            </div>
          </header>

          {/* Floating Calculator */}
          {showCalc && (
            <div className="fixed top-14 right-4 z-50 bg-surface border border-line rounded-2xl p-3 shadow-2xl w-56 animate-in fade-in">
              <div className="flex justify-between items-center pb-1 text-xs font-mono">
                <span className="text-accent font-bold">เครื่องคิดเลข</span>
                <button onClick={() => setShowCalc(false)}>✕</button>
              </div>
              <div className="bg-bg border border-line rounded-lg p-2 text-right font-mono font-bold text-base mb-2">{calcInput}</div>
              <div className="grid grid-cols-4 gap-1 text-xs font-mono">
                {['C', 'DEL', '/', '*'].map(b => <button key={b} onClick={() => handleCalcBtn(b)} className="bg-subtle py-1.5 rounded text-amber font-bold">{b}</button>)}
                {['7', '8', '9', '-'].map(b => <button key={b} onClick={() => handleCalcBtn(b)} className="bg-subtle py-1.5 rounded">{b}</button>)}
                {['4', '5', '6', '+'].map(b => <button key={b} onClick={() => handleCalcBtn(b)} className="bg-subtle py-1.5 rounded">{b}</button>)}
                {['1', '2', '3', '='].map(b => <button key={b} onClick={() => handleCalcBtn(b)} className={`py-1.5 rounded ${b === '=' ? 'bg-mint text-bg font-black' : 'bg-subtle'}`}>{b}</button>)}
                {['0', '.'].map(b => <button key={b} onClick={() => handleCalcBtn(b)} className="bg-subtle py-1.5 rounded">{b}</button>)}
              </div>
            </div>
          )}

          <main className="max-w-md mx-auto px-4 mt-4 space-y-4">
            
            {/* 1. DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-surface border border-coral/30 p-4 rounded-2xl">
                    <p className="text-[10px] text-coral font-bold uppercase font-mono">Total Outstanding</p>
                    <p className="text-2xl font-black text-coral font-mono tabular">{totalOwedAmount.toFixed(2)} <span className="text-xs">RM</span></p>
                  </div>
                  <div className="bg-surface border border-mint/30 p-4 rounded-2xl">
                    <p className="text-[10px] text-mint font-bold uppercase font-mono">My Expense Today</p>
                    <p className="text-2xl font-black text-mint font-mono tabular">{todayMyExpense.toFixed(2)} <span className="text-xs">RM</span></p>
                  </div>
                </div>

                <div className="bg-surface rounded-2xl p-4 border border-line space-y-3">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xs font-bold text-textMuted uppercase font-mono">Unsettled Friends</h2>
                    <div className="flex bg-subtle p-1 rounded-xl border border-line gap-1 text-[11px]">
                      <button onClick={() => setDashboardDebtFilter('all')} className={`px-2 py-0.5 rounded-lg font-semibold ${dashboardDebtFilter === 'all' ? 'bg-accent text-white' : 'text-textSecondary'}`}>All</button>
                      <button onClick={() => setDashboardDebtFilter('receivable')} className={`px-2 py-0.5 rounded-lg font-semibold ${dashboardDebtFilter === 'receivable' ? 'bg-coral text-white' : 'text-textSecondary'}`}>+ Owe Me</button>
                      <button onClick={() => setDashboardDebtFilter('payable')} className={`px-2 py-0.5 rounded-lg font-semibold ${dashboardDebtFilter === 'payable' ? 'bg-mint text-bg font-bold' : 'text-textSecondary'}`}>- I Owe</button>
                    </div>
                  </div>

                  <div className="space-y-2.5">
                    {unsettledFriendList.length === 0 ? (
                      <p className="py-8 text-center text-textMuted text-xs">เคลียร์หนี้ครบหมดแล้ว ไม่มีค้าง 🎉</p>
                    ) : (
                      unsettledFriendList.map(friend => {
                        const balance = friendBalances[friend.name] || { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
                        const isDebtor = balance.totalOwed > 0;

                        return (
                          <div key={friend.id} className="bg-subtle border border-line/80 p-3.5 rounded-xl flex justify-between items-center">
                            <div className="cursor-pointer flex-1 pr-2" onClick={() => setSelectedFriendForHistory(friend.name)}>
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="font-bold text-textPrimary text-sm">{friend.name}</span>
                                <span className={`text-[10px] px-1.5 py-0.2 rounded font-mono ${isDebtor ? 'text-coral bg-coral-subtle/50' : 'text-mint bg-mint-subtle/50'}`}>
                                  {isDebtor ? 'ค้างเรา' : 'เราค้าง'}
                                </span>
                              </div>
                              <div className="text-[11px] text-textSecondary font-mono mt-0.5">
                                บิล: {balance.billsOwed.toFixed(2)} RM
                              </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                              <span className={`text-base font-black font-mono tabular ${isDebtor ? 'text-coral' : 'text-mint'}`}>
                                {Math.abs(balance.totalOwed).toFixed(2)} RM
                              </span>
                              
                              {isAdmin && (
                                <button
                                  onClick={() => { setSelectedFriendForAdjust(friend.name); setAdjustAmount(''); }}
                                  className="bg-surface active:bg-line text-textPrimary text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-line"
                                >
                                  ปรับ
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* 2. HISTORY */}
            {activeTab === 'bills' && (
              <div className="space-y-3">
                <input 
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="ค้นหาชื่อบิล, สถานที่..."
                  className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-xs outline-none"
                />

                <div className="space-y-2.5">
                  {bills.filter(b => (b.name || '').toLowerCase().includes(searchQuery.toLowerCase())).map(bill => {
                    const isCollapsed = viewingBillId === bill.id;
                    const unpaidCount = Object.keys(bill.splits || {}).filter(n => {
                      const fObj = friends.find(f => f.name.toLowerCase() === n.toLowerCase());
                      return !fObj?.isSelf && !bill.paidStatus?.[n];
                    }).length;

                    return (
                      <div key={bill.id} onClick={() => setViewingBillId(isCollapsed ? null : bill.id)} className="bg-surface border border-line p-3.5 rounded-xl space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-[10px] text-textMuted font-mono">{bill.date}</span>
                            <h3 className="font-bold text-sm text-textPrimary">{bill.name}</h3>
                          </div>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${unpaidCount === 0 ? 'bg-mint/15 text-mint' : 'bg-coral/15 text-coral'}`}>
                            {unpaidCount === 0 ? '✓ ครบแล้ว' : `รอ ${unpaidCount} คน`}
                          </span>
                        </div>
                        <div className="flex justify-between text-xs font-mono">
                          <span className="text-textMuted">ยอดสุทธิ:</span>
                          <span className="font-bold text-mint">{bill.total?.toFixed(2)} RM</span>
                        </div>
                        {isCollapsed && (
                          <div className="pt-2 border-t border-line space-y-1.5 text-xs" onClick={e => e.stopPropagation()}>
                            {Object.keys(bill.splits || {}).map(fName => (
                              <div key={fName} className="flex justify-between items-center">
                                <span>{fName} ({bill.splits[fName]?.toFixed(2)} RM)</span>
                                {isAdmin && (
                                  <button onClick={async () => {
                                    const nextStatus = { ...(bill.paidStatus || {}), [fName]: !bill.paidStatus?.[fName] };
                                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(bill.id).update({ paidStatus: nextStatus });
                                  }} className={`px-2 py-0.5 rounded text-[10px] font-bold ${bill.paidStatus?.[fName] ? 'bg-mint text-bg' : 'bg-coral text-white'}`}>
                                    {bill.paidStatus?.[fName] ? 'จ่ายแล้ว' : 'ค้าง'}
                                  </button>
                                )}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 3. ANALYTICS (สถิติเต็มรูปแบบ) */}
            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <div className="bg-surface rounded-2xl p-4 border border-line space-y-3">
                  <div className="flex justify-between items-center pb-2 border-b border-line">
                    <span className="text-xs font-bold font-mono">📊 สถิติค่าใช้จ่าย</span>
                    <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="bg-subtle border border-line px-2 py-1 rounded text-xs font-mono" />
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-center font-mono">
                    <div className="bg-subtle p-3 rounded-xl border border-line">
                      <p className="text-[10px] text-textMuted uppercase font-bold">ยอดใช้จ่ายกลุ่ม</p>
                      <p className="text-base font-black text-textPrimary mt-0.5">{monthlyStats.totalGroup.toFixed(2)} RM</p>
                      <p className="text-[9px] text-textSecondary">{monthlyStats.count} บิล</p>
                    </div>
                    <div className="bg-subtle p-3 rounded-xl border border-line">
                      <p className="text-[10px] text-emerald-400 uppercase font-bold">ค่าอาหาร ({monthlyStats.foodPct}%)</p>
                      <p className="text-base font-black text-emerald-400 mt-0.5">{monthlyStats.foodTotal.toFixed(2)} RM</p>
                    </div>
                    <div className="bg-subtle p-3 rounded-xl border border-line">
                      <p className="text-[10px] text-bolt uppercase font-bold">ค่ารถ ({monthlyStats.ridePct}%)</p>
                      <p className="text-base font-black text-bolt mt-0.5">{monthlyStats.rideTotal.toFixed(2)} RM</p>
                    </div>
                    <div className="bg-subtle p-3 rounded-xl border border-line">
                      <p className="text-[10px] text-accent uppercase font-bold">เฉลี่ยต่อบิล</p>
                      <p className="text-base font-black text-accent mt-0.5">{monthlyStats.avgPerBill.toFixed(2)} RM</p>
                    </div>
                  </div>

                  {/* ปฏิทินรายจ่ายของฉัน */}
                  <div className="pt-2 border-t border-line space-y-2">
                    <p className="text-xs font-bold text-mint font-mono">📅 ปฏิทินรายจ่ายของฉัน (แตะดูยอด)</p>
                    <div className="grid grid-cols-7 gap-1 text-center font-mono">
                      {['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'].map((d, i) => (
                        <div key={i} className={`text-[10px] font-bold ${i === 0 || i === 6 ? 'text-coral' : 'text-textMuted'}`}>{d}</div>
                      ))}
                      {calendarMatrix.flat().map((c, i) => (
                        c ? (
                          <div 
                            key={i} 
                            onClick={() => c.total && setSelectedCalendarDay(selectedCalendarDay?.dateStr === c.dateStr ? null : c)} 
                            className={`min-h-[44px] p-1 rounded-lg border flex flex-col justify-between transition ${
                              selectedCalendarDay?.dateStr === c.dateStr 
                                ? 'bg-accent/20 border-accent' 
                                : c.total > 0 ? 'bg-surface border-mint/50 cursor-pointer' : 'opacity-30 border-line/40'
                            }`}
                          >
                            <span className="text-[10px] font-bold leading-none">{c.day}</span>
                            {c.total > 0 && <span className="text-[9px] text-mint font-bold leading-none truncate">{c.total.toFixed(0)}</span>}
                          </div>
                        ) : <div key={i} className="min-h-[44px] opacity-10"></div>
                      ))}
                    </div>

                    {selectedCalendarDay && (
                      <div className="bg-subtle p-2.5 rounded-xl border border-accent/40 text-xs font-mono space-y-1 mt-2">
                        <div className="flex justify-between font-bold text-textPrimary pb-1 border-b border-line">
                          <span>🗓️ {selectedCalendarDay.dateStr}</span>
                          <span className="text-mint">รวม: {selectedCalendarDay.total.toFixed(2)} RM</span>
                        </div>
                        {selectedCalendarDay.items.map((it, idx) => (
                          <div key={idx} className="flex justify-between text-textSecondary text-[11px]">
                            <span>{it.name}</span>
                            <span>{it.amount.toFixed(2)} RM</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* สรุปยอดส่วนแบ่งรายบุคคล */}
                  <div className="pt-2 border-t border-line space-y-1.5">
                    <p className="text-xs font-bold text-textPrimary">👥 ส่วนแบ่งรายบุคคลในเดือนนี้:</p>
                    {monthlyStats.sortedSpenders.map(([pName, pAmt]) => (
                      <div key={pName} className="bg-subtle p-2 rounded-lg flex justify-between items-center text-xs font-mono">
                        <span className="font-sans text-textPrimary">{pName}</span>
                        <span className="font-bold text-textPrimary">{pAmt.toFixed(2)} RM</span>
                      </div>
                    ))}
                  </div>

                  {/* Backup */}
                  <div className="pt-2 border-t border-line space-y-2">
                    <p className="text-xs font-bold text-textPrimary">💾 สำรองข้อมูล</p>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={handleExportJSONBackup} className="bg-subtle border border-line py-2.5 rounded-xl text-xs font-bold active:scale-95 transition">📦 JSON</button>
                      <button onClick={handleExportCSVReport} className="bg-subtle border border-line py-2.5 rounded-xl text-xs font-bold active:scale-95 transition">📊 CSV</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 4. FRIENDS */}
            {activeTab === 'friends' && (
              <div className="space-y-4">
                {isAdmin && (
                  <form onSubmit={async (e) => {
                    e.preventDefault();
                    const n = newFriendName.trim();
                    if (!n || /^(me|dom|me\s*\(dom\)|ตัวฉันเอง)$/i.test(n)) { showToast("ชื่อไม่ถูกต้อง", "error"); return; }
                    if (friends.some(f => f.name.toLowerCase() === n.toLowerCase())) { showToast("มีชื่อนี้แล้ว", "error"); return; }
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').add({ name: n, isSelf: false, isArchived: false, createdAt: Date.now() });
                    setNewFriendName('');
                    showToast(`เพิ่ม ${n} เรียบร้อย!`);
                  }} className="flex gap-2">
                    <input type="text" placeholder="ชื่อสมาชิกใหม่..." value={newFriendName} onChange={e => setNewFriendName(e.target.value)} className="flex-1 bg-surface border border-line rounded-xl px-3 py-2 text-xs outline-none" />
                    <button type="submit" className="bg-accent text-white font-bold px-4 py-2 rounded-xl text-xs">เพิ่ม</button>
                  </form>
                )}

                <div className="bg-surface rounded-2xl p-4 border border-line divide-y divide-line">
                  {friends.map(friend => (
                    <div key={friend.id} className="py-2.5 flex justify-between items-center text-xs">
                      <div>
                        <span className="font-bold">{friend.name}</span>
                        {friend.isSelf && <span className="ml-1 text-[9px] bg-accent/20 text-accent px-1.5 py-0.2 rounded">Me</span>}
                      </div>
                      {!friend.isSelf && (
                        <button onClick={() => setSelectedFriendForHistory(friend.name)} className="bg-subtle px-2.5 py-1 rounded">Statement</button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* STATEMENT BOTTOM SHEET */}
          {selectedFriendForHistory && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end" onClick={() => setSelectedFriendForHistory(null)}>
              <div className="bg-surface border-t border-line rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl p-4 space-y-3" onClick={e => e.stopPropagation()}>
                <div className="w-10 h-1 bg-line rounded-full mx-auto -mt-1 mb-1"></div>
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-sm">Statement: {selectedFriendForHistory}</h3>
                  <button onClick={() => setSelectedFriendForHistory(null)} className="text-xs">✕</button>
                </div>
                <div ref={friendSlipRef} className="bg-[#0B0F17] p-4 rounded-xl border border-line/60 font-mono text-xs space-y-2">
                  <p className="font-bold text-center text-sm">{selectedFriendForHistory}</p>
                  <p className={`text-base text-center font-black ${(friendBalances[selectedFriendForHistory]?.totalOwed || 0) > 0 ? 'text-coral' : 'text-mint'}`}>
                    {(friendBalances[selectedFriendForHistory]?.totalOwed || 0).toFixed(2)} RM
                  </p>
                </div>
                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button onClick={() => {
                    html2canvas(friendSlipRef.current, { scale: 2, backgroundColor: '#0B0F17' }).then(cv => {
                      const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `Statement_${selectedFriendForHistory}.png`; a.click();
                    });
                  }} className="bg-accent text-white font-bold py-2 rounded-xl text-xs">บันทึกรูป PNG</button>
                  <button onClick={() => setSelectedFriendForHistory(null)} className="bg-subtle border border-line py-2 rounded-xl text-xs">ปิด</button>
                </div>
              </div>
            </div>
          )}

          {/* FLOATING CAPSULE NAVIGATION (iOS / Instagram Style) */}
          <div className="fixed bottom-5 left-0 right-0 z-40 flex justify-center pointer-events-none px-4 pb-safe">
            <nav className="pointer-events-auto bg-surface/85 backdrop-blur-2xl border border-line/80 shadow-[0_12px_40px_rgba(0,0,0,0.6)] rounded-full p-1.5 flex items-center gap-1">
              {[
                { id: 'dashboard', icon: '📊' },
                { id: 'bills', icon: '🧾' },
                ...(isAdmin ? [{ id: 'new-bill', icon: '+', isFab: true }] : []),
                { id: 'friends', icon: '👥' },
                { id: 'analytics', icon: '📈' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center justify-center ${
                    tab.isFab 
                      ? 'bg-accent text-white font-black text-xl shadow-lg shadow-accent/40 scale-105' 
                      : activeTab === tab.id 
                        ? 'bg-textPrimary text-bg font-bold shadow-md scale-105' 
                        : 'text-textSecondary hover:text-textPrimary active:scale-95'
                  }`}
                >
                  <span className={tab.isFab ? 'leading-none' : 'text-lg leading-none'}>{tab.icon}</span>
                </button>
              ))}
            </nav>
          </div>

          {/* Toast */}
          {toast && (
            <div className={`fixed top-4 left-4 right-4 max-w-xs mx-auto z-50 text-center py-2 px-4 rounded-xl text-xs shadow-xl font-bold ${toast.type === 'error' ? 'bg-coral text-white' : 'bg-mint text-bg'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
