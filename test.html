    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }
    };

      const getFriendBalances = () => {
        const balances = {};
        friends.forEach(f => {
          balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
        });

        bills.forEach(bill => {
          const billPayer = bill.paidBy || 'Me (Dom)';
          const isDomPayer = /me|dom/i.test(billPayer);

          if (isDomPayer) {
            Object.keys(bill.splits || {}).forEach(name => {
              const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
              const realName = fObj ? fObj.name : name;
              const isSelf = fObj?.isSelf || /me|dom/i.test(realName);
              if (balances[realName] && !isSelf && !bill.paidStatus?.[name]) {
                balances[realName].billsOwed += bill.splits[name];
              }
            });
          } else {
            const payerObj = friends.find(f => f.name.toLowerCase() === billPayer.toLowerCase());
            const realPayerName = payerObj ? payerObj.name : billPayer;
            
            const myShare = bill.splits?.['Me (Dom)'] || bill.splits?.['ตัวฉันเอง'] || 0;
            const isMySharePaid = bill.paidStatus?.['Me (Dom)'] || bill.paidStatus?.['ตัวฉันเอง'] || false;

            if (balances[realPayerName] && myShare > 0 && !isMySharePaid) {
              balances[realPayerName].billsOwed -= myShare;
            }
          }
        });

        adjustments.forEach(adj => {
          const fObj = friends.find(f => f.name.toLowerCase() === adj.friendName.toLowerCase());
          const realName = fObj ? fObj.name : adj.friendName;
          if (balances[realName] && adj.amount !== undefined && !adj.isSettled) {
            balances[realName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = Math.round((balances[name].billsOwed + balances[name].adjustedOwed) * 100) / 100;
        });

        return balances;
      };

      const friendBalances = getFriendBalances();

          const selfAmount = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;

      const getFriendHistory = (friendName) => {

          return touchesFriend || isFriendPayer;

      const handleSettleFullWithBatch = async (friendName) => {
        if (!isAdmin || isProcessing) return;

        const unpaidBills = bills.filter(b => {
          const splitsKeys = Object.keys(b.splits || {});
          const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase());
          const hasSplit = matchedKey && b.splits[matchedKey] !== undefined;
          const isPaid = matchedKey ? (b.paidStatus?.[matchedKey] === true) : false;
          return hasSplit && !isPaid;
        });

        const curBalance = friendBalances[friendName]?.totalOwed || 0;

        if (!confirm(t('settleConfirmModal', { n: unpaidBills.length, name: friendName }))) {
          return;
        }

        setIsProcessing(true);
        try {
          if (db) {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();
            let operationsCount = 0;
            const settledBillIds = [];

            unpaidBills.forEach(bill => {
              const bDoc = basePath.collection('bills').doc(bill.id);
              const splitsKeys = Object.keys(bill.splits || {});
              const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase()) || friendName;
              const nextStatus = { ...(bill.paidStatus || {}), [matchedKey]: true };
              batch.update(bDoc, { paidStatus: nextStatus });
              settledBillIds.push(bill.id);
              operationsCount++;
            });

            adjustments.filter(a => a.friendName.toLowerCase() === friendName.toLowerCase() && !a.isSettled).forEach(adj => {
              const aDoc = basePath.collection('adjustments').doc(adj.id);
              batch.update(aDoc, { isSettled: true });
              operationsCount++;
            });

            const settleLogRef = basePath.collection('adjustments').doc();
            batch.set(settleLogRef, {
              friendName,
              amount: 0,
              displayAmount: curBalance,
              isPaymentRecord: true,
              isSettled: true,
              relatedBillIds: settledBillIds,
              note: `⚡ เคลียร์ยอดบิลทั้งหมด (${unpaidBills.length} รายการ)`,
              date: new Date().toISOString().split('T')[0],
              createdAt: Date.now() + 1
            });
            operationsCount++;

            if (operationsCount > 0) {
              await batch.commit();
              showToast(`🎉 Cleared all bills for ${friendName}!`);
            }

            setSelectedFriendForAdjust(null);
          }
        } catch (err) {
          console.error("Batch settle error:", err);
          showToast("Failed to settle: " + (err.message || "Permission Denied"), "error");
        } finally {
          setIsProcessing(false);
        }
      };

      const handleSmartFifoNetOff = async (friendName, creditAmount, sourceBillId = '', sourceBillName = '') => {
        if (!isAdmin || isProcessing) return;

        const parsedCredit = parseFloat(creditAmount);
        if (isNaN(parsedCredit) || parsedCredit <= 0) {
          showToast("กรุณาระบุจำนวนเงินที่ถูกต้อง", "error");
          return;
        }

        const unpaidBills = bills
          .filter(b => {
            const isDomPayer = /me|dom/i.test(b.paidBy || 'Me (Dom)');
            const splitsKeys = Object.keys(b.splits || {});
            const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase());
            const isUnpaid = matchedKey && !b.paidStatus?.[matchedKey] && (b.splits[matchedKey] || 0) > 0;
            return isDomPayer && isUnpaid;
          })
          .sort((a, b) => {
            const dateA = new Date(a.date || 0).getTime();
            const dateB = new Date(b.date || 0).getTime();
            return dateA !== dateB ? dateA - dateB : (a.createdAt || 0) - (b.createdAt || 0);
          });

        if (unpaidBills.length === 0) {
          showToast(`${friendName} ไม่มีบิลเก่าที่ค้างชำระอยู่`, "info");
          return;
        }

        setIsProcessing(true);
        try {
          if (db) {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();
            
            let remainingCredit = parsedCredit;
            let settledBillsCount = 0;
            const autoSettledBillIds = [];

            for (const bill of unpaidBills) {
              if (remainingCredit <= 0.009) break;

              const splitsKeys = Object.keys(bill.splits || {});
              const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase()) || friendName;
              const billDebt = bill.splits[matchedKey] || 0;
              const bDoc = basePath.collection('bills').doc(bill.id);

              if (remainingCredit >= billDebt) {
                const nextStatus = { ...(bill.paidStatus || {}), [matchedKey]: true };
                batch.update(bDoc, { paidStatus: nextStatus });
                remainingCredit = Math.round((remainingCredit - billDebt) * 100) / 100;
                autoSettledBillIds.push(bill.id);
                settledBillsCount++;
              } else {
                const remainingDebtOnThisBill = Math.round((billDebt - remainingCredit) * 100) / 100;
                const nextStatus = { ...(bill.paidStatus || {}), [matchedKey]: true };
                batch.update(bDoc, { paidStatus: nextStatus });

                const partialAdjRef = basePath.collection('adjustments').doc();
                batch.set(partialAdjRef, {
                  friendName,
                  amount: remainingDebtOnThisBill,
                  displayAmount: remainingDebtOnThisBill,
                  isPaymentRecord: false,
                  isSettled: false,
                  note: `⚙️ ยอดค้างส่วนต่างบิล: ${bill.name} (ตัดด้วยบิล ${sourceBillName || 'ล่าสุด'} ไป ${remainingCredit.toFixed(2)} RM)`,
                  date: new Date().toISOString().split('T')[0],
                  createdAt: Date.now()
                });

                autoSettledBillIds.push(bill.id);
                remainingCredit = 0;
                settledBillsCount++;
                break;
              }
            }

            if (sourceBillId) {
              const srcBill = bills.find(b => b.id === sourceBillId);
              if (srcBill) {
                const nextStatus = { ...(srcBill.paidStatus || {}) };
                Object.keys(srcBill.splits || {}).forEach(k => {
                  if (/me|dom|ตัวฉันเอง/i.test(k)) nextStatus[k] = true;
                });
                batch.update(basePath.collection('bills').doc(sourceBillId), { paidStatus: nextStatus });
                autoSettledBillIds.push(sourceBillId);
              }
            }

            const logRef = basePath.collection('adjustments').doc();
            batch.set(logRef, {
              friendName,
              amount: 0,
              displayAmount: parsedCredit,
              sourceBillId: sourceBillId || null,
              isPaymentRecord: true,
              isSettled: true,
              relatedBillIds: autoSettledBillIds,
              note: `⚡ Smart Net-off: ตัดล้างหนี้บิลเก่าด้วยบิล ${sourceBillName || 'ล่าสุด'} (${parsedCredit.toFixed(2)} RM)`,
              date: new Date().toISOString().split('T')[0],
              createdAt: Date.now() + 1
            });

            if (remainingCredit > 0.009) {
              const excessRef = basePath.collection('adjustments').doc();
              batch.set(excessRef, {
                friendName,
                amount: -remainingCredit,
                displayAmount: remainingCredit,
                isPaymentRecord: true,
                isSettled: true,
                note: `🤝 เครดิตคงเหลือหลังล้างหนี้ครบทุกบิล: ${remainingCredit.toFixed(2)} RM`,
                date: new Date().toISOString().split('T')[0],
                createdAt: Date.now() + 2
              });
            }

            await batch.commit();
            showToast(`🎉 หักกลบลบหนี้สำเร็จ! ล้างบิลเก่าไป ${settledBillsCount} รายการ`);
            setSelectedFriendForAdjust(null);
          }
        } catch (err) {
          console.error("FIFO Error:", err);
          showToast("เกิดข้อผิดพลาดในการตัดหนี้: " + err.message, "error");
        } finally {
          setIsProcessing(false);
        }
      };

      const handleAddFriend = async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          showToast("Only Admin can add friends", "error");
          return;
        }
        const name = newFriendName.trim();
        if (!name) return;

        const isSelfAlias = /^(me|dom|me\s*\(dom\)|ตัวฉันเอง)$/i.test(name);
        if (isSelfAlias) {
          showToast("ไม่สามารถเพิ่มชื่อตัวเองเป็นเพื่อนได้", "error");
          return;

        const isDuplicate = friends.some(

      const handleToggleArchiveFriend = async (friend) => {

      const handleConfirmRenameFriend = async (friend) => {
        if (!isAdmin) return;

        if (friends.some(f => f.id !== friend.id && f.name.toLowerCase() === newName.toLowerCase())) {

        const oldName = friend.name;
        const renameInBill = (bill) => {
          const newItems = (bill.items || []).map(item => ({
            ...item,
            sharedWith: (item.sharedWith || []).map(n => n === oldName ? newName : n)
          }));
          const newSplits = {};
          Object.entries(bill.splits || {}).forEach(([k, v]) => {
            newSplits[k === oldName ? newName : k] = v;
          });
          const newPaidStatus = {};
          Object.entries(bill.paidStatus || {}).forEach(([k, v]) => {

      const preprocessImageWithRotation = (file, angle) => {
        return new Promise((resolve) => {
          const img = new Image();
          const objectUrl = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            if (angle === 90 || angle === 270) {
              canvas.width = img.height;
              canvas.height = img.width;
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
            }

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((angle * Math.PI) / 180);
            ctx.drawImage(img, -img.width / 2, -img.height / 2);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
              const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
              const v = gray > 145 ? 255 : 0;
              d[i] = v;
              d[i + 1] = v;
              d[i + 2] = v;
            }
            ctx.putImageData(imgData, 0, 0);

            canvas.toBlob((blob) => resolve(blob || file), 'image/png');
          };
          img.src = objectUrl;
        });
      };

      const parseTextContent = (fullText) => {
        const cleanLines = fullText
          .replace(/[—–]/g, '-')
          .replace(/[oO](?=[0-9])/g, '0')
          .split('\n')
          .map(l => l.trim())
          .filter(Boolean);

        let extractedItems = [];
        let rFare = 0, tFee = 0, dFee = 0, pCharge = 0, dAmount = 0;

        for (let i = 0; i < cleanLines.length; i++) {
          const line = cleanLines[i];

          if (/delivery\s*fee|rider\s*fee|driver\s*fee|shipping/i.test(line)) {
            const matches = line.match(/(?:RM\s*)?([0-9]+[.,][0-9]{2})/gi);
            if (matches && matches.length > 0) {
              dFee = parseFloat(matches[matches.length - 1].replace(/RM\s*/i, '').replace(',', '.'));
            }
            continue;
          }

          if (/packaging|packing|takeaway\s*box|container|bag/i.test(line)) {
            const matches = line.match(/(?:RM\s*)?([0-9]+[.,][0-9]{2})/gi);
            if (matches && matches.length > 0) {
              pCharge = parseFloat(matches[matches.length - 1].replace(/RM\s*/i, '').replace(',', '.'));
            }
            continue;
          }

          if (/discount|promo|voucher|off\b|cashback|rebate/i.test(line)) {
            const matches = line.match(/[-−]?\s*(?:RM\s*)?([0-9]+[.,][0-9]{2})/gi);
            if (matches && matches.length > 0) {
              const rawVal = matches[matches.length - 1].replace(/[-−\sRM]/gi, '').replace(',', '.');
              dAmount = Math.abs(parseFloat(rawVal) || 0);
            }
            continue;
          }

          if (/toll|expressway|highway/i.test(line)) {
            const matches = line.match(/(?:RM\s*)?([0-9]+[.,][0-9]{2})/i);
            if (matches) tFee = parseFloat(matches[1].replace(',', '.'));
            continue;
          }

          const isNoise = /subtotal|total\s*\(|incl\.\s*tax|tax\b|sst\b|service|visa|mastercard|grabcoins|order summary|note to driver|reorder|contact|profile|cutlery|invoice|receipt|cashier|terminal|change\b|rounding/i.test(line);
          if (isNoise) continue;

          const itemRegex = /^(?:[0-9]{8,14}\s+)?(?:([0-9]+)\s*[xX*]\s+)?(.+?)\s+(?:RM\s*)?([0-9]+[.,][0-9]{2})$/i;
          const match = line.match(itemRegex);

          if (match) {
            let qty = parseInt(match[1]) || 1;
            let itemName = match[2].replace(/^[0-9]+x?\s*/i, '').trim();
            let itemPrice = parseFloat(match[3].replace(',', '.'));

            if (i + 1 < cleanLines.length && /^[0-9]+\s*[xX]$/i.test(cleanLines[i + 1])) {
              qty = parseInt(cleanLines[i + 1]) || qty;
            }

            if (itemPrice > 0 && itemName.length >= 2 && !/total|amount|cash|balance/i.test(itemName)) {
              const exists = extractedItems.some(it => it.name.toLowerCase() === itemName.toLowerCase());
              if (!exists) {
                extractedItems.push({
                  id: Date.now().toString() + Math.random().toString(36).substring(2, 7),
                  name: itemName,
                  price: itemPrice.toFixed(2),
                  qty: qty,
                  taxRate: 0,
                  sharedWith: [...billFriends]
                });
              }
            }
          }
        }

        return { extractedItems, rFare, tFee, dFee, pCharge, dAmount };
      };

      const handleAddImages = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        setSelectedImages(prev => [...prev, ...files]);
      };

      const handleRemoveImage = (index) => {
        setSelectedImages(prev => prev.filter((_, idx) => idx !== index));
      };

      const handleProcessAllImages = async () => {
        if (!selectedImages.length) return;
        setOcrProcessing(true);
        setOcrProgress(0);

        let combinedExtractedItems = [];
        let extractedRideFare = 0, detectedToll = 0, detectedDiscount = 0, detectedDelivery = 0, detectedPackaging = 0;

        try {
          showToast("⚡ กำลังประมวลผล OCR...");
          for (let i = 0; i < selectedImages.length; i++) {
            const rawFile = selectedImages[i];
            const processedBlob = await preprocessImageWithRotation(rawFile, imageRotation);

            const { data: { text } } = await Tesseract.recognize(
              processedBlob,
              'eng+tha',
              {
                logger: m => {
                  if (m.status === 'recognizing text') {
                    const singleProgress = m.progress || 0;
                    setOcrProgress(Math.round(((i + singleProgress) / selectedImages.length) * 100));
                  }
                }
              }
            );

            const parsed = parseTextContent(text);
            parsed.extractedItems.forEach(item => {
              if (!combinedExtractedItems.some(ci => ci.name.toLowerCase() === item.name.toLowerCase())) {
                combinedExtractedItems.push(item);
              }
            });

            if (parsed.dFee) detectedDelivery = parsed.dFee;
            if (parsed.pCharge) detectedPackaging = parsed.pCharge;
            if (parsed.dAmount) detectedDiscount = parsed.dAmount;
            if (parsed.tFee) detectedToll = parsed.tFee;

            if (billType === 'ride') {
              const prices = text.split('\n').map(l => {
                const m = l.match(/(?:RM\s*)?([0-9]+[.,][0-9]{2})/i);
                return m ? parseFloat(m[1].replace(',', '.')) : 0;
              }).filter(p => p > 0);
              if (prices.length > 0) extractedRideFare = Math.max(extractedRideFare, ...prices);
            }
          }

          if (billType === 'ride' && extractedRideFare > 0) {
            setRideFare(extractedRideFare);
            if (detectedToll) setTollFee(detectedToll);
            if (detectedDiscount) setDiscountAmount(detectedDiscount);
            showToast("สแกนค่าโดยสารสำเร็จ!");
          } else if (combinedExtractedItems.length > 0 || detectedDelivery > 0 || detectedPackaging > 0 || detectedDiscount > 0) {
            if (combinedExtractedItems.length > 0) setBillItems(combinedExtractedItems);
            if (detectedPackaging) setPackagingCharge(detectedPackaging);
            if (detectedDelivery) setDeliveryFee(detectedDelivery);
            if (detectedDiscount) setDiscountAmount(detectedDiscount);
            showToast(`🎉 สแกนสำเร็จ ${combinedExtractedItems.length} รายการ!`);
          } else {
            showToast("OCR อ่านไม่ชัด แนะนำให้วางข้อความสรุป", "error");
          }
        } catch (err) {
          showToast(`สแกนไม่สำเร็จ: ${err.message}`, "error");
        } finally {
          setOcrProcessing(false);
          setSelectedImages([]);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      const handleParseRawText = () => {
        if (!rawOrderText.trim()) return;
        const parsed = parseTextContent(rawOrderText);
        if (parsed.extractedItems.length > 0 || parsed.dFee || parsed.pCharge || parsed.dAmount) {
          if (parsed.extractedItems.length > 0) setBillItems(parsed.extractedItems);
          if (parsed.dFee) setDeliveryFee(parsed.dFee);
          if (parsed.pCharge) setPackagingCharge(parsed.pCharge);
          if (parsed.dAmount) setDiscountAmount(parsed.dAmount);
          showToast(`อ่านข้อมูลสำเร็จ ${parsed.extractedItems.length} รายการ! 🎉`);
          setShowRawTextInput(false);
          setRawOrderText('');
        } else {
          showToast("ไม่พบรายการสินค้าที่ระบุราคาชัดเจน", "error");
        }
      };

      const calculateBillSplits = (items, scRate, dFee, packCharge, discount, roundAdj, selectedFriends, currentTaxMode, currentBillType, rFare, tFee, lAmt, lBorrower, curRemainderMode = 'distribute', curPaidBy = 'Me (Dom)') => {
        const splits = {};
        const friendItemDetails = {};
        const activeFriendsCount = selectedFriends.length;

        if (currentBillType === 'loan') {
          const parsedLoanAmt = parseFloat(lAmt) || 0;
          if (lBorrower) {
            splits[lBorrower] = parsedLoanAmt;
            friendItemDetails[lBorrower] = { baseShare: parsedLoanAmt };
          }
          return {
            subtotal: parsedLoanAmt,
            total: parsedLoanAmt,
            splits,
            friendItemDetails
          };
        }

        if (currentBillType === 'ride') {
          const parsedRideFare = parseFloat(rFare) || 0;
          const parsedToll = parseFloat(tFee) || 0;
          const parsedDiscount = parseFloat(discount) || 0;
          const parsedRoundAdj = parseFloat(roundAdj) || 0;
          
          const netTotal = Math.max(0, parsedRideFare + parsedToll - parsedDiscount + parsedRoundAdj);
          const totalCents = Math.round(netTotal * 100);
          const baseCents = activeFriendsCount > 0 ? Math.floor(totalCents / activeFriendsCount) : 0;
          let remainderCents = activeFriendsCount > 0 ? (totalCents % activeFriendsCount) : 0;

          selectedFriends.forEach(f => {
            let shareCents = baseCents;
            if (curRemainderMode === 'distribute') {
              if (remainderCents > 0) {
                shareCents += 1;
                remainderCents--;
              }
            } else if (curRemainderMode === 'payer' && f.toLowerCase() === curPaidBy.toLowerCase()) {
              shareCents += remainderCents;
            }

            splits[f] = shareCents / 100;
            friendItemDetails[f] = {
              baseShare: Math.round((parsedRideFare / (activeFriendsCount || 1)) * 100) / 100,
              tollShare: Math.round((parsedToll / (activeFriendsCount || 1)) * 100) / 100,
              discountShare: Math.round((parsedDiscount / (activeFriendsCount || 1)) * 100) / 100,
            };
          });

          return {
            subtotal: parsedRideFare,
            tollFee: parsedToll,
            discountAmount: parsedDiscount,
            total: Math.round(netTotal * 100) / 100,
            splits,
            friendItemDetails
          };
        }

        const friendBaseShares = {};
        const friendTaxShares = {};
        
        selectedFriends.forEach(f => {
          friendBaseShares[f] = 0;
          friendTaxShares[f] = 0;
        });

        let subtotal = 0;
        let taxBreakdown = { 0: 0, 6: 0, 7: 0, 8: 0 };
        let totalTax = 0;

        items.forEach(item => {
          const price = parseFloat(item.price) || 0;
          const qty = parseInt(item.qty) || 1;
          const itemTotal = price * qty;
          const taxRate = parseFloat(item.taxRate) || 0;

          subtotal += itemTotal;

          let itemTaxAmount = 0;
          if (currentTaxMode === 'addon') {
            itemTaxAmount = itemTotal * (taxRate / 100);
          } else {
            itemTaxAmount = itemTotal - (itemTotal / (1 + (taxRate / 100)));
          }

          taxBreakdown[taxRate] = (taxBreakdown[taxRate] || 0) + itemTaxAmount;
          totalTax += itemTaxAmount;

          const sharedList = (item.sharedWith || []).filter(f => selectedFriends.includes(f));
          if (sharedList.length > 0) {
            const itemTotalCents = Math.round(itemTotal * 100);
            const baseShareCents = Math.floor(itemTotalCents / sharedList.length);
            let remShareCents = itemTotalCents % sharedList.length;

            const itemTaxCents = Math.round(itemTaxAmount * 100);
            const baseTaxCents = Math.floor(itemTaxCents / sharedList.length);
            let remTaxCents = itemTaxCents % sharedList.length;

            sharedList.forEach(f => {
              const allocatedCents = baseShareCents + (remShareCents > 0 ? 1 : 0);
              if (remShareCents > 0) remShareCents--;
              friendBaseShares[f] = (friendBaseShares[f] || 0) + (allocatedCents / 100);

              const allocatedTaxCents = baseTaxCents + (remTaxCents > 0 ? 1 : 0);
              if (remTaxCents > 0) remTaxCents--;
              friendTaxShares[f] = (friendTaxShares[f] || 0) + (allocatedTaxCents / 100);
            });
          }
        });

        const totalSc = subtotal * (scRate / 100);
        const parsedDFee = parseFloat(dFee) || 0;
        const parsedPackCharge = parseFloat(packCharge) || 0;
        const parsedDiscount = parseFloat(discount) || 0;
        const parsedRoundAdj = parseFloat(roundAdj) || 0;

        const perPersonDelivery = activeFriendsCount > 0 ? (parsedDFee / activeFriendsCount) : 0;
        const perPersonPackaging = activeFriendsCount > 0 ? (parsedPackCharge / activeFriendsCount) : 0;

        let totalDistributedCents = 0;

        selectedFriends.forEach(f => {
          const base = friendBaseShares[f] || 0;
          const friendSc = base * (scRate / 100);
          const friendTax = currentTaxMode === 'addon' ? (friendTaxShares[f] || 0) : 0;
          const userDiscountShare = subtotal > 0 ? (base / subtotal) * parsedDiscount : (parsedDiscount / (activeFriendsCount || 1));
          
          const finalPersonAmount = Math.max(0, base + friendSc + friendTax + perPersonDelivery + perPersonPackaging - userDiscountShare);
          const personCents = Math.round(finalPersonAmount * 100);
          splits[f] = personCents / 100;
          totalDistributedCents += personCents;

          friendItemDetails[f] = {
            baseShare: Math.round(base * 100) / 100,
            scShare: Math.round(friendSc * 100) / 100,
            taxShare: Math.round((friendTaxShares[f] || 0) * 100) / 100,
            deliveryShare: Math.round(perPersonDelivery * 100) / 100,
            packagingShare: Math.round(perPersonPackaging * 100) / 100,
            discountShare: Math.round(userDiscountShare * 100) / 100,
          };
        });

        const addedTaxToTotal = currentTaxMode === 'addon' ? totalTax : 0;
        const finalTotal = Math.round((subtotal + totalSc + addedTaxToTotal + parsedDFee + parsedPackCharge - parsedDiscount + parsedRoundAdj) * 100) / 100;
        const targetTotalCents = Math.round(finalTotal * 100);

        if (activeFriendsCount > 0 && totalDistributedCents !== targetTotalCents) {
          const diffCents = targetTotalCents - totalDistributedCents;
          const targetPerson = (curRemainderMode === 'payer' && selectedFriends.includes(curPaidBy)) 
            ? curPaidBy 
            : selectedFriends[selectedFriends.length - 1];
          splits[targetPerson] = Math.max(0, Math.round((splits[targetPerson] + (diffCents / 100)) * 100) / 100);
        }

        return {
          subtotal: Math.round(subtotal * 100) / 100,
          serviceChargeAmount: Math.round(totalSc * 100) / 100,
          deliveryFee: parsedDFee,
          packagingCharge: parsedPackCharge,
          discountAmount: parsedDiscount,
          taxMode: currentTaxMode,
          taxBreakdown,
          totalTax: Math.round(totalTax * 100) / 100,
          roundingAdjustment: parsedRoundAdj,
          total: finalTotal,
          splits,
          friendItemDetails
        };
      };

      const handleSaveBill = async (e) => {
        e.preventDefault();
        if (!isAdmin || isProcessing) return;
        if (!newBillName.trim()) {
          showToast("Please enter a title", "error");
          return;
        }

        const calculated = calculateBillSplits(
          billItems,
          serviceChargeRate,
          deliveryFee,
          packagingCharge,
          discountAmount,
          roundingAdj,
          billFriends,
          taxMode,
          billType,
          rideFare,
          tollFee,
          loanAmount,
          loanBorrower,
          remainderMode,
          paidBy
        );

        let initialPaidStatus = {};
        if (editingBillId) {
          const oldBill = bills.find(b => b.id === editingBillId);
          initialPaidStatus = oldBill?.paidStatus || {};
        }

        const participantsToProcess = billType === 'loan' ? (loanBorrower ? [loanBorrower] : []) : billFriends;

        participantsToProcess.forEach(f => {
          if (initialPaidStatus[f] === undefined) {
            const isCurrentPayer = f.toLowerCase() === paidBy.toLowerCase();
            initialPaidStatus[f] = isCurrentPayer ? true : false;
          }
        });

        const billPayload = {
          name: newBillName,
          billType,
          paidBy,
          remainderMode,
          taxMode,
          date: newBillDate,
          rideFare: parseFloat(rideFare) || 0,
          tollFee: parseFloat(tollFee) || 0,
          rideRoute,
          loanAmount: parseFloat(loanAmount) || 0,
          loanBorrower,
          subtotal: calculated.subtotal,
          serviceChargeRate,
          serviceChargeAmount: calculated.serviceChargeAmount || 0,
          deliveryFee: calculated.deliveryFee || 0,
          packagingCharge: calculated.packagingCharge || 0,
          discountAmount: calculated.discountAmount || 0,
          taxBreakdown: calculated.taxBreakdown || {},
          totalTax: calculated.totalTax || 0,
          roundingAdjustment: calculated.roundingAdjustment || 0,
          total: calculated.total,
          items: (billType === 'ride' || billType === 'loan') ? [] : billItems.map(item => ({
            id: item.id,
            name: item.name,
            price: parseFloat(item.price) || 0,
            qty: parseInt(item.qty) || 1,
            taxRate: parseFloat(item.taxRate || 0),
            sharedWith: item.sharedWith || []
          })),
          splits: calculated.splits,
          friendItemDetails: calculated.friendItemDetails,
          paidStatus: initialPaidStatus,
          updatedAt: Date.now()
        };

        setIsProcessing(true);
        if (db) {
          try {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();

            let billDocRef;
            if (editingBillId) {
              billDocRef = basePath.collection('bills').doc(editingBillId);
              batch.update(billDocRef, billPayload);
            } else {
              billPayload.createdAt = Date.now();
              billDocRef = basePath.collection('bills').doc();
              batch.set(billDocRef, billPayload);
            }

            const isDomPayer = /me|dom/i.test(paidBy);
            const myShareInThisBill = calculated.splits?.['Me (Dom)'] || calculated.splits?.['ตัวฉันเอง'] || 0;

            if (!isDomPayer && myShareInThisBill > 0) {
              const friendPayerName = paidBy;
              const unpaidBills = bills
                .filter(b => {
                  const bDomPayer = /me|dom/i.test(b.paidBy || 'Me (Dom)');
                  const splitsKeys = Object.keys(b.splits || {});
                  const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendPayerName.toLowerCase());
                  const isUnpaid = matchedKey && !b.paidStatus?.[matchedKey] && (b.splits[matchedKey] || 0) > 0;
                  return bDomPayer && isUnpaid;
                })
                .sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

              if (unpaidBills.length > 0) {
                let remainingCredit = myShareInThisBill;
                let autoSettledBillIds = [billDocRef.id];
                let settledCount = 0;

                for (const oldBill of unpaidBills) {
                  if (remainingCredit <= 0.009) break;

                  const splitsKeys = Object.keys(oldBill.splits || {});
                  const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendPayerName.toLowerCase()) || friendPayerName;
                  const billDebt = oldBill.splits[matchedKey] || 0;
                  const oldBDoc = basePath.collection('bills').doc(oldBill.id);

                  if (remainingCredit >= billDebt) {
                    const nextStatus = { ...(oldBill.paidStatus || {}), [matchedKey]: true };
                    batch.update(oldBDoc, { paidStatus: nextStatus });
                    remainingCredit = Math.round((remainingCredit - billDebt) * 100) / 100;
                    autoSettledBillIds.push(oldBill.id);
                    settledCount++;
                  } else {
                    const remainingDebt = Math.round((billDebt - remainingCredit) * 100) / 100;
                    const nextStatus = { ...(oldBill.paidStatus || {}), [matchedKey]: true };
                    batch.update(oldBDoc, { paidStatus: nextStatus });

                    const partAdjRef = basePath.collection('adjustments').doc();
                    batch.set(partAdjRef, {
                      friendName: friendPayerName,
                      amount: remainingDebt,
                      displayAmount: remainingDebt,
                      isPaymentRecord: false,
                      isSettled: false,
                      note: `⚙️ ยอดค้างส่วนต่างบิล: ${oldBill.name} (ตัดด้วยบิล ${newBillName} ไป ${remainingCredit.toFixed(2)} RM)`,
                      date: newBillDate,
                      createdAt: Date.now()
                    });

                    autoSettledBillIds.push(oldBill.id);
                    remainingCredit = 0;
                    settledCount++;
                    break;
                  }
                }

                initialPaidStatus['Me (Dom)'] = true;
                initialPaidStatus['ตัวฉันเอง'] = true;
                batch.update(billDocRef, { paidStatus: initialPaidStatus });

                const autoLogRef = basePath.collection('adjustments').doc();
                batch.set(autoLogRef, {
                  friendName: friendPayerName,
                  amount: 0,
                  displayAmount: myShareInThisBill,
                  sourceBillId: billDocRef.id,
                  isPaymentRecord: true,
                  isSettled: true,
                  relatedBillIds: autoSettledBillIds,
                  note: `⚡ Auto Net-off: ${friendPayerName} ออกค่า ${newBillName} ให้ (${myShareInThisBill.toFixed(2)} RM) -> ล้างบิลเก่าอัตโนมัติ ${settledCount} บิล`,
                  date: newBillDate,
                  createdAt: Date.now() + 1
                });
              }
            }

            await batch.commit();
            showToast("บันทึกบิลเรียบร้อย! 🎉");
          } catch (err) {
            showToast("Save failed: Permission denied", "error");
          } finally {
            setIsProcessing(false);
          }
        }

        setEditingBillId(null);
        setViewingBillId(null);
        setActiveTab('bills');
      };

      const handleTogglePaid = async (bill, friendName) => {
        if (!isAdmin || isProcessing) return;
        const splitsKeys = Object.keys(bill.splits || {});
        const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase()) || friendName;
        const currentPaid = !!bill.paidStatus?.[matchedKey];
        const newPaidStatus = !currentPaid;
        const updatedStatus = { ...(bill.paidStatus || {}), [matchedKey]: newPaidStatus };
        const userShare = bill.splits?.[matchedKey] || 0;
        
        setIsProcessing(true);
        if (db) {
          try {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();

            const billRef = basePath.collection('bills').doc(bill.id);
            batch.update(billRef, { paidStatus: updatedStatus });

            if (newPaidStatus && userShare > 0) {
              const adjRef = basePath.collection('adjustments').doc();
              batch.set(adjRef, {
                friendName: matchedKey,
                billId: bill.id,
                amount: 0,
                displayAmount: userShare,
                isPaymentRecord: true,
                isSettled: true,
                note: `✓ ชำระแล้ว: ${bill.name}`,
                date: new Date().toISOString().split('T')[0],
                createdAt: Date.now()
              });
            } else if (!newPaidStatus) {
              const matchedAdjs = adjustments.filter(a => a.billId === bill.id && a.friendName.toLowerCase() === matchedKey.toLowerCase());
              matchedAdjs.forEach(adj => {
                const adjRef = basePath.collection('adjustments').doc(adj.id);
                batch.delete(adjRef);
              });
            }

            await batch.commit();
            showToast(`Updated ${matchedKey} to ${newPaidStatus ? 'Paid' : 'Pending'}`);
          } catch (err) {
            showToast("Update failed: Permission denied", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      const handleExportJSONBackup = () => {

          version: "1.0",

          friends,
          bills,
          adjustments

        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `KraiMaiJay_Backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("JSON Backup downloaded! 📦");

      const handleExportCSVReport = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "Date,Type,Title,Route,PaidBy,Subtotal(RM),Total(RM),Participants,Unpaid Pax\n";

        bills.forEach(b => {
          const type = b.billType === 'ride' ? 'Ride' : b.billType === 'loan' ? 'Loan' : 'Food/Delivery';
          const title = `"${(b.name || '').replace(/"/g, '""')}"`;
          const route = `"${(b.rideRoute || '').replace(/"/g, '""')}"`;
          const pBy = `"${b.paidBy || 'Me (Dom)'}"`;
          const sub = (b.subtotal || 0).toFixed(2);
          const tot = (b.total || 0).toFixed(2);
          const parts = `"${Object.keys(b.splits || {}).join(', ')}"`;
          const unpaidList = Object.keys(b.splits || {}).filter(name => !b.paidStatus?.[name]);
          const unpaid = `"${unpaidList.join(', ')}"`;

          csvContent += `${b.date},${type},${title},${route},${pBy},${sub},${tot},${parts},${unpaid}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `KraiMaiJay_Bills_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Bills CSV Report downloaded! 📊");

      const handleRestoreJSON = (e) => {
        if (!isAdmin) {
          showToast("Admin only can restore data", "error");
          return;
        }
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (!data.friends || !data.bills) {
              showToast("Invalid backup JSON format", "error");
              return;
            }

            if (!confirm(`Are you sure you want to restore ${data.bills.length} bills?`)) return;

            if (db) {
              const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
              const batch = db.batch();

              data.friends.forEach(f => {
                const ref = basePath.collection('friends').doc(f.id || undefined);
                batch.set(ref, { name: f.name, isSelf: f.isSelf || false, isArchived: f.isArchived || false, createdAt: f.createdAt || Date.now() });
              });

              data.bills.forEach(b => {
                const ref = basePath.collection('bills').doc(b.id || undefined);
                batch.set(ref, b);
              });

              (data.adjustments || []).forEach(a => {
                const ref = basePath.collection('adjustments').doc(a.id || undefined);
                batch.set(ref, a);
              });

              await batch.commit();
              showToast("Backup restored successfully! 🎉");
            }
          } catch (err) {
            showToast("Failed to parse JSON", "error");
          } finally {
            if (restoreInputRef.current) restoreInputRef.current.value = '';
          }
        };
        reader.readAsText(file);

      const monthlyBills = useMemo(() => {

      const monthlyStats = useMemo(() => {
        let totalGroup = 0;
        let foodTotal = 0;
        let rideTotal = 0;
        let loanTotal = 0;
        const friendShares = {};
        const dailyMyExpenses = {};

        friends.forEach(f => { friendShares[f.name] = 0; });

        monthlyBills.forEach(b => {
          const tot = b.total || 0;
          totalGroup += tot;
          if (b.billType === 'ride') {
            rideTotal += tot;
          } else if (b.billType === 'loan') {
            loanTotal += tot;
          } else {
            foodTotal += tot;
          }

          const selfAmount = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          if (b.date && selfAmount > 0) {
            if (!dailyMyExpenses[b.date]) {
              dailyMyExpenses[b.date] = { total: 0, items: [] };
            }
            dailyMyExpenses[b.date].total += selfAmount;
            dailyMyExpenses[b.date].items.push({ name: b.name, amount: selfAmount, type: b.billType });
          }

          Object.entries(b.splits || {}).forEach(([pName, pAmt]) => {
            const fObj = friends.find(f => f.name.toLowerCase() === pName.toLowerCase());
            const key = fObj ? fObj.name : pName;
            friendShares[key] = (friendShares[key] || 0) + (pAmt || 0);
          });
        });

        const sortedSpenders = Object.entries(friendShares)
          .filter(([_, amt]) => amt > 0)
          .sort((a, b) => b[1] - a[1]);

        return {
          totalGroup,
          foodTotal,
          rideTotal,
          loanTotal,
          count: monthlyBills.length,
          avgPerBill: monthlyBills.length > 0 ? (totalGroup / monthlyBills.length) : 0,
          foodPct: totalGroup > 0 ? Math.round((foodTotal / totalGroup) * 100) : 0,

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const imgWidth = 210;
          const imgHeight = (canvas.height * imgWidth) / canvas.width;
          pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
          pdf.save(`${filename}.pdf`);
          showToast("PDF Downloaded!");
        } catch (err) {
          showToast("Failed to generate PDF", "error");

                        <select
                          value={loanBorrower}

                          required
                        >
                          <option value="">-- เลือกผู้ยืม --</option>
                          {friends.filter(f => !f.isSelf && !f.isArchived).map(f => (
                            <option key={f.id} value={f.name}>{f.name}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs text-coral mb-1 font-bold">ยอดเงินที่ยืม (RM)</label>
                        <input 
                          type="text" 
                          inputMode="decimal"
                          value={loanAmount}
                          onChange={(e) => setLoanAmount(e.target.value)}
                          onBlur={(e) => setLoanAmount(evaluateMathExpression(e.target.value))}
                          className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-sm text-textPrimary font-mono font-bold"
                          placeholder="0.00"
                          required
                        />
                      </div>
                    </div>
                  ) : billType === 'ride' ? (
                    <div className="bg-subtle p-3.5 rounded-xl border border-bolt/30 space-y-3">
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[11px] text-textSecondary mb-1 font-bold">ค่าโดยสาร (RM)</label>
                          <input 
                            type="text" 
                            inputMode="decimal"
                            value={rideFare}
                            onChange={(e) => setRideFare(e.target.value)}
                            onBlur={(e) => setRideFare(evaluateMathExpression(e.target.value))}
                            className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-sm text-textPrimary font-mono"
                            placeholder="0.00"
                            required
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] text-amber mb-1 font-bold">ค่าทางด่วน (RM)</label>
                          <input 
                            type="text" 
                            inputMode="decimal"
                            value={tollFee}
                            onChange={(e) => setTollFee(e.target.value)}
                            onBlur={(e) => setTollFee(evaluateMathExpression(e.target.value))}
                            className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-sm text-textPrimary font-mono"
                            placeholder="0.00"
                          />
                        </div>
                      </div>
                      <div>
                        <input 
                          type="text" 
                          value={rideRoute}
                          onChange={(e) => setRideRoute(e.target.value)}
                          className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-xs text-textPrimary"
                          placeholder="รายละเอียดเส้นทาง (เช่น Pavilion -> Condo)"
                        />
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <label className="block text-[10px] text-emerald-400 font-bold mb-1">ค่าส่ง</label>
                          <input 
                            type="text" 
                            inputMode="decimal"
                            value={deliveryFee}
                            onChange={(e) => setDeliveryFee(e.target.value)}
                            className="w-full bg-subtle border border-line rounded-xl px-2.5 py-1.5 text-xs text-textPrimary font-mono"
                            placeholder="0.00"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] text-amber font-bold mb-1">กล่อง/ห่อ</label>
                          <input 
                            type="text" 
                            inputMode="decimal"
                            value={packagingCharge}
                            onChange={(e) => setPackagingCharge(e.target.value)}
                            className="w-full bg-subtle border border-line rounded-xl px-2.5 py-1.5 text-xs text-textPrimary font-mono"
                            placeholder="0.00"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] text-coral font-bold mb-1">ส่วนลด (-)</label>
                          <input 
                            type="text" 
                            inputMode="decimal"
                            value={discountAmount}
                            onChange={(e) => setDiscountAmount(e.target.value)}
                            className="w-full bg-subtle border border-line rounded-xl px-2.5 py-1.5 text-xs text-textPrimary font-mono"
                            placeholder="0.00"
                          />
                        </div>
                      </div>

                      <div className="space-y-2">
                        <div className="flex justify-between items-center">
                          <label className="text-xs font-bold text-textSecondary">รายการอาหาร ({billItems.length})</label>
                          <button
                            type="button"
                            onClick={() => setBillItems([...billItems, { id: Date.now().toString(), name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }])}
                            className="text-xs text-accent font-bold"
                          >
                            + เพิ่มเมนู
                          </button>
                        </div>
                        {billItems.map((item, index) => (
                          <div key={item.id} className="bg-subtle p-3 rounded-xl border border-line space-y-2">
                            <div className="flex gap-2">
                              <input
                                type="text"
                                value={item.name}
                                onChange={(e) => setBillItems(billItems.map(bi => bi.id === item.id ? { ...bi, name: e.target.value } : bi))}
                                className="flex-1 bg-surface border border-line rounded-lg px-2.5 py-1.5 text-xs"
                                placeholder="ชื่อเมนู"
                                required
                              />
                              <input
                                type="text"
                                inputMode="decimal"
                                value={item.price}
                                onChange={(e) => setBillItems(billItems.map(bi => bi.id === item.id ? { ...bi, price: e.target.value } : bi))}
                                className="w-20 bg-surface border border-line rounded-lg px-2.5 py-1.5 text-xs font-mono"
                                placeholder="ราคา"
                                required
                              />
                            </div>
                            <div className="flex flex-wrap gap-1">
                              {billFriends.map(fName => {
                                const isShared = (item.sharedWith || []).includes(fName);
                                return (
                                  <button
                                    key={fName}
                                    type="button"
                                    onClick={() => {
                                      const nextShared = isShared ? item.sharedWith.filter(sn => sn !== fName) : [...item.sharedWith, fName];
                                      setBillItems(billItems.map(bi => bi.id === item.id ? { ...bi, sharedWith: nextShared } : bi));
                                    }}
                                    className={`px-2 py-0.5 rounded text-[10px] ${isShared ? 'bg-mint text-bg font-bold' : 'bg-surface text-textSecondary'}`}
                                  >
                                    {fName}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* PARTICIPANTS */}
                  {billType !== 'loan' && (
                    <div>
                      <label className="block text-xs font-bold text-textSecondary mb-1.5">คนร่วมหาร ({billFriends.length})</label>
                      <div className="flex flex-wrap gap-1.5">
                        {friends.filter(f => !f.isArchived).map(f => {
                          const isSel = billFriends.includes(f.name);
                          return (
                            <button
                              key={f.id}
                              type="button"
                              onClick={() => setBillFriends(isSel ? billFriends.filter(n => n !== f.name) : [...billFriends, f.name])}
                              className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${isSel ? 'bg-accent text-white' : 'bg-subtle text-textSecondary'}`}
                            >
                              {isSel ? '✓ ' : '+ '} {f.name}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  <button type="submit" disabled={isProcessing} className="w-full bg-mint hover:bg-emerald-600 text-bg font-bold py-3 rounded-xl transition text-sm shadow-md">
                    {isProcessing ? 'กำลังบันทึก...' : t('save')}
                  </button>
                </form>
              ) : (
                <div className="bg-surface rounded-2xl p-8 border border-line text-center space-y-3">
                  <p className="text-coral text-base font-bold">🔒 Viewer Mode</p>
                  <button onClick={() => setShowAuthModal(true)} className="bg-accent text-white font-bold px-4 py-2 rounded-xl text-xs">
                    {t('adminSignIn')}
                  </button>
                </div>
              )
            )}

            {/* 3. HISTORY */}
            {activeTab === 'bills' && (
              <div className="space-y-3">
                <input 
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder={t('searchPlaceholder')}
                  className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-xs outline-none"
                />

                <div className="space-y-2.5">
                  {filteredBills.map(bill => {
                    const isCollapsed = viewingBillId === bill.id;
                    const unpaidCount = Object.keys(bill.splits || {}).filter(n => {
                      const fObj = friends.find(f => f.name.toLowerCase() === n.toLowerCase());
                      return !fObj?.isSelf && !bill.paidStatus?.[n];
                    }).length;

                    return (
                      <div 
                        key={bill.id}
                        onClick={() => setViewingBillId(isCollapsed ? null : bill.id)}
                        className="bg-surface border border-line p-3.5 rounded-xl space-y-2"
                      >
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-[10px] text-textMuted font-mono">{bill.date}</span>
                            <h3 className="font-bold text-sm text-textPrimary">{bill.name}</h3>
                          </div>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${unpaidCount === 0 ? 'bg-mint/15 text-mint' : 'bg-coral/15 text-coral'}`}>
                            {unpaidCount === 0 ? '✓ เคลียร์แล้ว' : `รอ ${unpaidCount} คน`}
                          </span>
                        </div>

                        <div className="flex justify-between text-xs font-mono">
                          <span className="text-textMuted">ยอดสุทธิ:</span>
                          <span className="font-bold text-mint">{bill.total?.toFixed(2)} RM</span>
                        </div>

                        {isCollapsed && (
                          <div className="pt-2 border-t border-line space-y-2" onClick={e => e.stopPropagation()}>
                            {Object.keys(bill.splits || {}).map(fName => (
                              <div key={fName} className="flex justify-between items-center text-xs">
                                <span>{fName} ({bill.splits[fName]?.toFixed(2)} RM)</span>
                                {isAdmin ? (
                                  <button
                                    onClick={() => handleTogglePaid(bill, fName)}
                                    className={`px-2 py-0.5 rounded text-[10px] font-bold ${bill.paidStatus?.[fName] ? 'bg-mint text-bg' : 'bg-coral text-white'}`}
                                  >
                                    {bill.paidStatus?.[fName] ? 'จ่ายแล้ว' : 'ค้าง'}
                                  </button>
                                ) : (
                                  <span className={`text-[10px] font-bold ${bill.paidStatus?.[fName] ? 'text-mint' : 'text-coral'}`}>
                                    {bill.paidStatus?.[fName] ? 'จ่ายแล้ว' : 'ค้าง'}
                                  </span>
                                )}
                              </div>
                            ))}

                            {isAdmin && (
                              <div className="flex justify-between pt-2 border-t border-line">
                                <button onClick={() => handleStartEditBill(bill)} className="text-accent text-xs">แก้ไข</button>
                                <button onClick={() => handleDeleteBill(bill.id)} className="text-coral text-xs">ลบ</button>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 4. FRIENDS */}
            {activeTab === 'friends' && (
              <div className="space-y-4">
                {isAdmin && (
                  <form onSubmit={handleAddFriend} className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder={t('friendNamePlaceholder')}
                      value={newFriendName}
                      onChange={(e) => setNewFriendName(e.target.value)}
                      className="flex-1 bg-surface border border-line rounded-xl px-3 py-2 text-xs outline-none"
                    />
                    <button type="submit" className="bg-accent text-white font-bold px-4 py-2 rounded-xl text-xs">เพิ่ม</button>
                  </form>
                )}

                <div className="bg-surface rounded-2xl p-4 border border-line divide-y divide-line">
                  {friends.filter(f => showArchivedFriends ? true : !f.isArchived).map(friend => (
                    <div key={friend.id} className="py-2.5 first:pt-0 last:pb-0 flex justify-between items-center text-xs">
                      <div>
                        <span className="font-bold">{friend.name}</span>
                        {friend.isSelf && <span className="ml-1 text-[9px] bg-accent/20 text-accent px-1.5 py-0.2 rounded">Me</span>}
                      </div>
                      {!friend.isSelf && (
                        <div className="flex gap-1.5">
                          <button onClick={() => setSelectedFriendForHistory(friend.name)} className="bg-subtle px-2 py-1 rounded">Statement</button>
                          {isAdmin && (
                            <button onClick={() => handleToggleArchiveFriend(friend)} className="text-coral px-1">
                              {friend.isArchived ? "คืนค่า" : "ซ่อน"}
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 5. ANALYTICS */}
            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <div className="bg-surface rounded-2xl p-4 border border-line space-y-3">
                  <div className="flex justify-between items-center pb-2 border-b border-line">
                    <h2 className="text-sm font-bold">📊 {t('analyticsTitle')}</h2>
                    <input 
                      type="month"
                      value={selectedMonth}
                      onChange={(e) => setSelectedMonth(e.target.value)}
                      className="bg-subtle border border-line rounded-lg px-2 py-1 text-xs"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-center">
                    <div className="bg-subtle p-2.5 rounded-xl">
                      <p className="text-[10px] text-textMuted">ยอดรวมกลุ่ม</p>
                      <p className="text-base font-black font-mono mt-0.5">{monthlyStats.totalGroup.toFixed(2)} RM</p>
                    </div>
                    <div className="bg-subtle p-2.5 rounded-xl">
                      <p className="text-[10px] text-emerald-400">ค่าอาหาร</p>
                      <p className="text-base font-black font-mono text-emerald-400 mt-0.5">{monthlyStats.foodTotal.toFixed(2)} RM</p>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-line space-y-2">
                    <p className="text-xs font-bold">สำรองข้อมูล</p>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={handleExportJSONBackup} className="bg-subtle border border-line py-2 rounded-xl text-xs font-bold">JSON Backup</button>
                      <button onClick={handleExportCSVReport} className="bg-subtle border border-line py-2 rounded-xl text-xs font-bold">CSV Report</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MOBILE BOTTOM SHEET MODAL (Statement) */}
          {selectedFriendForHistory && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end"
              onClick={() => setSelectedFriendForHistory(null)}
            >
              <div 
                className="bg-surface border-t border-line rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom"
                onClick={e => e.stopPropagation()}
              >
                {/* Handle Bar */}
                <div className="w-10 h-1 bg-line rounded-full mx-auto mt-3 mb-1"></div>

                <div className="p-4 border-b border-line flex justify-between items-center">
                  <h3 className="font-bold text-sm">Statement: {selectedFriendForHistory}</h3>
                  <button onClick={() => setSelectedFriendForHistory(null)} className="text-textSecondary text-xs">ปิด ✕</button>
                </div>

                <div className="p-4 overflow-y-auto space-y-3 flex-1">
                  <div ref={friendSlipRef} className="bg-[#0B0F17] p-4 rounded-xl border border-line/60 font-mono text-xs space-y-3">
                    <div className="text-center pb-2 border-b border-line space-y-0.5">
                      <p className="font-bold text-sm font-sans">{selectedFriendForHistory}</p>
                      <p className={`text-base font-black ${(friendBalances[selectedFriendForHistory]?.totalOwed || 0) > 0 ? 'text-coral' : 'text-mint'}`}>
                        {(friendBalances[selectedFriendForHistory]?.totalOwed || 0).toFixed(2)} RM
                      </p>
                    </div>

                    <div className="space-y-1.5">
                      {getFriendHistory(selectedFriendForHistory).bills.map(b => (
                        <div key={b.id} className="flex justify-between text-[11px]">
                          <span className="truncate pr-2">{b.name}</span>
                          <span className="font-bold tabular">{b.splits[selectedFriendForHistory]?.toFixed(2)} RM</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-3 border-t border-line bg-surface grid grid-cols-3 gap-2">
                  <button onClick={() => copyStatementTextToClipboard(selectedFriendForHistory)} className="bg-mint text-bg font-bold py-2 rounded-xl text-xs">คัดลอก</button>
                  <button onClick={() => handleExportElement(friendSlipRef, `Statement_${selectedFriendForHistory}`)} className="bg-accent text-white font-bold py-2 rounded-xl text-xs">รูป PNG</button>
                  <button onClick={() => handleExportPDF(friendSlipRef, `Statement_${selectedFriendForHistory}`)} className="bg-coral text-white font-bold py-2 rounded-xl text-xs">PDF</button>
                </div>
              </div>
            </div>
          )}

          {/* MOBILE BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-surface/95 backdrop-blur-xl border-t border-line px-4 py-2 pb-safe flex justify-around items-center max-w-md mx-auto">
            <button 
              onClick={() => setActiveTab('dashboard')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'dashboard' ? 'text-accent font-bold' : 'text-textMuted'}`}
            >
              <span className="text-base">📊</span>
              <span className="text-[10px]">{t('navDashboard')}</span>
            </button>

            <button 
              onClick={() => setActiveTab('bills')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'bills' ? 'text-accent font-bold' : 'text-textMuted'}`}
            >
              <span className="text-base">🧾</span>
              <span className="text-[10px]">{t('navHistory')}</span>
            </button>

            {/* Central Primary Action Button */}
            {isAdmin && (
              <button 
                onClick={() => {
                  setEditingBillId(null);
                  setNewBillName('');
                  setBillFriends(friends.filter(f => !f.isArchived).map(f => f.name));
                  setActiveTab('new-bill');
                }}
                className="bg-accent hover:bg-accent-hover active:scale-95 text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-lg shadow-accent/40 -mt-6 border-4 border-bg transition"
              >
                +
              </button>
            )}

            <button 
              onClick={() => setActiveTab('friends')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'friends' ? 'text-accent font-bold' : 'text-textMuted'}`}
            >
              <span className="text-base">👥</span>
              <span className="text-[10px]">{t('navFriends')}</span>
            </button>

            <button 
              onClick={() => setActiveTab('analytics')} 
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'analytics' ? 'text-accent font-bold' : 'text-textMuted'}`}
            >
              <span className="text-base">📈</span>
              <span className="text-[10px]">{t('navAnalytics')}</span>
            </button>
          </nav>

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowAuthModal(false)}>
              <div className="bg-surface border border-line rounded-3xl p-6 w-full max-w-xs space-y-4" onClick={e => e.stopPropagation()}>
                <h3 className="font-bold text-center text-sm">{t('adminSignIn')}</h3>
                <button onClick={handleGoogleLogin} className="w-full bg-subtle border border-line py-2 rounded-xl text-xs font-bold">Google Sign-in</button>
                <form onSubmit={handleVerifyPin} className="space-y-2">
                  <input 
                    type="password"
                    pattern="[0-9]*"
                    inputMode="numeric"
                    maxLength="6"
                    placeholder="PIN"
                    value={inputPin}
                    onChange={(e) => setInputPin(e.target.value)}
                    className="w-full bg-subtle border border-line rounded-xl py-2 text-center font-mono outline-none"
                  />
                  <button type="submit" className="w-full bg-accent text-white font-bold py-2 rounded-xl text-xs">Unlock</button>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-4 left-4 right-4 max-w-xs mx-auto z-50 text-center py-2 px-4 rounded-xl text-xs shadow-xl font-bold ${toast.type === 'error' ? 'bg-coral text-white' : 'bg-mint text-bg'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
