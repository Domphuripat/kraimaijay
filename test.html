    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('kraimaijay_lang') || 'th');

      const t = (key, params = {}) => {
        let str = TRANSLATIONS[lang]?.[key] || TRANSLATIONS['en']?.[key] || key;
        Object.keys(params).forEach(p => {
          str = str.replace(`{${p}}`, params[p]);
        });
        return str;
      };

      const handleLangToggle = () => {
        const nextLang = lang === 'en' ? 'th' : 'en';
        setLang(nextLang);
        localStorage.setItem('kraimaijay_lang', nextLang);
      };

      const [cloudConfig] = useState(DEFAULT_FIREBASE_CONFIG);
      const [appId] = useState(DEFAULT_APP_ID);

      const [currentUser, setCurrentUser] = useState(null);
      const [isAdminByGoogle, setIsAdminByGoogle] = useState(false);
      
      const [isAdminBySecret, setIsAdminBySecret] = useState(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const hasSecretKey = urlParams.get('admin') === 'true' || urlParams.get('dom') === '2323';
        if (hasSecretKey) {
          localStorage.setItem('kraimaijay_secret_admin', 'true');
          return true;
        }
        return localStorage.getItem('kraimaijay_secret_admin') === 'true';
      });

      const isAdmin = isAdminByGoogle || isAdminBySecret;
      const [isProcessing, setIsProcessing] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);

      const [db, setDb] = useState(null);

      const [friends, setFriends] = useState([]);
      const [bills, setBills] = useState([]);
      const [adjustments, setAdjustments] = useState([]);
      const [showArchivedFriends, setShowArchivedFriends] = useState(false);

      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().substring(0, 7));

      // Bill Form States
      const [editingBillId, setEditingBillId] = useState(null);
      const [newBillName, setNewBillName] = useState('');
      const [billType, setBillType] = useState('delivery');
      const [newBillDate, setNewBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [billFriends, setBillFriends] = useState([]);
      const [paidBy, setPaidBy] = useState('Me (Dom)');
      const [remainderMode, setRemainderMode] = useState('distribute');
      
      const [rideFare, setRideFare] = useState('');
      const [tollFee, setTollFee] = useState('');
      const [rideRoute, setRideRoute] = useState('');

      const [loanAmount, setLoanAmount] = useState('');
      const [loanBorrower, setLoanBorrower] = useState('');
      
      const [taxMode, setTaxMode] = useState('inclusive');
      const [serviceChargeRate, setServiceChargeRate] = useState(0);
      const [deliveryFee, setDeliveryFee] = useState(0);
      const [packagingCharge, setPackagingCharge] = useState(0);
      const [discountAmount, setDiscountAmount] = useState(0);
      const [roundingAdj, setRoundingAdj] = useState(0);
      const [billItems, setBillItems] = useState([
        { id: '1', name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }
      ]);

      const [newFriendName, setNewFriendName] = useState('');
      const [selectedFriendForAdjust, setSelectedFriendForAdjust] = useState(null);
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustNote, setAdjustNote] = useState('');
      const [adjustType, setAdjustType] = useState('minus');
      const [viewingBillId, setViewingBillId] = useState(null);

      const [selectedFriendForHistory, setSelectedFriendForHistory] = useState(null);
      const friendSlipRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleStartEditBill = (bill) => {
        setEditingBillId(bill.id);
        setNewBillName(bill.name || '');
        setBillType(bill.billType || 'delivery');
        setPaidBy(bill.paidBy || 'Me (Dom)');
        setRemainderMode(bill.remainderMode || 'distribute');
        setTaxMode(bill.taxMode || 'inclusive');
        setNewBillDate(bill.date || new Date().toISOString().split('T')[0]);
        setDeliveryFee(bill.deliveryFee || 0);
        setPackagingCharge(bill.packagingCharge || 0);
        setDiscountAmount(bill.discountAmount || 0);
        setServiceChargeRate(bill.serviceChargeRate || 0);
        setRoundingAdj(bill.roundingAdjustment || 0);
        setRideFare(bill.rideFare || '');
        setTollFee(bill.tollFee || '');
        setRideRoute(bill.rideRoute || '');
        setLoanAmount(bill.loanAmount || '');
        setLoanBorrower(bill.loanBorrower || '');
        setBillFriends(Object.keys(bill.splits || {}));
        setBillItems(bill.items && bill.items.length > 0 ? bill.items : [{ id: '1', name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }]);
        setActiveTab('new-bill');
      };

      useEffect(() => {
        try {
          let firebaseApp = !firebase.apps.length ? firebase.initializeApp(cloudConfig) : firebase.app();
          const authInstance = firebase.auth(firebaseApp);
          const firestoreInstance = firebase.firestore(firebaseApp);
          setDb(firestoreInstance);

          if (localStorage.getItem('kraimaijay_secret_admin') === 'true' && !authInstance.currentUser) {
            authInstance.signInAnonymously().catch(() => {});
          }

          const unsubAuth = authInstance.onAuthStateChanged(user => {
            setCurrentUser(user);
            if (user && user.email) {
              const hasAdminRole = ADMIN_EMAILS.some(e => e.toLowerCase() === user.email.toLowerCase());
              setIsAdminByGoogle(hasAdminRole);
            } else {
              setIsAdminByGoogle(false);
            }
          });

          const basePath = firestoreInstance.collection('artifacts').doc(appId).collection('public').doc('data');
          
          const unsubFriends = basePath.collection('friends').onSnapshot(snap => {
            const list = [];
            const seenNames = new Set();
            snap.forEach(doc => {
              const data = doc.data();
              const normName = (data.name || '').trim().toLowerCase();
              if (normName && !seenNames.has(normName)) {
                seenNames.add(normName);
                list.push({ id: doc.id, ...data });
              }
            });
            setFriends(list);
          });

          const unsubBills = basePath.collection('bills').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setBills(list);
          });

          const unsubAdjs = basePath.collection('adjustments').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setAdjustments(list);
          });

          return () => {
            unsubAuth();
            unsubFriends();
            unsubBills();
            unsubAdjs();
          };
        } catch (err) {
          console.warn("Firebase Init Error:", err);
        }
      }, [cloudConfig, appId]);

      const handleGoogleLogin = async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          const result = await firebase.auth().signInWithPopup(provider);
          if (result && result.user) {
            const userEmail = (result.user.email || '').toLowerCase();
            const hasAdminRole = ADMIN_EMAILS.some(e => e.toLowerCase() === userEmail);
            setIsAdminByGoogle(hasAdminRole);
            setShowAuthModal(false);
            if (hasAdminRole) {
              showToast("👑 Signed in as Admin Dom!");
            } else {
              showToast(`Logged in as ${userEmail} (Viewer)`);
            }
          }
        } catch (err) {
          showToast("Google sign-in failed. Please use PIN below!", "error");
        }
      };

      const handleVerifyPin = async (e) => {
        e.preventDefault();
        if (inputPin === ADMIN_PIN) {
          setIsAdminBySecret(true);
          localStorage.setItem('kraimaijay_secret_admin', 'true');
          try {
            await firebase.auth().signInAnonymously();
          } catch (err) {}
          setShowAuthModal(false);
          setInputPin('');
          showToast("👑 PIN Correct: Admin mode unlocked!");
        } else {
          showToast("รหัส PIN ไม่ถูกต้อง", "error");
          setInputPin('');
        }
      };

      const handleLogoutAdmin = async () => {
        setIsAdminBySecret(false);
        setIsAdminByGoogle(false);
        localStorage.removeItem('kraimaijay_secret_admin');
        try {
          await firebase.auth().signOut();
        } catch (e) {}
        showToast("Logged out to Viewer mode");
      };

      const getFriendBalances = () => {
        const balances = {};
        friends.forEach(f => {
          balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
        });

        bills.forEach(bill => {
          const billPayer = bill.paidBy || 'Me (Dom)';
          const isDomPayer = /me|dom/i.test(billPayer);

          if (isDomPayer) {
            Object.keys(bill.splits || {}).forEach(name => {
              const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
              const realName = fObj ? fObj.name : name;
              const isSelf = fObj?.isSelf || /me|dom/i.test(realName);
              if (balances[realName] && !isSelf && !bill.paidStatus?.[name]) {
                balances[realName].billsOwed += bill.splits[name];
              }
            });
          } else {
            const payerObj = friends.find(f => f.name.toLowerCase() === billPayer.toLowerCase());
            const realPayerName = payerObj ? payerObj.name : billPayer;
            
            const myShare = bill.splits?.['Me (Dom)'] || bill.splits?.['ตัวฉันเอง'] || 0;
            const isMySharePaid = bill.paidStatus?.['Me (Dom)'] || bill.paidStatus?.['ตัวฉันเอง'] || false;

            if (balances[realPayerName] && myShare > 0 && !isMySharePaid) {
              balances[realPayerName].billsOwed -= myShare;
            }
          }
        });

        adjustments.forEach(adj => {
          const fObj = friends.find(f => f.name.toLowerCase() === adj.friendName.toLowerCase());
          const realName = fObj ? fObj.name : adj.friendName;
          if (balances[realName] && adj.amount !== undefined && !adj.isSettled) {
            balances[realName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = Math.round((balances[name].billsOwed + balances[name].adjustedOwed) * 100) / 100;
        });

        return balances;
      };

      const friendBalances = getFriendBalances();

      const todayDateStr = new Date().toISOString().split('T')[0];
      const todayMyExpense = bills
        .filter(b => b.date === todayDateStr)
        .reduce((sum, b) => {
          const selfAmount = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          return sum + selfAmount;
        }, 0);
      const todayBillsCount = bills.filter(b => b.date === todayDateStr).length;

      const getFriendHistory = (friendName) => {
        const friendBills = bills.filter(b => {
          const keys = Object.keys(b.splits || {});
          const touchesFriend = keys.some(k => k.toLowerCase() === friendName.toLowerCase());
          const isFriendPayer = (b.paidBy || '').toLowerCase() === friendName.toLowerCase();
          return touchesFriend || isFriendPayer;
        });
        const friendAdjustments = adjustments.filter(a => a.friendName.toLowerCase() === friendName.toLowerCase());
        return { bills: friendBills, adjustments: friendAdjustments };
      };

      const handleSettleFullWithBatch = async (friendName) => {
        if (!isAdmin || isProcessing) return;

        const unpaidBills = bills.filter(b => {
          const splitsKeys = Object.keys(b.splits || {});
          const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase());
          const hasSplit = matchedKey && b.splits[matchedKey] !== undefined;
          const isPaid = matchedKey ? (b.paidStatus?.[matchedKey] === true) : false;
          return hasSplit && !isPaid;
        });

        const curBalance = friendBalances[friendName]?.totalOwed || 0;

        if (!confirm(t('settleConfirmModal', { n: unpaidBills.length, name: friendName }))) {
          return;
        }

        setIsProcessing(true);
        try {
          if (db) {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();
            let operationsCount = 0;
            const settledBillIds = [];

            unpaidBills.forEach(bill => {
              const bDoc = basePath.collection('bills').doc(bill.id);
              const splitsKeys = Object.keys(bill.splits || {});
              const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase()) || friendName;
              const nextStatus = { ...(bill.paidStatus || {}), [matchedKey]: true };
              batch.update(bDoc, { paidStatus: nextStatus });
              settledBillIds.push(bill.id);
              operationsCount++;
            });

            adjustments.filter(a => a.friendName.toLowerCase() === friendName.toLowerCase() && !a.isSettled).forEach(adj => {
              const aDoc = basePath.collection('adjustments').doc(adj.id);
              batch.update(aDoc, { isSettled: true });
              operationsCount++;
            });

            const settleLogRef = basePath.collection('adjustments').doc();
            batch.set(settleLogRef, {
              friendName,
              amount: 0,
              displayAmount: curBalance,
              isPaymentRecord: true,
              isSettled: true,
              relatedBillIds: settledBillIds,
              note: `⚡ เคลียร์ยอดบิลทั้งหมด (${unpaidBills.length} รายการ)`,
              date: new Date().toISOString().split('T')[0],
              createdAt: Date.now() + 1
            });
            operationsCount++;

            if (operationsCount > 0) {
              await batch.commit();
              showToast(`🎉 Cleared all bills for ${friendName}!`);
            }

            setSelectedFriendForAdjust(null);
          }
        } catch (err) {
          showToast("Failed to settle: " + (err.message || "Permission Denied"), "error");
        } finally {
          setIsProcessing(false);
        }
      };

      const handleDeleteBill = async (billId) => {
        if (!isAdmin || isProcessing) return;
        if (!confirm("ต้องการลบบิลนี้ใช่หรือไม่?")) return;

        setIsProcessing(true);
        try {
          if (db) {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            await basePath.collection('bills').doc(billId).delete();
            setViewingBillId(null);
            showToast("ลบบิลเรียบร้อย! 🔄");
          }
        } catch (err) {
          showToast("Delete failed: " + err.message, "error");
        } finally {
          setIsProcessing(false);
        }
      };

      const handleSaveAdjustment = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        const amount = parseFloat(adjustAmount);
        if (isNaN(amount) || amount <= 0) {
          showToast("Please enter a valid amount", "error");
          return;
        }

        const finalAmount = adjustType === 'plus' ? amount : -amount;
        const newAdj = {
          friendName: selectedFriendForAdjust,
          amount: finalAmount,
          displayAmount: amount,
          isPaymentRecord: adjustType === 'minus',
          isSettled: adjustType === 'minus',
          note: adjustNote.trim() || (adjustType === 'plus' ? 'เพิ่มยอดหนี้' : `ชำระบางส่วน (${amount.toFixed(2)} RM)`),
          date: new Date().toISOString().split('T')[0],
          createdAt: Date.now()
        };

        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').add(newAdj);
            showToast(`บันทึกปรับยอด ${amount.toFixed(2)} RM เรียบร้อย`);
          } catch (err) {
            showToast("Save failed", "error");
          }
        }
        setSelectedFriendForAdjust(null);
        setAdjustAmount('');
        setAdjustNote('');
      };

      const handleAddFriend = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        const name = newFriendName.trim();
        if (!name) return;

        const isSelfAlias = /^(me|dom|me\s*\(dom\)|ตัวฉันเอง)$/i.test(name);
        if (isSelfAlias) {
          showToast("ไม่สามารถเพิ่มชื่อตัวเองเป็นเพื่อนได้", "error");
          return;
        }

        const isDuplicate = friends.some(
          f => (f.name || '').trim().toLowerCase() === name.toLowerCase()
        );

        if (isDuplicate) {
          showToast("มีชื่อนี้อยู่ในระบบแล้ว", "error");
          return;
        }

        const newF = { name, isSelf: false, isArchived: false, createdAt: Date.now() };
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').add(newF);
            showToast(`เพิ่มเพื่อน "${name}" สำเร็จ!`);
          } catch (err) {
            showToast("Failed to add friend", "error");
          }
        }
        setNewFriendName('');
      };

      const calculateBillSplits = (items, scRate, dFee, packCharge, discount, roundAdj, selectedFriends, currentTaxMode, currentBillType, rFare, tFee, lAmt, lBorrower, curRemainderMode = 'distribute', curPaidBy = 'Me (Dom)') => {
        const splits = {};
        const friendItemDetails = {};
        const activeFriendsCount = selectedFriends.length;

        if (currentBillType === 'loan') {
          const parsedLoanAmt = parseFloat(lAmt) || 0;
          if (lBorrower) {
            splits[lBorrower] = parsedLoanAmt;
            friendItemDetails[lBorrower] = { baseShare: parsedLoanAmt };
          }
          return { subtotal: parsedLoanAmt, total: parsedLoanAmt, splits, friendItemDetails };
        }

        if (currentBillType === 'ride') {
          const parsedRideFare = parseFloat(rFare) || 0;
          const parsedToll = parseFloat(tFee) || 0;
          const parsedDiscount = parseFloat(discount) || 0;
          const parsedRoundAdj = parseFloat(roundAdj) || 0;
          
          const netTotal = Math.max(0, parsedRideFare + parsedToll - parsedDiscount + parsedRoundAdj);
          const totalCents = Math.round(netTotal * 100);
          const baseCents = activeFriendsCount > 0 ? Math.floor(totalCents / activeFriendsCount) : 0;
          let remainderCents = activeFriendsCount > 0 ? (totalCents % activeFriendsCount) : 0;

          selectedFriends.forEach(f => {
            let shareCents = baseCents;
            if (curRemainderMode === 'distribute') {
              if (remainderCents > 0) { shareCents += 1; remainderCents--; }
            } else if (curRemainderMode === 'payer' && f.toLowerCase() === curPaidBy.toLowerCase()) {
              shareCents += remainderCents;
            }

            splits[f] = shareCents / 100;
            friendItemDetails[f] = {
              baseShare: Math.round((parsedRideFare / (activeFriendsCount || 1)) * 100) / 100,
              tollShare: Math.round((parsedToll / (activeFriendsCount || 1)) * 100) / 100,
              discountShare: Math.round((parsedDiscount / (activeFriendsCount || 1)) * 100) / 100,
            };
          });

          return {
            subtotal: parsedRideFare,
            tollFee: parsedToll,
            discountAmount: parsedDiscount,
            total: Math.round(netTotal * 100) / 100,
            splits,
            friendItemDetails
          };
        }

        const friendBaseShares = {};
        selectedFriends.forEach(f => { friendBaseShares[f] = 0; });

        let subtotal = 0;
        items.forEach(item => {
          const price = parseFloat(item.price) || 0;
          const qty = parseInt(item.qty) || 1;
          const itemTotal = price * qty;
          subtotal += itemTotal;

          const sharedList = (item.sharedWith || []).filter(f => selectedFriends.includes(f));
          if (sharedList.length > 0) {
            const itemTotalCents = Math.round(itemTotal * 100);
            const baseShareCents = Math.floor(itemTotalCents / sharedList.length);
            let remShareCents = itemTotalCents % sharedList.length;

            sharedList.forEach(f => {
              const allocatedCents = baseShareCents + (remShareCents > 0 ? 1 : 0);
              if (remShareCents > 0) remShareCents--;
              friendBaseShares[f] = (friendBaseShares[f] || 0) + (allocatedCents / 100);
            });
          }
        });

        const totalSc = subtotal * (scRate / 100);
        const parsedDFee = parseFloat(dFee) || 0;
        const parsedPackCharge = parseFloat(packCharge) || 0;
        const parsedDiscount = parseFloat(discount) || 0;
        const parsedRoundAdj = parseFloat(roundAdj) || 0;

        const perPersonDelivery = activeFriendsCount > 0 ? (parsedDFee / activeFriendsCount) : 0;
        const perPersonPackaging = activeFriendsCount > 0 ? (parsedPackCharge / activeFriendsCount) : 0;

        let totalDistributedCents = 0;

        selectedFriends.forEach(f => {
          const base = friendBaseShares[f] || 0;
          const friendSc = base * (scRate / 100);
          const userDiscountShare = subtotal > 0 ? (base / subtotal) * parsedDiscount : (parsedDiscount / (activeFriendsCount || 1));
          
          const finalPersonAmount = Math.max(0, base + friendSc + perPersonDelivery + perPersonPackaging - userDiscountShare);
          const personCents = Math.round(finalPersonAmount * 100);
          splits[f] = personCents / 100;
          totalDistributedCents += personCents;

          friendItemDetails[f] = {
            baseShare: Math.round(base * 100) / 100,
            scShare: Math.round(friendSc * 100) / 100,
            deliveryShare: Math.round(perPersonDelivery * 100) / 100,
            packagingShare: Math.round(perPersonPackaging * 100) / 100,
            discountShare: Math.round(userDiscountShare * 100) / 100,
          };
        });

        const finalTotal = Math.round((subtotal + totalSc + parsedDFee + parsedPackCharge - parsedDiscount + parsedRoundAdj) * 100) / 100;
        const targetTotalCents = Math.round(finalTotal * 100);

        if (activeFriendsCount > 0 && totalDistributedCents !== targetTotalCents) {
          const diffCents = targetTotalCents - totalDistributedCents;
          const targetPerson = (curRemainderMode === 'payer' && selectedFriends.includes(curPaidBy)) 
            ? curPaidBy 
            : selectedFriends[selectedFriends.length - 1];
          splits[targetPerson] = Math.max(0, Math.round((splits[targetPerson] + (diffCents / 100)) * 100) / 100);
        }

        return {
          subtotal: Math.round(subtotal * 100) / 100,
          deliveryFee: parsedDFee,
          packagingCharge: parsedPackCharge,
          discountAmount: parsedDiscount,
          total: finalTotal,
          splits,
          friendItemDetails
        };
      };

      const handleSaveBill = async (e) => {
        e.preventDefault();
        if (!isAdmin || isProcessing) return;
        if (!newBillName.trim()) {
          showToast("Please enter a title", "error");
          return;
        }

        const calculated = calculateBillSplits(
          billItems,
          serviceChargeRate,
          deliveryFee,
          packagingCharge,
          discountAmount,
          roundingAdj,
          billFriends,
          taxMode,
          billType,
          rideFare,
          tollFee,
          loanAmount,
          loanBorrower,
          remainderMode,
          paidBy
        );

        let initialPaidStatus = {};
        if (editingBillId) {
          const oldBill = bills.find(b => b.id === editingBillId);
          initialPaidStatus = oldBill?.paidStatus || {};
        }

        const participantsToProcess = billType === 'loan' ? (loanBorrower ? [loanBorrower] : []) : billFriends;

        participantsToProcess.forEach(f => {
          if (initialPaidStatus[f] === undefined) {
            const isCurrentPayer = f.toLowerCase() === paidBy.toLowerCase();
            initialPaidStatus[f] = isCurrentPayer;
          }
        });

        const billPayload = {
          name: newBillName,
          billType,
          paidBy,
          remainderMode,
          taxMode,
          date: newBillDate,
          rideFare: parseFloat(rideFare) || 0,
          tollFee: parseFloat(tollFee) || 0,
          rideRoute,
          loanAmount: parseFloat(loanAmount) || 0,
          loanBorrower,
          subtotal: calculated.subtotal,
          deliveryFee: calculated.deliveryFee || 0,
          packagingCharge: calculated.packagingCharge || 0,
          discountAmount: calculated.discountAmount || 0,
          total: calculated.total,
          items: (billType === 'ride' || billType === 'loan') ? [] : billItems.map(item => ({
            id: item.id,
            name: item.name,
            price: parseFloat(item.price) || 0,
            qty: parseInt(item.qty) || 1,
            taxRate: parseFloat(item.taxRate || 0),
            sharedWith: item.sharedWith || []
          })),
          splits: calculated.splits,
          friendItemDetails: calculated.friendItemDetails,
          paidStatus: initialPaidStatus,
          updatedAt: Date.now()
        };

        setIsProcessing(true);
        if (db) {
          try {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            if (editingBillId) {
              await basePath.collection('bills').doc(editingBillId).update(billPayload);
            } else {
              billPayload.createdAt = Date.now();
              await basePath.collection('bills').add(billPayload);
            }
            showToast("บันทึกบิลเรียบร้อย! 🎉");
          } catch (err) {
            showToast("Save failed", "error");
          } finally {
            setIsProcessing(false);
          }
        }

        setEditingBillId(null);
        setViewingBillId(null);
        setActiveTab('bills');
      };

      const handleTogglePaid = async (bill, friendName) => {
        if (!isAdmin || isProcessing) return;
        const splitsKeys = Object.keys(bill.splits || {});
        const matchedKey = splitsKeys.find(k => k.toLowerCase() === friendName.toLowerCase()) || friendName;
        const currentPaid = !!bill.paidStatus?.[matchedKey];
        const newPaidStatus = !currentPaid;
        const updatedStatus = { ...(bill.paidStatus || {}), [matchedKey]: newPaidStatus };
        const userShare = bill.splits?.[matchedKey] || 0;
        
        setIsProcessing(true);
        if (db) {
          try {
            const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const batch = db.batch();

            const billRef = basePath.collection('bills').doc(bill.id);
            batch.update(billRef, { paidStatus: updatedStatus });

            if (newPaidStatus && userShare > 0) {
              const adjRef = basePath.collection('adjustments').doc();
              batch.set(adjRef, {
                friendName: matchedKey,
                billId: bill.id,
                amount: 0,
                displayAmount: userShare,
                isPaymentRecord: true,
                isSettled: true,
                note: `✓ ชำระแล้ว: ${bill.name}`,
                date: new Date().toISOString().split('T')[0],
                createdAt: Date.now()
              });
            } else if (!newPaidStatus) {
              const matchedAdjs = adjustments.filter(a => a.billId === bill.id && a.friendName.toLowerCase() === matchedKey.toLowerCase());
              matchedAdjs.forEach(adj => {
                const adjRef = basePath.collection('adjustments').doc(adj.id);
                batch.delete(adjRef);
              });
            }

            await batch.commit();
            showToast(`Updated ${matchedKey} to ${newPaidStatus ? 'Paid' : 'Pending'}`);
          } catch (err) {
            showToast("Update failed", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      const filteredBills = useMemo(() => {
        const term = searchQuery.trim().toLowerCase();
        return bills.filter(bill => {
          const matchTitle = (bill.name || '').toLowerCase().includes(term);
          const matchRoute = (bill.rideRoute || '').toLowerCase().includes(term);
          if (term && !matchTitle && !matchRoute) return false;

          const unpaidCount = Object.keys(bill.splits || {}).filter(n => {
            const fObj = friends.find(f => f.name.toLowerCase() === n.toLowerCase());
            return !(fObj?.isSelf) && !bill.paidStatus?.[n];
          }).length;

          if (statusFilter === 'pending') return unpaidCount > 0;
          if (statusFilter === 'settled') return unpaidCount === 0;
          return true;
        });
      }, [bills, searchQuery, statusFilter, friends]);

      const totalOwedAmount = Object.keys(friendBalances).reduce((acc, name) => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || /me|dom/i.test(name);
        if (!isMe) return acc + Math.max(0, friendBalances[name].totalOwed);
        return acc;
      }, 0);

      const pendingDebtorsCount = Object.keys(friendBalances).filter(name => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || /me|dom/i.test(name);
        return !isMe && friendBalances[name].totalOwed > 0;
      }).length;

      const receivableCount = Object.keys(friendBalances).filter(name => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || /me|dom/i.test(name);
        return !isMe && friendBalances[name].totalOwed > 0;
      }).length;

      const payableCount = Object.keys(friendBalances).filter(name => {
        const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
        const isMe = fObj?.isSelf || /me|dom/i.test(name);
        return !isMe && friendBalances[name].totalOwed < 0;
      }).length;

      const unsettledFriendList = useMemo(() => {
        return friends.filter(f => {
          const isMe = f.isSelf || /me|dom/i.test(f.name);
          const bal = friendBalances[f.name]?.totalOwed || 0;
          if (isMe || bal === 0) return false;
          if (dashboardDebtFilter === 'receivable') return bal > 0;
          if (dashboardDebtFilter === 'payable') return bal < 0;
          return true;
        });
      }, [friends, friendBalances, dashboardDebtFilter]);

      return (
        <div className="min-h-screen">
          {/* Header Mobile */}
          <header className="bg-surface/90 border-b border-line sticky top-0 z-30 backdrop-blur-lg px-4 py-3">
            <div className="max-w-md mx-auto flex justify-between items-center">
              <div className="flex items-center gap-2.5">
                <img 
                  src="cat.jpg" 
                  alt="Pilot Cat" 
                  className="w-8 h-8 rounded-xl object-cover ring-2 ring-coral/40"
                  onError={(e) => { e.target.style.display='none'; }}
                />
                <div className="flex flex-col">
                  <span className="leading-none font-black tracking-wide text-base bg-gradient-to-r from-textPrimary via-coral to-amber bg-clip-text text-transparent">
                    {t('appTitle')}
                  </span>
                  <span className="text-[9px] text-coral font-bold tracking-widest uppercase mt-0.5">
                    Mobile App 🔥
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={handleLangToggle}
                  className="bg-subtle border border-line text-xs font-bold px-2 py-1 rounded-lg"
                >
                  {lang === 'en' ? '🇹🇭' : '🇬🇧'}
                </button>

                {isAdmin ? (
                  <button 
                    onClick={handleLogoutAdmin}
                    className="bg-subtle text-textSecondary border border-line p-1.5 rounded-lg text-xs"
                    title="Lock Admin Mode"
                  >
                    🔒
                  </button>
                ) : (
                  <button 
                    onClick={() => setShowAuthModal(true)}
                    className="bg-accent/15 text-accent border border-accent/40 font-bold px-2.5 py-1 rounded-lg text-xs"
                  >
                    {t('adminSignIn')}
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="max-w-md mx-auto px-4 mt-4 space-y-4">
            
            {/* 1. DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-surface border border-coral/30 bg-gradient-to-br from-coral-subtle/30 to-surface p-4 rounded-2xl">
                    <p className="text-[10px] text-coral font-bold uppercase font-mono">{t('totalOutstanding')}</p>
                    <p className="text-2xl font-black text-coral mt-1 font-mono tabular">{totalOwedAmount.toFixed(2)} <span className="text-xs font-sans">RM</span></p>
                    <p className="text-[10px] text-textSecondary mt-0.5">{t('pendingFriends', { n: pendingDebtorsCount })}</p>
                  </div>

                  <div className="bg-surface border border-mint/30 bg-gradient-to-br from-mint-subtle/30 to-surface p-4 rounded-2xl">
                    <p className="text-[10px] text-mint font-bold uppercase font-mono">{t('myExpenseToday')}</p>
                    <p className="text-2xl font-black text-mint mt-1 font-mono tabular">{todayMyExpense.toFixed(2)} <span className="text-xs font-sans">RM</span></p>
                    <p className="text-[10px] text-textSecondary mt-0.5">{t('calculatedToday', { n: todayBillsCount })}</p>
                  </div>
                </div>

                <div className="bg-surface rounded-2xl p-4 border border-line space-y-3">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xs font-bold text-textMuted uppercase font-mono">{t('unsettledFriends')}</h2>
                    <div className="flex bg-subtle p-1 rounded-xl border border-line gap-1 text-[11px]">
                      <button
                        onClick={() => setDashboardDebtFilter('all')}
                        className={`px-2 py-0.5 rounded-lg font-semibold ${dashboardDebtFilter === 'all' ? 'bg-accent text-white' : 'text-textSecondary'}`}
                      >
                        All ({receivableCount + payableCount})
                      </button>
                      <button
                        onClick={() => setDashboardDebtFilter('receivable')}
                        className={`px-2 py-0.5 rounded-lg font-semibold ${dashboardDebtFilter === 'receivable' ? 'bg-coral text-white' : 'text-textSecondary'}`}
                      >
                        + {receivableCount}
                      </button>
                      <button
                        onClick={() => setDashboardDebtFilter('payable')}
                        className={`px-2 py-0.5 rounded-lg font-semibold ${dashboardDebtFilter === 'payable' ? 'bg-mint text-bg font-bold' : 'text-textSecondary'}`}
                      >
                        - {payableCount}
                      </button>
                    </div>
                  </div>

                  <div className="space-y-2.5">
                    {unsettledFriendList.length === 0 ? (
                      <div className="py-8 text-center text-textMuted text-xs">{t('allSettled')}</div>
                    ) : (
                      unsettledFriendList.map(friend => {
                        const balance = friendBalances[friend.name] || { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
                        const isDebtor = balance.totalOwed > 0;

                        return (
                          <div key={friend.id} className="bg-subtle border border-line/80 p-3.5 rounded-xl flex justify-between items-center">
                            <div className="cursor-pointer flex-1 pr-2" onClick={() => setSelectedFriendForHistory(friend.name)}>
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="font-bold text-textPrimary text-sm">{friend.name}</span>
                                <span className={`text-[10px] px-1.5 py-0.2 rounded font-mono ${isDebtor ? 'text-coral bg-coral-subtle/50' : 'text-mint bg-mint-subtle/50'}`}>
                                  {isDebtor ? 'ค้างเรา' : 'เราค้าง'}
                                </span>
                              </div>
                              <div className="text-[11px] text-textSecondary font-mono mt-0.5">
                                {t('bills')}: {balance.billsOwed.toFixed(2)} RM
                              </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                              <span className={`text-base font-black font-mono tabular ${isDebtor ? 'text-coral' : 'text-mint'}`}>
                                {Math.abs(balance.totalOwed).toFixed(2)} RM
                              </span>
                              
                              {isAdmin && (
                                <button
                                  onClick={() => { setSelectedFriendForAdjust(friend.name); setAdjustAmount(''); }}
                                  className="bg-surface active:bg-line text-textPrimary text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-line"
                                >
                                  {t('adjust')}
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* 2. BILL FORM */}
            {activeTab === 'new-bill' && (
              isAdmin ? (
                <form onSubmit={handleSaveBill} className="bg-surface rounded-2xl p-5 border border-line space-y-4">
                  <div className="flex justify-between items-center pb-2 border-b border-line">
                    <h2 className="text-base font-bold text-textPrimary">{editingBillId ? t('editTx') : t('createTx')}</h2>
                    <button type="button" onClick={() => setActiveTab('bills')} className="text-textSecondary text-xs">✕</button>
                  </div>

                  <div className="grid grid-cols-4 gap-1.5">
                    {['delivery', 'ride', 'dinein', 'loan'].map(type => (
                      <button
                        key={type}
                        type="button"
                        onClick={() => {
                          setBillType(type);
                          if (type === 'delivery') { setTaxMode('inclusive'); setServiceChargeRate(0); }
                          if (type === 'dinein') { setTaxMode('addon'); setDeliveryFee(0); setPackagingCharge(0); }
                        }}
                        className={`py-2 rounded-xl text-xs font-bold border capitalize ${billType === type ? 'bg-accent text-white border-accent' : 'bg-subtle border-line text-textSecondary'}`}
                      >
                        {type === 'delivery' ? '🛵 Food' : type === 'ride' ? '🚗 Ride' : type === 'dinein' ? '🍽️ Dine' : '💸 Loan'}
                      </button>
                    ))}
                  </div>

                  {billType !== 'loan' && (
                    <div className="bg-subtle p-3 rounded-xl border border-line space-y-2">
                      <label className="block text-xs font-bold text-textPrimary">{t('paidByLabel')}</label>
                      <div className="flex flex-wrap gap-1.5">
                        {friends.filter(f => !f.isArchived).map(f => (
                          <button
                            key={f.id}
                            type="button"
                            onClick={() => setPaidBy(f.name)}
                            className={`px-3 py-1 rounded-lg text-xs font-bold ${paidBy.toLowerCase() === f.name.toLowerCase() ? 'bg-mint text-bg' : 'bg-surface text-textSecondary border border-line'}`}
                          >
                            {f.name}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="space-y-3">
                    <input 
                      type="text" 
                      value={newBillName}
                      onChange={(e) => setNewBillName(e.target.value)}
                      className="w-full bg-subtle border border-line rounded-xl px-3.5 py-2.5 text-textPrimary text-sm outline-none"
                      placeholder="ชื่อรายการ / ร้านอาหาร / จุดหมาย"
                      required
                    />
                    <input 
                      type="date" 
                      value={newBillDate}
                      onChange={(e) => setNewBillDate(e.target.value)}
                      className="w-full bg-subtle border border-line rounded-xl px-3.5 py-2 text-textPrimary text-xs outline-none"
                    />
                  </div>

                  {billType === 'loan' ? (
                    <div className="bg-subtle p-3.5 rounded-xl border border-coral/30 space-y-3">
                      <select
                        value={loanBorrower}
                        onChange={(e) => setLoanBorrower(e.target.value)}
                        className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-sm text-textPrimary outline-none"
                        required
                      >
                        <option value="">-- เลือกผู้ยืม --</option>
                        {friends.filter(f => !f.isSelf && !f.isArchived).map(f => (
                          <option key={f.id} value={f.name}>{f.name}</option>
                        ))}
                      </select>
                      <input 
                        type="text" 
                        inputMode="decimal"
                        value={loanAmount}
                        onChange={(e) => setLoanAmount(e.target.value)}
                        onBlur={(e) => setLoanAmount(evaluateMathExpression(e.target.value))}
                        className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-sm text-textPrimary font-mono font-bold"
                        placeholder="จำนวนเงิน (RM)"
                        required
                      />
                    </div>
                  ) : billType === 'ride' ? (
                    <div className="bg-subtle p-3.5 rounded-xl border border-bolt/30 space-y-3">
                      <div className="grid grid-cols-2 gap-2">
                        <input 
                          type="text" 
                          inputMode="decimal"
                          value={rideFare}
                          onChange={(e) => setRideFare(e.target.value)}
                          onBlur={(e) => setRideFare(evaluateMathExpression(e.target.value))}
                          className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-sm text-textPrimary font-mono"
                          placeholder="ค่าโดยสาร (RM)"
                          required
                        />
                        <input 
                          type="text" 
                          inputMode="decimal"
                          value={tollFee}
                          onChange={(e) => setTollFee(e.target.value)}
                          onBlur={(e) => setTollFee(evaluateMathExpression(e.target.value))}
                          className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-sm text-textPrimary font-mono"
                          placeholder="ค่าทางด่วน (RM)"
                        />
                      </div>
                      <input 
                        type="text" 
                        value={rideRoute}
                        onChange={(e) => setRideRoute(e.target.value)}
                        className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-xs text-textPrimary"
                        placeholder="เส้นทาง (เช่น Pavilion -> KLCC)"
                      />
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div className="grid grid-cols-3 gap-2">
                        <input 
                          type="text" 
                          inputMode="decimal"
                          value={deliveryFee}
                          onChange={(e) => setDeliveryFee(e.target.value)}
                          className="w-full bg-subtle border border-line rounded-xl px-2.5 py-1.5 text-xs text-textPrimary font-mono"
                          placeholder="ค่าส่ง"
                        />
                        <input 
                          type="text" 
                          inputMode="decimal"
                          value={packagingCharge}
                          onChange={(e) => setPackagingCharge(e.target.value)}
                          className="w-full bg-subtle border border-line rounded-xl px-2.5 py-1.5 text-xs text-textPrimary font-mono"
                          placeholder="กล่อง/ห่อ"
                        />
                        <input 
                          type="text" 
                          inputMode="decimal"
                          value={discountAmount}
                          onChange={(e) => setDiscountAmount(e.target.value)}
                          className="w-full bg-subtle border border-line rounded-xl px-2.5 py-1.5 text-xs text-textPrimary font-mono"
                          placeholder="ส่วนลด"
                        />
                      </div>

                      <div className="space-y-2">
                        <div className="flex justify-between items-center">
                          <label className="text-xs font-bold text-textSecondary">เมนูอาหาร</label>
                          <button
                            type="button"
                            onClick={() => setBillItems([...billItems, { id: Date.now().toString(), name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }])}
                            className="text-xs text-accent font-bold"
                          >
                            + เพิ่มเมนู
                          </button>
                        </div>
                        {billItems.map(item => (
                          <div key={item.id} className="bg-subtle p-3 rounded-xl border border-line space-y-2">
                            <div className="flex gap-2">
                              <input
                                type="text"
                                value={item.name}
                                onChange={(e) => setBillItems(billItems.map(bi => bi.id === item.id ? { ...bi, name: e.target.value } : bi))}
                                className="flex-1 bg-surface border border-line rounded-lg px-2.5 py-1.5 text-xs"
                                placeholder="ชื่อเมนู"
                                required
                              />
                              <input
                                type="text"
                                inputMode="decimal"
                                value={item.price}
                                onChange={(e) => setBillItems(billItems.map(bi => bi.id === item.id ? { ...bi, price: e.target.value } : bi))}
                                className="w-20 bg-surface border border-line rounded-lg px-2.5 py-1.5 text-xs font-mono"
                                placeholder="ราคา"
                                required
                              />
                            </div>
                            <div className="flex flex-wrap gap-1">
                              {billFriends.map(fName => {
                                const isShared = (item.sharedWith || []).includes(fName);
                                return (
                                  <button
                                    key={fName}
                                    type="button"
                                    onClick={() => {
                                      const nextShared = isShared ? item.sharedWith.filter(sn => sn !== fName) : [...item.sharedWith, fName];
                                      setBillItems(billItems.map(bi => bi.id === item.id ? { ...bi, sharedWith: nextShared } : bi));
                                    }}
                                    className={`px-2 py-0.5 rounded text-[10px] ${isShared ? 'bg-mint text-bg font-bold' : 'bg-surface text-textSecondary'}`}
                                  >
                                    {fName}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {billType !== 'loan' && (
                    <div>
                      <label className="block text-xs font-bold text-textSecondary mb-1.5">คนร่วมหาร ({billFriends.length})</label>
                      <div className="flex flex-wrap gap-1.5">
                        {friends.filter(f => !f.isArchived).map(f => {
                          const isSel = billFriends.includes(f.name);
                          return (
                            <button
                              key={f.id}
                              type="button"
                              onClick={() => setBillFriends(isSel ? billFriends.filter(n => n !== f.name) : [...billFriends, f.name])}
                              className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${isSel ? 'bg-accent text-white' : 'bg-subtle text-textSecondary'}`}
                            >
                              {isSel ? '✓ ' : '+ '} {f.name}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  <button type="submit" disabled={isProcessing} className="w-full bg-mint hover:bg-emerald-600 text-bg font-bold py-3 rounded-xl transition text-sm shadow-md">
                    {isProcessing ? 'กำลังบันทึก...' : t('save')}
                  </button>
                </form>
              ) : (
                <div className="bg-surface rounded-2xl p-8 border border-line text-center space-y-3">
                  <p className="text-coral text-base font-bold">🔒 Viewer Mode</p>
                  <button onClick={() => setShowAuthModal(true)} className="bg-accent text-white font-bold px-4 py-2 rounded-xl text-xs">
                    {t('adminSignIn')}
                  </button>
                </div>
              )
            )}

            {/* 3. BILL HISTORY */}
            {activeTab === 'bills' && (
              <div className="space-y-3">
                <input 
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder={t('searchPlaceholder')}
                  className="w-full bg-surface border border-line rounded-xl px-3 py-2 text-xs outline-none"
                />

                <div className="space-y-2.5">
                  {filteredBills.map(bill => {
                    const isCollapsed = viewingBillId === bill.id;
                    const unpaidCount = Object.keys(bill.splits || {}).filter(n => {
                      const fObj = friends.find(f => f.name.toLowerCase() === n.toLowerCase());
                      return !fObj?.isSelf && !bill.paidStatus?.[n];
                    }).length;

                    return (
                      <div 
                        key={bill.id}
                        onClick={() => setViewingBillId(isCollapsed ? null : bill.id)}
                        className="bg-surface border border-line p-3.5 rounded-xl space-y-2"
                      >
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-[10px] text-textMuted font-mono">{bill.date}</span>
                            <h3 className="font-bold text-sm text-textPrimary">{bill.name}</h3>
                          </div>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${unpaidCount === 0 ? 'bg-mint/15 text-mint' : 'bg-coral/15 text-coral'}`}>
                            {unpaidCount === 0 ? '✓ เคลียร์แล้ว' : `รอ ${unpaidCount} คน`}
                          </span>
                        </div>

                        <div className="flex justify-between text-xs font-mono">
                          <span className="text-textMuted">ยอดสุทธิ:</span>
                          <span className="font-bold text-mint">{bill.total?.toFixed(2)} RM</span>
                        </div>

                        {isCollapsed && (
                          <div className="pt-2 border-t border-line space-y-2" onClick={e => e.stopPropagation()}>
                            {Object.keys(bill.splits || {}).map(fName => (
                              <div key={fName} className="flex justify-between items-center text-xs">
                                <span>{fName} ({bill.splits[fName]?.toFixed(2)} RM)</span>
                                {isAdmin ? (
                                  <button
                                    onClick={() => handleTogglePaid(bill, fName)}
                                    className={`px-2 py-0.5 rounded text-[10px] font-bold ${bill.paidStatus?.[fName] ? 'bg-mint text-bg' : 'bg-coral text-white'}`}
                                  >
                                    {bill.paidStatus?.[fName] ? 'จ่ายแล้ว' : 'ค้าง'}
                                  </button>
                                ) : (
                                  <span className={`text-[10px] font-bold ${bill.paidStatus?.[fName] ? 'text-mint' : 'text-coral'}`}>
                                    {bill.paidStatus?.[fName] ? 'จ่ายแล้ว' : 'ค้าง'}
                                  </span>
                                )}
                              </div>
                            ))}

                            {isAdmin && (
                              <div className="flex justify-between pt-2 border-t border-line">
                                <button onClick={() => handleStartEditBill(bill)} className="text-accent text-xs">แก้ไข</button>
                                <button onClick={() => handleDeleteBill(bill.id)} className="text-coral text-xs">ลบ</button>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 4. FRIENDS */}
            {activeTab === 'friends' && (
              <div className="space-y-4">
                {isAdmin && (
                  <form onSubmit={handleAddFriend} className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder={t('friendNamePlaceholder')}
                      value={newFriendName}
                      onChange={(e) => setNewFriendName(e.target.value)}
                      className="flex-1 bg-surface border border-line rounded-xl px-3 py-2 text-xs outline-none"
                    />
                    <button type="submit" className="bg-accent text-white font-bold px-4 py-2 rounded-xl text-xs">เพิ่ม</button>
                  </form>
                )}

                <div className="bg-surface rounded-2xl p-4 border border-line divide-y divide-line">
                  {friends.filter(f => showArchivedFriends ? true : !f.isArchived).map(friend => (
                    <div key={friend.id} className="py-2.5 first:pt-0 last:pb-0 flex justify-between items-center text-xs">
                      <div>
                        <span className="font-bold">{friend.name}</span>
                        {friend.isSelf && <span className="ml-1 text-[9px] bg-accent/20 text-accent px-1.5 py-0.2 rounded">Me</span>}
                      </div>
                      {!friend.isSelf && (
                        <div className="flex gap-1.5">
                          <button onClick={() => setSelectedFriendForHistory(friend.name)} className="bg-subtle px-2 py-1 rounded">Statement</button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 5. ANALYTICS */}
            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <div className="bg-surface rounded-2xl p-4 border border-line space-y-3">
                  <div className="flex justify-between items-center pb-2 border-b border-line">
                    <h2 className="text-sm font-bold">📊 {t('analyticsTitle')}</h2>
                    <input 
                      type="month"
                      value={selectedMonth}
                      onChange={(e) => setSelectedMonth(e.target.value)}
                      className="bg-subtle border border-line rounded-lg px-2 py-1 text-xs"
                    />
                  </div>

                  <div className="pt-2 border-t border-line space-y-2">
                    <p className="text-xs font-bold">สำรองข้อมูล</p>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={handleExportJSONBackup} className="bg-subtle border border-line py-2 rounded-xl text-xs font-bold">JSON</button>
                      <button onClick={handleExportCSVReport} className="bg-subtle border border-line py-2 rounded-xl text-xs font-bold">CSV</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* BOTTOM SHEET: STATEMENT */}
          {selectedFriendForHistory && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end"
              onClick={() => setSelectedFriendForHistory(null)}
            >
              <div 
                className="bg-surface border-t border-line rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom"
                onClick={e => e.stopPropagation()}
              >
                <div className="w-10 h-1 bg-line rounded-full mx-auto mt-3 mb-1"></div>

                <div className="p-4 border-b border-line flex justify-between items-center">
                  <h3 className="font-bold text-sm">Statement: {selectedFriendForHistory}</h3>
                  <button onClick={() => setSelectedFriendForHistory(null)} className="text-textSecondary text-xs">ปิด ✕</button>
                </div>

                <div className="p-4 overflow-y-auto space-y-3 flex-1">
                  <div ref={friendSlipRef} className="bg-[#0B0F17] p-4 rounded-xl border border-line/60 font-mono text-xs space-y-3">
                    <div className="text-center pb-2 border-b border-line space-y-0.5">
                      <p className="font-bold text-sm font-sans">{selectedFriendForHistory}</p>
                      <p className={`text-base font-black ${(friendBalances[selectedFriendForHistory]?.totalOwed || 0) > 0 ? 'text-coral' : 'text-mint'}`}>
                        {(friendBalances[selectedFriendForHistory]?.totalOwed || 0).toFixed(2)} RM
                      </p>
                    </div>

                    <div className="space-y-1.5">
                      {getFriendHistory(selectedFriendForHistory).bills.map(b => (
                        <div key={b.id} className="flex justify-between text-[11px]">
                          <span className="truncate pr-2">{b.name}</span>
                          <span className="font-bold tabular">{b.splits[selectedFriendForHistory]?.toFixed(2)} RM</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-3 border-t border-line bg-surface grid grid-cols-2 gap-2">
                  <button onClick={() => handleExportElement(friendSlipRef, `Statement_${selectedFriendForHistory}`)} className="bg-accent text-white font-bold py-2 rounded-xl text-xs">รูป PNG</button>
                  <button onClick={() => handleExportPDF(friendSlipRef, `Statement_${selectedFriendForHistory}`)} className="bg-coral text-white font-bold py-2 rounded-xl text-xs">PDF</button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM SHEET: ADJUST */}
          {selectedFriendForAdjust && isAdmin && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end"
              onClick={() => setSelectedFriendForAdjust(null)}
            >
              <form 
                onSubmit={handleSaveAdjustment}
                className="bg-surface border-t border-line rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl p-5 space-y-4"
                onClick={e => e.stopPropagation()}
              >
                <div className="w-10 h-1 bg-line rounded-full mx-auto -mt-2 mb-1"></div>

                <div className="flex justify-between items-center pb-2 border-b border-line">
                  <h3 className="font-bold text-sm">ปรับยอด: {selectedFriendForAdjust}</h3>
                  <button type="button" onClick={() => setSelectedFriendForAdjust(null)} className="text-textSecondary text-xs">ปิด ✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2 bg-subtle p-1 rounded-xl">
                  <button
                    type="button"
                    onClick={() => setAdjustType('minus')}
                    className={`py-2 text-xs font-bold rounded-lg ${adjustType === 'minus' ? 'bg-mint text-bg' : 'text-textSecondary'}`}
                  >
                    หักลบยอด (-)
                  </button>
                  <button
                    type="button"
                    onClick={() => setAdjustType('plus')}
                    className={`py-2 text-xs font-bold rounded-lg ${adjustType === 'plus' ? 'bg-coral text-white' : 'text-textSecondary'}`}
                  >
                    เพิ่มหนี้ (+)
                  </button>
                </div>

                <input 
                  type="text"
                  inputMode="decimal"
                  placeholder="จำนวนเงิน (RM)"
                  value={adjustAmount}
                  onChange={(e) => setAdjustAmount(e.target.value)}
                  onBlur={(e) => setAdjustAmount(evaluateMathExpression(e.target.value))}
                  className="w-full bg-subtle border border-line rounded-xl px-3 py-2 text-sm font-mono outline-none"
                  required
                />

                <input 
                  type="text"
                  placeholder="หมายเหตุ"
                  value={adjustNote}
                  onChange={(e) => setAdjustNote(e.target.value)}
                  className="w-full bg-subtle border border-line rounded-xl px-3 py-2 text-xs outline-none"
                />

                <div className="space-y-2 pt-2">
                  <button type="submit" disabled={isProcessing} className="w-full bg-accent text-white font-bold py-2.5 rounded-xl text-xs">
                    บันทึกรายการ
                  </button>
                  {friendBalances[selectedFriendForAdjust]?.totalOwed > 0 && (
                    <button
                      type="button"
                      disabled={isProcessing}
                      onClick={() => handleSettleFullWithBatch(selectedFriendForAdjust)}
                      className="w-full bg-mint/15 text-mint border border-mint/40 font-bold py-2 rounded-xl text-xs"
                    >
                      ⚡ เคลียร์บิลทั้งหมด ({friendBalances[selectedFriendForAdjust]?.totalOwed.toFixed(2)} RM)
                    </button>
                  )}
                </div>
              </form>
            </div>
          )}

          {/* FLOATING CAPSULE NAVIGATION BAR (iOS / Instagram Style) */}
          <div className="fixed bottom-5 left-0 right-0 z-40 flex justify-center pointer-events-none px-4 pb-safe">
            <nav className="pointer-events-auto bg-surface/85 backdrop-blur-2xl border border-line/80 shadow-[0_12px_40px_rgba(0,0,0,0.6)] rounded-full p-1.5 flex items-center gap-1">
              
              {/* Dashboard */}
              <button 
                onClick={() => setActiveTab('dashboard')} 
                className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center justify-center ${
                  activeTab === 'dashboard' 
                    ? 'bg-textPrimary text-bg shadow-md scale-105' 
                    : 'text-textSecondary hover:text-textPrimary active:scale-95'
                }`}
              >
                <span className="text-lg leading-none">📊</span>
              </button>

              {/* Bills History */}
              <button 
                onClick={() => setActiveTab('bills')} 
                className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center justify-center ${
                  activeTab === 'bills' 
                    ? 'bg-textPrimary text-bg shadow-md scale-105' 
                    : 'text-textSecondary hover:text-textPrimary active:scale-95'
                }`}
              >
                <span className="text-lg leading-none">🧾</span>
              </button>

              {/* Central Primary Action Button */}
              {isAdmin && (
                <button 
                  onClick={() => {
                    setEditingBillId(null);
                    setNewBillName('');
                    setBillFriends(friends.filter(f => !f.isArchived).map(f => f.name));
                    setActiveTab('new-bill');
                  }}
                  className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center justify-center active:scale-90 ${
                    activeTab === 'new-bill'
                      ? 'bg-accent text-white shadow-lg shadow-accent/40 scale-105'
                      : 'bg-accent/20 hover:bg-accent text-accent hover:text-white'
                  }`}
                >
                  <span className="text-xl leading-none font-black">+</span>
                </button>
              )}

              {/* Friends */}
              <button 
                onClick={() => setActiveTab('friends')} 
                className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center justify-center ${
                  activeTab === 'friends' 
                    ? 'bg-textPrimary text-bg shadow-md scale-105' 
                    : 'text-textSecondary hover:text-textPrimary active:scale-95'
                }`}
              >
                <span className="text-lg leading-none">👥</span>
              </button>

              {/* Analytics */}
              <button 
                onClick={() => setActiveTab('analytics')} 
                className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center justify-center ${
                  activeTab === 'analytics' 
                    ? 'bg-textPrimary text-bg shadow-md scale-105' 
                    : 'text-textSecondary hover:text-textPrimary active:scale-95'
                }`}
              >
                <span className="text-lg leading-none">📈</span>
              </button>
              
            </nav>
          </div>

          {/* PIN AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowAuthModal(false)}>
              <div className="bg-surface border border-line rounded-3xl p-6 w-full max-w-xs space-y-4" onClick={e => e.stopPropagation()}>
                <h3 className="font-bold text-center text-sm">{t('adminSignIn')}</h3>
                <button onClick={handleGoogleLogin} className="w-full bg-subtle border border-line py-2 rounded-xl text-xs font-bold">Google Sign-in</button>
                <form onSubmit={handleVerifyPin} className="space-y-2">
                  <input 
                    type="password"
                    pattern="[0-9]*"
                    inputMode="numeric"
                    maxLength="6"
                    placeholder="PIN"
                    value={inputPin}
                    onChange={(e) => setInputPin(e.target.value)}
                    className="w-full bg-subtle border border-line rounded-xl py-2 text-center font-mono outline-none"
                  />
                  <button type="submit" className="w-full bg-accent text-white font-bold py-2 rounded-xl text-xs">Unlock</button>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-4 left-4 right-4 max-w-xs mx-auto z-50 text-center py-2 px-4 rounded-xl text-xs shadow-xl font-bold ${toast.type === 'error' ? 'bg-coral text-white' : 'bg-mint text-bg'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
