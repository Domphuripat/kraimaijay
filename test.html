    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }

      const handleExportPDF = async (ref, filename) => {
        if (!ref.current) return;
        try {
          showToast("Generating PDF document...");
          const canvas = await html2canvas(ref.current, {
            scale: 2,
            backgroundColor: '#0B0F17'
          });
          const imgData = canvas.toDataURL('image/png');
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const imgWidth = 210;
          const pageHeight = 297;
          const imgHeight = (canvas.height * imgWidth) / canvas.width;

          let heightLeft = imgHeight;
          let position = 0;

          pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;

          while (heightLeft > 0) {
            position = heightLeft - imgHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;
          }

          pdf.save(`${filename}.pdf`);
          showToast("PDF Downloaded successfully!");
        } catch (err) {
          console.error(err);
          showToast("Failed to generate PDF", "error");

      const handleExportElement = async (ref, filename) => {

      };

      const parseTextContent = (fullText) => {
        const lines = fullText.split('\n').map(l => l.trim()).filter(Boolean);
        let extractedItems = [];
        let rFare = 0;
        let tFee = 0;
        let dFee = 0;
        let pCharge = 0;
        let dAmount = 0;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          if (/delivery\s*fee|rider|driver/i.test(line)) {
            const matches = line.match(/(?:RM\s*)?([0-9]+\.[0-9]{2})/gi);
            if (matches && matches.length > 0) dFee = parseFloat(matches[0].replace(/RM\s*/i, ''));
            continue;
          }

          if (/packaging|packing|box|takeaway/i.test(line)) {
            const matches = line.match(/(?:RM\s*)?([0-9]+\.[0-9]{2})/gi);
            if (matches && matches.length > 0) pCharge = parseFloat(matches[0].replace(/RM\s*/i, ''));
            continue;
          }

          if (/off|discount|promo|voucher/i.test(line)) {
            const matches = line.match(/[-−]?\s*(?:RM\s*)?([0-9]+(?:\.[0-9]{2})?)/gi);
            if (matches && matches.length > 0) {
              const candidate = matches[matches.length - 1].replace(/[-−\sRM]/gi, '');
              dAmount = parseFloat(candidate);
            }
            continue;
          }

          if (/toll|expressway|highway/i.test(line)) {
            const matches = line.match(/(?:RM\s*)?([0-9]+\.[0-9]{2})/i);
            if (matches) tFee = parseFloat(matches[1]);
            continue;
          }

          const isNoise = /subtotal|total\s*\(|incl\.\s*tax|tax\b|service|visa|mastercard|grabcoins|order summary|note to driver|reorder|contact|profile|cutlery/i.test(line);
          if (isNoise) continue;

          const priceMatch = line.match(/(.+?)\s+(?:RM\s*)?([0-9]+\.[0-9]{2})$/i);
          if (priceMatch) {
            const itemName = priceMatch[1].replace(/^[0-9]+x?\s*/i, '').trim();
            const itemPrice = parseFloat(priceMatch[2]);

            let itemQty = 1;
            if (i + 1 < lines.length && /^[0-9]+x$/i.test(lines[i + 1])) {
              itemQty = parseInt(lines[i + 1]) || 1;
            } else if (i + 2 < lines.length && /^[0-9]+x$/i.test(lines[i + 2])) {
              itemQty = parseInt(lines[i + 2]) || 1;
            }

            if (itemPrice > 0 && itemName.length >= 2) {
              const exists = extractedItems.some(it => it.name.toLowerCase() === itemName.toLowerCase());
              if (!exists) {
                extractedItems.push({
                  id: Date.now().toString() + Math.random().toString(36).substring(2, 7),
                  name: itemName,
                  price: itemPrice.toFixed(2),
                  qty: itemQty,
                  taxRate: 0,
                  sharedWith: [...billFriends]
                });
              }
            }
          }
        }

        return { extractedItems, rFare, tFee, dFee, pCharge, dAmount };
      };

      const handleAddImages = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;

      const handleRemoveImage = (index) => {

      const handleProcessAllImages = async () => {
        if (!selectedImages.length) return;
        setOcrProcessing(true);
        setOcrProgress(0);

        let combinedExtractedItems = [];
        let extractedRideFare = 0;
        let detectedToll = 0;
        let detectedDiscount = 0;
        let detectedDelivery = 0;
        let detectedPackaging = 0;

        try {
          for (let i = 0; i < selectedImages.length; i++) {
            const file = selectedImages[i];
            const { data: { text } } = await Tesseract.recognize(
              file,
              'eng+tha',
              {
                logger: m => {
                  if (m.status === 'recognizing text') {
                    const singleProgress = m.progress || 0;
                    const overall = Math.round(((i + singleProgress) / selectedImages.length) * 100);
                    setOcrProgress(overall);
                  }
                }
              }
            );

            const parsed = parseTextContent(text);
            parsed.extractedItems.forEach(item => {
              if (!combinedExtractedItems.some(ci => ci.name.toLowerCase() === item.name.toLowerCase())) {
                combinedExtractedItems.push(item);
              }
            });

            if (parsed.dFee) detectedDelivery = parsed.dFee;
            if (parsed.pCharge) detectedPackaging = parsed.pCharge;
            if (parsed.dAmount) detectedDiscount = parsed.dAmount;
            if (parsed.tFee) detectedToll = parsed.tFee;

            if (billType === 'ride') {
              const prices = text.split('\n').map(l => {
                const m = l.match(/(?:RM\s*)?([0-9]+\.[0-9]{2})/i);
                return m ? parseFloat(m[1]) : 0;
              }).filter(p => p > 0);
              if (prices.length > 0) extractedRideFare = Math.max(extractedRideFare, ...prices);
            }
          }

          if (billType === 'ride' && extractedRideFare > 0) {
            setRideFare(extractedRideFare);
            if (detectedToll) setTollFee(detectedToll);
            if (detectedDiscount) setDiscountAmount(detectedDiscount);
            showToast("Ride fare scanned successfully");
          } else if (combinedExtractedItems.length > 0 || detectedDelivery > 0 || detectedPackaging > 0 || detectedDiscount > 0) {
            if (combinedExtractedItems.length > 0) setBillItems(combinedExtractedItems);
            if (detectedPackaging) setPackagingCharge(detectedPackaging);
            if (detectedDelivery) setDeliveryFee(detectedDelivery);
            if (detectedDiscount) setDiscountAmount(detectedDiscount);
            showToast(`Scanned successfully (${combinedExtractedItems.length} items)! 🎉`);
          } else {
            showToast("OCR couldn't extract items. Use 'Paste Text' button!", "error");
          }
        } catch (err) {
          showToast("OCR scanning error", "error");
        } finally {
          setOcrProcessing(false);
          setSelectedImages([]);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      const handleParseRawText = () => {
        if (!rawOrderText.trim()) return;
        const parsed = parseTextContent(rawOrderText);
        if (parsed.extractedItems.length > 0 || parsed.dFee || parsed.pCharge || parsed.dAmount) {
          if (parsed.extractedItems.length > 0) setBillItems(parsed.extractedItems);
          if (parsed.dFee) setDeliveryFee(parsed.dFee);
          if (parsed.pCharge) setPackagingCharge(parsed.pCharge);
          if (parsed.dAmount) setDiscountAmount(parsed.dAmount);
          showToast(`Parsed ${parsed.extractedItems.length} items from text! 🎉`);
          setShowRawTextInput(false);
          setRawOrderText('');
        } else {
          showToast("No clear items detected from text", "error");
        }
      };

      const calculateBillSplits = (items, scRate, dFee, packCharge, discount, roundAdj, selectedFriends, currentTaxMode, currentBillType, rFare, tFee) => {
        const splits = {};
        const friendItemDetails = {};
        const activeFriendsCount = selectedFriends.length;

        if (currentBillType === 'ride') {
          const parsedRideFare = parseFloat(rFare) || 0;
          const parsedToll = parseFloat(tFee) || 0;
          const parsedDiscount = parseFloat(discount) || 0;
          const parsedRoundAdj = parseFloat(roundAdj) || 0;
          
          const netTotal = Math.max(0, parsedRideFare + parsedToll - parsedDiscount + parsedRoundAdj);
          const totalCents = Math.round(netTotal * 100);
          const baseCents = activeFriendsCount > 0 ? Math.floor(totalCents / activeFriendsCount) : 0;
          let remainderCents = activeFriendsCount > 0 ? (totalCents % activeFriendsCount) : 0;

          selectedFriends.forEach(f => {
            const shareCents = baseCents + (remainderCents > 0 ? 1 : 0);
            if (remainderCents > 0) remainderCents--;
            splits[f] = shareCents / 100;

            friendItemDetails[f] = {
              baseShare: Math.round((parsedRideFare / (activeFriendsCount || 1)) * 100) / 100,
              tollShare: Math.round((parsedToll / (activeFriendsCount || 1)) * 100) / 100,
              discountShare: Math.round((parsedDiscount / (activeFriendsCount || 1)) * 100) / 100,
            };
          });

          return {
            subtotal: parsedRideFare,
            tollFee: parsedToll,
            discountAmount: parsedDiscount,
            total: Math.round(netTotal * 100) / 100,
            splits,
            friendItemDetails
          };
        }

        const friendBaseShares = {};
        const friendTaxShares = {};
        
        selectedFriends.forEach(f => {
          friendBaseShares[f] = 0;
          friendTaxShares[f] = 0;
        });

        let subtotal = 0;
        let taxBreakdown = { 0: 0, 6: 0, 7: 0, 8: 0 };
        let totalTax = 0;

        items.forEach(item => {
          const price = parseFloat(item.price) || 0;
          const qty = parseInt(item.qty) || 1;
          const itemTotal = price * qty;
          const taxRate = parseFloat(item.taxRate) || 0;

          subtotal += itemTotal;

          let itemTaxAmount = 0;
          if (currentTaxMode === 'addon') {
            itemTaxAmount = itemTotal * (taxRate / 100);
          } else {
            itemTaxAmount = itemTotal - (itemTotal / (1 + (taxRate / 100)));
          }

          taxBreakdown[taxRate] = (taxBreakdown[taxRate] || 0) + itemTaxAmount;
          totalTax += itemTaxAmount;

          const sharedList = (item.sharedWith || []).filter(f => selectedFriends.includes(f));
          if (sharedList.length > 0) {
            const itemTotalCents = Math.round(itemTotal * 100);
            const baseShareCents = Math.floor(itemTotalCents / sharedList.length);
            let remShareCents = itemTotalCents % sharedList.length;

            const itemTaxCents = Math.round(itemTaxAmount * 100);
            const baseTaxCents = Math.floor(itemTaxCents / sharedList.length);
            let remTaxCents = itemTaxCents % sharedList.length;

            sharedList.forEach(f => {
              const allocatedCents = baseShareCents + (remShareCents > 0 ? 1 : 0);
              if (remShareCents > 0) remShareCents--;
              friendBaseShares[f] = (friendBaseShares[f] || 0) + (allocatedCents / 100);

              const allocatedTaxCents = baseTaxCents + (remTaxCents > 0 ? 1 : 0);
              if (remTaxCents > 0) remTaxCents--;
              friendTaxShares[f] = (friendTaxShares[f] || 0) + (allocatedTaxCents / 100);
            });
          }
        });

        const totalSc = subtotal * (scRate / 100);
        const parsedDFee = parseFloat(dFee) || 0;
        const parsedPackCharge = parseFloat(packCharge) || 0;
        const parsedDiscount = parseFloat(discount) || 0;
        const parsedRoundAdj = parseFloat(roundAdj) || 0;

        const perPersonDelivery = activeFriendsCount > 0 ? (parsedDFee / activeFriendsCount) : 0;
        const perPersonPackaging = activeFriendsCount > 0 ? (parsedPackCharge / activeFriendsCount) : 0;

        let totalDistributedCents = 0;

        selectedFriends.forEach(f => {
          const base = friendBaseShares[f] || 0;
          const friendSc = base * (scRate / 100);
          const friendTax = currentTaxMode === 'addon' ? (friendTaxShares[f] || 0) : 0;
          const userDiscountShare = subtotal > 0 ? (base / subtotal) * parsedDiscount : (parsedDiscount / (activeFriendsCount || 1));
          
          const finalPersonAmount = Math.max(0, base + friendSc + friendTax + perPersonDelivery + perPersonPackaging - userDiscountShare);
          const personCents = Math.round(finalPersonAmount * 100);
          splits[f] = personCents / 100;
          totalDistributedCents += personCents;

          friendItemDetails[f] = {
            baseShare: Math.round(base * 100) / 100,
            scShare: Math.round(friendSc * 100) / 100,
            taxShare: Math.round((friendTaxShares[f] || 0) * 100) / 100,
            deliveryShare: Math.round(perPersonDelivery * 100) / 100,
            packagingShare: Math.round(perPersonPackaging * 100) / 100,
            discountShare: Math.round(userDiscountShare * 100) / 100,
          };
        });

        const addedTaxToTotal = currentTaxMode === 'addon' ? totalTax : 0;
        const finalTotal = Math.round((subtotal + totalSc + addedTaxToTotal + parsedDFee + parsedPackCharge - parsedDiscount + parsedRoundAdj) * 100) / 100;
        const targetTotalCents = Math.round(finalTotal * 100);

        if (activeFriendsCount > 0 && totalDistributedCents !== targetTotalCents) {
          const diffCents = targetTotalCents - totalDistributedCents;
          const lastPerson = selectedFriends[selectedFriends.length - 1];
          splits[lastPerson] = Math.max(0, Math.round((splits[lastPerson] + (diffCents / 100)) * 100) / 100);
        }

        return {
          subtotal: Math.round(subtotal * 100) / 100,
          serviceChargeAmount: Math.round(totalSc * 100) / 100,
          deliveryFee: parsedDFee,
          packagingCharge: parsedPackCharge,
          discountAmount: parsedDiscount,
          taxMode: currentTaxMode,
          taxBreakdown,
          totalTax: Math.round(totalTax * 100) / 100,
          roundingAdjustment: parsedRoundAdj,
          total: finalTotal,
          splits,
          friendItemDetails
        };
      };

      const getFriendBalances = () => {
        const balances = {};
        friends.forEach(f => {
          balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 };
        });

        bills.forEach(bill => {
          Object.keys(bill.splits || {}).forEach(name => {
            const fObj = friends.find(f => f.name === name);
            const isSelf = fObj?.isSelf || name === 'Me (Dom)' || name === 'ตัวฉันเอง';
            if (balances[name] && !isSelf && !bill.paidStatus?.[name]) {
              balances[name].billsOwed += bill.splits[name];
            }
          });
        });

        adjustments.forEach(adj => {
          if (balances[adj.friendName]) {
            balances[adj.friendName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = balances[name].billsOwed + balances[name].adjustedOwed;
        });

        return balances;
      };

      const friendBalances = getFriendBalances();

      const todayDateStr = new Date().toISOString().split('T')[0];
      const todayMyExpense = bills
        .filter(b => b.date === todayDateStr)
        .reduce((sum, b) => {
          const selfAmount = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          return sum + selfAmount;
        }, 0);
      const todayBillsCount = bills.filter(b => b.date === todayDateStr).length;

      const getFriendHistory = (friendName) => {
        const friendBills = bills.filter(b => Object.keys(b.splits || {}).includes(friendName));
        const friendAdjustments = adjustments.filter(a => a.friendName === friendName);
        return { bills: friendBills, adjustments: friendAdjustments };
      };

      const filteredBills = useMemo(() => {
        const term = searchQuery.trim().toLowerCase();
        return bills.filter(bill => {
          const matchTitle = (bill.name || '').toLowerCase().includes(term);
          const matchRoute = (bill.rideRoute || '').toLowerCase().includes(term);
          const matchItem = (bill.items || []).some(item => (item.name || '').toLowerCase().includes(term));
          
          if (term && !matchTitle && !matchRoute && !matchItem) return false;

          const unpaidCount = Object.keys(bill.splits || {}).filter(n => {
            const fObj = friends.find(f => f.name === n);
            return !(fObj?.isSelf) && !bill.paidStatus?.[n];
          }).length;

          if (statusFilter === 'pending') return unpaidCount > 0;
          if (statusFilter === 'settled') return unpaidCount === 0;
          if (statusFilter === 'ride') return bill.billType === 'ride';
          if (statusFilter === 'food') return bill.billType !== 'ride';

          return true;
        });
      }, [bills, searchQuery, statusFilter, friends]);

      const handleStartEditBill = (bill) => {
        if (!isAdmin) {
          showToast("Only Admin can edit transactions", "error");
          return;
        }
        setEditingBillId(bill.id);
        setNewBillName(bill.name);
        setBillType(bill.billType || 'delivery');
        setTaxMode(bill.taxMode || 'inclusive');
        setNewBillDate(bill.date);
        setRideFare(bill.rideFare || '');
        setTollFee(bill.tollFee || '');
        setRideRoute(bill.rideRoute || '');
        setServiceChargeRate(bill.serviceChargeRate !== undefined ? bill.serviceChargeRate : 0);
        setDeliveryFee(bill.deliveryFee || 0);
        setPackagingCharge(bill.packagingCharge || 0);
        setDiscountAmount(bill.discountAmount || 0);
        setRoundingAdj(bill.roundingAdjustment || 0);
        
        const existingParticipants = new Set([
          ...Object.keys(bill.splits || {}),
          ...(bill.items || []).flatMap(i => i.sharedWith || [])
        ]);
        const participantsArray = Array.from(existingParticipants);
        setBillFriends(participantsArray.length > 0 ? participantsArray : friends.filter(f => !f.isArchived).map(f => f.name));

        const loadedItems = (bill.items || []).map(item => ({
          ...item,
          id: item.id || Date.now().toString() + Math.random().toString(36).substring(2, 5),
          taxRate: item.taxRate !== undefined ? item.taxRate : 0,
          sharedWith: item.sharedWith || []
        }));
        setBillItems(loadedItems);
        setActiveTab('new-bill');
      };

      const handleSaveBill = async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          showToast("Permission denied: Admin only", "error");
          return;
        }
        if (!newBillName.trim()) {
          showToast("Please enter a transaction title", "error");
          return;
        }

        const calculated = calculateBillSplits(
          billItems,
          serviceChargeRate,
          deliveryFee,
          packagingCharge,
          discountAmount,
          roundingAdj,
          billFriends,
          taxMode,
          billType,
          rideFare,
          tollFee
        );

        let initialPaidStatus = {};
        if (editingBillId) {
          const oldBill = bills.find(b => b.id === editingBillId);
          initialPaidStatus = oldBill?.paidStatus || {};
        }
        billFriends.forEach(f => {
          if (initialPaidStatus[f] === undefined) {
            const fObj = friends.find(fr => fr.name === f);
            initialPaidStatus[f] = fObj?.isSelf || false;
          }
        });

        const billPayload = {
          name: newBillName,
          billType,
          taxMode,
          date: newBillDate,
          rideFare: parseFloat(rideFare) || 0,
          tollFee: parseFloat(tollFee) || 0,
          rideRoute,
          subtotal: calculated.subtotal,
          serviceChargeRate,
          serviceChargeAmount: calculated.serviceChargeAmount || 0,
          deliveryFee: calculated.deliveryFee || 0,
          packagingCharge: calculated.packagingCharge || 0,
          discountAmount: calculated.discountAmount || 0,
          taxBreakdown: calculated.taxBreakdown || {},
          totalTax: calculated.totalTax || 0,
          roundingAdjustment: calculated.roundingAdjustment || 0,
          total: calculated.total,
          items: billType === 'ride' ? [] : billItems.map(item => ({
            id: item.id,
            name: item.name,
            price: parseFloat(item.price) || 0,
            qty: parseInt(item.qty) || 1,
            taxRate: parseFloat(item.taxRate || 0),
            sharedWith: item.sharedWith || []
          })),
          splits: calculated.splits,
          friendItemDetails: calculated.friendItemDetails,
          paidStatus: initialPaidStatus,
          updatedAt: Date.now()
        };

        if (editingBillId) {
          if (db) {
            try {
              await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(editingBillId).update(billPayload);
              showToast("Bill updated successfully");
            } catch (err) {
              showToast("Update failed: Permission denied", "error");
            }
          }
        } else {
          billPayload.createdAt = Date.now();
          if (db) {
            try {
              await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').add(billPayload);
              showToast("New transaction saved to cloud");
            } catch (err) {
              showToast("Save failed: Permission denied", "error");
            }
          }
        }

        setEditingBillId(null);
        setViewingBillId(null);
        setActiveTab('bills');
      };

      const handleTogglePaid = async (bill, friendName) => {
        if (!isAdmin) {
          showToast("Only Admin can change payment status", "error");
          return;
        }
        const updatedStatus = { ...bill.paidStatus, [friendName]: !bill.paidStatus?.[friendName] };
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(bill.id).update({ paidStatus: updatedStatus });
          } catch (err) {
            showToast("Update failed: Permission denied", "error");
          }
        }
      };

      const handleDeleteBill = async (billId) => {
        if (!isAdmin) {
          showToast("Only Admin can delete bills", "error");
          return;
        }
        if (!confirm("Are you sure you want to delete this bill?")) return;
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(billId).delete();
            setViewingBillId(null);
            showToast("Bill deleted");
          } catch (err) {
            showToast("Delete failed: Permission denied", "error");
          }
        }
      };

      const handleAddFriend = async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          showToast("Only Admin can add friends", "error");
          return;
        }
        const name = newFriendName.trim();
        if (!name) return;
        if (friends.some(f => f.name.toLowerCase() === name.toLowerCase())) {
          showToast("Friend name already exists", "error");
          return;
        }

        const newF = { name, isSelf: false, isArchived: false, createdAt: Date.now() };
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').add(newF);
            showToast("Friend added");
          } catch (err) {
            showToast("Failed to add friend", "error");
          }
        }
        setNewFriendName('');
      };

      const handleToggleArchiveFriend = async (friend) => {
        if (!isAdmin) {
          showToast("Only Admin can archive friends", "error");
          return;
        }
        const actionText = friend.isArchived ? "Restore" : "Archive";
        if (!confirm(`${actionText} friend "${friend.name}"? (Past records remain safe)`)) return;

        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').doc(friend.id).update({
              isArchived: !friend.isArchived
            });
            showToast(`Friend ${actionText.toLowerCase()}d successfully`);
          } catch (err) {
            showToast("Action failed: Permission denied", "error");
          }
        }
      };

      const handleStartRenameFriend = (friend) => {
        if (!isAdmin) return;
        setRenamingFriendId(friend.id);
        setRenameValue(friend.name);
      };

      const handleCancelRenameFriend = () => {
        setRenamingFriendId(null);
        setRenameValue('');
      };

      const handleConfirmRenameFriend = async (friend) => {
        if (!isAdmin) return;
        const newName = renameValue.trim();
        if (!newName || newName === friend.name) {
          handleCancelRenameFriend();
          return;
        }
        if (friends.some(f => f.id !== friend.id && f.name.toLowerCase() === newName.toLowerCase())) {
          showToast("This name already exists", "error");
          return;
        }

        const oldName = friend.name;
        const renameInBill = (bill) => {
          const newItems = (bill.items || []).map(item => ({
            ...item,
            sharedWith: (item.sharedWith || []).map(n => n === oldName ? newName : n)
          }));
          const newSplits = {};
          Object.entries(bill.splits || {}).forEach(([k, v]) => {
            newSplits[k === oldName ? newName : k] = v;
          });
          const newPaidStatus = {};
          Object.entries(bill.paidStatus || {}).forEach(([k, v]) => {
            newPaidStatus[k === oldName ? newName : k] = v;
          });
          return { ...bill, items: newItems, splits: newSplits, paidStatus: newPaidStatus };
        };

        try {
          if (db) {
            const batch = db.batch();
            const friendRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('friends').doc(friend.id);
            batch.update(friendRef, { name: newName });

            bills.forEach(bill => {
              const touches = Object.keys(bill.splits || {}).includes(oldName) || (bill.items || []).some(i => (i.sharedWith || []).includes(oldName));
              if (touches) {
                const updated = renameInBill(bill);
                const billRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').doc(bill.id);
                batch.update(billRef, { items: updated.items, splits: updated.splits, paidStatus: updated.paidStatus });
              }
            });

            adjustments.forEach(adj => {
              if (adj.friendName === oldName) {
                const adjRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').doc(adj.id);
                batch.update(adjRef, { friendName: newName });
              }
            });

            await batch.commit();
            showToast(`Renamed to "${newName}"`);
          }
        } catch (err) {
          showToast("Rename failed: Permission denied", "error");
        }
        handleCancelRenameFriend();
      };

      const handleDeleteAdjustment = async (adj) => {
        if (!isAdmin) {
          showToast("Only Admin can delete adjustments", "error");
          return;
        }
        if (!confirm(`Delete adjustment for "${adj.friendName}"?`)) return;

        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').doc(adj.id).delete();
            showToast("Adjustment removed");
          } catch (err) {
            showToast("Delete failed: Permission denied", "error");
          }
        }
      };

      const handleSaveAdjustment = async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          showToast("Only Admin can adjust balances", "error");
          return;
        }
        const amount = parseFloat(adjustAmount);
        if (isNaN(amount) || amount <= 0) {
          showToast("Please enter a valid amount", "error");
          return;
        }

        const finalAmount = adjustType === 'plus' ? amount : -amount;
        const newAdj = {
          friendName: selectedFriendForAdjust,
          amount: finalAmount,
          note: adjustNote.trim() || (adjustType === 'plus' ? 'Debt Increased' : 'Payment Settled'),
          date: new Date().toISOString().split('T')[0],
          createdAt: Date.now()
        };

        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').add(newAdj);
            showToast("Adjustment saved");
          } catch (err) {
            showToast("Save failed: Permission denied", "error");
          }
        }
        setSelectedFriendForAdjust(null);
        setAdjustAmount('');
        setAdjustNote('');
      };

      const totalOwedAmount = Object.keys(friendBalances).reduce((acc, name) => {
        const fObj = friends.find(f => f.name === name);
        if (!fObj?.isSelf) return acc + Math.max(0, friendBalances[name].totalOwed);
        return acc;
      }, 0);

      const pendingDebtorsCount = Object.keys(friendBalances).filter(name => {
        const fObj = friends.find(f => f.name === name);
        return !fObj?.isSelf && friendBalances[name].totalOwed > 0;
      }).length;

      const currentSelectedBalance = selectedFriendForAdjust ? (friendBalances[selectedFriendForAdjust] || { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 }) : null;

      return (
        <div className="pb-16 min-h-screen">
          {/* Header */}
          <header className="bg-surface/80 border-b border-line sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-4xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-3">
              <div>
                <h1 className="text-lg font-black tracking-tight text-textPrimary flex items-center gap-2.5">
                  <img 
                    src="cat.jpg" 
                    alt="Pilot Cat" 
                    className="w-9 h-9 rounded-xl object-cover ring-2 ring-coral/40 shadow-md shadow-coral/20"
                    onError={(e) => { e.target.style.display='none'; }}
                  />
                  <div className="flex flex-col">
                    <span className="leading-none bg-gradient-to-r from-textPrimary via-coral to-amber bg-clip-text text-transparent font-black tracking-wide text-base sm:text-lg">
                      KraiMaiJayMeeReung
                    </span>
                    <span className="text-[10px] text-coral font-bold tracking-widest uppercase mt-0.5">
                      Made by Dom 🔥
                    </span>
                  </div>
                  <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full border ml-1 ${isAdmin ? 'bg-mint/15 border-mint/40 text-mint' : 'bg-subtle border-line text-textMuted'}`}>
                    {isAdmin ? '👑 Admin Mode' : '👀 View Only'}
                  </span>
                </h1>
              </div>

              {/* Action Buttons & Unified Auth Button */}
              <div className="flex items-center gap-2 w-full sm:w-auto">
                {isAdmin ? (
                  <>
                    <button 
                      onClick={() => {
                        setEditingBillId(null);
                        setNewBillName('');
                        setBillType('delivery');
                        setTaxMode('inclusive');
                        setDeliveryFee(0);
                        setPackagingCharge(0);
                        setDiscountAmount(0);
                        setServiceChargeRate(0);
                        setRoundingAdj(0);
                        setRideFare('');
                        setTollFee('');
                        setRideRoute('');
                        setSelectedImages([]);
                        setBillItems([{ id: '1', name: '', price: '', qty: 1, taxRate: 0, sharedWith: [] }]);
                        setBillFriends(friends.filter(f => !f.isArchived).map(f => f.name));
                        setActiveTab('new-bill');
                      }}
                      className="flex-1 sm:flex-initial bg-accent hover:bg-accent-hover active:scale-[0.98] text-white font-bold px-4 py-2 rounded-xl transition text-sm flex justify-center items-center gap-1.5 shadow-lg shadow-accent/20"
                    >
                      + Create Transaction
                    </button>
                    <button 
                      onClick={handleLogoutAdmin}
                      className="bg-subtle hover:bg-coral/20 text-textSecondary hover:text-coral border border-line px-3 py-2 rounded-xl text-xs font-semibold transition"
                      title="Lock Admin Mode"
                    >
                      Lock 🔒
                    </button>
                  </>
                ) : (
                  <button 
                    onClick={() => setShowAuthModal(true)}
                    className="flex-1 sm:flex-initial bg-accent/15 hover:bg-accent text-accent hover:text-white border border-accent/40 font-semibold px-4 py-2 rounded-xl transition text-xs flex justify-center items-center gap-1.5 shadow-sm"
                  >
                    <span>🔑 Admin Sign-In</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 mt-6">
            
            {/* Tabs */}
            <div className="flex bg-surface p-1 rounded-2xl gap-1 mb-6 border border-line">
              <button 
                onClick={() => setActiveTab('dashboard')}
                className={`flex-1 py-2 px-2 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 ${activeTab === 'dashboard' ? 'bg-accent text-white shadow-sm' : 'text-textSecondary hover:text-textPrimary'}`}
              >
                Dashboard
              </button>
              <button 
                onClick={() => setActiveTab('bills')}
                className={`flex-1 py-2 px-2 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 ${activeTab === 'bills' ? 'bg-accent text-white shadow-sm' : 'text-textSecondary hover:text-textPrimary'}`}
              >
                History ({bills.length})
              </button>
              <button 
                onClick={() => setActiveTab('friends')}
                className={`flex-1 py-2 px-2 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 ${activeTab === 'friends' ? 'bg-accent text-white shadow-sm' : 'text-textSecondary hover:text-textPrimary'}`}
              >
                Friends ({friends.filter(f => !f.isArchived).length})
              </button>
              <button 
                onClick={() => setActiveTab('adjustments')}
                className={`flex-1 py-2 px-2 text-center rounded-xl font-semibold text-xs sm:text-sm transition duration-150 ${activeTab === 'adjustments' ? 'bg-accent text-white shadow-sm' : 'text-textSecondary hover:text-textPrimary'}`}
              >
                Adjustments ({adjustments.length})
              </button>
            </div>

            {/* --- 1. DASHBOARD --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">

                  </button>
                </div>

                <div className="p-4 sm:p-6 overflow-y-auto space-y-4 flex-1">
                  <div ref={friendSlipRef} className="bg-[#0B0F17] border border-line/60 p-5 sm:p-6 rounded-2xl text-textPrimary space-y-4 font-mono text-xs shadow-inner">
                    <div className="text-center pb-3 border-b border-dashed border-line space-y-1">
                      <img src="cat.jpg" alt="Logo" className="w-10 h-10 rounded-full mx-auto mb-1 ring-1 ring-coral/50 object-cover" onError={(e) => { e.target.style.display='none'; }} />
                      <p className="text-xs text-coral font-bold tracking-widest uppercase">👊 KraiMaiJayMeeReung • Statement</p>
                      <p className="text-base font-bold text-textPrimary font-sans">{selectedFriendForHistory}</p>
                      <p className="text-xs text-textMuted">Cumulative Debt Statement</p>
                    </div>

                    <div className="grid grid-cols-3 gap-2 bg-subtle p-3 rounded-xl text-center">
                      <div>
                        <p className="text-[10px] text-textMuted uppercase font-bold">From Bills</p>
                        <p className="text-sm font-bold text-textPrimary mt-0.5 tabular font-mono">
                          {(friendBalances[selectedFriendForHistory]?.billsOwed || 0).toFixed(2)}
                        </p>
                      </div>
                      <div>
                        <p className="text-[10px] text-textMuted uppercase font-bold">Adjusted</p>
                        <p className={`text-sm font-bold mt-0.5 tabular font-mono ${(friendBalances[selectedFriendForHistory]?.adjustedOwed || 0) > 0 ? 'text-amber' : 'text-mint'}`}>
                          {(friendBalances[selectedFriendForHistory]?.adjustedOwed || 0).toFixed(2)}
                        </p>
                      </div>
                      <div>
                        <p className="text-[10px] text-coral uppercase font-bold">Net Balance</p>
                        <p className="text-base font-black text-coral mt-0.5 tabular font-mono">
                          {(friendBalances[selectedFriendForHistory]?.totalOwed || 0).toFixed(2)}
                        </p>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <p className="text-xs font-bold text-textSecondary uppercase font-sans">📋 Transaction History ({getFriendHistory(selectedFriendForHistory).bills.length}):</p>
                      {getFriendHistory(selectedFriendForHistory).bills.length === 0 ? (
                        <p className="text-center py-3 text-textMuted">No transactions on record</p>
                      ) : (
                        <div className="space-y-2">
                          {getFriendHistory(selectedFriendForHistory).bills.map(b => {
                            const isPaid = b.paidStatus?.[selectedFriendForHistory];
                            const userShare = b.splits[selectedFriendForHistory] || 0;
                            return (
                              <div key={b.id} className="bg-subtle p-3 rounded-xl flex justify-between items-center border border-line">
                                <div>
                                  <p className="font-bold text-textPrimary font-sans flex items-center gap-1.5">
                                    {b.billType === 'ride' ? '🚗 ' : '🛵 '} {b.name}
                                  </p>
                                  <p className="text-[10px] text-textMuted">
                                    {b.date} • {b.billType === 'ride' ? (b.rideRoute || 'Shared equally') : (b.items?.filter(i => (i.sharedWith || []).includes(selectedFriendForHistory)).map(i => i.name).join(', ') || 'General split')}
                                  </p>
                                </div>
                                <div className="text-right">
                                  <p className="font-bold text-sm text-textPrimary font-mono tabular">{userShare.toFixed(2)} RM</p>
                                  <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${isPaid ? 'bg-mint/20 text-mint' : 'bg-coral/20 text-coral'}`}>
                                    {isPaid ? 'Paid' : 'Unpaid'}
                                  </span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    {getFriendHistory(selectedFriendForHistory).adjustments.length > 0 && (
                      <div className="space-y-2 pt-2 border-t border-dashed border-line">
                        <p className="text-xs font-bold text-textSecondary uppercase font-sans">⚙️ Adjustments ({getFriendHistory(selectedFriendForHistory).adjustments.length}):</p>
                        <div className="space-y-1.5">
                          {getFriendHistory(selectedFriendForHistory).adjustments.map(adj => (
                            <div key={adj.id} className="bg-subtle/50 p-2 rounded-lg flex justify-between items-center text-[11px]">
                              <div>
                                <span className="text-textPrimary">{adj.note}</span>
                                <span className="text-textMuted ml-1.5 font-mono">({adj.date})</span>
                              </div>
                              <span className={`font-bold font-mono ${adj.amount > 0 ? 'text-coral' : 'text-mint'}`}>
                                {adj.amount > 0 ? '+' : ''}{adj.amount.toFixed(2)} RM
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                <div className="p-4 border-t border-line bg-surface flex flex-wrap gap-2">
                  <button
                    onClick={() => handleExportElement(friendSlipRef, `Statement_${selectedFriendForHistory}`)}
                    className="flex-1 bg-accent hover:bg-accent-hover text-white font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-1.5 transition active:scale-95 shadow-md shadow-accent/20"
                  >
                    📸 PNG
                  </button>
                  <button
                    onClick={() => handleExportPDF(friendSlipRef, `Statement_${selectedFriendForHistory}`)}
                    className="flex-1 bg-coral hover:bg-coral/90 text-white font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-1.5 transition active:scale-95 shadow-md shadow-coral/20"
                  >
                    📄 PDF
                  </button>
                  <button
                    onClick={() => {
                      const bal = (friendBalances[selectedFriendForHistory]?.totalOwed || 0).toFixed(2);
                      shareToSocial(`แจ้งยอดค้างชำระ: ${selectedFriendForHistory} มียอดคงเหลือ ${bal} RM`, 'whatsapp');
                    }}
                    className="bg-whatsapp/15 hover:bg-whatsapp text-emerald-400 hover:text-bg font-bold py-2.5 px-3 rounded-xl text-xs transition border border-whatsapp/30 flex items-center gap-1"
                  >
                    💬 WhatsApp
                  </button>
                  <button
                    onClick={() => {
                      const bal = (friendBalances[selectedFriendForHistory]?.totalOwed || 0).toFixed(2);
                      shareToSocial(`แจ้งยอดค้างชำระ: ${selectedFriendForHistory} มียอดคงเหลือ ${bal} RM`, 'ig');
                    }}
                    className="bg-instagram/15 hover:bg-instagram text-coral hover:text-white font-bold py-2.5 px-3 rounded-xl text-xs transition border border-instagram/30 flex items-center gap-1"
                  >
                    📸 IG
                  </button>
                  {isAdmin && (
                    <button
                      onClick={() => {
                        const fName = selectedFriendForHistory;
                        setSelectedFriendForHistory(null);
                        setSelectedFriendForAdjust(fName);
                      }}
                      className="bg-subtle hover:bg-line text-textPrimary border border-line font-bold py-2.5 px-3 rounded-xl text-xs transition active:scale-95"
                    >
                      ⚖️ Adjust
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* --- SCROLLABLE RECEIPT MODAL --- */}
          {activeBreakdown && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4"
              onClick={() => setActiveBreakdown(null)}
            >
              <div 
                className="bg-surface border border-line rounded-3xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden"
                onClick={e => e.stopPropagation()}
              >
                <div className="p-4 sm:p-5 border-b border-line flex justify-between items-center bg-surface sticky top-0 z-20">
                  <h3 className="font-bold text-textPrimary text-base">
                    {activeBreakdown.selectedFriend ? `Breakdown: ${activeBreakdown.selectedFriend}` : 'Transaction Summary'}
                  </h3>
                  <button 
                    onClick={() => setActiveBreakdown(null)} 
                    className="w-9 h-9 rounded-full bg-subtle hover:bg-line text-textSecondary hover:text-textPrimary flex items-center justify-center text-lg font-bold transition active:scale-95"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 sm:p-6 overflow-y-auto space-y-4 flex-1">
                  <div ref={receiptCardRef} className="bg-[#0B0F17] border border-line/60 p-5 sm:p-6 rounded-2xl text-textPrimary space-y-4 font-mono text-xs shadow-inner">
                    <div className="text-center pb-3 border-b border-dashed border-line space-y-1">
                      <img src="cat.jpg" alt="Logo" className="w-10 h-10 rounded-full mx-auto mb-1 ring-1 ring-coral/50 object-cover" onError={(e) => { e.target.style.display='none'; }} />
                      <p className="text-xs text-coral font-bold tracking-widest uppercase">👊 KraiMaiJayMeeReung</p>
                      <p className="text-base font-bold text-textPrimary font-sans">
                        {activeBreakdown.bill.billType === 'ride' ? '🚗 ' : '🛵 '} {activeBreakdown.bill.name}
                      </p>
                      {activeBreakdown.bill.rideRoute && <p className="text-[11px] text-textSecondary font-sans">📍 {activeBreakdown.bill.rideRoute}</p>}
                      <p className="text-textMuted">{activeBreakdown.bill.date}</p>
                      {activeBreakdown.selectedFriend && (
                        <p className="text-emerald-400 font-bold font-sans text-sm mt-1">
                          Participant: {activeBreakdown.selectedFriend}
                        </p>
                      )}
                    </div>

                    {activeBreakdown.bill.billType === 'ride' ? (
                      <div className="space-y-2">
                        <div className="flex justify-between py-1">
                          <span className="text-textSecondary">Base Fare</span>
                          <span className="font-bold font-mono">{activeBreakdown.bill.subtotal?.toFixed(2)} RM</span>
                        </div>
                        {activeBreakdown.bill.tollFee > 0 && (
                          <div className="flex justify-between py-1 text-amber">
                            <span>Toll / Surcharge</span>
                            <span className="font-bold font-mono">+{activeBreakdown.bill.tollFee?.toFixed(2)} RM</span>
                          </div>
                        )}
                        {activeBreakdown.bill.discountAmount > 0 && (
                          <div className="flex justify-between py-1 text-coral">
                            <span>Promo Discount</span>
                            <span className="font-bold font-mono">-{activeBreakdown.bill.discountAmount?.toFixed(2)} RM</span>
                          </div>
                        )}
                        <div className="flex justify-between py-1 text-textMuted text-[10px]">
                          <span>Total Split Across</span>
                          <span>{Object.keys(activeBreakdown.bill.splits || {}).length} People</span>
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        <div className="flex justify-between font-bold text-textMuted uppercase text-[10px] pb-1 border-b border-line">
                          <span>Item Name</span>
                          <span>Share (RM)</span>
                        </div>

                        {activeBreakdown.bill.items?.filter(item => {
                          if (!activeBreakdown.selectedFriend) return true;
                          return (item.sharedWith || []).includes(activeBreakdown.selectedFriend);
                        }).map((item, idx) => {
                          const shareCount = (item.sharedWith || []).length || 1;
                          const userShareCost = (item.price * item.qty) / shareCount;

                          return (
                            <div key={idx} className="flex justify-between items-center py-1">
                              <div className="pr-2">
                                <p className="text-textPrimary font-sans font-medium">{item.name}</p>
                                <p className="text-[10px] text-textMuted">
                                  {item.qty > 1 && `${item.qty}x `}{item.price.toFixed(2)} RM
                                  {activeBreakdown.selectedFriend && shareCount > 1 && ` (Split ${shareCount} pax)`}
                                  {activeBreakdown.bill.taxMode === 'inclusive' ? ` [Incl. Tax ${item.taxRate || 0}%]` : ` [Addon Tax ${item.taxRate || 0}%]`}
                                </p>
                              </div>
                              <span className="font-bold text-textPrimary tabular">{userShareCost.toFixed(2)}</span>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    <div className="pt-3 border-t border-dashed border-line space-y-1.5 text-[11px]">
                      {activeBreakdown.bill.packagingCharge > 0 && (
                        <div className="flex justify-between text-amber">
                          <span>Packaging Charge</span>
                          <span className="tabular font-mono">+{activeBreakdown.bill.packagingCharge.toFixed(2)} RM</span>
                        </div>
                      )}

                      {activeBreakdown.bill.deliveryFee > 0 && (
                        <div className="flex justify-between text-emerald-400">
                          <span>Delivery Fee</span>
                          <span className="tabular font-mono">+{activeBreakdown.bill.deliveryFee.toFixed(2)} RM</span>
                        </div>
                      )}

                      {activeBreakdown.selectedFriend ? (
                        <div className="flex justify-between items-center text-sm font-bold text-textPrimary pt-2 border-t border-line font-sans">
                          <span>Net Payable Amount:</span>
                          <span className="text-base text-mint font-mono tabular">{activeBreakdown.bill.splits[activeBreakdown.selectedFriend]?.toFixed(2)} RM</span>
                        </div>
                      ) : (
                        <div className="flex justify-between items-center text-sm font-bold text-textPrimary pt-2 border-t border-line font-sans">
                          <span>Total Net Bill:</span>
                          <span className="text-base text-mint font-mono tabular">{activeBreakdown.bill.total?.toFixed(2)} RM</span>
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-line bg-surface flex gap-3">
                  <button
                    onClick={() => handleExportElement(receiptCardRef, `Bill_${activeBreakdown.bill.name}`)}
                    className="flex-1 bg-accent hover:bg-accent-hover text-white font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-2 transition active:scale-95 shadow-md shadow-accent/20"
                  >
                    📸 Save PNG
                  </button>
                  <button
                    onClick={() => handleExportPDF(receiptCardRef, `Bill_${activeBreakdown.bill.name}`)}
                    className="flex-1 bg-coral hover:bg-coral/90 text-white font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-2 transition active:scale-95 shadow-md shadow-coral/20"
                  >
                    📄 Download PDF
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- ADJUSTMENT MODAL (ADMIN ONLY) --- */}
          {selectedFriendForAdjust && isAdmin && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
              onClick={() => setSelectedFriendForAdjust(null)}
            >
              <form 
                onSubmit={handleSaveAdjustment} 
                className="bg-surface border border-line rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex justify-between items-center pb-2 border-b border-line">
                  <div>
                    <h3 className="font-bold text-md text-textPrimary flex items-center gap-1.5">
                      Adjust Balance: <span className="text-accent">{selectedFriendForAdjust}</span>
                    </h3>
                  </div>
                  <button type="button" onClick={() => setSelectedFriendForAdjust(null)} className="text-textSecondary text-lg font-bold">✕</button>
                </div>

                {currentSelectedBalance && (
                  <div className="bg-subtle border border-line/80 rounded-2xl p-3.5 space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-xs text-textSecondary">Current Balance Owed:</span>
                      <span className={`text-lg font-black font-mono tabular ${currentSelectedBalance.totalOwed > 0 ? 'text-coral' : currentSelectedBalance.totalOwed < 0 ? 'text-mint' : 'text-textMuted'}`}>
                        {currentSelectedBalance.totalOwed.toFixed(2)} RM
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-[11px] pt-2 border-t border-line/50 text-textMuted font-mono">
                      <div>Bills Owed: {currentSelectedBalance.billsOwed.toFixed(2)} RM</div>
                      <div className="text-right">Previous Adj: {currentSelectedBalance.adjustedOwed > 0 ? '+' : ''}{currentSelectedBalance.adjustedOwed.toFixed(2)} RM</div>
                    </div>

                    {currentSelectedBalance.totalOwed > 0 && (
                      <div className="pt-2 border-t border-line/50 flex gap-2">
                        <button
                          type="button"
                          onClick={() => {
                            setAdjustType('minus');
                            setAdjustAmount(currentSelectedBalance.totalOwed.toFixed(2));
                            setAdjustNote('Payment settled in full');
                          }}
                          className="flex-1 bg-mint/15 hover:bg-mint text-mint hover:text-bg font-bold py-1.5 px-2 rounded-lg text-xs transition text-center"
                        >
                          ⚡ Settle Full Balance ({currentSelectedBalance.totalOwed.toFixed(2)} RM)
                        </button>
                      </div>
                    )}
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2 bg-subtle p-1 rounded-xl">
                  <button
                    type="button"
                    onClick={() => setAdjustType('minus')}
                    className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'minus' ? 'bg-mint text-bg shadow-sm' : 'text-textSecondary'}`}
                  >
                    Deduct / Settle (-)
                  </button>
                  <button
                    type="button"
                    onClick={() => setAdjustType('plus')}
                    className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'plus' ? 'bg-coral text-white shadow-sm' : 'text-textSecondary'}`}
                  >
                    Add Debt (+)
                  </button>
                </div>

                <div>
                  <label className="block text-xs text-textSecondary font-bold mb-1">Adjustment Amount (RM)</label>
                  <input 
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    value={adjustAmount}
                    onChange={(e) => setAdjustAmount(e.target.value)}
                    className="w-full bg-subtle border border-line rounded-xl px-4 py-2.5 text-textPrimary text-sm font-mono focus:border-accent outline-none"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs text-textSecondary font-bold mb-1">Note</label>
                  <input 
                    type="text"
                    placeholder="e.g., Transfer via DuitNow, Cash"
                    value={adjustNote}
                    onChange={(e) => setAdjustNote(e.target.value)}
                    className="w-full bg-subtle border border-line rounded-xl px-4 py-2.5 text-textPrimary text-sm focus:border-accent outline-none"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="submit" className="flex-1 bg-accent hover:bg-accent-hover text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md shadow-accent/20">Save</button>
                  <button type="button" onClick={() => setSelectedFriendForAdjust(null)} className="bg-subtle border border-line text-textPrimary py-2.5 px-4 rounded-xl text-sm hover:bg-line">Cancel</button>
                </div>
              </form>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 bg-surface border px-4 py-3 rounded-xl text-sm shadow-xl ${toast.type === 'error' ? 'border-coral/40 text-coral bg-coral-subtle/80' : 'border-mint/40 text-mint bg-mint-subtle/80'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
