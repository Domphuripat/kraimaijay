  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<body class="text-slate-900 pb-32">

  <div id="root">
    <div class="min-h-screen flex items-center justify-center text-slate-400 text-sm font-sans">
      Loading KraiMaiJay App...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const ADMIN_EMAILS = ["phuripat26dom@gmail.com"];
    const ADMIN_PIN = "2323";
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyC4RNzFy2wi7S4ZKN2_DWfHY_hUldwzmRQ",
      authDomain: "eat-app-eb3f8.firebaseapp.com",
      projectId: "eat-app-eb3f8",
      storageBucket: "eat-app-eb3f8.firebasestorage.app",
      messagingSenderId: "923469695976",
      appId: "1:923469695976:web:2888ebe9e10097d7c6b25d",
      measurementId: "G-DJEMGJV6Y6"
    };
    const DEFAULT_APP_ID = "eat-app-eb3f8";

    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }
    };

    function App() {
      const [cloudConfig] = useState(DEFAULT_FIREBASE_CONFIG);
      const [appId] = useState(DEFAULT_APP_ID);

      const [isAdminByGoogle, setIsAdminByGoogle] = useState(false);
      const [isAdminBySecret, setIsAdminBySecret] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        return p.get('admin') === 'true' || p.get('dom') === '2323' || localStorage.getItem('kraimaijay_secret_admin') === 'true';
      });
      const isAdmin = isAdminByGoogle || isAdminBySecret;

      const [isProcessing, setIsProcessing] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [inputPin, setInputPin] = useState('');

      const [db, setDb] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'bills' | 'calendar' | 'friends'
      
      const [friends, setFriends] = useState([]);
      const [bills, setBills] = useState([]);
      const [adjustments, setAdjustments] = useState([]);

      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().substring(0, 7));
      const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);

      // ฟอร์มบิล
      const [editingBillId, setEditingBillId] = useState(null);
      const [newBillName, setNewBillName] = useState('');
      const [billType, setBillType] = useState('delivery');
      const [newBillDate, setNewBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [billFriends, setBillFriends] = useState([]);
      const [paidBy, setPaidBy] = useState('Me (Dom)');
      
      const [rideFare, setRideFare] = useState('');
      const [tollFee, setTollFee] = useState('');
      const [rideRoute, setRideRoute] = useState('');
      const [loanAmount, setLoanAmount] = useState('');
      const [loanBorrower, setLoanBorrower] = useState('');
      
      const [deliveryFee, setDeliveryFee] = useState(0);
      const [packagingCharge, setPackagingCharge] = useState(0);
      const [discountAmount, setDiscountAmount] = useState(0);
      const [roundingAdj, setRoundingAdj] = useState(0);
      const [billItems, setBillItems] = useState([{ id: '1', name: '', price: '', qty: 1, sharedWith: [] }]);

      // OCR
      const [selectedImages, setSelectedImages] = useState([]);
      const [ocrProcessing, setOcrProcessing] = useState(false);
      const fileInputRef = useRef(null);

      // สมาชิก & ปรับยอด
      const [newFriendName, setNewFriendName] = useState('');
      const [selectedFriendForAdjust, setSelectedFriendForAdjust] = useState(null);
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustNote, setAdjustNote] = useState('');
      const [adjustType, setAdjustType] = useState('minus');
      const [viewingBillId, setViewingBillId] = useState(null);
      const [selectedFriendForHistory, setSelectedFriendForHistory] = useState(null);
      const friendSlipRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        try {
          let app = !firebase.apps.length ? firebase.initializeApp(cloudConfig) : firebase.app();
          const auth = firebase.auth(app);
          const firestore = firebase.firestore(app);
          setDb(firestore);

          if (isAdminBySecret && !auth.currentUser) auth.signInAnonymously().catch(() => {});

          const unsubAuth = auth.onAuthStateChanged(user => {
            setIsAdminByGoogle(user?.email && ADMIN_EMAILS.some(e => e.toLowerCase() === user.email.toLowerCase()));
          });

          const base = firestore.collection('artifacts').doc(appId).collection('public').doc('data');
          const unsubFriends = base.collection('friends').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setFriends(list);
          });
          const unsubBills = base.collection('bills').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setBills(list);
          });
          const unsubAdjs = base.collection('adjustments').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setAdjustments(list);
          });

          return () => { unsubAuth(); unsubFriends(); unsubBills(); unsubAdjs(); };
        } catch (e) { console.warn(e); }
      }, []);

      const handleGoogleLogin = async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          const result = await firebase.auth().signInWithPopup(provider);
          if (result && result.user) {
            const userEmail = (result.user.email || '').toLowerCase();
            const hasAdminRole = ADMIN_EMAILS.some(e => e.toLowerCase() === userEmail);
            setIsAdminByGoogle(hasAdminRole);
            setShowAuthModal(false);
            showToast(hasAdminRole ? "👑 Signed in as Admin!" : `Signed in as ${userEmail}`);
          }
        } catch (err) {
          showToast("Google sign-in failed, please use PIN", "error");
        }
      };

      const handleVerifyPin = async (e) => {
        e.preventDefault();
        if (inputPin === ADMIN_PIN) {
          setIsAdminBySecret(true);
          localStorage.setItem('kraimaijay_secret_admin', 'true');
          try { await firebase.auth().signInAnonymously(); } catch (err) {}
          setShowAuthModal(false);
          setInputPin('');
          showToast("👑 PIN Correct: Admin mode unlocked!");
        } else {
          showToast("รหัส PIN ไม่ถูกต้อง", "error");
          setInputPin('');
        }
      };

      const handleLogoutAdmin = async () => {
        setIsAdminBySecret(false);
        setIsAdminByGoogle(false);
        localStorage.removeItem('kraimaijay_secret_admin');
        try { await firebase.auth().signOut(); } catch (e) {}
        showToast("Switched to Viewer Mode");
      };

      // ยอดหนี้
      const friendBalances = useMemo(() => {
        const balances = {};
        friends.forEach(f => { balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 }; });

        bills.forEach(bill => {
          const isDomPayer = /me|dom/i.test(bill.paidBy || 'Me (Dom)');
          if (isDomPayer) {
            Object.keys(bill.splits || {}).forEach(name => {
              const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
              const realName = fObj ? fObj.name : name;
              const isSelf = fObj?.isSelf || /me|dom/i.test(realName);
              if (balances[realName] && !isSelf && !bill.paidStatus?.[name]) {
                balances[realName].billsOwed += bill.splits[name];
              }
            });
          } else {
            const payerObj = friends.find(f => f.name.toLowerCase() === (bill.paidBy || '').toLowerCase());
            const realPayerName = payerObj ? payerObj.name : bill.paidBy;
            const myShare = bill.splits?.['Me (Dom)'] || bill.splits?.['ตัวฉันเอง'] || 0;
            const isMySharePaid = bill.paidStatus?.['Me (Dom)'] || bill.paidStatus?.['ตัวฉันเอง'] || false;
            if (balances[realPayerName] && myShare > 0 && !isMySharePaid) {
              balances[realPayerName].billsOwed -= myShare;
            }
          }
        });

        adjustments.forEach(adj => {
          const fObj = friends.find(f => f.name.toLowerCase() === adj.friendName.toLowerCase());
          const realName = fObj ? fObj.name : adj.friendName;
          if (balances[realName] && adj.amount !== undefined && !adj.isSettled) {
            balances[realName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = Math.round((balances[name].billsOwed + balances[name].adjustedOwed) * 100) / 100;
        });
        return balances;
      }, [friends, bills, adjustments]);

      const totalOwedAmount = useMemo(() => {
        return Object.keys(friendBalances).reduce((acc, name) => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return (fObj?.isSelf || /me|dom/i.test(name)) ? acc : acc + Math.max(0, friendBalances[name].totalOwed);
        }, 0);
      }, [friendBalances, friends]);

      const todayMyExpense = useMemo(() => {
        const today = new Date().toISOString().split('T')[0];
        return bills.filter(b => b.date === today).reduce((sum, b) => sum + (b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0), 0);
      }, [bills]);

      const monthlyStats = useMemo(() => {
        const monthly = bills.filter(b => (b.date || '').startsWith(selectedMonth));
        let totalGroup = 0, foodTotal = 0, rideTotal = 0;
        const dailyMyExpenses = {};

        monthly.forEach(b => {
          const tot = b.total || 0;
          totalGroup += tot;
          if (b.billType === 'ride') rideTotal += tot;
          else if (b.billType !== 'loan') foodTotal += tot;

          const self = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          if (b.date && self > 0) {
            if (!dailyMyExpenses[b.date]) dailyMyExpenses[b.date] = { total: 0, items: [] };
            dailyMyExpenses[b.date].total += self;
            dailyMyExpenses[b.date].items.push({ name: b.name, amount: self, type: b.billType });
          }
        });

        return {
          totalGroup,
          foodTotal,
          rideTotal,
          count: monthly.length,
          avgPerBill: monthly.length > 0 ? (totalGroup / monthly.length) : 0,
          dailyMyExpenses
        };
      }, [bills, selectedMonth]);

      // ปฏิทินรายจ่าย
      const calendarMatrix = useMemo(() => {
        if (!selectedMonth) return [];
        const [year, month] = selectedMonth.split('-').map(Number);
        if (!year || !month) return [];

        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const matrix = [];
        let dayCounter = 1;

        for (let row = 0; row < 6; row++) {
          const week = [];
          for (let col = 0; col < 7; col++) {
            if (row === 0 && col < firstDayIndex) {
              week.push(null);
            } else if (dayCounter > daysInMonth) {
              week.push(null);
            } else {
              const dStr = `${selectedMonth}-${String(dayCounter).padStart(2, '0')}`;
              const dayData = monthlyStats.dailyMyExpenses?.[dStr] || null;
              week.push({
                day: dayCounter,
                dateStr: dStr,
                total: dayData ? dayData.total : 0,
                items: dayData ? dayData.items : []
              });
              dayCounter++;
            }
          }
          matrix.push(week);
          if (dayCounter > daysInMonth) break;
        }
        return matrix;
      }, [selectedMonth, monthlyStats.dailyMyExpenses]);

      // ดึงประวัติเพื่อน
      const getFriendHistory = (friendName) => {
        const fBills = bills.filter(b => {
          const keys = Object.keys(b.splits || {});
          return keys.some(k => k.toLowerCase() === friendName.toLowerCase()) || (b.paidBy || '').toLowerCase() === friendName.toLowerCase();
        });
        const fAdjs = adjustments.filter(a => a.friendName.toLowerCase() === friendName.toLowerCase());
        return { bills: fBills, adjustments: fAdjs };
      };

      // บันทึกบิล
      const handleSaveBill = async (e) => {
        e.preventDefault();
        if (!isAdmin || isProcessing) return;
        if (!newBillName.trim()) { showToast("กรุณาระบุชื่อบิล", "error"); return; }

        let splits = {};
        const activeFriends = billFriends;

        if (billType === 'loan') {
          const p = parseFloat(loanAmount) || 0;
          if (loanBorrower) splits[loanBorrower] = p;
        } else if (billType === 'ride') {
          const rf = parseFloat(rideFare) || 0;
          const tf = parseFloat(tollFee) || 0;
          const ds = parseFloat(discountAmount) || 0;
          const tot = Math.max(0, rf + tf - ds);
          const perPerson = activeFriends.length > 0 ? tot / activeFriends.length : 0;
          activeFriends.forEach(f => { splits[f] = Math.round(perPerson * 100) / 100; });
        } else {
          let sub = 0;
          const baseShares = {};
          activeFriends.forEach(f => { baseShares[f] = 0; });
          billItems.forEach(it => {
            const pr = (parseFloat(it.price) || 0) * (parseInt(it.qty) || 1);
            sub += pr;
            const shared = (it.sharedWith || []).filter(sn => activeFriends.includes(sn));
            if (shared.length > 0) {
              const per = pr / shared.length;
              shared.forEach(sn => { baseShares[sn] = (baseShares[sn] || 0) + per; });
            }
          });
          const perDel = activeFriends.length > 0 ? (parseFloat(deliveryFee) || 0) / activeFriends.length : 0;
          const perPack = activeFriends.length > 0 ? (parseFloat(packagingCharge) || 0) / activeFriends.length : 0;
          const disc = parseFloat(discountAmount) || 0;

          activeFriends.forEach(f => {
            const base = baseShares[f] || 0;
            const uDisc = sub > 0 ? (base / sub) * disc : (disc / (activeFriends.length || 1));
            splits[f] = Math.round(Math.max(0, base + perDel + perPack - uDisc) * 100) / 100;
          });
        }

        const totalAmt = Object.values(splits).reduce((a, b) => a + b, 0);

        let initialPaidStatus = {};
        const participants = billType === 'loan' ? (loanBorrower ? [loanBorrower] : []) : billFriends;
        participants.forEach(f => {
          initialPaidStatus[f] = f.toLowerCase() === paidBy.toLowerCase();
        });

        const billPayload = {
          name: newBillName,
          billType,
          paidBy,
          date: newBillDate,
          rideFare: parseFloat(rideFare) || 0,
          tollFee: parseFloat(tollFee) || 0,
          rideRoute,
          loanAmount: parseFloat(loanAmount) || 0,
          loanBorrower,
          total: totalAmt,
          items: billItems,
          splits,
          paidStatus: initialPaidStatus,
          createdAt: Date.now()
        };

        setIsProcessing(true);
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills').add(billPayload);
            showToast("บันทึกบิลสำเร็จ!");
            setNewBillName('');
            setActiveTab('bills');
          } catch (err) {
            showToast("บันทึกไม่สำเร็จ", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      // บันทึกปรับยอด
      const handleSaveAdjustment = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        const amount = parseFloat(adjustAmount);
        if (isNaN(amount) || amount <= 0) return;

        const finalAmount = adjustType === 'plus' ? amount : -amount;
        const newAdj = {
          friendName: selectedFriendForAdjust,
          amount: finalAmount,
          displayAmount: amount,
          isPaymentRecord: adjustType === 'minus',
          isSettled: adjustType === 'minus',
          note: adjustNote.trim() || (adjustType === 'plus' ? 'เพิ่มยอดหนี้ (+)' : `ชำระแล้ว (- ${amount.toFixed(2)} RM)`),
          date: new Date().toISOString().split('T')[0],
          createdAt: Date.now()
        };

        setIsProcessing(true);
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('adjustments').add(newAdj);
            showToast(`ปรับยอด ${amount.toFixed(2)} RM เรียบร้อย!`);
            setSelectedFriendForAdjust(null);
            setAdjustAmount('');
            setAdjustNote('');
          } catch (err) {
            showToast("เกิดข้อผิดพลาด", "error");
          } finally {
            setIsProcessing(false);
          }
        }
      };

      const unpaidDebtorsCount = useMemo(() => {
        return Object.keys(friendBalances).filter(name => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return !fObj?.isSelf && friendBalances[name].totalOwed > 0;
        }).length;
      }, [friendBalances, friends]);

      return (
        <div className="max-w-md mx-auto min-h-screen px-4 pt-5 pb-8 flex flex-col justify-between">
          
          {/* ================= TAB 1: OVERVIEW ================= */}
          {activeTab === 'overview' && (
            <div className="space-y-5 animate-in fade-in duration-200">
              {/* Header Top[cite: 2] */}
              <div className="flex justify-between items-end">
                <div>
                  <p className="text-xs text-slate-400 font-medium">{new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
                  <h1 className="text-3xl font-extrabold tracking-tight text-slate-900 mt-0.5">Overview</h1>
                </div>
                <div className="flex gap-2">
                  <button 
                    onClick={() => {
                      if (!isAdmin) { setShowAuthModal(true); return; }
                      setBillFriends(friends.filter(f => !f.isArchived).map(f => f.name));
                      setActiveTab('new-bill');
                    }} 
                    className="bg-capsuleDark text-white text-xs font-semibold px-4 py-2 rounded-xl flex items-center gap-1 active:scale-95 transition shadow-sm"
                  >
                    <span className="text-base leading-none">+</span> Add
                  </button>
                </div>
              </div>

              {/* Cards & accounts (Visa Gradient Card)[cite: 2] */}
              <div className="space-y-2">
                <div className="flex justify-between items-center text-xs">
                  <span className="font-bold text-slate-800 text-sm">Cards & accounts</span>
                  {isAdmin ? (
                    <button onClick={handleLogoutAdmin} className="text-slate-400 text-xs font-semibold">Admin (🔒 Lock)</button>
                  ) : (
                    <button onClick={() => setShowAuthModal(true)} className="text-brandPurple font-semibold">Sign-In 🔑</button>
                  )}
                </div>

                <div className="flex gap-3 overflow-x-auto hide-scrollbar pt-1 pb-2">
                  {/* Card Red/Pink Gradient[cite: 2] */}
                  <div className="min-w-[280px] h-44 rounded-3xl p-5 text-white flex flex-col justify-between shadow-lg shadow-rose-500/15 relative overflow-hidden"
                       style={{ background: 'linear-gradient(135deg, #E65C5C 0%, #EA7E6B 60%, #BA7B9B 100%)' }}>
                    <div className="flex justify-between items-start z-10">
                      <div>
                        <p className="text-xs font-bold leading-tight">Total Outstanding</p>
                        <p className="text-[10px] text-white/80">KraiMaiJay Pay</p>
                      </div>
                      <span className="bg-white text-slate-800 text-[10px] font-black px-2 py-0.5 rounded tracking-wider shadow-sm">VISA</span>
                    </div>

                    <div className="z-10">
                      <p className="text-xs tracking-widest text-white/90 font-mono">•••• •••• •••• 2323</p>
                      <div className="flex justify-between items-end mt-2">
                        <div>
                          <p className="text-[9px] text-white/80">Pending from friends</p>

                          <div className="flex gap-2">
                            <input type="text" placeholder="Dish name" value={item.name} onChange={e => setBillItems(billItems.map(b => b.id === item.id ? { ...b, name: e.target.value } : b))} className="flex-1 bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs" required />
                            <input type="text" placeholder="Price" value={item.price} onChange={e => setBillItems(billItems.map(b => b.id === item.id ? { ...b, price: e.target.value } : b))} className="w-16 bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs font-mono" required />
                          </div>
                          <div className="flex flex-wrap gap-1">
                            {billFriends.map(fName => {
                              const isShared = (item.sharedWith || []).includes(fName);
                              return (
                                <button key={fName} type="button" onClick={() => setBillItems(billItems.map(b => b.id === item.id ? { ...b, sharedWith: isShared ? b.sharedWith.filter(n => n !== fName) : [...b.sharedWith, fName] } : b))} className={`px-2 py-0.5 rounded-lg text-[10px] ${isShared ? 'bg-capsuleDark text-white' : 'bg-white text-slate-500'}`}>
                                  {fName}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Select Participants */}
                {billType !== 'loan' && (
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Split with ({billFriends.length}):</label>
                    <div className="flex flex-wrap gap-1.5">
                      {friends.map(f => {
                        const isSel = billFriends.includes(f.name);
                        return (
                          <button
                            key={f.id}
                            type="button"
                            onClick={() => setBillFriends(isSel ? billFriends.filter(n => n !== f.name) : [...billFriends, f.name])}
                            className={`px-3 py-1 rounded-xl text-xs font-semibold ${isSel ? 'bg-capsuleDark text-white' : 'bg-slate-100 text-slate-500'}`}
                          >
                            {isSel ? '✓ ' : '+ '} {f.name}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                <button type="submit" disabled={isProcessing} className="w-full bg-brandPurple text-white font-bold py-3 rounded-2xl text-xs shadow-lg shadow-brandPurple/30 active:scale-95 transition">
                  {isProcessing ? 'Saving...' : 'Save Transaction'}
                </button>
              </form>
            </div>
          )}

          {/* ================= STATEMENT BOTTOM SHEET ================= */}
          {selectedFriendForHistory && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex flex-col justify-end" onClick={() => setSelectedFriendForHistory(null)}>
              <div className="bg-white border-t border-slate-200 rounded-t-3xl max-h-[85vh] flex flex-col p-5 space-y-4 animate-in slide-in-from-bottom" onClick={e => e.stopPropagation()}>
                <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto -mt-2 mb-1"></div>
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <h3 className="font-extrabold text-slate-900 text-base">Statement: {selectedFriendForHistory}</h3>
                  <button onClick={() => setSelectedFriendForHistory(null)} className="text-slate-400 text-xs">✕</button>
                </div>

                <div ref={friendSlipRef} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3 font-mono text-xs">
                  <div className="text-center pb-2 border-b border-dashed border-slate-200">
                    <p className="font-bold text-sm font-sans text-slate-900">{selectedFriendForHistory}</p>
                    <p className={`text-xl font-black ${(friendBalances[selectedFriendForHistory]?.totalOwed || 0) > 0 ? 'text-coral' : 'text-mint'}`}>
                      MYR {(friendBalances[selectedFriendForHistory]?.totalOwed || 0).toFixed(2)}
                    </p>
                  </div>

                  <div className="space-y-1.5 max-h-48 overflow-y-auto">
                    {getFriendHistory(selectedFriendForHistory).bills.map(b => (
                      <div key={b.id} className="flex justify-between text-[11px]">
                        <span className="truncate pr-2 text-slate-600">{b.name}</span>
                        <span className="font-bold text-slate-900">MYR {(b.splits[selectedFriendForHistory] || 0).toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => {
                    html2canvas(friendSlipRef.current, { scale: 2 }).then(cv => {
                      const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `Statement_${selectedFriendForHistory}.png`; a.click();
                    });
                  }} className="bg-capsuleDark text-white font-bold py-2.5 rounded-xl text-xs">Save Image</button>
                  <button onClick={() => setSelectedFriendForHistory(null)} className="bg-slate-100 font-bold py-2.5 rounded-xl text-xs text-slate-600">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= ADJUST BOTTOM SHEET ================= */}
          {selectedFriendForAdjust && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex flex-col justify-end" onClick={() => setSelectedFriendForAdjust(null)}>
              <form onSubmit={handleSaveAdjustment} className="bg-white border-t border-slate-200 rounded-t-3xl max-h-[85vh] flex flex-col p-5 space-y-4 animate-in slide-in-from-bottom" onClick={e => e.stopPropagation()}>
                <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto -mt-2 mb-1"></div>
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <h3 className="font-extrabold text-slate-900 text-base">Adjust: {selectedFriendForAdjust}</h3>
                  <button type="button" onClick={() => setSelectedFriendForAdjust(null)} className="text-slate-400 text-xs">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                  <button type="button" onClick={() => setAdjustType('minus')} className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'minus' ? 'bg-mint text-white' : 'text-slate-500'}`}>Paid / Reduce (-)</button>
                  <button type="button" onClick={() => setAdjustType('plus')} className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'plus' ? 'bg-coral text-white' : 'text-slate-500'}`}>Add Debt (+)</button>
                </div>

                <input type="text" placeholder="Amount (RM)" value={adjustAmount} onChange={e => setAdjustAmount(e.target.value)} onBlur={e => setAdjustAmount(evaluateMathExpression(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-mono font-bold outline-none" required />
                <input type="text" placeholder="Note (e.g. Bank transfer)" value={adjustNote} onChange={e => setAdjustNote(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none" />

                <button type="submit" disabled={isProcessing} className="w-full bg-brandPurple text-white font-bold py-3 rounded-2xl text-xs shadow-lg shadow-brandPurple/30 active:scale-95 transition">
                  {isProcessing ? 'Saving...' : 'Confirm Adjustment'}
                </button>
              </form>
            </div>
          )}

          {/* ================= FLOATING CAPSULE NAVBAR[cite: 2, 3, 4, 5] ================= */}
          <div className="fixed bottom-5 left-0 right-0 z-50 flex justify-center pointer-events-none px-4 pb-safe">
            <nav className="pointer-events-auto bg-capsuleDark/95 backdrop-blur-xl border border-white/10 shadow-2xl rounded-full p-1.5 flex items-center gap-1">
              
              {/* 1. Overview[cite: 2] */}
              <button 
                onClick={() => setActiveTab('overview')}
                className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center gap-1.5 ${
                  activeTab === 'overview'
                    ? 'bg-brandPurple text-white shadow-lg shadow-brandPurple/40 font-bold'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span className="text-base leading-none">🏠</span>
                {activeTab === 'overview' && <span className="text-[11px] tracking-wide">Overview</span>}
              </button>

              {/* 2. Subscriptions / Bills[cite: 3] */}
              <button 
                onClick={() => setActiveTab('bills')}
                className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center gap-1.5 ${
                  activeTab === 'bills'
                    ? 'bg-brandPurple text-white shadow-lg shadow-brandPurple/40 font-bold'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span className="text-base leading-none">🧾</span>
                {activeTab === 'bills' && <span className="text-[11px] tracking-wide">Bills</span>}
              </button>

              {/* 3. Calendar[cite: 4] */}
              <button 
                onClick={() => setActiveTab('calendar')}
                className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center gap-1.5 ${
                  activeTab === 'calendar'
                    ? 'bg-brandPurple text-white shadow-lg shadow-brandPurple/40 font-bold'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span className="text-base leading-none">📅</span>
                {activeTab === 'calendar' && <span className="text-[11px] tracking-wide">Calendar</span>}
              </button>

              {/* 4. Friends / Members[cite: 5] */}
              <button 
                onClick={() => setActiveTab('friends')}
                className={`px-4 py-2 rounded-full transition-all duration-200 flex items-center gap-1.5 ${
                  activeTab === 'friends'
                    ? 'bg-brandPurple text-white shadow-lg shadow-brandPurple/40 font-bold'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span className="text-base leading-none">👥</span>
                {activeTab === 'friends' && <span className="text-[11px] tracking-wide">Friends</span>}
              </button>
            </nav>
          </div>

          {/* ================= AUTH POPUP MODAL ================= */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in" onClick={() => setShowAuthModal(false)}>
              <div className="bg-white border border-slate-200 rounded-3xl p-6 w-full max-w-xs space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <h3 className="font-bold text-sm text-slate-900">🔑 Admin Sign-In</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 text-xs">✕</button>
                </div>
                <button type="button" onClick={handleGoogleLogin} className="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 py-2.5 rounded-xl text-xs font-bold text-slate-800 flex items-center justify-center gap-2 active:scale-95 transition">
                  <span>Google Sign-in</span>
                </button>
                <form onSubmit={handleVerifyPin} className="space-y-3 pt-2 border-t border-slate-100">
                  <input type="password" pattern="[0-9]*" inputMode="numeric" maxLength="6" placeholder="Enter PIN (2323)" value={inputPin} onChange={e => setInputPin(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 text-center font-mono text-base tracking-widest outline-none focus:border-brandPurple" autoFocus />
                  <button type="submit" className="w-full bg-brandPurple text-white font-bold py-2.5 rounded-xl text-xs active:scale-95 transition shadow-lg shadow-brandPurple/20">Unlock</button>
                </form>
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && (
            <div className={`fixed top-4 left-4 right-4 max-w-xs mx-auto z-50 text-center py-2 px-4 rounded-xl text-xs shadow-xl font-bold ${toast.type === 'error' ? 'bg-coral text-white' : 'bg-slate-900 text-white'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
