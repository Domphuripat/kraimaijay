    const evaluateMathExpression = (str) => {
      if (!str || typeof str !== 'string') return str;
      const clean = str.replace(/[^0-9+\-*/.]/g, '');
      if (!clean) return '';
      try {
        const res = Function(`'use strict'; return (${clean})`)();
        return isNaN(res) ? str : (Math.round(res * 100) / 100).toString();
      } catch (e) {
        return str;
      }
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('kraimaijay_lang') || 'th');

        if (navigator.vibrate) {

      const handleSwitchLang = (newLang) => {
        triggerHaptic();

      };

      const [selectedTheme, setSelectedTheme] = useState(() => localStorage.getItem('kraimaijay_theme') || 'system');

      useEffect(() => {
        const applyTheme = () => {
          const root = document.documentElement;
          if (selectedTheme === 'dark') {
            root.classList.add('dark');
          } else if (selectedTheme === 'light') {

      const [cloudConfig] = useState(DEFAULT_FIREBASE_CONFIG);
      const [appId] = useState(DEFAULT_APP_ID);

      const [currentUser, setCurrentUser] = useState(null);
      const [isAdminByGoogle, setIsAdminByGoogle] = useState(false);
      const [isAdminBySecret, setIsAdminBySecret] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        return p.get('admin') === 'true' || p.get('dom') === '2323' || localStorage.getItem('kraimaijay_secret_admin') === 'true';
      });
      const isAdmin = isAdminByGoogle || isAdminBySecret;

      const [isProcessing, setIsProcessing] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [inputPin, setInputPin] = useState('');

      const [db, setDb] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('overview');

      const [friends, setFriends] = useState([]);

      const [adjustments, setAdjustments] = useState([]);

      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().substring(0, 7));
      const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);
      const restoreInputRef = useRef(null);

      // ฟอร์มบิล
      const [editingBillId, setEditingBillId] = useState(null);
      const [newBillName, setNewBillName] = useState('');
      const [billType, setBillType] = useState('delivery');
      const [newBillDate, setNewBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [billFriends, setBillFriends] = useState([]);
      const [paidBy, setPaidBy] = useState('Me (Dom)');
      
      const [rideFare, setRideFare] = useState('');
      const [tollFee, setTollFee] = useState('');
      const [rideRoute, setRideRoute] = useState('');
      const [loanAmount, setLoanAmount] = useState('');
      const [loanBorrower, setLoanBorrower] = useState('');
      
      const [deliveryFee, setDeliveryFee] = useState(0);
      const [packagingCharge, setPackagingCharge] = useState(0);
      const [discountAmount, setDiscountAmount] = useState(0);
      const [billItems, setBillItems] = useState([{ id: '1', name: '', price: '', qty: 1, sharedWith: [] }]);

      // ปรับยอด & สเตตเมนต์
      const [selectedFriendForAdjust, setSelectedFriendForAdjust] = useState(null);
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustNote, setAdjustNote] = useState('');
      const [adjustType, setAdjustType] = useState('minus');
      const [viewingBillId, setViewingBillId] = useState(null);
      const [selectedFriendForHistory, setSelectedFriendForHistory] = useState(null);
      const friendSlipRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });

      };

      useEffect(() => {
        try {
          let app = !firebase.apps.length ? firebase.initializeApp(cloudConfig) : firebase.app();

          const firestore = firebase.firestore(app);
          setDb(firestore);

          if (isAdminBySecret && !auth.currentUser) auth.signInAnonymously().catch(() => {});

            setIsAdminByGoogle(user?.email && ADMIN_EMAILS.some(e => e.toLowerCase() === user.email.toLowerCase()));

            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setFriends(list);
          });
          const unsubBills = base.collection('bills').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setBills(list);
          });
          const unsubAdjs = base.collection('adjustments').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setAdjustments(list);
          });

          return () => { unsubAuth(); unsubFriends(); unsubBills(); unsubAdjs(); };
        } catch (e) { console.warn(e); }
      }, []);

      const handleGoogleLogin = async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          const result = await firebase.auth().signInWithPopup(provider);
          if (result && result.user) {
            const userEmail = (result.user.email || '').toLowerCase();
            const hasAdminRole = ADMIN_EMAILS.some(e => e.toLowerCase() === userEmail);
            setIsAdminByGoogle(hasAdminRole);
            setShowAuthModal(false);
            showToast(hasAdminRole ? "👑 เข้าสู่ระบบแอดมินแล้ว!" : `เข้าสู่ระบบเป็น ${userEmail}`);
          }
        } catch (err) {
          showToast("เข้าสู่ระบบไม่สำเร็จ", "error");
        }
      };

      const handleVerifyPin = async (e) => {
        e.preventDefault();
        if (inputPin === ADMIN_PIN) {
          setIsAdminBySecret(true);
          localStorage.setItem('kraimaijay_secret_admin', 'true');
          try { await firebase.auth().signInAnonymously(); } catch (err) {}
          setShowAuthModal(false);
          setInputPin('');
          showToast("👑 ปลดล็อกโหมดแอดมินเรียบร้อย!");
        } else {
          showToast("PIN ไม่ถูกต้อง", "error");
          setInputPin('');
        }
      };

      const handleLogoutAdmin = async () => {
        triggerHaptic();
        setIsAdminBySecret(false);
        setIsAdminByGoogle(false);
        localStorage.removeItem('kraimaijay_secret_admin');
        try { await firebase.auth().signOut(); } catch (e) {}
        showToast("เปลี่ยนเป็นโหมดผู้ชมแล้ว");
      };

      // ยอดหนี้
      const friendBalances = useMemo(() => {
        const balances = {};
        friends.forEach(f => { balances[f.name] = { billsOwed: 0, adjustedOwed: 0, totalOwed: 0 }; });

        bills.forEach(bill => {
          const isDomPayer = /me|dom/i.test(bill.paidBy || 'Me (Dom)');
          if (isDomPayer) {
            Object.keys(bill.splits || {}).forEach(name => {
              const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
              const realName = fObj ? fObj.name : name;
              const isSelf = fObj?.isSelf || /me|dom/i.test(realName);
              if (balances[realName] && !isSelf && !bill.paidStatus?.[name]) {
                balances[realName].billsOwed += bill.splits[name];
              }
            });
          } else {
            const payerObj = friends.find(f => f.name.toLowerCase() === (bill.paidBy || '').toLowerCase());
            const realPayerName = payerObj ? payerObj.name : bill.paidBy;
            const myShare = bill.splits?.['Me (Dom)'] || bill.splits?.['ตัวฉันเอง'] || 0;
            const isMySharePaid = bill.paidStatus?.['Me (Dom)'] || bill.paidStatus?.['ตัวฉันเอง'] || false;
            if (balances[realPayerName] && myShare > 0 && !isMySharePaid) {
              balances[realPayerName].billsOwed -= myShare;
            }
          }
        });

        adjustments.forEach(adj => {
          const fObj = friends.find(f => f.name.toLowerCase() === adj.friendName.toLowerCase());
          const realName = fObj ? fObj.name : adj.friendName;
          if (balances[realName] && adj.amount !== undefined && !adj.isSettled) {
            balances[realName].adjustedOwed += adj.amount;
          }
        });

        Object.keys(balances).forEach(name => {
          balances[name].totalOwed = Math.round((balances[name].billsOwed + balances[name].adjustedOwed) * 100) / 100;
        });
        return balances;
      }, [friends, bills, adjustments]);

      const totalOwedAmount = useMemo(() => {
        return Object.keys(friendBalances).reduce((acc, name) => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return (fObj?.isSelf || /me|dom/i.test(name)) ? acc : acc + Math.max(0, friendBalances[name].totalOwed);
        }, 0);
      }, [friendBalances, friends]);

      const totalPayableAmount = useMemo(() => {
        return Object.keys(friendBalances).reduce((acc, name) => {
          const fObj = friends.find(f => f.name.toLowerCase() === name.toLowerCase());
          return (fObj?.isSelf || /me|dom/i.test(name)) ? acc : acc + Math.abs(Math.min(0, friendBalances[name].totalOwed));
        }, 0);
      }, [friendBalances, friends]);

      const todayMyExpense = useMemo(() => {
        const today = new Date().toISOString().split('T')[0];
        return bills.filter(b => b.date === today).reduce((sum, b) => sum + (b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0), 0);
      }, [bills]);

      const monthlyStats = useMemo(() => {
        const monthly = bills.filter(b => (b.date || '').startsWith(selectedMonth));
        let totalGroup = 0, foodTotal = 0, rideTotal = 0, loanTotal = 0;
        const dailyMyExpenses = {};

        monthly.forEach(b => {
          const tot = b.total || 0;
          totalGroup += tot;
          if (b.billType === 'ride') rideTotal += tot;
          else if (b.billType === 'loan') loanTotal += tot;
          else foodTotal += tot;

          const self = b.splits?.['Me (Dom)'] || b.splits?.['ตัวฉันเอง'] || 0;
          if (b.date && self > 0) {
            if (!dailyMyExpenses[b.date]) dailyMyExpenses[b.date] = { total: 0, items: [] };
            dailyMyExpenses[b.date].total += self;
            dailyMyExpenses[b.date].items.push({ name: b.name, amount: self, type: b.billType });
          }
        });

        const foodPct = totalGroup > 0 ? Math.round((foodTotal / totalGroup) * 100) : 0;
        const ridePct = totalGroup > 0 ? Math.round((rideTotal / totalGroup) * 100) : 0;

        return {
          totalGroup,
          foodTotal,
          rideTotal,
          foodPct,
          ridePct,
          count: monthly.length,
          avgPerBill: monthly.length > 0 ? (totalGroup / monthly.length) : 0,
          dailyMyExpenses
        };
      }, [bills, selectedMonth]);

      // ปฏิทิน
      const calendarMatrix = useMemo(() => {
        if (!selectedMonth) return [];
        const [year, month] = selectedMonth.split('-').map(Number);
        if (!year || !month) return [];

        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const matrix = [];
        let dayCounter = 1;

        for (let row = 0; row < 6; row++) {
          const week = [];
          for (let col = 0; col < 7; col++) {
            if (row === 0 && col < firstDayIndex) {
              week.push(null);
            } else if (dayCounter > daysInMonth) {
              week.push(null);
            } else {
              const dStr = `${selectedMonth}-${String(dayCounter).padStart(2, '0')}`;
              const dayData = monthlyStats.dailyMyExpenses?.[dStr] || null;
              week.push({
                day: dayCounter,
                dateStr: dStr,
                total: dayData ? dayData.total : 0,
                items: dayData ? dayData.items : []
              });
              dayCounter++;
            }
          }
          matrix.push(week);
          if (dayCounter > daysInMonth) break;
        }
        return matrix;
      }, [selectedMonth, monthlyStats.dailyMyExpenses]);

      const getFriendHistory = (friendName) => {
        const fBills = bills.filter(b => {
          const keys = Object.keys(b.splits || {});
          return keys.some(k => k.toLowerCase() === friendName.toLowerCase()) || (b.paidBy || '').toLowerCase() === friendName.toLowerCase();
        });
        const fAdjs = adjustments.filter(a => a.friendName.toLowerCase() === friendName.toLowerCase());
        return { bills: fBills, adjustments: fAdjs };
      };

      const copyRemindText = (name, amount, billName) => {
        triggerHaptic();
        const text = `แจ้งเตือนยอดหารบิล "${billName}" ของ ${name} ยอดรวม MYR ${amount.toFixed(2)} รบกวนโอนคืนเมื่อสะดวกด้วยนะครับ 🙏`;
        navigator.clipboard.writeText(text).then(() => showToast(`คัดลอกข้อความทวงของ ${name} แล้ว!`));
      };

      const handleSaveBill = async (e) => {
        e.preventDefault();
        if (!isAdmin || isProcessing) return;
        if (!newBillName.trim()) { showToast("กรุณาระบุชื่อบิล", "error"); return; }

        let splits = {};
        const activeFriends = billFriends;

        if (billType === 'loan') {
          const p = parseFloat(loanAmount) || 0;
          if (loanBorrower) splits[loanBorrower] = p;
        } else if (billType === 'ride') {
          const rf = parseFloat(rideFare) || 0;
          const tf = parseFloat(tollFee) || 0;
          const ds = parseFloat(discountAmount) || 0;
          const tot = Math.max(0, rf + tf - ds);
          const perPerson = activeFriends.length > 0 ? tot / activeFriends.length : 0;
          activeFriends.forEach(f => { splits[f] = Math.round(perPerson * 100) / 100; });
        } else {
          let sub = 0;
          const baseShares = {};
          activeFriends.forEach(f => { baseShares[f] = 0; });
          billItems.forEach(it => {
            const pr = (parseFloat(it.price) || 0) * (parseInt(it.qty) || 1);
            sub += pr;
            const shared = (it.sharedWith || []).filter(sn => activeFriends.includes(sn));
            if (shared.length > 0) {
              const per = pr / shared.length;
              shared.forEach(sn => { baseShares[sn] = (baseShares[sn] || 0) + per; });
            }
          });
          const perDel = activeFriends.length > 0 ? (parseFloat(deliveryFee) || 0) / activeFriends.length : 0;
          const perPack = activeFriends.length > 0 ? (parseFloat(packagingCharge) || 0) / activeFriends.length : 0;
          const disc = parseFloat(discountAmount) || 0;

          activeFriends.forEach(f => {

          {selectedFriendForAdjust && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex flex-col justify-end" onClick={() => setSelectedFriendForAdjust(null)}>
              <form onSubmit={handleSaveAdjustment} className="bg-white dark:bg-surfaceDark border-t border-slate-200 dark:border-slate-800 rounded-t-3xl max-h-[85vh] flex flex-col p-5 space-y-4 animate-in slide-in-from-bottom" onClick={e => e.stopPropagation()}>
                <div className="w-10 h-1 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto -mt-2 mb-1"></div>
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="font-extrabold text-slate-900 dark:text-white text-base">Adjust: {selectedFriendForAdjust}</h3>
                  <button type="button" onClick={() => setSelectedFriendForAdjust(null)} className="text-slate-400 text-xs">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-subtleDark p-1 rounded-xl">
                  <button type="button" onClick={() => { triggerHaptic(); setAdjustType('minus'); }} className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'minus' ? 'bg-mint text-white' : 'text-slate-500'}`}>Paid / Reduce (-)</button>
                  <button type="button" onClick={() => { triggerHaptic(); setAdjustType('plus'); }} className={`py-2 text-xs font-bold rounded-lg transition ${adjustType === 'plus' ? 'bg-coral text-white' : 'text-slate-500'}`}>Add Debt (+)</button>
                </div>

                <input type="text" placeholder="Amount (RM)" value={adjustAmount} onChange={e => setAdjustAmount(e.target.value)} onBlur={e => setAdjustAmount(evaluateMathExpression(e.target.value))} className="w-full bg-slate-50 dark:bg-subtleDark border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-mono font-bold outline-none dark:text-white" required />
                <input type="text" placeholder="Note (e.g. Bank transfer)" value={adjustNote} onChange={e => setAdjustNote(e.target.value)} className="w-full bg-slate-50 dark:bg-subtleDark border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs outline-none dark:text-white" />

                <button type="submit" disabled={isProcessing} className="w-full bg-brandPurple text-white font-bold py-3 rounded-2xl text-xs shadow-lg shadow-brandPurple/30 active:scale-95 transition">
                  {isProcessing ? 'Saving...' : 'Confirm Adjustment'}
                </button>
              </form>
            </div>
          )}

          {/* ================= FLOATING DYNAMIC CAPSULE NAVBAR (ตามรูปเป๊ะ 100%)[cite: 17] ================= */}
          <div className="fixed bottom-6 left-0 right-0 z-50 flex justify-center pointer-events-none px-4 pb-safe">
            <nav className="pointer-events-auto bg-capsuleDark shadow-[0_16px_40px_rgba(0,0,0,0.45)] rounded-full p-1.5 flex items-center justify-between w-full max-w-[370px]">
              
              {/* 1. Overview[cite: 17] */}
              <button 
                onClick={() => { triggerHaptic(); setActiveTab('overview'); }}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-full transition-all duration-300 ease-out active:scale-95 ${
                  activeTab === 'overview'
                    ? 'bg-brandPurple text-white shadow-md font-medium'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span className="text-[10px] tracking-tight leading-none">{t('overview')}</span>
              </button>

              {/* 2. Bills[cite: 17] */}
              <button 
                onClick={() => { triggerHaptic(); setActiveTab('bills'); }}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-full transition-all duration-300 ease-out active:scale-95 ${
                  activeTab === 'bills'
                    ? 'bg-brandPurple text-white shadow-md font-medium'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="8" y1="6" x2="21" y2="6" />
                  <line x1="8" y1="12" x2="21" y2="12" />
                  <line x1="8" y1="18" x2="21" y2="18" />
                  <line x1="3" y1="6" x2="3.01" y2="6" />
                  <line x1="3" y1="12" x2="3.01" y2="12" />
                  <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
                <span className="text-[10px] tracking-tight leading-none">{t('bills')}</span>
              </button>

              {/* 3. Calendar[cite: 17] */}
              <button 
                onClick={() => { triggerHaptic(); setActiveTab('calendar'); }}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-full transition-all duration-300 ease-out active:scale-95 ${
                  activeTab === 'calendar'
                    ? 'bg-brandPurple text-white shadow-md font-medium'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
                <span className="text-[10px] tracking-tight leading-none">{t('calendar')}</span>
              </button>

              {/* 4. Settings[cite: 17] */}
              <button 
                onClick={() => { triggerHaptic(); setActiveTab('settings'); setSettingsSubPage(null); }}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-full transition-all duration-300 ease-out active:scale-95 ${
                  activeTab === 'settings'
                    ? 'bg-brandPurple text-white shadow-md font-medium'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span className="text-[10px] tracking-tight leading-none">{t('settings')}</span>
              </button>

            </nav>
          </div>

          {/* ================= AUTH POPUP MODAL ================= */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in" onClick={() => setShowAuthModal(false)}>
              <div className="bg-white dark:bg-surfaceDark border border-slate-200 dark:border-slate-700 rounded-3xl p-6 w-full max-w-xs space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-700">
                  <h3 className="font-bold text-sm text-slate-900 dark:text-white">🔑 เข้าสู่ระบบแอดมิน</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 text-xs">✕</button>
                </div>
                <button type="button" onClick={handleGoogleLogin} className="w-full bg-slate-50 dark:bg-subtleDark hover:bg-slate-100 border border-slate-200 dark:border-slate-700 py-2.5 rounded-xl text-xs font-bold text-slate-800 dark:text-white flex items-center justify-center gap-2 active:scale-95 transition">
                  <span>Google Sign-in</span>
                </button>
                <form onSubmit={handleVerifyPin} className="space-y-3 pt-2 border-t border-slate-100 dark:border-slate-700">
                  <input type="password" pattern="[0-9]*" inputMode="numeric" maxLength="6" placeholder="กรอก PIN 4 หลัก" value={inputPin} onChange={e => setInputPin(e.target.value)} className="w-full bg-slate-50 dark:bg-subtleDark border border-slate-200 dark:border-slate-700 rounded-xl py-2.5 text-center font-mono text-base tracking-widest outline-none focus:border-brandPurple dark:text-white" autoFocus />
                  <button type="submit" className="w-full bg-brandPurple text-white font-bold py-2.5 rounded-xl text-xs active:scale-95 transition shadow-lg shadow-brandPurple/20">ปลดล็อค</button>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-4 left-4 right-4 max-w-xs mx-auto z-50 text-center py-2 px-4 rounded-xl text-xs shadow-xl font-bold ${toast.type === 'error' ? 'bg-coral text-white' : 'bg-slate-900 text-white'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
